<!DOCTYPE html>
<!-- Trade Trainer v2.0.0 (build 2026-07-31) — Al Brooks price action -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRADE TRAINER v2.0.0 — Cadet to Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;--bg2:#141821;--bg3:#1B2029;--line:#2A303C;
    --amber:#F2A93B;--amber-dim:#6E5122;--up:#3FBF7F;--dn:#E5634D;--blue:#5B9BD5;
    --paper:#E8E6E0;--muted:#8A92A2;--grid:#1C222C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--paper);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input,select{font-family:inherit}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--amber)}.mu{color:var(--muted)}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171B23,#0E1116);flex:0 0 auto}
  .logo{font-family:'Archivo';font-weight:800;letter-spacing:.15em;font-size:13px;background:linear-gradient(90deg,var(--amber),#FFD98A);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .rank{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber-dim);background:#241a08;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .xpwrap{flex:1;min-width:60px;display:flex;flex-direction:column;gap:3px}
  .xpbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--amber),#FFD98A);width:0%;transition:width .35s}
  .xptxt{font-family:'IBM Plex Mono';font-size:9px;color:var(--muted);letter-spacing:.04em}
  .ver{font-size:9px;color:var(--muted);letter-spacing:.06em;align-self:flex-start;margin-top:2px}
  @media(max-width:760px){.ver{display:none}}
  nav{display:flex;gap:4px;flex:0 0 auto}
  nav button{padding:6px 9px;font-size:11px;font-weight:600;border-radius:7px;border:1px solid transparent;color:var(--muted)}
  nav button.on{color:var(--amber);background:var(--bg3);border-color:var(--line)}
  nav button:hover{color:var(--paper)}
  @media(max-width:620px){
    nav button{padding:6px 8px;font-size:0}
    nav button::after{content:attr(data-ico);font-size:15px;line-height:1}
    .xptxt{display:none}
    .logo{font-size:11px;letter-spacing:.1em}
  }

  main{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .view.on{display:flex}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}

  /* ---------- generic ---------- */
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .seclabel{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
  .seclabel:first-child{margin-top:0}
  .btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:12px;font-weight:600}
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:linear-gradient(180deg,#F2A93B,#D9902A);color:#14100a;border-color:#F2A93B}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:6px 9px;font-size:11px}
  .row{display:flex;align-items:center;gap:9px}
  .grow{flex:1;min-width:0}
  .wrap{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--muted);border:1px solid var(--line)}
  .pill.ok{background:#12291d;color:var(--up);border-color:#20452f}
  .pill.bad{background:#2c1512;color:var(--dn);border-color:#4a2019}
  .pill.am{background:#241a08;color:var(--amber);border-color:var(--amber-dim)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
  .kv b{font-family:'IBM Plex Mono';font-weight:600}

  /* ---------- path / levels ---------- */
  .tier{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);margin-bottom:9px;align-items:flex-start;cursor:pointer;transition:border-color .12s}
  .tier:hover{border-color:#3d465a}
  .tier.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
  .tier.done{opacity:.75}
  .tier.lock{opacity:.42;cursor:default}
  .tier .num{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-family:'Archivo';font-weight:800;font-size:15px;background:var(--bg3);border:1px solid var(--line)}
  .tier.cur .num{background:#241a08;border-color:var(--amber);color:var(--amber)}
  .tier.done .num{background:#12291d;border-color:#2a5a3c;color:var(--up)}
  .tier .nm{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.02em}
  .tier .ds{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .mini{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:7px}
  .mini i{display:block;height:100%;background:var(--up)}
  .drilllist{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
  .tier.open .drilllist{display:block}
  .drow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12px}
  .drow:hover{background:var(--bg3)}
  .drow .st{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:9px;color:var(--muted)}
  .drow .st.ok{background:#12291d;border-color:#2a5a3c;color:var(--up)}

  .skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
  .skill{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .skill .n{font-size:11px;font-weight:600;display:flex;justify-content:space-between}
  .skill .n span{font-family:'IBM Plex Mono';color:var(--muted)}
  .skill .b{height:5px;background:var(--bg3);border-radius:3px;margin-top:6px;overflow:hidden}
  .skill .b i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7FD1F0)}

  /* ---------- drill / chart ---------- */
  .stage{flex:1;display:flex;min-height:0}
  @media(max-width:860px){.stage{flex-direction:column}}
  .chartcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .chartwrap{flex:1;position:relative;min-height:0;background:#0B0E13;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .toolbar{display:flex;gap:4px;padding:5px 7px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tool{width:31px;height:29px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .tool.on{border-color:var(--amber);background:#241a08;color:var(--amber)}
  .tool:hover{border-color:#3d465a}
  .tool.wide{width:auto;padding:0 9px;font-size:11px;font-weight:600}
  .tsep{width:1px;background:var(--line);margin:2px 3px;flex:0 0 auto}
  .sym{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);padding:0 6px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sym b{color:var(--paper);font-weight:600;letter-spacing:.04em}

  .panel{width:330px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
  @media(max-width:860px){.panel{width:auto;border-left:none;border-top:1px solid var(--line);height:44%;min-height:190px}}
  .pbody{flex:1;overflow-y:auto;padding:11px;-webkit-overflow-scrolling:touch}
  .pfoot{flex:0 0 auto;padding:9px 11px;border-top:1px solid var(--line);display:flex;gap:8px}
  .pfoot .btn{flex:1;text-align:center}
  .task{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-family:'Archivo';font-weight:700;color:var(--amber);margin-bottom:5px}
  .brief{font-size:13px;line-height:1.55}
  .brief b{color:var(--amber)}
  .opt{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);font-size:12.5px;margin-bottom:6px;line-height:1.35}
  .opt:hover{border-color:#3d465a}
  .opt.sel{border-color:var(--amber);background:#241a08}
  .opt.right{border-color:var(--up);background:#12291d}
  .opt.wrong{border-color:var(--dn);background:#2c1512}
  .num{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--paper);font-family:'IBM Plex Mono';font-size:14px}
  .num:focus{outline:none;border-color:var(--amber)}
  .fb{border-radius:9px;padding:10px;margin-top:10px;font-size:12.5px;line-height:1.5;border:1px solid}
  .fb.good{background:#12291d;border-color:#2a5a3c}
  .fb.mid{background:#2a2208;border-color:var(--amber-dim)}
  .fb.bad{background:#2c1512;border-color:#4a2019}
  .fb h4{font-family:'Archivo';font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
  .fb ul{margin:6px 0 0 16px}
  .fb li{margin:3px 0}
  .stepdots{display:flex;gap:4px;margin-bottom:9px}
  .stepdots i{flex:1;height:3px;border-radius:2px;background:var(--bg3)}
  .stepdots i.on{background:var(--amber)}
  .stepdots i.ok{background:var(--up)}

  /* ---------- trade ticket ---------- */
  .ticket{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:9px}
  .ticket .hd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'Archivo';font-weight:700}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tf{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
  .tf .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tf .v{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;margin-top:1px}
  .dirsel{display:flex;gap:6px;margin-bottom:7px}
  .dirsel button{flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);font-size:11px;font-weight:700;letter-spacing:.06em}
  .dirsel button.on.long{background:#12291d;border-color:var(--up);color:var(--up)}
  .dirsel button.on.short{background:#2c1512;border-color:var(--dn);color:var(--dn)}

  /* ---------- stats ---------- */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  .sbox{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .sbox .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .sbox .v{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:5px 6px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:6px;border-bottom:1px solid #1b2029;font-family:'IBM Plex Mono'}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--bg2)}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(6,8,12,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
  .modal.on{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:16px}
  .sheet h2{font-family:'Archivo';font-size:16px;letter-spacing:.04em;margin-bottom:9px}
  .sheet h3{font-family:'Archivo';font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:14px 0 5px}
  .sheet p{font-size:13px;line-height:1.6;color:#cfd4dd;margin-bottom:7px}
  .sheet li{font-size:13px;line-height:1.6;color:#cfd4dd;margin:3px 0 3px 17px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--bg3);border:1px solid var(--amber);color:var(--paper);padding:9px 15px;border-radius:9px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,bottom .25s;font-weight:600}
  .toast.on{opacity:1;bottom:30px}
</style>
</head>
<body>

<header>
  <div class="logo">TRADE&nbsp;TRAINER</div>
  <span class="ver mono" id="verTag"></span>
  <div class="rank" id="rankBadge">CADET</div>
  <div class="xpwrap">
    <div class="xpbar"><i class="xpfill" id="xpFill"></i></div>
    <div class="xptxt mono" id="xpTxt">0 XP</div>
  </div>
  <nav>
    <button data-view="path" data-ico="▤" class="on">Path</button>
    <button data-view="practice" data-ico="▶">Practice</button>
    <button data-view="stats" data-ico="◔">Stats</button>
    <button id="helpBtn" data-ico="?">Help</button>
  </nav>
</header>

<main>
  <!-- ============ PATH ============ -->
  <section class="view on" id="view-path"><div class="scroll" id="pathBody"></div></section>

  <!-- ============ DRILL ============ -->
  <section class="view" id="view-drill">
    <div class="stage">
      <div class="chartcol">
        <div class="toolbar" id="drillTools"></div>
        <div class="chartwrap"><canvas id="cvDrill"></canvas></div>
      </div>
      <aside class="panel">
        <div class="pbody" id="drillPanel"></div>
        <div class="pfoot" id="drillFoot"></div>
      </aside>
    </div>
  </section>

  <!-- ============ PRACTICE ============ -->
  <section class="view" id="view-practice">
    <div class="stage">
      <div class="chartcol">
        <div class="toolbar" id="pracTools"></div>
        <div class="chartwrap"><canvas id="cvPrac"></canvas></div>
      </div>
      <aside class="panel">
        <div class="pbody" id="pracPanel"></div>
        <div class="pfoot" id="pracFoot"></div>
      </aside>
    </div>
  </section>

  <!-- ============ STATS ============ -->
  <section class="view" id="view-stats"><div class="scroll" id="statsBody"></div></section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Trade Trainer — version. Bump this when the file changes so a deployed
   copy can be identified from the UI, the page source, or the console. */
var APP = { name: "Trade Trainer", version: "2.0.0", build: "2026-07-31", basis: "Al Brooks price action" };

/* =====================================================================
   TRADE TRAINER — market engine (Al Brooks price-action framework)

   Every chart is one identifiable Brooks *context*, not a chart pattern:
   spike-and-channel, tight channel, trading range, barbwire, failed
   breakout, wedge reversal, major trend reversal, final flag, climax.

   Each context carries the things Brooks actually trades off:
     · the market cycle phase   (breakout / channel / trading range)
     · the always-in direction  (or none, in a range)
     · a probability of success, and the tape resolves at that rate
     · a measured move with an explicit type (spike / leg1=leg2 /
       range height / failed breakout / wedge origin)
     · a signal bar of controlled quality at the decision point
     · scalp or swing

   Bullish forms are declared once; bearish twins are mirrored, so every
   ground-truth function is written in a "bull frame" and reads the
   direction-aware helpers on ctx.
   ===================================================================== */
var Mkt = (function () {
  "use strict";

  /* ---------------- rng ---------------- */
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mkR(seed) {
    var r = rng(seed), sp = null;
    var o = {
      u: r,
      f: function (a, b) { return a + (b - a) * r(); },
      i: function (a, b) { return Math.floor(a + (b - a + 1) * r()); },
      g: function () {
        if (sp !== null) { var v = sp; sp = null; return v; }
        var u1 = Math.max(1e-9, r()), u2 = r(), m = Math.sqrt(-2 * Math.log(u1));
        sp = m * Math.sin(2 * Math.PI * u2);
        return m * Math.cos(2 * Math.PI * u2);
      },
      t: function () { var g = o.g(); return r() < 0.06 ? g * 2.8 : g; },
      pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
      chance: function (p) { return r() < p; },
      shuffle: function (arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(r() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
    };
    return o;
  }

  /* ---------------- instruments ---------------- */
  var INSTR = [
    { sym: "ES",     nm: "S&P 500 Futures",     dec: 2, lo: 4180,  hi: 6120,  sig: 0.0022, kind: "fut",    vbase: 38000 },
    { sym: "NQ",     nm: "Nasdaq 100 Futures",  dec: 2, lo: 15200, hi: 22400, sig: 0.0033, kind: "fut",    vbase: 42000 },
    { sym: "CL",     nm: "Crude Oil Futures",   dec: 2, lo: 62,    hi: 94,    sig: 0.0042, kind: "fut",    vbase: 27000 },
    { sym: "EURUSD", nm: "Euro / US Dollar",    dec: 5, lo: 1.02,  hi: 1.19,  sig: 0.0016, kind: "fx",     vbase: 24000 },
    { sym: "GBPJPY", nm: "Pound / Yen",         dec: 3, lo: 172,   hi: 199,   sig: 0.0026, kind: "fx",     vbase: 12000 },
    { sym: "XAUUSD", nm: "Gold Spot",           dec: 2, lo: 1880,  hi: 2650,  sig: 0.0030, kind: "fx",     vbase: 31000 },
    { sym: "BTCUSD", nm: "Bitcoin / US Dollar", dec: 1, lo: 26000, hi: 98000, sig: 0.0055, kind: "crypto", vbase: 900 },
    { sym: "AAPL",   nm: "Apple Inc.",          dec: 2, lo: 168,   hi: 258,   sig: 0.0026, kind: "eq",     vbase: 380000 },
    { sym: "NVDA",   nm: "NVIDIA Corp.",        dec: 2, lo: 92,    hi: 195,   sig: 0.0049, kind: "eq",     vbase: 620000 },
    { sym: "TSLA",   nm: "Tesla Inc.",          dec: 2, lo: 178,   hi: 428,   sig: 0.0056, kind: "eq",     vbase: 510000 }
  ];
  /* Brooks works the 5-minute chart, so the pool leans intraday */
  var TFS = [
    { k: "1m",  min: 1,    lbl: "1 min",  w: 1 },
    { k: "5m",  min: 5,    lbl: "5 min",  w: 5 },
    { k: "15m", min: 15,   lbl: "15 min", w: 3 },
    { k: "1H",  min: 60,   lbl: "1 hour", w: 2 },
    { k: "1D",  min: 1440, lbl: "Daily",  w: 1 }
  ];
  var TF_POOL = [];
  TFS.forEach(function (t) { for (var i = 0; i < t.w; i++) TF_POOL.push(t); });

  /* ---------------- bar helpers ---------------- */
  function hiIn(b, a, z) {
    a = Math.max(0, a | 0); z = Math.min(b.length - 1, z | 0);
    var bi = a, bv = -Infinity;
    for (var i = a; i <= z; i++) if (b[i].h > bv) { bv = b[i].h; bi = i; }
    return { i: bi, p: bv };
  }
  function loIn(b, a, z) {
    a = Math.max(0, a | 0); z = Math.min(b.length - 1, z | 0);
    var bi = a, bv = Infinity;
    for (var i = a; i <= z; i++) if (b[i].l < bv) { bv = b[i].l; bi = i; }
    return { i: bi, p: bv };
  }
  /** direction-aware helper pack. m=+1 normal, m=-1 mirrored (bearish twin).
      Everything inside a gt() is written as if the market were bullish. */
  function ctxFor(m) {
    return {
      m: m,
      hi: function (b, a, z) { return m > 0 ? hiIn(b, a, z) : loIn(b, a, z); },
      lo: function (b, a, z) { return m > 0 ? loIn(b, a, z) : hiIn(b, a, z); },
      /** snap anchor i to its local extreme; s=+1 means "high" in the bull frame */
      ref: function (b, i, s, w) {
        w = w || 3;
        return (s * m) > 0 ? hiIn(b, i - w, i + w) : loIn(b, i - w, i + w);
      },

/* ---------- drawings model ---------- */

/* ---------- pointer ---------- */

/* ---------- building drawings by clicking ---------- */

/* ---------- handles ---------- */
Chart.prototype.handles = function () {

/* ---------- reveal animation ---------- */
Chart.prototype.revealTo = function (idx, speed, done) {

  this._rev = setInterval(function () {
    if (self.vis >= idx) { clearInterval(self._rev); self._rev = null; if (done) done(); return; }
    self.vis++;

/* =====================================================================
   render
   ===================================================================== */
Chart.prototype.render = function () {
  if (!this.bars.length) return;

  if (this.opts.vol) this._vol(c, b);

  this._emas(c, b);
  this._candles(c, b);

  if (this.gt) this._gtOverlay(c, b);
  this._markers(c, b);
  var self = this;
  this.drawings.forEach(function (dr) { self._draw(c, b, dr, false); });
  if (this.pending) this._draw(c, b, this.pending, true);

Chart.prototype._niceStep = function (range, want) {
  var raw = range / want, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / mag;

Chart.prototype._grid = function (c, b) {

    c.fillStyle = COL.txt; c.fillText(this._tlabel(this.bars[i].t), x, b.b + 5);

Chart.prototype._tlabel = function (t) {

  if (this.tf === "1D" || this.tf === "4H") return d.getUTCDate() + " " + M[d.getUTCMonth()];

Chart.prototype._vol = function (c, b) {

    var bar = this.bars[j], hgt = (bar.v / mx) * (b.volH - 4);
    c.fillStyle = bar.c >= bar.o ? "rgba(63,191,127,.32)" : "rgba(229,99,77,.32)";

};
Chart.prototype._emas = function (c, b) {
  var self = this;
  function line(n, col) {
    var e = Mkt.ema(self.bars, n, self.vis);
    c.strokeStyle = col; c.lineWidth = 1.2; c.beginPath();
    var st = true;
    for (var i = Math.max(n, Math.floor(self.i0)); i <= Math.min(self.vis, Math.ceil(self.i1)); i++) {

    c.stroke();
  }

  if (this.opts.ema50) line(50, "rgba(91,155,213,.5)");
};
Chart.prototype._candles = function (c, b) {

Chart.prototype._tag = function (c, x, y, txt, bg, fg) {

Chart.prototype._axes = function (c, b) {

};
Chart.prototype._watermark = function (c, b) {

};
Chart.prototype._crosshair = function (c, b) {

    c.beginPath(); c.arc(x, y, 4.5, 0, 6.284); c.fill();

/** a small bracket under the signal bar, so it is unambiguous which bar is the decision */
Chart.prototype._sigMark = function (c, b) {
  var i = this.sigBar;

    c.fillRect(0, Math.min(yt, yb), b.r, Math.abs(yb - yt));
    lvl(this, g.rangeTop, "rgba(91,155,213,.85)", "RANGE HIGH", [2, 4]);
    lvl(this, g.rangeBot, "rgba(91,155,213,.85)", "RANGE LOW", [2, 4]);
  }
  if (g.tradeable) {
    lvl(this, g.entry, COL.amber, "ENTRY");
    lvl(this, g.target, COL.ok, "TARGET");
    lvl(this, g.invalid, COL.bad, "STOP");
  }
  /* the measured leg */
  if (this.gtMeasure && g.measure && g.measure.a && g.measure.b) {
    var a = g.measure.a, bb = g.measure.b;
    c.strokeStyle = COL.violet; c.lineWidth = 2;
    c.beginPath(); c.moveTo(this.x(a.i), this.y(a.p)); c.lineTo(this.x(bb.i), this.y(bb.p)); c.stroke();
    c.fillStyle = COL.violet;
    [a, bb].forEach(function (pt) {
      c.beginPath(); c.arc(this.x(pt.i), this.y(pt.p), 3.5, 0, 6.284); c.fill();
    }, this);
  }
  if (this.gtMeasure) (g.labels || []).forEach(function (L) {
    var pt = L[0], x = this.x(pt.i), y = this.y(pt.p);
    c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "center"; c.textBaseline = "bottom";
    c.fillStyle = "rgba(169,139,232,.95)";
    c.fillText(L[1], x, y - 6);
  }, this);
};

/* ---------- drawing renderers ---------- */
Chart.prototype._draw = function (c, b, d, ghost) {
  var al = ghost ? 0.6 : 1;
  c.globalAlpha = al;
  switch (d.type) {
    case "hline": this._drawH(c, b, d); break;
    case "trend": this._drawTrend(c, b, d); break;
    case "rect": this._drawRect(c, b, d); break;
    case "fib": this._drawFib(c, b, d); break;
    case "measure": this._drawMeasure(c, b, d); break;
    case "pos": this._drawPos(c, b, d); break;
  }
  c.globalAlpha = 1;
  if (!ghost && this.tool === "cursor") {
    var self = this;
    this.handles().filter(function (h) { return h.d === d; }).forEach(function (h) {
      if (h.line) return;
      c.fillStyle = COL.paper; c.strokeStyle = "#0B0E13"; c.lineWidth = 1.5;
      c.beginPath(); c.arc(h.x, h.y, 3.5, 0, 6.284); c.fill(); c.stroke();
    });
  }
};
Chart.prototype._drawH = function (c, b, d) {
  var y = Math.round(this.y(d.p)) + 0.5, col = d.col || COL.amber;
  c.strokeStyle = col; c.lineWidth = 1.4; c.setLineDash([]);
  c.beginPath(); c.moveTo(0, y); c.lineTo(b.r, y); c.stroke();
  this._tag(c, b.r + 1, y, this.fmt(d.p), col, "#14100a");
  if (d.tag) {
    c.font = "700 10px Archivo,sans-serif"; c.fillStyle = col; c.textAlign = "left"; c.textBaseline = "bottom";
    c.fillText(d.tag, 6, y - 3);
  }
};
Chart.prototype._drawTrend = function (c, b, d) {
  if (!d.b) return;
  var x1 = this.x(d.a.i), y1 = this.y(d.a.p), x2 = this.x(d.b.i), y2 = this.y(d.b.p);
  c.strokeStyle = COL.amber; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2);
  /* extend to the right edge */
  if (x2 !== x1) {
    var m = (y2 - y1) / (x2 - x1);
    c.lineTo(b.r, y2 + m * (b.r - x2));
  }
  c.stroke();
};
Chart.prototype._drawRect = function (c, b, d) {
  if (!d.b) return;
  var x1 = this.x(d.a.i), y1 = this.y(d.a.p), x2 = this.x(d.b.i), y2 = this.y(d.b.p);
  c.fillStyle = "rgba(91,155,213,.13)"; c.strokeStyle = "rgba(91,155,213,.75)"; c.lineWidth = 1.2;
  c.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
  c.strokeRect(Math.min(x1, x2) + 0.5, Math.min(y1, y2) + 0.5, Math.abs(x2 - x1), Math.abs(y2 - y1));
};
Chart.prototype._drawFib = function (c, b, d) {
  if (!d.b) return;
  var lv = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1], self = this;
  var x1 = Math.min(this.x(d.a.i), this.x(d.b.i));
  c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "left"; c.textBaseline = "bottom";
  lv.forEach(function (f) {
    var p = d.a.p + (d.b.p - d.a.p) * f, y = Math.round(self.y(p)) + 0.5;
    c.strokeStyle = f === 0.618 || f === 0.5 ? "rgba(242,169,59,.75)" : "rgba(138,146,162,.45)";
    c.setLineDash([4, 4]); c.lineWidth = 1;
    c.beginPath(); c.moveTo(x1, y); c.lineTo(b.r, y); c.stroke(); c.setLineDash([]);
    c.fillStyle = "rgba(138,146,162,.9)";
    c.fillText((f * 100).toFixed(1) + "%  " + self.fmt(p), x1 + 4, y - 2);
  });
};

/* --- the measured-move tool: leg A->B projected from C --- */
Chart.prototype._drawMeasure = function (c, b, d) {
  var self = this;
  function dot(pt, lab) {
    var x = self.x(pt.i), y = self.y(pt.p);
    c.fillStyle = COL.violet; c.beginPath(); c.arc(x, y, 4, 0, 6.284); c.fill();
    c.font = "700 10px Archivo,sans-serif"; c.textAlign = "center"; c.textBaseline = "bottom";
    c.fillStyle = COL.violet; c.fillText(lab, x, y - 7);
  }
  dot(d.a, "A");
  if (!d.b) return;
  var x1 = this.x(d.a.i), y1 = this.y(d.a.p), x2 = this.x(d.b.i), y2 = this.y(d.b.p);
  c.strokeStyle = COL.violet; c.lineWidth = 2; c.setLineDash([]);
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  dot(d.b, "B");
  var leg = d.b.p - d.a.p, pct = (leg / d.a.p) * 100;
  c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "left"; c.textBaseline = "middle";
  c.fillStyle = COL.violet;
  c.fillText("leg " + this.fmt(Math.abs(leg)) + "  (" + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%)",
    Math.max(x1, x2) + 6, (y1 + y2) / 2);
  if (!d.c) return;
  dot(d.c, "C");
  var tgt = d.c.p + leg, xc = this.x(d.c.i), yc = this.y(d.c.p), yt = this.y(tgt);
  var xr = this.box().r;
  /* projection body */
  c.fillStyle = leg >= 0 ? "rgba(63,191,127,.10)" : "rgba(229,99,77,.10)";
  c.fillRect(xc, Math.min(yc, yt), xr - xc, Math.abs(yt - yc));
  c.strokeStyle = leg >= 0 ? "rgba(63,191,127,.9)" : "rgba(229,99,77,.9)";
  c.lineWidth = 1.4; c.setLineDash([6, 4]);
  c.beginPath(); c.moveTo(xc, yt); c.lineTo(xr, yt); c.stroke();
  c.setLineDash([2, 3]); c.strokeStyle = "rgba(169,139,232,.7)";
  c.beginPath(); c.moveTo(xc, yc); c.lineTo(xr, yc); c.stroke();
  c.setLineDash([]);
  /* the projected leg drawn as a vertical arrow at C */
  c.strokeStyle = COL.violet; c.lineWidth = 2;
  c.beginPath(); c.moveTo(xc, yc); c.lineTo(xc, yt); c.stroke();
  var dirUp = yt < yc;
  c.beginPath();
  c.moveTo(xc, yt); c.lineTo(xc - 4, yt + (dirUp ? 7 : -7)); c.lineTo(xc + 4, yt + (dirUp ? 7 : -7));
  c.closePath(); c.fillStyle = COL.violet; c.fill();
  this._tag(c, xr + 1, yt, this.fmt(tgt), leg >= 0 ? COL.ok : COL.bad, "#0B0E13");
  c.font = "700 10px Archivo,sans-serif"; c.textAlign = "right"; c.textBaseline = "bottom";
  c.fillStyle = leg >= 0 ? COL.ok : COL.bad;
  c.fillText("MEASURED TARGET", xr - 4, yt - 3);
  /* partial extensions */
  if (this.opts.fibExt) {
    var self2 = this;
    [[0.5, "0.5"], [0.618, "0.618"], [1.272, "1.272"]].forEach(function (e) {
      var p = d.c.p + leg * e[0], y = Math.round(self2.y(p)) + 0.5;
      c.strokeStyle = "rgba(138,146,162,.35)"; c.setLineDash([2, 4]); c.lineWidth = 1;
      c.beginPath(); c.moveTo(xc, y); c.lineTo(xr, y); c.stroke(); c.setLineDash([]);
      c.font = "9px 'IBM Plex Mono',monospace"; c.textAlign = "right"; c.textBaseline = "bottom";
      c.fillStyle = "rgba(138,146,162,.8)";
      c.fillText(e[1] + "  " + self2.fmt(p), xr - 4, y - 1);
    });
  }
};

/* --- long/short position with live R:R --- */
Chart.prototype._drawPos = function (c, b, d) {
  var x0 = this.x(d.i), xr = b.r;
  var ye = this.y(d.entry), ys = this.y(d.stop), yt = this.y(d.target);
  c.fillStyle = "rgba(63,191,127,.13)"; c.fillRect(x0, Math.min(ye, yt), xr - x0, Math.abs(yt - ye));
  c.fillStyle = "rgba(229,99,77,.15)"; c.fillRect(x0, Math.min(ye, ys), xr - x0, Math.abs(ys - ye));
  var self = this;
  function line(y, col, txt, val) {
    y = Math.round(y) + 0.5;
    c.strokeStyle = col; c.lineWidth = 1.3; c.setLineDash([]);
    c.beginPath(); c.moveTo(x0, y); c.lineTo(xr, y); c.stroke();
    c.font = "700 10px Archivo,sans-serif"; c.textAlign = "left"; c.textBaseline = "bottom";
    c.fillStyle = col; c.fillText(txt, x0 + 5, y - 3);
    self._tag(c, xr + 1, y, self.fmt(val), col, "#0B0E13");
  }
  line(yt, COL.ok, "TARGET", d.target);
  line(ye, COL.amber, d.dir > 0 ? "LONG ENTRY" : "SHORT ENTRY", d.entry);
  line(ys, COL.bad, "STOP", d.stop);
  var risk = Math.abs(d.entry - d.stop), rew = Math.abs(d.target - d.entry);
  var rr = risk > 0 ? rew / risk : 0;
  c.font = "700 11px 'IBM Plex Mono',monospace"; c.textAlign = "right"; c.textBaseline = "top";
  c.fillStyle = rr >= 2 ? COL.ok : rr >= 1 ? COL.amber : COL.bad;
  c.fillText(rr.toFixed(2) + "R", xr - 5, Math.min(ye, yt) + 4);
};

/* readout used by the side panels */
Chart.prototype.readout = function () {
  var m = this.find("measure"), p = this.find("pos"), out = {};
  if (m && m.b) {
    out.leg = m.b.p - m.a.p;
    out.legPct = out.leg / m.a.p * 100;
    if (m.c) out.mTarget = m.c.p + out.leg;
  }
  if (p) {
    out.dir = p.dir; out.entry = p.entry; out.stop = p.stop; out.target = p.target;
    out.risk = Math.abs(p.entry - p.stop); out.reward = Math.abs(p.target - p.entry);
    out.rr = out.risk > 0 ? out.reward / out.risk : 0;
    out.riskPct = out.risk / p.entry * 100;
  }
  return out;
};
/* =====================================================================
   TRADE TRAINER — Brooks skills, drills, grading, progression
   A drill node = N reps. prepare() builds a chart + question,
   grade() returns a score in 0..1 plus written feedback.
   ===================================================================== */

var SKILLS = {
  bars: "Bar reading",

  range: "Range trading",

};

var RANKS = [
  { n: "Cadet" }, { n: "Bar Reader" }, { n: "Cycle Reader" }, { n: "Trend Trader" },

/* ---------------- context pools ---------------- */
function both(a) { var o = []; a.forEach(function (k) { o.push(k, k + "_D"); }); return o; }
var POOL = {
  trend: both(["spikeChannel", "tightChannel", "broadChannel", "twoLegPullback"]),
  range: both(["rangeLow", "rangeMid", "barbwire", "breakoutMode"]),
  rangeTradeable: both(["rangeLow"]),
  noTrade: both(["rangeMid", "barbwire", "breakoutMode"]),
  breakout: both(["failedBo", "successBo"]),
  reversal: both(["wedgeBottom", "mtr", "finalFlag", "climax"]),
  all: Mkt.KEYS.slice(),
  tradeable: Mkt.KEYS.filter(function (k) { return Mkt.CTX[k].dir !== 0; }),
  measurable: Mkt.KEYS.filter(function (k) { return Mkt.CTX[k].mmType !== "none" && Mkt.CTX[k].dir !== 0; }),
  mmSpike: both(["spikeChannel"]),
  mmLeg: both(["tightChannel", "twoLegPullback", "mtr", "finalFlag"]),
  mmRange: both(["successBo", "failedBo", "rangeLow"]),
  mmWedge: both(["wedgeBottom"]),
  swing: [], scalp: [], boFate: []
};
Mkt.KEYS.forEach(function (k) {
  var c = Mkt.CTX[k];
  if (c.dir === 0) return;
  if (c.style === "swing") POOL.swing.push(k);
  if (c.style === "scalp") POOL.scalp.push(k);
});
/* two failures per follow-through: enough to teach the base rate, not enough
   that answering "it fails" every time clears the 70% pass mark */
both(["failedBo"]).forEach(function (k) { POOL.boFate.push(k, k); });
both(["successBo"]).forEach(function (k) { POOL.boFate.push(k); });

/* ---------------- scoring helpers ---------------- */
function band(err, tol) {
  if (err <= tol) return 1;
  if (err <= tol * 2) return 0.68;
  if (err <= tol * 3.4) return 0.3;
  return 0;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pct(x) { return Math.round(x * 100) + "%"; }
function fmtN(p, dec) { return p.toFixed(dec); }
function ptol(ch) { return Math.max(0.55 * ch.atr, 0.11 * (ch.gt.height || ch.atr * 3)); }
/** the reward-to-risk this context offers from its reference entry */
function refRR(ch) { return ch.gt.refRR || 0; }
/** Brooks' trader's equation: is probability x reward bigger than the rest? */
function equation(p, rr) { return p * rr - (1 - p); }
function rrScore(rr, goal, can) {
  if (rr >= goal) return 1;
  if (can < goal && rr >= can * 0.85) return 0.75;
  if (rr >= goal * 0.75) return 0.6;
  if (rr >= 1) return 0.35;
  return 0.1;
}
/** where price sits inside its range: 0 = at the low, 1 = at the high */
function rangePos(ch) {
  var g = ch.gt;
  if (g.rangeTop === undefined) return null;
  var px = ch.bars[g.decision].c, h = g.rangeTop - g.rangeBot;
  return h > 0 ? clamp((px - g.rangeBot) / h, 0, 1) : 0.5;
}
function outcomeLine(ch) {
  var g = ch.gt;
  if (!g.tradeable) return "";
  return g.worked
    ? "On this tape it did work — the target came before the stop."
    : "On this tape it failed: the stop came first. About " + pct(1 - g.prob) + " of these do.";
}
function probLine(ch) {
  var g = ch.gt, e = equation(g.prob, g.refRR);
  return "This context wins about <b>" + pct(g.prob) + "</b> of the time in this trainer, and offers roughly <b>" +
    g.refRR.toFixed(2) + "R</b>. Trader's equation: " + g.prob.toFixed(2) + " x " + g.refRR.toFixed(2) +
    " − " + (1 - g.prob).toFixed(2) + " = <b>" + (e >= 0 ? "+" : "") + e.toFixed(2) + "R</b> per trade.";
}

      };
    }
    if (ans.dir !== g.dir) {

        score: 0, reveal: true, verdict: "Wrong side of the market",

      };

    var d = g.dir;
    var beyond = d > 0 ? (g.invalid - ans.stop) : (ans.stop - g.invalid);

    var risk = Math.abs(ans.entry - ans.stop), rr = risk > 0 ? Math.abs(ans.target - ans.entry) / risk : 0;
    var can = refRR(ch), rrS = rrScore(rr, minRR, can);

      : "At " + rr.toFixed(2) + "R you left reward behind — this context offers about " + can.toFixed(2) + "R.");
    lines.push(outcomeLine(ch));
    return { score: s, reveal: true, verdict: s >= 0.85 ? "Solid plan" : s >= 0.55 ? "Workable, with holes" : "Needs rework", lines: lines.filter(Boolean) };
  }

/* ---------------- pool picker ---------------- */
function pickPool(pool, seed) {
  var R = Mkt.mkR((seed ^ 0x9e37) >>> 0);
  return pool[Math.floor(R.u() * pool.length)];
}

var MIXED_KINDS = ["alwaysIn", "cycle", "context", "signalBar", "takeSide", "rangePlace",
  "boFate", "scalpSwing", "measure", "stop", "target", "traderEq", "plan"];

function nodeById(id) {
  for (var i = 0; i < TIERS.length; i++) {
    for (var j = 0; j < TIERS[i].nodes.length; j++) {
      if (TIERS[i].nodes[j].id === id) return { tier: TIERS[i], node: TIERS[i].nodes[j], ti: i, ni: j };
    }
  }
  return null;
}

/** build one rep; resolves the "mixed" pseudo-kind */
function prepareRep(node, rep, seed) {
  var spec = node, kindName = node.kind;
  if (kindName === "mixed") {
    var R = Mkt.mkR(seed ^ 0xfeed);
    kindName = MIXED_KINDS[Math.floor(R.u() * MIXED_KINDS.length)];
    spec = {
      kind: kindName, minRR: 1.8,
      pool: kindName === "measure" || kindName === "target" ? POOL.measurable
        : kindName === "boFate" ? POOL.breakout
          : kindName === "rangePlace" ? POOL.range
            : kindName === "scalpSwing" ? POOL.tradeable : POOL.all
    };
  }
  var K = KIND[kindName];
  var prep = K.prepare(spec, seed);
  prep.kind = kindName; prep.K = K; prep.spec = spec;
  return prep;
}

var PROG = (function () {
  var KEY = "tt.brooks.v1";
  var st = { xp: 0, placed: false, rank: 0, skills: {}, nodes: {}, journal: [], trades: [], made: Date.now() };
  Object.keys(SKILLS).forEach(function (k) { st.skills[k] = { s: 0, n: 0 }; });

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        Object.keys(o).forEach(function (k) { st[k] = o[k]; });
        Object.keys(SKILLS).forEach(function (k) { if (!st.skills[k]) st.skills[k] = { s: 0, n: 0 }; });
      }
    } catch (e) { }
    return st;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } }
  function skillBump(skill, score) {
    var s = st.skills[skill] || (st.skills[skill] = { s: 0, n: 0 });
    var w = s.n === 0 ? 1 : 0.28;
    s.s = s.s * (1 - w) + score * w; s.n++;
  }
  function repDone(kindName, score) {
    var K = KIND[kindName];
    if (!K) return;
    skillBump(K.skill, score);
    if (K.skill2) skillBump(K.skill2, score * 0.9 + 0.05);
    st.xp += Math.round(score * 12) + 2;
    save();
  }
  function nodeDone(node, avg) {
    var rec = st.nodes[node.id] || (st.nodes[node.id] = { best: 0, tries: 0 });
    rec.tries++; rec.last = avg;
    if (avg > rec.best) rec.best = avg;
    rec.at = Date.now();
    st.xp += Math.round(avg * 45) + 10;
    st.journal.unshift({ t: Date.now(), node: node.id, title: node.title, avg: avg, n: node.n });
    st.journal = st.journal.slice(0, 60);
    recomputeRank(); save();
  }
  function nodePass(node) {
    var rec = st.nodes[node.id];
    return !!rec && rec.best >= (node.pass || 0.7);
  }
  function tierDone(tier) { return tier.nodes.every(nodePass); }
  function tierProgress(tier) {
    var d = tier.nodes.filter(nodePass).length;
    return { done: d, total: tier.nodes.length, frac: d / tier.nodes.length };
  }
  function tierOpen(ti) {
    if (ti === 0) return true;
    if (st.rank >= ti) return true;
    return tierDone(TIERS[ti - 1]);
  }
  function recomputeRank() {
    var r = 0;
    for (var i = 0; i < TIERS.length; i++) { if (tierDone(TIERS[i])) r = i + 1; else break; }
    if (r > st.rank) st.rank = r;
    return st.rank;
  }
  function rankName() { return RANKS[Math.min(st.rank, RANKS.length - 1)].n; }
  function nextNode() {
    for (var i = 0; i < TIERS.length; i++) {
      if (!tierOpen(i)) break;
      for (var j = 0; j < TIERS[i].nodes.length; j++) {
        if (!nodePass(TIERS[i].nodes[j])) return { tier: TIERS[i], node: TIERS[i].nodes[j], ti: i };
      }
    }
    return null;
  }
  function logTrade(t) { st.trades.unshift(t); st.trades = st.trades.slice(0, 300); save(); }
  function reset() { try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); }
  function place(rank) {
    st.placed = true;
    st.rank = Math.max(st.rank, rank);
    for (var i = 0; i < rank; i++) {
      TIERS[i].nodes.forEach(function (nd) {
        var rec = st.nodes[nd.id] || (st.nodes[nd.id] = { best: 0, tries: 0 });
        if (rec.best < 0.75) { rec.best = 0.75; rec.placed = true; }
      });
    }
    save();
  }
  load();
  return {
    st: st, save: save, nodeDone: nodeDone, repDone: repDone, nodePass: nodePass,
    tierDone: tierDone, tierProgress: tierProgress, tierOpen: tierOpen, rankName: rankName,
    nextNode: nextNode, skillBump: skillBump, logTrade: logTrade, reset: reset,
    place: place, recomputeRank: recomputeRank
  };
})();

    if (ui.mode === "chart" || ui.mode === "replay" || ui.mode === "plan") out.push(ticket());
    if (ui.mode === "plan" && !S.graded) {
      out.push('<button class="btn" id="noTradeBtn" style="width:100%;margin-top:9px">No trade here</button>');
    }

    if (S.graded) {
      var g = S.graded, cls = g.score >= 0.85 ? "good" : g.score >= 0.5 ? "mid" : "bad";
      out.push('<div class="fb ' + cls + '"><h4>' + esc(g.verdict) + ' · ' + Math.round(g.score * 100) + '%</h4>' +
        '<ul>' + g.lines.map(function (l) { return "<li>" + l + "</li>"; }).join("") + '</ul></div>');
    }
    $("drillPanel").innerHTML = out.join("");

    [].forEach.call($("drillPanel").querySelectorAll("[data-opt]"), function (b) {
      b.onclick = function () { if (S.graded) return; S.sel = b.dataset.opt; paintDrillPanel(); };
    });
    if ($("numIn")) $("numIn").oninput = function () { S.ansNum = this.value; };
    if ($("dirLong")) $("dirLong").onclick = function () { setDir(1); };
    if ($("dirShort")) $("dirShort").onclick = function () { setDir(-1); };
    if ($("execBtn")) $("execBtn").onclick = execute;
    if ($("noTradeBtn")) $("noTradeBtn").onclick = function () {
      chD.locked = true; finishRep(S.prep.K.grade(S.prep, { passed: true }));
    };
    if ($("passBtn")) $("passBtn").onclick = passTrade;

    paintFoot();
  }
  function dirToggle() {
    var d = chD.posDir || 1;
    return '<div class="ticket"><div class="hd">Direction</div><div class="dirsel">' +
      '<button id="dirLong" class="long' + (d > 0 ? " on" : "") + '">LONG</button>' +
      '<button id="dirShort" class="short' + (d < 0 ? " on" : "") + '">SHORT</button></div>' +
      '<div class="hint">Then tap the chart to drop the position box, and drag entry / stop / target.</div></div>';
  }
  function setDir(d) {
    chD.posDir = d;
    var p = chD.find("pos");
    if (p) {
      var a = S.prep.ch.atr;
      p.dir = d; p.stop = p.entry - d * a * 1.5; p.target = p.entry + d * a * 3;
      chD.render();
    } else { chD.setTool("pos"); }
    paintDrillPanel();
  }
  function ticket() {
    var r = chD.readout(), ch = S.prep.ch, out = [];
    out.push('<div class="ticket"><div class="hd">Read-out</div><div class="tgrid">');
    function f(k, v, cls) { out.push('<div class="tf"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>'); }
    if (r.leg !== undefined) {
      f("Measured leg", ch ? ch.dec !== undefined ? Math.abs(r.leg).toFixed(ch.dec) : "" : "");
      f("Projected target", r.mTarget !== undefined ? r.mTarget.toFixed(ch.dec) : "—", "am");
    }
    if (r.entry !== undefined) {
      f("Entry", r.entry.toFixed(ch.dec));
      f("Stop", r.stop.toFixed(ch.dec), "dn");
      f("Target", r.target.toFixed(ch.dec), "up");
      f("Reward : risk", r.rr.toFixed(2) + "R", r.rr >= 2 ? "up" : r.rr >= 1 ? "am" : "dn");
      f("Risk / unit", r.risk.toFixed(ch.dec));
      f("Risk of entry", r.riskPct.toFixed(2) + "%");
    }
    if (r.leg === undefined && r.entry === undefined) {
      out.push('<div class="hint" style="grid-column:1/-1">Nothing drawn yet.</div>');
    }
    out.push("</div></div>");
    if (S.graded && ch && ch.gt.tradeable) {
      var g = ch.gt;
      out.push('<div class="ticket"><div class="hd">Context</div><div class="tgrid">' +
        '<div class="tf"><div class="k">Cycle</div><div class="v" style="font-size:11px">' + g.cycle + '</div></div>' +
        '<div class="tf"><div class="k">Style</div><div class="v" style="font-size:11px">' + g.style + '</div></div>' +
        '<div class="tf"><div class="k">Wins</div><div class="v">' + Math.round(g.prob * 100) + '%</div></div>' +
        '<div class="tf"><div class="k">Offers</div><div class="v">' + g.refRR.toFixed(2) + 'R</div></div>' +
        '</div></div>');
    }
    return out.join("");
  }
  function replayPanel() {
    if (S.replayRun) return '<div class="ticket"><div class="hd">Executing</div><div class="hint">' + S.replayMsg + '</div></div>';
    if (S.graded) return "";
    return dirToggle() +
      '<div class="row" style="margin-top:9px;gap:7px">' +
      '<button class="btn primary grow" id="execBtn">Execute</button>' +
      '<button class="btn grow" id="passBtn">Pass</button></div>';
  }

  function paintFoot() {
    var f = $("drillFoot"), out = [];
    if (S.graded) {
      var last = S.idx >= S.n - 1;
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
      out.push('<button class="btn primary" id="nextBtn">' + (last ? "Finish" : "Next") + '</button>');
    } else if (S.prep.ui.mode === "replay") {
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
    } else {
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
      out.push('<button class="btn primary" id="subBtn">Submit</button>');
    }
    f.innerHTML = out.join("");
    if ($("quitBtn")) $("quitBtn").onclick = function () {
      if (S.abortSim) { S.abortSim(); S.abortSim = null; }
      if (chD._rev) { clearInterval(chD._rev); chD._rev = null; }
      setView("path");
    };
    if ($("subBtn")) $("subBtn").onclick = submit;
    if ($("nextBtn")) $("nextBtn").onclick = nextRep;
  }

  /* ---------- answering ---------- */
  function readAnswer() {
    var ui = S.prep.ui;
    if (ui.mode === "mcq") return S.sel;
    if (ui.mode === "numeric") { var v = parseFloat(S.ansNum); return isFinite(v) ? v : null; }
    if (ui.mode === "chart" || ui.mode === "plan") {
      if (ui.need === "hline") { var d = chD.find("hline"); return d ? d.p : null; }
      if (ui.need === "measure") return chD.find("measure");
      if (ui.need === "mark") return chD.userMark || null;
      if (ui.need === "pos") {
        var p = chD.find("pos");
        return p ? { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target } : null;
      }
    }
    return null;
  }
  function submit() {
    if (S.graded || S.busy) return;
    var ans = readAnswer();
    if (ans === null || ans === undefined || (typeof ans === "object" && S.prep.ui.need === "measure" && !ans.c)) {
      toast(S.prep.ui.mode === "mcq" ? "Pick an answer" :
        S.prep.ui.mode === "numeric" ? "Type a number" :
          S.prep.ui.need === "measure" ? "Place A, B and C first" : "Nothing placed on the chart yet");
      return;
    }
    finishRep(S.prep.K.grade(S.prep, ans));
  }
  function finishRep(g) {
    S.graded = g;
    S.scores[S.idx] = g.score;
    PROG.repDone(S.prep.kind, g.score);
    paintHeader();
    if (g.r !== undefined) S.rs.push(g.r);
    chD.locked = true;
    if (g.marks) g.marks.forEach(function (m) { chD.markers.push(m); });
    if (g.reveal && S.prep.ch) {
      chD.gt = S.prep.ch.gt;
      chD.gtMeasure = (S.prep.kind === "measure" || S.prep.kind === "target");
      chD.sigBar = null;                 /* the bracket has done its job */
      chD.revealTo(S.prep.ch.bars.length - 1, 26, function () { chD.fit(); });
    }
    paintDrillPanel();
  }
  function nextRep() {
    S.idx++;
    if (S.idx >= S.n) return finishNode();
    loadRep();
  }
  function finishNode() {
    var avg = S.scores.reduce(function (a, b) { return a + b; }, 0) / S.scores.length;
    if (S.placement) {
      var rank = avg < 0.3 ? 0 : avg < 0.42 ? 1 : avg < 0.52 ? 2 : avg < 0.6 ? 3 : avg < 0.68 ? 4 :
        avg < 0.75 ? 5 : avg < 0.82 ? 6 : avg < 0.9 ? 7 : 8;
      PROG.place(rank);
      modal('<h2>Placed: ' + RANKS[rank].n + '</h2>' +
        '<p>You scored <b>' + Math.round(avg * 100) + '%</b> across the mixed set.</p>' +
        '<p>The ladder now starts at <b>' + TIERS[rank].name + '</b> and runs through to Mastery certification. ' +
        'Everything below is unlocked if you want to revisit it — the scores there are provisional until you actually run the drills.</p>' +
        '<button class="btn primary" id="okBtn">Show my path</button>');
      $("okBtn").onclick = function () { closeModal(); setView("path"); };
      return;
    }
    var pass = avg >= (S.node.pass || 0.7);
    PROG.nodeDone(S.node, avg);
    var rTxt = "";
    if (S.rs.length) {
      var tot = S.rs.reduce(function (a, b) { return a + b; }, 0);
      rTxt = '<p>Net result across the session: <b class="' + (tot >= 0 ? "up" : "dn") + '">' +
        (tot >= 0 ? "+" : "") + tot.toFixed(2) + "R</b> over " + S.rs.length + " trades. " +
        "Process score is what counts here — the R is the market's opinion, not a grade.</p>";
    }
    modal('<h2>' + esc(S.node.title) + '</h2>' +
      '<p>Score <b>' + Math.round(avg * 100) + '%</b> · ' +
      (pass ? '<span class="up">passed</span>' : '<span class="dn">below the ' + Math.round((S.node.pass || 0.7) * 100) + '% pass mark</span>') + '</p>' + rTxt +
      (pass ? "" : "<p>Retake it — repetition on the same skill is the whole point. Your best score is the one that counts.</p>") +
      '<button class="btn primary" id="okBtn">' + (pass ? "Continue" : "Back to path") + '</button> ' +
      '<button class="btn ghost" id="againBtn">Run it again</button>');
    $("okBtn").onclick = function () { closeModal(); setView("path"); };
    $("againBtn").onclick = function () { closeModal(); startNode(S.node); };
  }

  /* ---------------- placement ---------------- */
  function startPlacement() {
    startNode({ id: "placement", kind: "mixed", n: 10, title: "Placement test", pass: 1.1 }, { placement: true });
  }

  /* =====================================================================
     TRADE SIMULATION (shared by replay drills and practice)
     ===================================================================== */
  function simulate(ch, plan, fromIdx, onBar, done) {
    var bars = ch.bars, i = fromIdx, filled = false, fillPx = 0, waited = 0;
    var d = plan.dir, risk = Math.abs(plan.entry - plan.stop);
    var timer = setInterval(function () {
      i++;
      if (i >= bars.length) { clearInterval(timer); return done(finish("data end", filled ? bars[bars.length - 1].c : null)); }
      var b = bars[i];
      if (!filled) {
        if (b.l <= plan.entry && plan.entry <= b.h) { filled = true; fillPx = plan.entry; }
        else if (++waited > 14) { clearInterval(timer); onBar(i); return done({ r: 0, exit: "no fill", bars: waited, filledAt: -1 }); }
      } else {
        var hitS = d > 0 ? b.l <= plan.stop : b.h >= plan.stop;
        var hitT = d > 0 ? b.h >= plan.target : b.l <= plan.target;
        if (hitS) { clearInterval(timer); onBar(i); return done(finish("stopped", plan.stop, i)); }
        if (hitT) { clearInterval(timer); onBar(i); return done(finish("target", plan.target, i)); }
      }
      onBar(i);
    }, 95);
    function finish(why, px, at) {
      if (px === null || !filled) return { r: 0, exit: "no fill", bars: waited, filledAt: -1 };
      return { r: ((px - fillPx) * d) / (risk || 1e-9), exit: why, bars: at ? at - fromIdx : 0, filledAt: at || i };
    }
    return function abort() { clearInterval(timer); };
  }

  function execute() {
    var p = chD.find("pos");
    if (!p) { toast("Place the position on the chart first"); return; }
    if (Math.abs(p.entry - p.stop) < 1e-9) { toast("Stop and entry are the same price"); return; }
    var ch = S.prep.ch;
    S.replayRun = true; S.replayMsg = "Waiting for fill…"; chD.locked = true;
    paintDrillPanel();
    var plan = { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target };
    S.abortSim = simulate(ch, plan, chD.vis,
      function (i) {
        chD.vis = i;
        if (i > chD.i1 - 3) { chD.i0 += 1; chD.i1 += 1; }
        chD.render();
        S.replayMsg = "Bar " + (i - ch.gt.decision) + " · " + ch.sym + " " + ch.bars[i].c.toFixed(ch.dec);
        var el = $("drillPanel").querySelector(".ticket .hint");
        if (el) el.textContent = S.replayMsg;
      },
      function (res) {
        S.replayRun = false; S.abortSim = null;
        plan.result = res;
        PROG.logTrade({
          t: Date.now(), sym: ch.sym, tf: ch.tf, pattern: ch.gt.name, dir: plan.dir,
          r: res.r, exit: res.exit, src: S.node.id
        });
        finishRep(S.prep.K.grade(S.prep, plan));
      });
  }
  function passTrade() {
    chD.locked = true;
    finishRep(S.prep.K.grade(S.prep, { passed: true }));
  }

  /* =====================================================================
     PRACTICE
     ===================================================================== */
  var prac = { ch: null, playing: false, timer: null, live: null, eq: 25000, riskPct: 1 };

  function newPractice(opts) {
    opts = opts || {};
    var seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    var key = opts.ctx || Mkt.KEYS[(Math.random() * Mkt.KEYS.length) | 0];
    prac.ch = Mkt.gen({ seed: seed, ctx: key });
    prac.live = null; prac.playing = false;
    if (prac.timer) { clearInterval(prac.timer); prac.timer = null; }
    if (prac.abort) { prac.abort(); prac.abort = null; }
    var start = Math.max(30, prac.ch.gt.decision - (4 + ((Math.random() * 10) | 0)));
    chP.load(prac.ch, start);
    chP.sigBar = null;
    chP.locked = false;
    chP.posDir = 1;
    chP.onChange = paintPractice;
    buildPracToolbar();
    paintPractice();
  }
  function buildPracToolbar() {
    var wrap = $("pracTools");
    var html = '<div class="sym"><b>' + prac.ch.sym + '</b>' + prac.ch.tfLbl + '</div><div class="tsep"></div>';
    TOOLBTN.forEach(function (t) { html += '<button class="tool" data-tool="' + t[0] + '" title="' + t[2] + '">' + t[1] + '</button>'; });
    html += '<div class="tsep"></div>' +
      '<button class="tool" data-act="undo" title="Undo">↺</button>' +
      '<button class="tool" data-act="clear" title="Clear">✕</button>' +
      '<button class="tool" data-act="fit" title="Fit">⤢</button>' +
      '<div class="tsep"></div>' +
      '<button class="tool wide" data-act="step">Step ▸</button>' +
      '<button class="tool wide" data-act="play" id="playBtn">Play ▶</button>' +
      '<button class="tool wide" data-act="new">New chart</button>';
    wrap.innerHTML = html;
    [].forEach.call(wrap.querySelectorAll("[data-tool]"), function (b) {
      b.onclick = function () { chP.setTool(b.dataset.tool); syncTools(wrap, chP); };
    });
    [].forEach.call(wrap.querySelectorAll("[data-act]"), function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === "undo") chP.undo();
        if (a === "clear") chP.clearAll();
        if (a === "fit") chP.fit();
        if (a === "step") stepPrac(1);
        if (a === "play") togglePlay();
        if (a === "new") newPractice();
        paintPractice();
      };
    });
    chP._syncWrap = wrap;
    syncTools(wrap, chP);
  }
  function stepPrac(n) {
    if (prac.live) return;
    chP.vis = Math.min(chP.bars.length - 1, chP.vis + n);
    if (chP.vis > chP.i1 - 3) { chP.i0 += n; chP.i1 += n; }
    chP.render();
  }
  function togglePlay() {
    if (prac.playing) { clearInterval(prac.timer); prac.timer = null; prac.playing = false; }
    else {
      prac.playing = true;
      prac.timer = setInterval(function () {
        if (chP.vis >= chP.bars.length - 1) { togglePlay(); paintPractice(); return; }
        stepPrac(1);
      }, 260);
    }
    var b = $("playBtn"); if (b) b.textContent = prac.playing ? "Pause ❚❚" : "Play ▶";
  }

  function paintPractice() {
    if (!prac.ch) return;
    if (chP._syncWrap) syncTools(chP._syncWrap, chP);
    var r = chP.readout(), ch = prac.ch, out = [];
    out.push('<div class="task">Practice · free chart</div>');
    out.push('<div class="brief">' + esc(ch.nm) + ' — ' + ch.tfLbl +
      '. Step the tape forward, mark the structure, measure the move, then put a position on it.</div>');

    out.push(dirTogglePrac());

    out.push('<div class="ticket"><div class="hd">Risk model</div><div class="tgrid">' +
      '<div class="tf"><div class="k">Account</div><input class="num" id="eqIn" style="padding:3px 5px;font-size:12px" type="number" value="' + prac.eq + '"></div>' +
      '<div class="tf"><div class="k">Risk %</div><input class="num" id="rpIn" style="padding:3px 5px;font-size:12px" type="number" step="0.25" value="' + prac.riskPct + '"></div>' +
      '</div></div>');

    out.push('<div class="ticket"><div class="hd">Ticket</div><div class="tgrid">');
    function f(k, v, cls) { out.push('<div class="tf"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>'); }
    if (r.mTarget !== undefined) f("Measured target", r.mTarget.toFixed(ch.dec), "am");
    if (r.leg !== undefined) f("Leg", Math.abs(r.leg).toFixed(ch.dec) + " (" + Math.abs(r.legPct).toFixed(1) + "%)");
    if (r.entry !== undefined) {
      var risk$ = prac.eq * prac.riskPct / 100, units = r.risk > 0 ? risk$ / r.risk : 0;
      f("Entry", r.entry.toFixed(ch.dec));
      f("Stop", r.stop.toFixed(ch.dec), "dn");
      f("Target", r.target.toFixed(ch.dec), "up");
      f("R : R", r.rr.toFixed(2) + "R", r.rr >= 2 ? "up" : r.rr >= 1 ? "am" : "dn");
      f("Size", units.toFixed(units > 100 ? 0 : 2) + " u");
      f("Risk", "$" + risk$.toFixed(0));
      f("If target hits", "$" + (risk$ * r.rr).toFixed(0), "up");
      f("Stop distance", (r.risk / ch.atr).toFixed(2) + " ATR");
    } else {
      out.push('<div class="hint" style="grid-column:1/-1">Drop a position with the ⌸ tool to size it.</div>');
    }
    out.push("</div></div>");

    if (prac.result) {
      var res = prac.result;
      out.push('<div class="fb ' + (res.r > 0 ? "good" : res.r < 0 ? "bad" : "mid") + '"><h4>' + esc(res.exit) + ' · ' +
        (res.r >= 0 ? "+" : "") + res.r.toFixed(2) + 'R</h4><ul>' +
        '<li>P&amp;L on the modelled size: <b>' + (res.r >= 0 ? "+" : "") + "$" + (res.r * prac.eq * prac.riskPct / 100).toFixed(0) + '</b></li>' +
        '<li>Held ' + res.bars + ' bars.</li></ul></div>');
    }
    if (prac.revealed) {
      var g = ch.gt;
      out.push('<div class="fb mid"><h4>' + esc(g.name) + '</h4><ul>' +
        '<li>' + g.brooks + '</li>' +
        '<li>Cycle <b>' + g.cycle + '</b> · always-in <b>' +
        (g.alwaysIn > 0 ? "long" : g.alwaysIn < 0 ? "short" : "none") + '</b> · ' + g.style + '</li>' +
        (g.tradeable
          ? '<li>Entry <b>' + g.entry.toFixed(ch.dec) + '</b> · stop <b>' + g.invalid.toFixed(ch.dec) +
            '</b> · target <b>' + g.target.toFixed(ch.dec) + '</b> (' + g.refRR.toFixed(2) + 'R, wins ' +
            Math.round(g.prob * 100) + '%)</li>'
          : '<li>Not tradeable — expectancy is negative here.</li>') +
        '<li>' + g.mmRule + '</li>' +
        '<li>' + (g.worked ? "The target printed." : "It failed before reaching the target.") + '</li></ul></div>');
    }
    $("pracPanel").innerHTML = out.join("");

    if ($("pdirLong")) $("pdirLong").onclick = function () { setPracDir(1); };
    if ($("pdirShort")) $("pdirShort").onclick = function () { setPracDir(-1); };
    if ($("eqIn")) $("eqIn").onchange = function () { prac.eq = Math.max(100, +this.value || 25000); paintPractice(); };
    if ($("rpIn")) $("rpIn").onchange = function () { prac.riskPct = Math.min(10, Math.max(0.1, +this.value || 1)); paintPractice(); };

    var foot = [];
    foot.push('<button class="btn primary" id="pExec">' + (prac.live ? "Running…" : "Execute") + '</button>');
    foot.push('<button class="btn" id="pReveal">Reveal</button>');
    foot.push('<button class="btn ghost" id="pNew">New</button>');
    $("pracFoot").innerHTML = foot.join("");
    $("pExec").onclick = pracExecute;
    $("pReveal").onclick = function () {
      prac.revealed = true; chP.gt = ch.gt; chP.gtMeasure = true; chP.render(); paintPractice();
    };
    $("pNew").onclick = function () { prac.result = null; prac.revealed = false; newPractice(); };
  }
  function dirTogglePrac() {
    var d = chP.posDir || 1;
    return '<div class="ticket"><div class="hd">Direction</div><div class="dirsel">' +
      '<button id="pdirLong" class="long' + (d > 0 ? " on" : "") + '">LONG</button>' +
      '<button id="pdirShort" class="short' + (d < 0 ? " on" : "") + '">SHORT</button></div></div>';
  }
  function setPracDir(d) {
    chP.posDir = d;
    var p = chP.find("pos");
    if (p) {
      p.dir = d; p.stop = p.entry - d * prac.ch.atr * 1.5; p.target = p.entry + d * prac.ch.atr * 3;
      chP.render();
    } else chP.setTool("pos");
    paintPractice();
  }
  function pracExecute() {
    var p = chP.find("pos");
    if (!p) { toast("Place a position first"); return; }
    if (prac.live) return;
    if (prac.playing) togglePlay();
    prac.live = true; prac.result = null;
    var ch = prac.ch;
    prac.abort = simulate(ch, { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target }, chP.vis,
      function (i) {
        chP.vis = i;
        if (i > chP.i1 - 3) { chP.i0 += 1; chP.i1 += 1; }
        chP.render();
      },
      function (res) {
        prac.live = false; prac.result = res;
        PROG.logTrade({
          t: Date.now(), sym: ch.sym, tf: ch.tf, pattern: ch.gt.name, dir: p.dir,
          r: res.r, exit: res.exit, src: "practice"
        });
        paintPractice(); paintHeader();
      });
    paintPractice();
  }

  /* =====================================================================
     STATS
     ===================================================================== */
  function tradeStats(tr) {
    var w = tr.filter(function (t) { return t.r > 0; }), l = tr.filter(function (t) { return t.r < 0; });
    var sumW = w.reduce(function (a, t) { return a + t.r; }, 0);
    var sumL = Math.abs(l.reduce(function (a, t) { return a + t.r; }, 0));
    var tot = tr.reduce(function (a, t) { return a + t.r; }, 0);
    var cum = 0, peak = 0, dd = 0, curve = [];
    tr.slice().reverse().forEach(function (t) {
      cum += t.r; curve.push(cum);
      if (cum > peak) peak = cum;
      dd = Math.min(dd, cum - peak);
    });
    return {
      n: tr.length, wr: tr.length ? w.length / tr.length : 0,
      avgW: w.length ? sumW / w.length : 0, avgL: l.length ? sumL / l.length : 0,
      exp: tr.length ? tot / tr.length : 0, pf: sumL > 0 ? sumW / sumL : (sumW > 0 ? Infinity : 0),
      tot: tot, dd: dd, curve: curve
    };
  }
  function spark(vals) {
    if (vals.length < 2) return '<div class="hint">Not enough trades yet.</div>';
    var mn = Math.min.apply(null, vals.concat([0])), mx = Math.max.apply(null, vals.concat([0]));
    var rg = (mx - mn) || 1, w = 300, ht = 74;
    var pts = vals.map(function (v, i) {
      return ((i / (vals.length - 1)) * w).toFixed(1) + "," + (ht - ((v - mn) / rg) * ht).toFixed(1);
    }).join(" ");
    var zy = (ht - ((0 - mn) / rg) * ht).toFixed(1);
    return '<svg viewBox="0 0 ' + w + ' ' + ht + '" preserveAspectRatio="none" style="width:100%;height:74px;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:9px">' +
      '<line x1="0" y1="' + zy + '" x2="' + w + '" y2="' + zy + '" stroke="#2A303C" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + (vals[vals.length - 1] >= 0 ? "#3FBF7F" : "#E5634D") +
      '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  }
  function paintStats() {
    paintHeader();
    var st = PROG.st, s = tradeStats(st.trades || []), out = [];
    out.push('<div class="seclabel">Standing</div><div class="statgrid">' +
      box("Rank", PROG.rankName()) + box("XP", st.xp) +
      box("Tiers cleared", TIERS.filter(PROG.tierDone).length + " / " + TIERS.length) +
      box("Drills passed", TIERS.reduce(function (a, t) { return a + t.nodes.filter(PROG.nodePass).length; }, 0)) +
      '</div>');

    out.push('<div class="seclabel">Simulated trades</div>');
    if (!s.n) out.push('<div class="card hint">No trades yet — run a live execution drill or take a trade in Practice.</div>');
    else {
      out.push('<div class="statgrid">' +
        box("Trades", s.n) + box("Win rate", Math.round(s.wr * 100) + "%") +
        box("Expectancy", s.exp.toFixed(2) + "R", s.exp >= 0 ? "up" : "dn") +
        box("Net", (s.tot >= 0 ? "+" : "") + s.tot.toFixed(1) + "R", s.tot >= 0 ? "up" : "dn") +
        box("Avg win", "+" + s.avgW.toFixed(2) + "R", "up") +
        box("Avg loss", "-" + s.avgL.toFixed(2) + "R", "dn") +
        box("Profit factor", isFinite(s.pf) ? s.pf.toFixed(2) : "∞") +
        box("Max drawdown", s.dd.toFixed(1) + "R", "dn") + '</div>');
      out.push('<div class="seclabel">Equity curve (R)</div>' + spark(s.curve));
      out.push('<div class="seclabel">Trade log</div><div class="tblwrap"><table><tr><th>Setup</th><th>Sym</th><th>Side</th><th>Exit</th><th>R</th></tr>' +
        st.trades.slice(0, 25).map(function (t) {
          return "<tr><td>" + esc(t.pattern) + "</td><td>" + esc(t.sym) + "</td><td>" + (t.dir > 0 ? "L" : "S") +
            "</td><td>" + esc(t.exit) + '</td><td class="' + (t.r >= 0 ? "up" : "dn") + '">' + (t.r >= 0 ? "+" : "") + t.r.toFixed(2) + "</td></tr>";
        }).join("") + "</table></div>");
    }

    out.push('<div class="seclabel">Skills</div><div class="skillgrid">');
    Object.keys(SKILLS).forEach(function (k) {
      var sk = st.skills[k] || { s: 0, n: 0 };
      out.push('<div class="skill"><div class="n">' + SKILLS[k] + '<span>' + Math.round(sk.s * 100) + '%</span></div>' +
        '<div class="b"><i style="width:' + Math.round(sk.s * 100) + '%"></i></div>' +
        '<div class="hint" style="margin-top:4px;font-size:10px">' + sk.n + ' reps</div></div>');
    });
    out.push("</div>");

    if (st.journal && st.journal.length) {
      out.push('<div class="seclabel">Recent drills</div><div class="tblwrap"><table><tr><th>Drill</th><th>Score</th><th>When</th></tr>' +
        st.journal.slice(0, 15).map(function (j) {
          return "<tr><td>" + esc(j.title) + '</td><td class="' + (j.avg >= 0.7 ? "up" : "dn") + '">' + Math.round(j.avg * 100) +
            "%</td><td>" + new Date(j.t).toLocaleDateString() + "</td></tr>";
        }).join("") + "</table></div>");
    }
    out.push('<div class="seclabel">Data</div><div class="card"><div class="hint" style="margin-bottom:8px">' +
      'Progress is stored in this browser only.</div>' +
      '<div class="hint mono" style="margin-bottom:8px">' + esc(APP.name) + ' v' + esc(APP.version) +
      ' · build ' + esc(APP.build) + '</div>' +
      '<button class="btn" id="resetBtn">Reset all progress</button></div>');
    $("statsBody").innerHTML = out.join("");
    $("resetBtn").onclick = function () {
      modal('<h2>Reset everything?</h2><p>Ranks, skill scores and the trade log will be wiped.</p>' +
        '<button class="btn primary" id="yes">Yes, reset</button> <button class="btn ghost" id="no">Cancel</button>');
      $("yes").onclick = function () { PROG.reset(); };
      $("no").onclick = closeModal;
    };
  }
  function box(k, v, cls) {
    return '<div class="sbox"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>";
  }

  /* =====================================================================
     HELP
     ===================================================================== */
  function showHelp() {
    modal('<h2>How this works</h2>' +
      '<p>This trainer is built on <b>Al Brooks\' price action framework</b>. Every chart is one identifiable ' +
      'context — spike and channel, tight channel, trading range, barbwire, failed breakout, wedge, major trend ' +
      'reversal, final flag, climax — and each one carries its own always-in direction, probability, measured move ' +
      'and scalp-or-swing answer.</p>' +
      '<p>Charts are generated rather than replayed from a feed, but the <b>probabilities are real</b>: each context ' +
      'resolves at the rate the app quotes for it, and every tradeable context has positive expectancy while every ' +
      'no-trade context has negative expectancy. The base rates you feel here are the ones the app teaches.</p>' +

      '<h3>The market cycle</h3>' +
      '<p>Breakout becomes channel, channel becomes trading range, range becomes the next breakout. Name the phase ' +
      'first: you <b>swing</b> in a channel, you <b>scalp</b> in a range, and you do nothing in barbwire. Most of ' +
      'the trading day is a range, which is why half this ladder is about ranges and traps.</p>' +

      '<h3>The 80% rule</h3>' +
      '<p>Roughly four out of five breakout attempts out of a trading range fail. That single number is most of the ' +
      'edge available in a range: fade the failed breakouts, and only go with the ones showing big trend bars, ' +
      'closes on their extremes and a follow-through bar.</p>' +

      '<h3>Measured moves</h3>' +
      '<p>Pick <b>⇕</b> and click three points — <b>A</b> and <b>B</b> to measure, <b>C</b> to anchor the projection. ' +
      'Which move you measure depends on the context:</p>' +
      '<li><b>Spike and channel</b> — measure the spike, project from the top of the spike.</li>' +
      '<li><b>Pullbacks</b> — leg one equals leg two: measure the first leg, project from the pullback.</li>' +
      '<li><b>Breakouts</b> — measure the range height, project from the edge that broke.</li>' +
      '<li><b>Failed breakouts</b> — the target is the other side of the range.</li>' +
      '<li><b>Wedges</b> — no height projection; the target is where the wedge began.</li>' +

      '<h3>The trader\'s equation</h3>' +
      '<p>Probability x reward against probability of loss x risk. A 40% setup paying 3R is a good trade; a 65% ' +
      'setup paying 0.8R is a losing one. The app shows you both numbers for every context after you answer, so ' +
      'you can stop arguing with your own results.</p>' +

      '<h3>Signal bars and stops</h3>' +
      '<p>A bar worth trading has a body that is most of its range, closes near its extreme in your direction, and ' +
      'has its tail on the far side. Stops belong just beyond the structure that has to hold — the signal bar, the ' +
      'swing, the range edge — plus room for noise. Inside the structure is too tight; several ATR beyond destroys ' +
      'the R multiple.</p>' +

      '<h3>Scoring</h3>' +
      '<p>Each node is a set of reps and your best score is kept. A tier unlocks at 70%; certification needs 85%. ' +
      'In execution drills the <b>process score</b> and the <b>R result</b> are reported separately on purpose — a ' +
      'good plan that loses is still a good plan, and a win on a bad plan is the most expensive kind.</p>' +

      '<h3>Controls</h3>' +
      '<li>Scroll or pinch to zoom · drag to pan · double-click to fit.</li>' +
      '<li>↺ undo · ✕ clear drawings · ⤢ fit.</li>' +
      '<p class="hint" style="margin-top:14px">' + esc(APP.name) + ' <b>v' + esc(APP.version) +
      '</b> · build ' + esc(APP.build) + ' · ' + esc(APP.basis) + '</p>' +
      '<button class="btn primary" id="okBtn" style="margin-top:6px">Got it</button>');
    $("okBtn").onclick = closeModal;
  }

  /* debug handle — also what the console needs to jump straight to a drill */
  window.TT = {
    chD: chD, chP: chP, startNode: startNode, nodeById: nodeById,
    PROG: PROG, Mkt: Mkt, setView: setView, APP: APP,
    get session() { return S; }
  };

  /* ---------------- boot ---------------- */
  $("verTag").textContent = "v" + APP.version;
  paintHeader();
  paintPath();
  if (!PROG.st.placed) setTimeout(showHelp, 400);
  window.addEventListener("resize", function () { chD.render(); chP.render(); });
})();
</script>
</body>
</html>
