    });
  }

  /* ---------- drill panel ---------- */
  function paintDrillPanel() {
    var prep = S.prep, ui = prep.ui, out = [];
    if (chD._syncWrap) syncTools(chD._syncWrap, chD);

    out.push('<div class="stepdots">' + Array.apply(null, Array(S.n)).map(function (_, i) {
      var c = i < S.idx ? (S.scores[i] >= 0.7 ? "ok" : "on") : i === S.idx ? "on" : "";
      return '<i class="' + c + '"></i>';
    }).join("") + '</div>');
    out.push('<div class="task">' + esc(S.placement ? "Placement" : S.node.title) + ' · ' + (S.idx + 1) + " / " + S.n + '</div>');
    out.push('<div class="brief">' + prep.q + '</div>');
    if (ui.hint) out.push('<div class="hint" style="margin-top:8px">' + ui.hint + '</div>');

    if (ui.mode === "mcq") {
      out.push('<div style="margin-top:11px">');
      ui.options.forEach(function (o, i) {
        var cls = "opt" + (S.sel === o.k ? " sel" : "");
        if (S.graded) {
          var right = correctKey(prep);
          if (o.k === right) cls += " right";
          else if (S.sel === o.k) cls += " wrong";
        }
        out.push('<button class="' + cls + '" data-opt="' + esc(o.k) + '">' + esc(o.t) + '</button>');
      });
      out.push('</div>');
    }
    if (ui.mode === "numeric") {
      out.push('<div style="margin-top:11px"><div class="hint" style="margin-bottom:5px">' + esc(ui.label) + '</div>' +
        '<input class="num" id="numIn" type="number" step="' + (ui.step || "0.01") + '" inputmode="decimal" ' +
        (S.graded ? "disabled" : "") + ' value="' + (S.ansNum != null ? S.ansNum : "") + '"></div>');
    }
    if (ui.mode === "chart" && ui.need === "pos") out.push(dirToggle());
    if (ui.mode === "replay") out.push(replayPanel());
    if (ui.mode === "chart" || ui.mode === "replay") out.push(ticket());

    if (S.graded) {
      var g = S.graded, cls = g.score >= 0.85 ? "good" : g.score >= 0.5 ? "mid" : "bad";
      out.push('<div class="fb ' + cls + '"><h4>' + esc(g.verdict) + ' · ' + Math.round(g.score * 100) + '%</h4>' +
        '<ul>' + g.lines.map(function (l) { return "<li>" + l + "</li>"; }).join("") + '</ul></div>');
    }
    $("drillPanel").innerHTML = out.join("");

    [].forEach.call($("drillPanel").querySelectorAll("[data-opt]"), function (b) {
      b.onclick = function () { if (S.graded) return; S.sel = b.dataset.opt; paintDrillPanel(); };
    });
    if ($("numIn")) $("numIn").oninput = function () { S.ansNum = this.value; };
    if ($("dirLong")) $("dirLong").onclick = function () { setDir(1); };
    if ($("dirShort")) $("dirShort").onclick = function () { setDir(-1); };
    if ($("execBtn")) $("execBtn").onclick = execute;
    if ($("passBtn")) $("passBtn").onclick = passTrade;

    paintFoot();
  }
  function correctKey(prep) {
    var g = prep.ch && prep.ch.gt;
    if (prep.kind === "bias") return g.noTrade ? "skip" : (g.dir > 0 ? "long" : "short");
    if (prep.kind === "filter") return g.noTrade ? "skip" : "take";
    if (prep.kind === "id") return g.name;
    return null;
  }
  function dirToggle() {
    var d = chD.posDir || 1;
    return '<div class="ticket"><div class="hd">Direction</div><div class="dirsel">' +
      '<button id="dirLong" class="long' + (d > 0 ? " on" : "") + '">LONG</button>' +
      '<button id="dirShort" class="short' + (d < 0 ? " on" : "") + '">SHORT</button></div>' +
      '<div class="hint">Then tap the chart to drop the position box, and drag entry / stop / target.</div></div>';
  }
  function setDir(d) {
    chD.posDir = d;
    var p = chD.find("pos");
    if (p) {
      var a = S.prep.ch.atr;
      p.dir = d; p.stop = p.entry - d * a * 1.5; p.target = p.entry + d * a * 3;
      chD.render();
    } else { chD.setTool("pos"); }
    paintDrillPanel();
  }
  function ticket() {
    var r = chD.readout(), ch = S.prep.ch, out = [];
    out.push('<div class="ticket"><div class="hd">Read-out</div><div class="tgrid">');
    function f(k, v, cls) { out.push('<div class="tf"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>'); }
    if (r.leg !== undefined) {
      f("Measured leg", ch ? ch.dec !== undefined ? Math.abs(r.leg).toFixed(ch.dec) : "" : "");
      f("Projected target", r.mTarget !== undefined ? r.mTarget.toFixed(ch.dec) : "—", "am");
    }
    if (r.entry !== undefined) {
      f("Entry", r.entry.toFixed(ch.dec));
      f("Stop", r.stop.toFixed(ch.dec), "dn");
      f("Target", r.target.toFixed(ch.dec), "up");
      f("Reward : risk", r.rr.toFixed(2) + "R", r.rr >= 2 ? "up" : r.rr >= 1 ? "am" : "dn");
      f("Risk / unit", r.risk.toFixed(ch.dec));
      f("Risk of entry", r.riskPct.toFixed(2) + "%");
    }
    if (r.leg === undefined && r.entry === undefined) {
      out.push('<div class="hint" style="grid-column:1/-1">Nothing drawn yet.</div>');
    }
    out.push("</div></div>");
    return out.join("");
  }
  function replayPanel() {
    if (S.replayRun) return '<div class="ticket"><div class="hd">Executing</div><div class="hint">' + S.replayMsg + '</div></div>';
    if (S.graded) return "";
    return dirToggle() +
      '<div class="row" style="margin-top:9px;gap:7px">' +
      '<button class="btn primary grow" id="execBtn">Execute</button>' +
      '<button class="btn grow" id="passBtn">Pass</button></div>';
  }

  function paintFoot() {
    var f = $("drillFoot"), out = [];
    if (S.graded) {
      var last = S.idx >= S.n - 1;
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
      out.push('<button class="btn primary" id="nextBtn">' + (last ? "Finish" : "Next") + '</button>');
    } else if (S.prep.ui.mode === "replay") {
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
    } else {
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
      out.push('<button class="btn primary" id="subBtn">Submit</button>');
    }
    f.innerHTML = out.join("");
    if ($("quitBtn")) $("quitBtn").onclick = function () {
      if (S.abortSim) { S.abortSim(); S.abortSim = null; }
      if (chD._rev) { clearInterval(chD._rev); chD._rev = null; }
      setView("path");
    };
    if ($("subBtn")) $("subBtn").onclick = submit;
    if ($("nextBtn")) $("nextBtn").onclick = nextRep;
  }

  /* ---------- answering ---------- */
  function readAnswer() {
    var ui = S.prep.ui;
    if (ui.mode === "mcq") return S.sel;
    if (ui.mode === "numeric") { var v = parseFloat(S.ansNum); return isFinite(v) ? v : null; }
    if (ui.mode === "chart") {
      if (ui.need === "hline") { var d = chD.find("hline"); return d ? d.p : null; }
      if (ui.need === "measure") return chD.find("measure");
      if (ui.need === "mark") return chD.userMark || null;
      if (ui.need === "pos") {
        var p = chD.find("pos");
        return p ? { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target } : null;
      }
    }
    return null;
  }
  function submit() {
    if (S.graded || S.busy) return;
    var ans = readAnswer();
    if (ans === null || ans === undefined || (typeof ans === "object" && S.prep.ui.need === "measure" && !ans.c)) {
      toast(S.prep.ui.mode === "mcq" ? "Pick an answer" :
        S.prep.ui.mode === "numeric" ? "Type a number" :
          S.prep.ui.need === "measure" ? "Place A, B and C first" : "Nothing placed on the chart yet");
      return;
    }
    finishRep(S.prep.K.grade(S.prep, ans));
  }
  function finishRep(g) {
    S.graded = g;
    S.scores[S.idx] = g.score;
    PROG.repDone(S.prep.kind, g.score);
    paintHeader();
    if (g.r !== undefined) S.rs.push(g.r);
    chD.locked = true;
    if (g.marks) g.marks.forEach(function (m) { chD.markers.push(m); });
    if (g.reveal && S.prep.ch) {
      chD.gt = S.prep.ch.gt;
      chD.revealTo(S.prep.ch.bars.length - 1, 26, function () { chD.fit(); });
    }
    paintDrillPanel();
  }
  function nextRep() {
    S.idx++;
    if (S.idx >= S.n) return finishNode();
    loadRep();
  }
  function finishNode() {
    var avg = S.scores.reduce(function (a, b) { return a + b; }, 0) / S.scores.length;
    if (S.placement) {
      var rank = avg < 0.35 ? 0 : avg < 0.5 ? 1 : avg < 0.62 ? 2 : avg < 0.72 ? 3 : avg < 0.8 ? 4 : avg < 0.88 ? 5 : 6;
      PROG.place(rank);
      modal('<h2>Placed: ' + RANKS[rank].n + '</h2>' +
        '<p>You scored <b>' + Math.round(avg * 100) + '%</b> across the mixed set.</p>' +
        '<p>The ladder now starts at <b>' + TIERS[rank].name + '</b> and runs through to Mastery certification. ' +
        'Everything below is unlocked if you want to revisit it — the scores there are provisional until you actually run the drills.</p>' +
        '<button class="btn primary" id="okBtn">Show my path</button>');
      $("okBtn").onclick = function () { closeModal(); setView("path"); };
      return;
    }
    var pass = avg >= (S.node.pass || 0.7);
    PROG.nodeDone(S.node, avg);
    var rTxt = "";
    if (S.rs.length) {
      var tot = S.rs.reduce(function (a, b) { return a + b; }, 0);
      rTxt = '<p>Net result across the session: <b class="' + (tot >= 0 ? "up" : "dn") + '">' +
        (tot >= 0 ? "+" : "") + tot.toFixed(2) + "R</b> over " + S.rs.length + " trades. " +
        "Process score is what counts here — the R is the market's opinion, not a grade.</p>";
    }
    modal('<h2>' + esc(S.node.title) + '</h2>' +
      '<p>Score <b>' + Math.round(avg * 100) + '%</b> · ' +
      (pass ? '<span class="up">passed</span>' : '<span class="dn">below the ' + Math.round((S.node.pass || 0.7) * 100) + '% pass mark</span>') + '</p>' + rTxt +
      (pass ? "" : "<p>Retake it — repetition on the same skill is the whole point. Your best score is the one that counts.</p>") +
      '<button class="btn primary" id="okBtn">' + (pass ? "Continue" : "Back to path") + '</button> ' +
      '<button class="btn ghost" id="againBtn">Run it again</button>');
    $("okBtn").onclick = function () { closeModal(); setView("path"); };
    $("againBtn").onclick = function () { closeModal(); startNode(S.node); };
  }

  /* ---------------- placement ---------------- */
  function startPlacement() {
    startNode({ id: "placement", kind: "mixed", n: 8, title: "Placement test", pass: 1.1 }, { placement: true });
  }

  /* =====================================================================
     TRADE SIMULATION (shared by replay drills and practice)
     ===================================================================== */
  function simulate(ch, plan, fromIdx, onBar, done) {
    var bars = ch.bars, i = fromIdx, filled = false, fillPx = 0, waited = 0;
    var d = plan.dir, risk = Math.abs(plan.entry - plan.stop);
    var timer = setInterval(function () {
      i++;
      if (i >= bars.length) { clearInterval(timer); return done(finish("data end", filled ? bars[bars.length - 1].c : null)); }
      var b = bars[i];
      if (!filled) {
        if (b.l <= plan.entry && plan.entry <= b.h) { filled = true; fillPx = plan.entry; }
        else if (++waited > 14) { clearInterval(timer); onBar(i); return done({ r: 0, exit: "no fill", bars: waited, filledAt: -1 }); }
      } else {
        var hitS = d > 0 ? b.l <= plan.stop : b.h >= plan.stop;
        var hitT = d > 0 ? b.h >= plan.target : b.l <= plan.target;
        if (hitS) { clearInterval(timer); onBar(i); return done(finish("stopped", plan.stop, i)); }
        if (hitT) { clearInterval(timer); onBar(i); return done(finish("target", plan.target, i)); }
      }
      onBar(i);
    }, 95);
    function finish(why, px, at) {
      if (px === null || !filled) return { r: 0, exit: "no fill", bars: waited, filledAt: -1 };
      return { r: ((px - fillPx) * d) / (risk || 1e-9), exit: why, bars: at ? at - fromIdx : 0, filledAt: at || i };
    }
    return function abort() { clearInterval(timer); };
  }

  function execute() {
    var p = chD.find("pos");
    if (!p) { toast("Place the position on the chart first"); return; }
    if (Math.abs(p.entry - p.stop) < 1e-9) { toast("Stop and entry are the same price"); return; }
    var ch = S.prep.ch;
    S.replayRun = true; S.replayMsg = "Waiting for fill…"; chD.locked = true;
    paintDrillPanel();
    var plan = { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target };
    S.abortSim = simulate(ch, plan, chD.vis,
      function (i) {
        chD.vis = i;
        if (i > chD.i1 - 3) { chD.i0 += 1; chD.i1 += 1; }
        chD.render();
        S.replayMsg = "Bar " + (i - ch.gt.decision) + " · " + ch.sym + " " + ch.bars[i].c.toFixed(ch.dec);
        var el = $("drillPanel").querySelector(".ticket .hint");
        if (el) el.textContent = S.replayMsg;
      },
      function (res) {
        S.replayRun = false; S.abortSim = null;
        plan.result = res;
        PROG.logTrade({
          t: Date.now(), sym: ch.sym, tf: ch.tf, pattern: ch.gt.name, dir: plan.dir,
          r: res.r, exit: res.exit, src: S.node.id
        });
        finishRep(S.prep.K.grade(S.prep, plan));
      });
  }
  function passTrade() {
    chD.locked = true;
    finishRep(S.prep.K.grade(S.prep, { passed: true }));
  }

  /* =====================================================================
     PRACTICE
     ===================================================================== */
  var prac = { ch: null, playing: false, timer: null, live: null, eq: 25000, riskPct: 1 };

  function newPractice(opts) {
    opts = opts || {};
    var seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    var key = opts.pattern || (Math.random() < 0.22 ? "noise" : Mkt.KEYS[(Math.random() * Mkt.KEYS.length) | 0]);
    prac.ch = Mkt.gen({ seed: seed, pattern: key });
    prac.live = null; prac.playing = false;
    if (prac.timer) { clearInterval(prac.timer); prac.timer = null; }
    if (prac.abort) { prac.abort(); prac.abort = null; }
    var start = Math.max(30, prac.ch.gt.decision - (4 + ((Math.random() * 10) | 0)));
    chP.load(prac.ch, start);
    chP.locked = false;
    chP.posDir = 1;
    chP.onChange = paintPractice;
    buildPracToolbar();
    paintPractice();
  }
  function buildPracToolbar() {
    var wrap = $("pracTools");
    var html = '<div class="sym"><b>' + prac.ch.sym + '</b>' + prac.ch.tfLbl + '</div><div class="tsep"></div>';
    TOOLBTN.forEach(function (t) { html += '<button class="tool" data-tool="' + t[0] + '" title="' + t[2] + '">' + t[1] + '</button>'; });
    html += '<div class="tsep"></div>' +
      '<button class="tool" data-act="undo" title="Undo">↺</button>' +
      '<button class="tool" data-act="clear" title="Clear">✕</button>' +
      '<button class="tool" data-act="fit" title="Fit">⤢</button>' +
      '<div class="tsep"></div>' +
      '<button class="tool wide" data-act="step">Step ▸</button>' +
      '<button class="tool wide" data-act="play" id="playBtn">Play ▶</button>' +
      '<button class="tool wide" data-act="new">New chart</button>';
    wrap.innerHTML = html;
    [].forEach.call(wrap.querySelectorAll("[data-tool]"), function (b) {
      b.onclick = function () { chP.setTool(b.dataset.tool); syncTools(wrap, chP); };
    });
    [].forEach.call(wrap.querySelectorAll("[data-act]"), function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === "undo") chP.undo();
        if (a === "clear") chP.clearAll();
        if (a === "fit") chP.fit();
        if (a === "step") stepPrac(1);
        if (a === "play") togglePlay();
        if (a === "new") newPractice();
        paintPractice();
      };
    });
    chP._syncWrap = wrap;
    syncTools(wrap, chP);
  }
  function stepPrac(n) {
    if (prac.live) return;
    chP.vis = Math.min(chP.bars.length - 1, chP.vis + n);
    if (chP.vis > chP.i1 - 3) { chP.i0 += n; chP.i1 += n; }
    chP.render();
  }
  function togglePlay() {
    if (prac.playing) { clearInterval(prac.timer); prac.timer = null; prac.playing = false; }
    else {
      prac.playing = true;
      prac.timer = setInterval(function () {
        if (chP.vis >= chP.bars.length - 1) { togglePlay(); paintPractice(); return; }
        stepPrac(1);
      }, 260);
    }
    var b = $("playBtn"); if (b) b.textContent = prac.playing ? "Pause ❚❚" : "Play ▶";
  }

  function paintPractice() {
    if (!prac.ch) return;
    if (chP._syncWrap) syncTools(chP._syncWrap, chP);
    var r = chP.readout(), ch = prac.ch, out = [];
    out.push('<div class="task">Practice · free chart</div>');
    out.push('<div class="brief">' + esc(ch.nm) + ' — ' + ch.tfLbl +
      '. Step the tape forward, mark the structure, measure the move, then put a position on it.</div>');

    out.push(dirTogglePrac());

    out.push('<div class="ticket"><div class="hd">Risk model</div><div class="tgrid">' +
      '<div class="tf"><div class="k">Account</div><input class="num" id="eqIn" style="padding:3px 5px;font-size:12px" type="number" value="' + prac.eq + '"></div>' +
      '<div class="tf"><div class="k">Risk %</div><input class="num" id="rpIn" style="padding:3px 5px;font-size:12px" type="number" step="0.25" value="' + prac.riskPct + '"></div>' +
      '</div></div>');

    out.push('<div class="ticket"><div class="hd">Ticket</div><div class="tgrid">');
    function f(k, v, cls) { out.push('<div class="tf"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>'); }
    if (r.mTarget !== undefined) f("Measured target", r.mTarget.toFixed(ch.dec), "am");
    if (r.leg !== undefined) f("Leg", Math.abs(r.leg).toFixed(ch.dec) + " (" + Math.abs(r.legPct).toFixed(1) + "%)");
    if (r.entry !== undefined) {
      var risk$ = prac.eq * prac.riskPct / 100, units = r.risk > 0 ? risk$ / r.risk : 0;
      f("Entry", r.entry.toFixed(ch.dec));
      f("Stop", r.stop.toFixed(ch.dec), "dn");
      f("Target", r.target.toFixed(ch.dec), "up");
      f("R : R", r.rr.toFixed(2) + "R", r.rr >= 2 ? "up" : r.rr >= 1 ? "am" : "dn");
      f("Size", units.toFixed(units > 100 ? 0 : 2) + " u");
      f("Risk", "$" + risk$.toFixed(0));
      f("If target hits", "$" + (risk$ * r.rr).toFixed(0), "up");
      f("Stop distance", (r.risk / ch.atr).toFixed(2) + " ATR");
    } else {
      out.push('<div class="hint" style="grid-column:1/-1">Drop a position with the ⌸ tool to size it.</div>');
    }
    out.push("</div></div>");

    if (prac.result) {
      var res = prac.result;
      out.push('<div class="fb ' + (res.r > 0 ? "good" : res.r < 0 ? "bad" : "mid") + '"><h4>' + esc(res.exit) + ' · ' +
        (res.r >= 0 ? "+" : "") + res.r.toFixed(2) + 'R</h4><ul>' +
        '<li>P&amp;L on the modelled size: <b>' + (res.r >= 0 ? "+" : "") + "$" + (res.r * prac.eq * prac.riskPct / 100).toFixed(0) + '</b></li>' +
        '<li>Held ' + res.bars + ' bars.</li></ul></div>');
    }
    if (prac.revealed) {
      var g = ch.gt;
      out.push('<div class="fb mid"><h4>' + esc(g.name) + '</h4><ul><li>' + g.rule + '</li>' +
        '<li>Break <b>' + g.level.toFixed(ch.dec) + '</b> · invalidation <b>' + g.invalid.toFixed(ch.dec) +
        '</b> · measured target <b>' + g.target.toFixed(ch.dec) + '</b></li>' +
        '<li>' + (g.worked ? "The target printed." : "It failed before reaching the target.") + '</li></ul></div>');
    }
    $("pracPanel").innerHTML = out.join("");

    if ($("pdirLong")) $("pdirLong").onclick = function () { setPracDir(1); };
    if ($("pdirShort")) $("pdirShort").onclick = function () { setPracDir(-1); };
    if ($("eqIn")) $("eqIn").onchange = function () { prac.eq = Math.max(100, +this.value || 25000); paintPractice(); };
    if ($("rpIn")) $("rpIn").onchange = function () { prac.riskPct = Math.min(10, Math.max(0.1, +this.value || 1)); paintPractice(); };

    var foot = [];
    foot.push('<button class="btn primary" id="pExec">' + (prac.live ? "Running…" : "Execute") + '</button>');
    foot.push('<button class="btn" id="pReveal">Reveal</button>');
    foot.push('<button class="btn ghost" id="pNew">New</button>');
    $("pracFoot").innerHTML = foot.join("");
    $("pExec").onclick = pracExecute;
    $("pReveal").onclick = function () {
      prac.revealed = true; chP.gt = ch.gt; chP.render(); paintPractice();
    };
    $("pNew").onclick = function () { prac.result = null; prac.revealed = false; newPractice(); };
  }
  function dirTogglePrac() {
    var d = chP.posDir || 1;
    return '<div class="ticket"><div class="hd">Direction</div><div class="dirsel">' +
      '<button id="pdirLong" class="long' + (d > 0 ? " on" : "") + '">LONG</button>' +
      '<button id="pdirShort" class="short' + (d < 0 ? " on" : "") + '">SHORT</button></div></div>';
  }
  function setPracDir(d) {
    chP.posDir = d;
    var p = chP.find("pos");
    if (p) {
      p.dir = d; p.stop = p.entry - d * prac.ch.atr * 1.5; p.target = p.entry + d * prac.ch.atr * 3;
      chP.render();
    } else chP.setTool("pos");
    paintPractice();
  }
  function pracExecute() {
    var p = chP.find("pos");
    if (!p) { toast("Place a position first"); return; }
    if (prac.live) return;
    if (prac.playing) togglePlay();
    prac.live = true; prac.result = null;
    var ch = prac.ch;
    prac.abort = simulate(ch, { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target }, chP.vis,
      function (i) {
        chP.vis = i;
        if (i > chP.i1 - 3) { chP.i0 += 1; chP.i1 += 1; }
        chP.render();
      },
      function (res) {
        prac.live = false; prac.result = res;
        PROG.logTrade({
          t: Date.now(), sym: ch.sym, tf: ch.tf, pattern: ch.gt.name, dir: p.dir,
          r: res.r, exit: res.exit, src: "practice"
        });
        paintPractice(); paintHeader();
      });
    paintPractice();
  }

  /* =====================================================================
     STATS
     ===================================================================== */
  function tradeStats(tr) {
    var w = tr.filter(function (t) { return t.r > 0; }), l = tr.filter(function (t) { return t.r < 0; });
    var sumW = w.reduce(function (a, t) { return a + t.r; }, 0);
    var sumL = Math.abs(l.reduce(function (a, t) { return a + t.r; }, 0));
    var tot = tr.reduce(function (a, t) { return a + t.r; }, 0);
    var cum = 0, peak = 0, dd = 0, curve = [];
    tr.slice().reverse().forEach(function (t) {
      cum += t.r; curve.push(cum);
      if (cum > peak) peak = cum;
      dd = Math.min(dd, cum - peak);
    });
    return {
      n: tr.length, wr: tr.length ? w.length / tr.length : 0,
      avgW: w.length ? sumW / w.length : 0, avgL: l.length ? sumL / l.length : 0,
      exp: tr.length ? tot / tr.length : 0, pf: sumL > 0 ? sumW / sumL : (sumW > 0 ? Infinity : 0),
      tot: tot, dd: dd, curve: curve
    };
  }
  function spark(vals) {
    if (vals.length < 2) return '<div class="hint">Not enough trades yet.</div>';
    var mn = Math.min.apply(null, vals.concat([0])), mx = Math.max.apply(null, vals.concat([0]));
    var rg = (mx - mn) || 1, w = 300, ht = 74;
    var pts = vals.map(function (v, i) {
      return ((i / (vals.length - 1)) * w).toFixed(1) + "," + (ht - ((v - mn) / rg) * ht).toFixed(1);
    }).join(" ");
    var zy = (ht - ((0 - mn) / rg) * ht).toFixed(1);
    return '<svg viewBox="0 0 ' + w + ' ' + ht + '" preserveAspectRatio="none" style="width:100%;height:74px;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:9px">' +
      '<line x1="0" y1="' + zy + '" x2="' + w + '" y2="' + zy + '" stroke="#2A303C" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + (vals[vals.length - 1] >= 0 ? "#3FBF7F" : "#E5634D") +
      '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  }
  function paintStats() {
    paintHeader();
    var st = PROG.st, s = tradeStats(st.trades || []), out = [];
    out.push('<div class="seclabel">Standing</div><div class="statgrid">' +
      box("Rank", PROG.rankName()) + box("XP", st.xp) +
      box("Tiers cleared", TIERS.filter(PROG.tierDone).length + " / " + TIERS.length) +
      box("Drills passed", TIERS.reduce(function (a, t) { return a + t.nodes.filter(PROG.nodePass).length; }, 0)) +
      '</div>');

    out.push('<div class="seclabel">Simulated trades</div>');
    if (!s.n) out.push('<div class="card hint">No trades yet — run a live execution drill or take a trade in Practice.</div>');
    else {
      out.push('<div class="statgrid">' +
        box("Trades", s.n) + box("Win rate", Math.round(s.wr * 100) + "%") +
        box("Expectancy", s.exp.toFixed(2) + "R", s.exp >= 0 ? "up" : "dn") +
        box("Net", (s.tot >= 0 ? "+" : "") + s.tot.toFixed(1) + "R", s.tot >= 0 ? "up" : "dn") +
        box("Avg win", "+" + s.avgW.toFixed(2) + "R", "up") +
        box("Avg loss", "-" + s.avgL.toFixed(2) + "R", "dn") +
        box("Profit factor", isFinite(s.pf) ? s.pf.toFixed(2) : "∞") +
        box("Max drawdown", s.dd.toFixed(1) + "R", "dn") + '</div>');
      out.push('<div class="seclabel">Equity curve (R)</div>' + spark(s.curve));
      out.push('<div class="seclabel">Trade log</div><div class="tblwrap"><table><tr><th>Setup</th><th>Sym</th><th>Side</th><th>Exit</th><th>R</th></tr>' +
        st.trades.slice(0, 25).map(function (t) {
          return "<tr><td>" + esc(t.pattern) + "</td><td>" + esc(t.sym) + "</td><td>" + (t.dir > 0 ? "L" : "S") +
            "</td><td>" + esc(t.exit) + '</td><td class="' + (t.r >= 0 ? "up" : "dn") + '">' + (t.r >= 0 ? "+" : "") + t.r.toFixed(2) + "</td></tr>";
        }).join("") + "</table></div>");
    }

    out.push('<div class="seclabel">Skills</div><div class="skillgrid">');
    Object.keys(SKILLS).forEach(function (k) {
      var sk = st.skills[k] || { s: 0, n: 0 };
      out.push('<div class="skill"><div class="n">' + SKILLS[k] + '<span>' + Math.round(sk.s * 100) + '%</span></div>' +
        '<div class="b"><i style="width:' + Math.round(sk.s * 100) + '%"></i></div>' +
        '<div class="hint" style="margin-top:4px;font-size:10px">' + sk.n + ' reps</div></div>');
    });
    out.push("</div>");

    if (st.journal && st.journal.length) {
      out.push('<div class="seclabel">Recent drills</div><div class="tblwrap"><table><tr><th>Drill</th><th>Score</th><th>When</th></tr>' +
        st.journal.slice(0, 15).map(function (j) {
          return "<tr><td>" + esc(j.title) + '</td><td class="' + (j.avg >= 0.7 ? "up" : "dn") + '">' + Math.round(j.avg * 100) +
            "%</td><td>" + new Date(j.t).toLocaleDateString() + "</td></tr>";
        }).join("") + "</table></div>");
    }
    out.push('<div class="seclabel">Data</div><div class="card"><div class="hint" style="margin-bottom:8px">' +
      'Progress is stored in this browser only.</div><button class="btn" id="resetBtn">Reset all progress</button></div>');
    $("statsBody").innerHTML = out.join("");
    $("resetBtn").onclick = function () {
      modal('<h2>Reset everything?</h2><p>Ranks, skill scores and the trade log will be wiped.</p>' +
        '<button class="btn primary" id="yes">Yes, reset</button> <button class="btn ghost" id="no">Cancel</button>');
      $("yes").onclick = function () { PROG.reset(); };
      $("no").onclick = closeModal;
    };
  }
  function box(k, v, cls) {
    return '<div class="sbox"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>";
  }

  /* =====================================================================
     HELP
     ===================================================================== */
  function showHelp() {
    modal('<h2>How this works</h2>' +
      '<p>Charts are generated, not replayed from a feed — but every one contains a real structure with a known ' +
      'break level, a known invalidation point and a known measured target, which is what makes grading possible. ' +
      'Roughly 6 in 10 setups reach their target; the rest fail, on purpose.</p>' +

      '<h3>The measured move tool</h3>' +
      '<p>Pick <b>⇕</b> and click three points:</p>' +
      '<li><b>A</b> — where the move you are measuring starts (the base of the flagpole, the head, the range low).</li>' +
      '<li><b>B</b> — where it ends.</li>' +
      '<li><b>C</b> — where that distance gets projected from: normally the level that just broke.</li>' +
      '<p>The tool draws the projection, the target price, and the 0.5 / 0.618 / 1.272 partials for scaling out. ' +
      'Drag any of the three handles to adjust.</p>' +

      '<h3>Position tool</h3>' +
      '<p>Choose LONG or SHORT, pick <b>⌸</b>, tap the chart, then drag the three lines. The box shows reward-to-risk live; ' +
      'in Practice it also converts to position size from your account and risk percentage.</p>' +

      '<h3>Stops</h3>' +
      '<p>A stop belongs just beyond the price that makes the idea wrong — the flag low, the right shoulder, the far side of the range — ' +
      'plus a buffer of roughly a quarter to one ATR. Inside the structure is too tight; several ATR beyond destroys the R multiple.</p>' +

      '<h3>Scoring</h3>' +
      '<p>Each drill node is a set of reps; your best score on a node is kept. A tier unlocks when every node in the tier above it ' +
      'is at 70% or better. Certification at tier 8 needs 85%.</p>' +
      '<p>In execution drills the <b>process score</b> and the <b>R result</b> are reported separately, deliberately. ' +
      'A good plan that loses is still a good plan.</p>' +

      '<h3>Controls</h3>' +
      '<li>Scroll or pinch to zoom · drag to pan · double-click to fit.</li>' +
      '<li>↺ undo · ✕ clear drawings · ⤢ fit.</li>' +
      '<button class="btn primary" id="okBtn" style="margin-top:12px">Got it</button>');
    $("okBtn").onclick = closeModal;
  }

  /* debug handle — also what the console needs to jump straight to a drill */
  window.TT = {
    chD: chD, chP: chP, startNode: startNode, nodeById: nodeById,
    PROG: PROG, Mkt: Mkt, setView: setView,
    get session() { return S; }
  };

  /* ---------------- boot ---------------- */
  paintHeader();
  paintPath();
  if (!PROG.st.placed) setTimeout(showHelp, 400);
  window.addEventListener("resize", function () { chD.render(); chP.render(); });
})();
</script>
</body>
</html>
