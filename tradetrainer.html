<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRADE TRAINER — Cadet to Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;--bg2:#141821;--bg3:#1B2029;--line:#2A303C;
    --amber:#F2A93B;--amber-dim:#6E5122;--up:#3FBF7F;--dn:#E5634D;--blue:#5B9BD5;
    --paper:#E8E6E0;--muted:#8A92A2;--grid:#1C222C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--paper);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input,select{font-family:inherit}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--amber)}.mu{color:var(--muted)}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171B23,#0E1116);flex:0 0 auto}
  .logo{font-family:'Archivo';font-weight:800;letter-spacing:.15em;font-size:13px;background:linear-gradient(90deg,var(--amber),#FFD98A);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .rank{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber-dim);background:#241a08;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .xpwrap{flex:1;min-width:60px;display:flex;flex-direction:column;gap:3px}
  .xpbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--amber),#FFD98A);width:0%;transition:width .35s}
  .xptxt{font-family:'IBM Plex Mono';font-size:9px;color:var(--muted);letter-spacing:.04em}
  nav{display:flex;gap:4px;flex:0 0 auto}
  nav button{padding:6px 9px;font-size:11px;font-weight:600;border-radius:7px;border:1px solid transparent;color:var(--muted)}
  nav button.on{color:var(--amber);background:var(--bg3);border-color:var(--line)}
  nav button:hover{color:var(--paper)}
  @media(max-width:620px){
    nav button{padding:6px 8px;font-size:0}
    nav button::after{content:attr(data-ico);font-size:15px;line-height:1}
    .xptxt{display:none}
    .logo{font-size:11px;letter-spacing:.1em}
  }

  main{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .view.on{display:flex}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}

  /* ---------- generic ---------- */
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .seclabel{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
  .seclabel:first-child{margin-top:0}
  .btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:12px;font-weight:600}
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:linear-gradient(180deg,#F2A93B,#D9902A);color:#14100a;border-color:#F2A93B}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:6px 9px;font-size:11px}
  .row{display:flex;align-items:center;gap:9px}
  .grow{flex:1;min-width:0}
  .wrap{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--muted);border:1px solid var(--line)}
  .pill.ok{background:#12291d;color:var(--up);border-color:#20452f}
  .pill.bad{background:#2c1512;color:var(--dn);border-color:#4a2019}
  .pill.am{background:#241a08;color:var(--amber);border-color:var(--amber-dim)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
  .kv b{font-family:'IBM Plex Mono';font-weight:600}

  /* ---------- path / levels ---------- */
  .tier{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);margin-bottom:9px;align-items:flex-start;cursor:pointer;transition:border-color .12s}
  .tier:hover{border-color:#3d465a}
  .tier.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
  .tier.done{opacity:.75}
  .tier.lock{opacity:.42;cursor:default}
  .tier .num{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-family:'Archivo';font-weight:800;font-size:15px;background:var(--bg3);border:1px solid var(--line)}
  .tier.cur .num{background:#241a08;border-color:var(--amber);color:var(--amber)}
  .tier.done .num{background:#12291d;border-color:#2a5a3c;color:var(--up)}
  .tier .nm{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.02em}
  .tier .ds{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .mini{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:7px}
  .mini i{display:block;height:100%;background:var(--up)}
  .drilllist{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
  .tier.open .drilllist{display:block}
  .drow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12px}
  .drow:hover{background:var(--bg3)}
  .drow .st{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:9px;color:var(--muted)}
  .drow .st.ok{background:#12291d;border-color:#2a5a3c;color:var(--up)}

  .skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
  .skill{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .skill .n{font-size:11px;font-weight:600;display:flex;justify-content:space-between}
  .skill .n span{font-family:'IBM Plex Mono';color:var(--muted)}
  .skill .b{height:5px;background:var(--bg3);border-radius:3px;margin-top:6px;overflow:hidden}
  .skill .b i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7FD1F0)}

  /* ---------- drill / chart ---------- */
  .stage{flex:1;display:flex;min-height:0}
  @media(max-width:860px){.stage{flex-direction:column}}
  .chartcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .chartwrap{flex:1;position:relative;min-height:0;background:#0B0E13;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .toolbar{display:flex;gap:4px;padding:5px 7px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tool{width:31px;height:29px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .tool.on{border-color:var(--amber);background:#241a08;color:var(--amber)}
  .tool:hover{border-color:#3d465a}
  .tool.wide{width:auto;padding:0 9px;font-size:11px;font-weight:600}
  .tsep{width:1px;background:var(--line);margin:2px 3px;flex:0 0 auto}
  .sym{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);padding:0 6px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sym b{color:var(--paper);font-weight:600;letter-spacing:.04em}

  .panel{width:330px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
  @media(max-width:860px){.panel{width:auto;border-left:none;border-top:1px solid var(--line);height:44%;min-height:190px}}
  .pbody{flex:1;overflow-y:auto;padding:11px;-webkit-overflow-scrolling:touch}
  .pfoot{flex:0 0 auto;padding:9px 11px;border-top:1px solid var(--line);display:flex;gap:8px}
  .pfoot .btn{flex:1;text-align:center}
  .task{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-family:'Archivo';font-weight:700;color:var(--amber);margin-bottom:5px}
  .brief{font-size:13px;line-height:1.55}
  .brief b{color:var(--amber)}
  .opt{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);font-size:12.5px;margin-bottom:6px;line-height:1.35}
  .opt:hover{border-color:#3d465a}
  .opt.sel{border-color:var(--amber);background:#241a08}
  .opt.right{border-color:var(--up);background:#12291d}
  .opt.wrong{border-color:var(--dn);background:#2c1512}
  .num{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--paper);font-family:'IBM Plex Mono';font-size:14px}
  .num:focus{outline:none;border-color:var(--amber)}
  .fb{border-radius:9px;padding:10px;margin-top:10px;font-size:12.5px;line-height:1.5;border:1px solid}
  .fb.good{background:#12291d;border-color:#2a5a3c}
  .fb.mid{background:#2a2208;border-color:var(--amber-dim)}
  .fb.bad{background:#2c1512;border-color:#4a2019}
  .fb h4{font-family:'Archivo';font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
  .fb ul{margin:6px 0 0 16px}
  .fb li{margin:3px 0}
  .stepdots{display:flex;gap:4px;margin-bottom:9px}
  .stepdots i{flex:1;height:3px;border-radius:2px;background:var(--bg3)}
  .stepdots i.on{background:var(--amber)}
  .stepdots i.ok{background:var(--up)}

  /* ---------- trade ticket ---------- */
  .ticket{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:9px}
  .ticket .hd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'Archivo';font-weight:700}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tf{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
  .tf .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tf .v{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;margin-top:1px}
  .dirsel{display:flex;gap:6px;margin-bottom:7px}
  .dirsel button{flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);font-size:11px;font-weight:700;letter-spacing:.06em}
  .dirsel button.on.long{background:#12291d;border-color:var(--up);color:var(--up)}
  .dirsel button.on.short{background:#2c1512;border-color:var(--dn);color:var(--dn)}

  /* ---------- stats ---------- */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  .sbox{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .sbox .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .sbox .v{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:5px 6px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:6px;border-bottom:1px solid #1b2029;font-family:'IBM Plex Mono'}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--bg2)}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(6,8,12,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
  .modal.on{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:16px}
  .sheet h2{font-family:'Archivo';font-size:16px;letter-spacing:.04em;margin-bottom:9px}
  .sheet h3{font-family:'Archivo';font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:14px 0 5px}
  .sheet p{font-size:13px;line-height:1.6;color:#cfd4dd;margin-bottom:7px}
  .sheet li{font-size:13px;line-height:1.6;color:#cfd4dd;margin:3px 0 3px 17px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--bg3);border:1px solid var(--amber);color:var(--paper);padding:9px 15px;border-radius:9px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,bottom .25s;font-weight:600}
  .toast.on{opacity:1;bottom:30px}
</style>
</head>
<body>

<header>
  <div class="logo">TRADE&nbsp;TRAINER</div>
  <div class="rank" id="rankBadge">CADET</div>
  <div class="xpwrap">
    <div class="xpbar"><i class="xpfill" id="xpFill"></i></div>
    <div class="xptxt mono" id="xpTxt">0 XP</div>
  </div>
  <nav>
    <button data-view="path" data-ico="▤" class="on">Path</button>
    <button data-view="practice" data-ico="▶">Practice</button>
    <button data-view="stats" data-ico="◔">Stats</button>
    <button id="helpBtn" data-ico="?">Help</button>
  </nav>
</header>

<main>
  <!-- ============ PATH ============ -->
  <section class="view on" id="view-path"><div class="scroll" id="pathBody"></div></section>

  <!-- ============ DRILL ============ -->
  <section class="view" id="view-drill">
    <div class="stage">
      <div class="chartcol">
        <div class="toolbar" id="drillTools"></div>
        <div class="chartwrap"><canvas id="cvDrill"></canvas></div>
      </div>
      <aside class="panel">
        <div class="pbody" id="drillPanel"></div>
        <div class="pfoot" id="drillFoot"></div>
      </aside>
    </div>
  </section>

  <!-- ============ PRACTICE ============ -->
  <section class="view" id="view-practice">
    <div class="stage">
      <div class="chartcol">
        <div class="toolbar" id="pracTools"></div>
        <div class="chartwrap"><canvas id="cvPrac"></canvas></div>
      </div>
      <aside class="panel">
        <div class="pbody" id="pracPanel"></div>
        <div class="pfoot" id="pracFoot"></div>
      </aside>
    </div>
  </section>

  <!-- ============ STATS ============ -->
  <section class="view" id="view-stats"><div class="scroll" id="statsBody"></div></section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   TRADE TRAINER — market engine
   Synthetic but structurally honest OHLCV:
     · seeded PRNG, so any chart is reproducible from its id
     · anchor skeleton -> Brownian-bridge fill (legs land exactly, path wanders)
     · volatility clustering + fat-tailed shocks
     · wick sweeps at pivots (stop runs), volume expansion on the break bar
     · ground truth (pole, neckline, breakout, target, invalidation) for grading
   Bullish forms are declared once; bearish twins are mirrored automatically,
   so every ground-truth function is written in a "bull frame" and reads the
   direction-aware helpers on ctx.
   ===================================================================== */
var Mkt = (function () {
  "use strict";

  /* ---------------- rng ---------------- */
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mkR(seed) {
    var r = rng(seed), sp = null;
    var o = {
      u: r,
      f: function (a, b) { return a + (b - a) * r(); },
      i: function (a, b) { return Math.floor(a + (b - a + 1) * r()); },
      g: function () {
        if (sp !== null) { var v = sp; sp = null; return v; }
        var u1 = Math.max(1e-9, r()), u2 = r(), m = Math.sqrt(-2 * Math.log(u1));
        sp = m * Math.sin(2 * Math.PI * u2);
        return m * Math.cos(2 * Math.PI * u2);
      },
      t: function () { var g = o.g(); return r() < 0.06 ? g * 2.8 : g; },
      pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
      chance: function (p) { return r() < p; },
      shuffle: function (arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(r() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
    };
    return o;
  }

  /* ---------------- instruments ---------------- */
  var INSTR = [
    { sym: "EURUSD", nm: "Euro / US Dollar",    dec: 5, lo: 1.02,  hi: 1.19,  sig: 0.0016, kind: "fx",     vbase: 24000 },
    { sym: "GBPJPY", nm: "Pound / Yen",         dec: 3, lo: 172,   hi: 199,   sig: 0.0026, kind: "fx",     vbase: 12000 },
    { sym: "XAUUSD", nm: "Gold Spot",           dec: 2, lo: 1880,  hi: 2650,  sig: 0.0030, kind: "fx",     vbase: 31000 },
    { sym: "NQ",     nm: "Nasdaq 100 Futures",  dec: 2, lo: 15200, hi: 22400, sig: 0.0033, kind: "fut",    vbase: 42000 },
    { sym: "CL",     nm: "Crude Oil Futures",   dec: 2, lo: 62,    hi: 94,    sig: 0.0042, kind: "fut",    vbase: 27000 },
    { sym: "BTCUSD", nm: "Bitcoin / US Dollar", dec: 1, lo: 26000, hi: 98000, sig: 0.0055, kind: "crypto", vbase: 900 },
    { sym: "SOLUSD", nm: "Solana / US Dollar",  dec: 3, lo: 88,    hi: 260,   sig: 0.0080, kind: "crypto", vbase: 46000 },
    { sym: "AAPL",   nm: "Apple Inc.",          dec: 2, lo: 168,   hi: 258,   sig: 0.0026, kind: "eq",     vbase: 380000 },
    { sym: "NVDA",   nm: "NVIDIA Corp.",        dec: 2, lo: 92,    hi: 195,   sig: 0.0049, kind: "eq",     vbase: 620000 },
    { sym: "TSLA",   nm: "Tesla Inc.",          dec: 2, lo: 178,   hi: 428,   sig: 0.0056, kind: "eq",     vbase: 510000 }
  ];
  var TFS = [
    { k: "5m",  min: 5,    lbl: "5 min" },
    { k: "15m", min: 15,   lbl: "15 min" },
    { k: "1H",  min: 60,   lbl: "1 hour" },
    { k: "4H",  min: 240,  lbl: "4 hour" },
    { k: "1D",  min: 1440, lbl: "Daily" }
  ];

  /* ---------------- bar helpers ---------------- */
  function hiIn(b, a, z) {
    a = Math.max(0, a | 0); z = Math.min(b.length - 1, z | 0);
    var bi = a, bv = -Infinity;
    for (var i = a; i <= z; i++) if (b[i].h > bv) { bv = b[i].h; bi = i; }
    return { i: bi, p: bv };
  }
  function loIn(b, a, z) {
    a = Math.max(0, a | 0); z = Math.min(b.length - 1, z | 0);
    var bi = a, bv = Infinity;
    for (var i = a; i <= z; i++) if (b[i].l < bv) { bv = b[i].l; bi = i; }
    return { i: bi, p: bv };
  }
  function crossUp(b, a, z, lvl) {
    a = Math.max(0, a); z = Math.min(b.length - 1, z);
    for (var i = a; i <= z; i++) if (b[i].c > lvl) return i;
    return Math.max(a, Math.min(z, b.length - 1));
  }
  function crossDn(b, a, z, lvl) {
    a = Math.max(0, a); z = Math.min(b.length - 1, z);
    for (var i = a; i <= z; i++) if (b[i].c < lvl) return i;
    return Math.max(a, Math.min(z, b.length - 1));
  }
  /** direction-aware helper pack; d=+1 normal, d=-1 mirrored (bearish twin) */
  function ctxFor(d) {
    return {
      dir: d,
      hi: function (b, a, z) { return d > 0 ? hiIn(b, a, z) : loIn(b, a, z); },
      lo: function (b, a, z) { return d > 0 ? loIn(b, a, z) : hiIn(b, a, z); },
      /** snap anchor i to the local extreme; s=+1 means "high" in the bull frame */
      ref: function (b, i, s, w) {
        w = w || 3;
        return (s * d) > 0 ? hiIn(b, i - w, i + w) : loIn(b, i - w, i + w);
      },
      cross: function (b, a, z, lvl) { return d > 0 ? crossUp(b, a, z, lvl) : crossDn(b, a, z, lvl); },
      mid: function (x, y) { return (x + y) / 2; }
    };
  }

  /* ---------------- pattern skeletons ----------------
     segs: [barCount, priceInSwingUnits, tag]   (always written bullish)
     hU:   approximate pattern height in swing units, from the raw anchors
     gt:   ground truth, computed from the bars actually drawn            */
  var P = {};

  P.bullFlag = {
    name: "Bull flag", family: "continuation", dir: 1,
    rule: "Measure the flagpole (impulse low to impulse high). Project that height from the point where price breaks the flag's upper boundary.",
    segs: function (R) {

  c.strokeStyle = COL.grid; c.lineWidth = 1; c.font = "10px 'IBM Plex Mono',monospace";
  c.textAlign = "left"; c.textBaseline = "middle";
  var p0 = Math.ceil(this.pMin / step) * step;
  for (var p = p0; p <= this.pMax; p += step) {
    var y = Math.round(this.y(p)) + 0.5;
    if (y < b.t || y > b.b) continue;
    c.beginPath(); c.moveTo(0, y); c.lineTo(b.r, y); c.stroke();
    c.fillStyle = COL.txt; c.fillText(this.fmt(p), b.r + 6, y);
  }
  /* time grid */
  var everyN = Math.max(1, Math.round((this.i1 - this.i0) / 7));
  c.textAlign = "center"; c.textBaseline = "top";
  for (var i = Math.max(0, Math.ceil(this.i0 / everyN) * everyN); i <= Math.min(this.vis, this.i1); i += everyN) {
    var x = Math.round(this.x(i)) + 0.5;
    if (x < 0 || x > b.r) continue;
    c.strokeStyle = COL.grid;
    c.beginPath(); c.moveTo(x, b.t); c.lineTo(x, b.b); c.stroke();
    c.fillStyle = COL.txt; c.fillText(this._tlabel(this.bars[i].t), x, b.b + 5);

};
Chart.prototype._tlabel = function (t) {
  var d = new Date(t), M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  if (this.tf === "1D" || this.tf === "4H") return d.getUTCDate() + " " + M[d.getUTCMonth()];
  return ("0" + d.getUTCHours()).slice(-2) + ":" + ("0" + d.getUTCMinutes()).slice(-2);
};
Chart.prototype._vol = function (c, b) {
  var mx = 0, a = Math.max(0, Math.floor(this.i0)), z = Math.min(this.vis, Math.ceil(this.i1));
  for (var i = a; i <= z; i++) mx = Math.max(mx, this.bars[i].v);
  if (!mx) return;
  var w = Math.max(1, this.bw * 0.66);
  for (var j = a; j <= z; j++) {
    var bar = this.bars[j], hgt = (bar.v / mx) * (b.volH - 4);
    c.fillStyle = bar.c >= bar.o ? "rgba(63,191,127,.32)" : "rgba(229,99,77,.32)";
    c.fillRect(this.x(j) - w / 2, b.volT + b.volH - hgt, w, hgt);

  c.strokeStyle = COL.grid; c.beginPath();
  c.moveTo(0, b.volT + 0.5); c.lineTo(b.r, b.volT + 0.5); c.stroke();
};
Chart.prototype._emas = function (c, b) {
  var self = this;
  function line(n, col) {
    var e = Mkt.ema(self.bars, n, self.vis);
    c.strokeStyle = col; c.lineWidth = 1.2; c.beginPath();
    var st = true;
    for (var i = Math.max(n, Math.floor(self.i0)); i <= Math.min(self.vis, Math.ceil(self.i1)); i++) {
      var x = self.x(i), y = self.y(e[i]);
      if (st) { c.moveTo(x, y); st = false; } else c.lineTo(x, y);
    }
    c.stroke();
  }
  if (this.opts.ema20) line(20, "rgba(242,169,59,.55)");
  if (this.opts.ema50) line(50, "rgba(91,155,213,.5)");
};
Chart.prototype._candles = function (c, b) {
  var a = Math.max(0, Math.floor(this.i0)), z = Math.min(this.vis, Math.ceil(this.i1));
  var w = Math.max(1, Math.floor(this.bw * 0.68));
  for (var i = a; i <= z; i++) {
    var bar = this.bars[i], up = bar.c >= bar.o;
    var x = Math.round(this.x(i)), yo = this.y(bar.o), yc = this.y(bar.c);
    c.strokeStyle = up ? COL.upw : COL.dnw; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + 0.5, this.y(bar.h)); c.lineTo(x + 0.5, this.y(bar.l)); c.stroke();
    c.fillStyle = up ? COL.up : COL.dn;
    var top = Math.min(yo, yc), hgt = Math.max(1, Math.abs(yc - yo));
    c.fillRect(x - (w >> 1), top, Math.max(1, w), hgt);
  }
  /* last price */
  var last = this.bars[this.vis], y = Math.round(this.y(last.c)) + 0.5;
  c.strokeStyle = "rgba(232,230,224,.32)"; c.setLineDash([3, 3]); c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, y); c.lineTo(b.r, y); c.stroke(); c.setLineDash([]);
  this._tag(c, b.r + 1, y, this.fmt(last.c), last.c >= last.o ? COL.up : COL.dn, "#0B0E13");

Chart.prototype._tag = function (c, x, y, txt, bg, fg) {
  c.font = "10px 'IBM Plex Mono',monospace"; c.textBaseline = "middle"; c.textAlign = "left";
  var w = c.measureText(txt).width + 8;

};
Chart.prototype._axes = function (c, b) {
  c.strokeStyle = COL.axis; c.lineWidth = 1;
  c.beginPath(); c.moveTo(b.r + 0.5, 0); c.lineTo(b.r + 0.5, b.b); c.stroke();
  c.beginPath(); c.moveTo(0, b.b + 0.5); c.lineTo(b.r, b.b + 0.5); c.stroke();
};
Chart.prototype._watermark = function (c, b) {
  c.font = "700 13px Archivo,sans-serif"; c.fillStyle = "rgba(138,146,162,.28)";
  c.textAlign = "left"; c.textBaseline = "top";

};
Chart.prototype._crosshair = function (c, b) {
  if (!this.cross) return;
  var x = Math.round(this.cross.x) + 0.5, y = Math.round(this.cross.y) + 0.5;
  if (x > b.r) return;
  c.strokeStyle = "rgba(138,146,162,.5)"; c.setLineDash([2, 3]); c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, 0); c.lineTo(x, b.b); c.stroke();
  c.beginPath(); c.moveTo(0, y); c.lineTo(b.r, y); c.stroke();
  c.setLineDash([]);
  this._tag(c, b.r + 1, y, this.fmt(this.pAt(y)), "#39404C", COL.paper);
  var i = Math.round(this.iAt(x));
  if (i >= 0 && i <= this.vis) {
    var t = this._tlabel(this.bars[i].t);
    c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "center"; c.textBaseline = "top";
    var w = c.measureText(t).width + 8;
    c.fillStyle = "#39404C"; c.fillRect(x - w / 2, b.b + 2, w, 15);
    c.fillStyle = COL.paper; c.fillText(t, x, b.b + 5);
  }
};
Chart.prototype._markers = function (c, b) {
  var self = this;
  this.markers.forEach(function (m) {
    var x = self.x(m.i), y = self.y(m.p);
    c.fillStyle = m.col || COL.amber;
    c.beginPath(); c.arc(x, y, 4.5, 0, 6.284); c.fill();
    c.strokeStyle = "#0B0E13"; c.lineWidth = 1.5; c.stroke();
    if (m.txt) {
      c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "center";
      c.textBaseline = m.below ? "top" : "bottom";
      c.fillStyle = m.col || COL.amber;
      c.fillText(m.txt, x, y + (m.below ? 8 : -8));
    }
  });
};

/* ---------- ground-truth overlay (feedback) ---------- */
Chart.prototype._gtOverlay = function (c, b) {
  var g = this.gt;
  function lvl(self, p, col, txt, dash) {
    var y = Math.round(self.y(p)) + 0.5;
    c.strokeStyle = col; c.lineWidth = 1.2; c.setLineDash(dash || [5, 4]);
    c.beginPath(); c.moveTo(0, y); c.lineTo(b.r, y); c.stroke(); c.setLineDash([]);
    c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "left"; c.textBaseline = "bottom";
    c.fillStyle = col; c.fillText(txt + "  " + self.fmt(p), 6, y - 2);
  }
  lvl(this, g.level, COL.blue, "BREAK");
  lvl(this, g.target, COL.ok, "TARGET");
  lvl(this, g.invalid, COL.bad, "INVALID");
  /* the measured leg */
  if (g.measure && g.measure.a && g.measure.b) {
    var a = g.measure.a, bb = g.measure.b;
    c.strokeStyle = COL.violet; c.lineWidth = 2;
    c.beginPath(); c.moveTo(this.x(a.i), this.y(a.p)); c.lineTo(this.x(bb.i), this.y(bb.p)); c.stroke();
    c.fillStyle = COL.violet;
    [a, bb].forEach(function (pt) {
      c.beginPath(); c.arc(this.x(pt.i), this.y(pt.p), 3.5, 0, 6.284); c.fill();
    }, this);
  }
  (g.labels || []).forEach(function (L) {
    var pt = L[0], x = this.x(pt.i), y = this.y(pt.p);
    c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "center"; c.textBaseline = "bottom";
    c.fillStyle = "rgba(169,139,232,.95)";
    c.fillText(L[1], x, y - 6);
  }, this);
};

/* ---------- drawing renderers ---------- */
Chart.prototype._draw = function (c, b, d, ghost) {
  var al = ghost ? 0.6 : 1;
  c.globalAlpha = al;
  switch (d.type) {
    case "hline": this._drawH(c, b, d); break;
    case "trend": this._drawTrend(c, b, d); break;
    case "rect": this._drawRect(c, b, d); break;
    case "fib": this._drawFib(c, b, d); break;
    case "measure": this._drawMeasure(c, b, d); break;
    case "pos": this._drawPos(c, b, d); break;
  }
  c.globalAlpha = 1;
  if (!ghost && this.tool === "cursor") {
    var self = this;
    this.handles().filter(function (h) { return h.d === d; }).forEach(function (h) {
      if (h.line) return;
      c.fillStyle = COL.paper; c.strokeStyle = "#0B0E13"; c.lineWidth = 1.5;
      c.beginPath(); c.arc(h.x, h.y, 3.5, 0, 6.284); c.fill(); c.stroke();
    });
  }
};
Chart.prototype._drawH = function (c, b, d) {
  var y = Math.round(this.y(d.p)) + 0.5, col = d.col || COL.amber;
  c.strokeStyle = col; c.lineWidth = 1.4; c.setLineDash([]);
  c.beginPath(); c.moveTo(0, y); c.lineTo(b.r, y); c.stroke();
  this._tag(c, b.r + 1, y, this.fmt(d.p), col, "#14100a");
  if (d.tag) {
    c.font = "700 10px Archivo,sans-serif"; c.fillStyle = col; c.textAlign = "left"; c.textBaseline = "bottom";
    c.fillText(d.tag, 6, y - 3);
  }
};
Chart.prototype._drawTrend = function (c, b, d) {
  if (!d.b) return;
  var x1 = this.x(d.a.i), y1 = this.y(d.a.p), x2 = this.x(d.b.i), y2 = this.y(d.b.p);
  c.strokeStyle = COL.amber; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2);
  /* extend to the right edge */
  if (x2 !== x1) {
    var m = (y2 - y1) / (x2 - x1);
    c.lineTo(b.r, y2 + m * (b.r - x2));
  }
  c.stroke();
};
Chart.prototype._drawRect = function (c, b, d) {
  if (!d.b) return;
  var x1 = this.x(d.a.i), y1 = this.y(d.a.p), x2 = this.x(d.b.i), y2 = this.y(d.b.p);
  c.fillStyle = "rgba(91,155,213,.13)"; c.strokeStyle = "rgba(91,155,213,.75)"; c.lineWidth = 1.2;
  c.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
  c.strokeRect(Math.min(x1, x2) + 0.5, Math.min(y1, y2) + 0.5, Math.abs(x2 - x1), Math.abs(y2 - y1));
};
Chart.prototype._drawFib = function (c, b, d) {
  if (!d.b) return;
  var lv = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1], self = this;
  var x1 = Math.min(this.x(d.a.i), this.x(d.b.i));

  lv.forEach(function (f) {
    var p = d.a.p + (d.b.p - d.a.p) * f, y = Math.round(self.y(p)) + 0.5;

    c.setLineDash([4, 4]); c.lineWidth = 1;
    c.beginPath(); c.moveTo(x1, y); c.lineTo(b.r, y); c.stroke(); c.setLineDash([]);
    c.fillStyle = "rgba(138,146,162,.9)";
    c.fillText((f * 100).toFixed(1) + "%  " + self.fmt(p), x1 + 4, y - 2);
  });
};

/* --- the measured-move tool: leg A->B projected from C --- */
Chart.prototype._drawMeasure = function (c, b, d) {
  var self = this;
  function dot(pt, lab) {
    var x = self.x(pt.i), y = self.y(pt.p);
    c.fillStyle = COL.violet; c.beginPath(); c.arc(x, y, 4, 0, 6.284); c.fill();
    c.font = "700 10px Archivo,sans-serif"; c.textAlign = "center"; c.textBaseline = "bottom";
    c.fillStyle = COL.violet; c.fillText(lab, x, y - 7);
  }
  dot(d.a, "A");
  if (!d.b) return;
  var x1 = this.x(d.a.i), y1 = this.y(d.a.p), x2 = this.x(d.b.i), y2 = this.y(d.b.p);
  c.strokeStyle = COL.violet; c.lineWidth = 2; c.setLineDash([]);
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  dot(d.b, "B");
  var leg = d.b.p - d.a.p, pct = (leg / d.a.p) * 100;
  c.font = "10px 'IBM Plex Mono',monospace"; c.textAlign = "left"; c.textBaseline = "middle";
  c.fillStyle = COL.violet;
  c.fillText("leg " + this.fmt(Math.abs(leg)) + "  (" + (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%)",

  c.fillRect(xc, Math.min(yc, yt), xr - xc, Math.abs(yt - yc));
  c.strokeStyle = leg >= 0 ? "rgba(63,191,127,.9)" : "rgba(229,99,77,.9)";
  c.lineWidth = 1.4; c.setLineDash([6, 4]);
  c.beginPath(); c.moveTo(xc, yt); c.lineTo(xr, yt); c.stroke();
  c.setLineDash([2, 3]); c.strokeStyle = "rgba(169,139,232,.7)";
  c.beginPath(); c.moveTo(xc, yc); c.lineTo(xr, yc); c.stroke();
  c.setLineDash([]);
  /* the projected leg drawn as a vertical arrow at C */
  c.strokeStyle = COL.violet; c.lineWidth = 2;
  c.beginPath(); c.moveTo(xc, yc); c.lineTo(xc, yt); c.stroke();

  this._tag(c, xr + 1, yt, this.fmt(tgt), leg >= 0 ? COL.ok : COL.bad, "#0B0E13");
  c.font = "700 10px Archivo,sans-serif"; c.textAlign = "right"; c.textBaseline = "bottom";
  c.fillStyle = leg >= 0 ? COL.ok : COL.bad;
  c.fillText("MEASURED TARGET", xr - 4, yt - 3);

  if (this.opts.fibExt) {

      c.fillStyle = "rgba(138,146,162,.8)";
      c.fillText(e[1] + "  " + self2.fmt(p), xr - 4, y - 1);

  }
};

/* --- long/short position with live R:R --- */
Chart.prototype._drawPos = function (c, b, d) {
  var x0 = this.x(d.i), xr = b.r;
  var ye = this.y(d.entry), ys = this.y(d.stop), yt = this.y(d.target);
  c.fillStyle = "rgba(63,191,127,.13)"; c.fillRect(x0, Math.min(ye, yt), xr - x0, Math.abs(yt - ye));
  c.fillStyle = "rgba(229,99,77,.15)"; c.fillRect(x0, Math.min(ye, ys), xr - x0, Math.abs(ys - ye));
  var self = this;
  function line(y, col, txt, val) {
    y = Math.round(y) + 0.5;
    c.strokeStyle = col; c.lineWidth = 1.3; c.setLineDash([]);
    c.beginPath(); c.moveTo(x0, y); c.lineTo(xr, y); c.stroke();
    c.font = "700 10px Archivo,sans-serif"; c.textAlign = "left"; c.textBaseline = "bottom";
    c.fillStyle = col; c.fillText(txt, x0 + 5, y - 3);
    self._tag(c, xr + 1, y, self.fmt(val), col, "#0B0E13");
  }
  line(yt, COL.ok, "TARGET", d.target);
  line(ye, COL.amber, d.dir > 0 ? "LONG ENTRY" : "SHORT ENTRY", d.entry);
  line(ys, COL.bad, "STOP", d.stop);
  var risk = Math.abs(d.entry - d.stop), rew = Math.abs(d.target - d.entry);
  var rr = risk > 0 ? rew / risk : 0;
  c.font = "700 11px 'IBM Plex Mono',monospace"; c.textAlign = "right"; c.textBaseline = "top";
  c.fillStyle = rr >= 2 ? COL.ok : rr >= 1 ? COL.amber : COL.bad;
  c.fillText(rr.toFixed(2) + "R", xr - 5, Math.min(ye, yt) + 4);
};

/* readout used by the side panels */
Chart.prototype.readout = function () {
  var m = this.find("measure"), p = this.find("pos"), out = {};
  if (m && m.b) {
    out.leg = m.b.p - m.a.p;
    out.legPct = out.leg / m.a.p * 100;
    if (m.c) out.mTarget = m.c.p + out.leg;
  }
  if (p) {
    out.dir = p.dir; out.entry = p.entry; out.stop = p.stop; out.target = p.target;
    out.risk = Math.abs(p.entry - p.stop); out.reward = Math.abs(p.target - p.entry);
    out.rr = out.risk > 0 ? out.reward / out.risk : 0;
    out.riskPct = out.risk / p.entry * 100;
  }
  return out;
};
/* =====================================================================
   TRADE TRAINER — skills, drills, grading, progression
   A drill node = N reps. Each rep: prepare() builds a chart + question,
   grade() returns a score in 0..1 plus written feedback.
   ===================================================================== */

var SKILLS = {
  structure: "Market structure",
  patterns: "Pattern recognition",
  measured: "Measured moves",
  stops: "Stop placement",
  targets: "Targets & R:R",
  sizing: "Position sizing",
  execution: "Execution",
  discipline: "Discipline"
};

var RANKS = [
  { n: "Cadet",        need: 0 },
  { n: "Apprentice",   need: 1 },
  { n: "Technician",   need: 2 },
  { n: "Cartographer", need: 3 },
  { n: "Risk Officer", need: 4 },
  { n: "Strategist",   need: 5 },
  { n: "Operator",     need: 6 },

];

/* pattern pools */
var POOL = {
  cont: ["bullFlag", "bearFlag", "ascTriangle", "descTriangle", "symTriangle", "symTriangleDn", "rectangle", "rectangleDn", "cupHandle"],
  rev: ["doubleBottom", "doubleTop", "invHS", "hsTop", "fallingWedge", "risingWedge", "roundingTop"],
  flag: ["bullFlag", "bearFlag"],
  box: ["rectangle", "rectangleDn", "ascTriangle", "descTriangle", "symTriangle", "symTriangleDn"],
  neck: ["doubleBottom", "doubleTop", "invHS", "hsTop"],
  ab: ["abcd", "abcdDn"],
  all: Mkt.KEYS.slice(),
  measurable: Mkt.KEYS.filter(function (k) { return !Mkt.P[k].noHeight; }),
  withNoise: Mkt.KEYS.concat(["noise", "noise", "noise"])
};

/* ---------------- scoring helpers ---------------- */
function band(err, tol) {
  if (err <= tol) return 1;
  if (err <= tol * 2) return 0.68;
  if (err <= tol * 3.4) return 0.3;
  return 0;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pct(x) { return Math.round(x * 100) + "%"; }
function fmtN(p, dec) { return p.toFixed(dec); }
/** the R this structure actually offers from the break with a stop beyond invalidation */
function refRR(ch) { return ch.gt.refRR || 0; }
/** grade R:R against the goal, but give credit for taking what the structure offers */
function rrScore(rr, goal, can) {
  if (rr >= goal) return 1;
  if (can < goal && rr >= can * 0.85) return 0.75;
  if (rr >= goal * 0.75) return 0.6;
  if (rr >= 1) return 0.35;
  return 0.1;
}
/** tolerance for a price placement: generous on small structures, tight on big ones */
function ptol(ch) { return Math.max(0.55 * ch.atr, 0.11 * (ch.gt.height || ch.atr * 3)); }

/* =====================================================================
   drill kinds
   prepare(spec, seed) -> prep {ch, q, ui, meta}
   grade(prep, ans)    -> {score, verdict, lines[], reveal}
   ===================================================================== */
var KIND = {};

/* --- 1. trend / bias --------------------------------------------- */
KIND.bias = {
  skill: "structure", tools: [],
  prepare: function (sp, seed) {
    var key = pickPool(sp.pool || POOL.withNoise, seed);
    var ch = Mkt.gen({ seed: seed, pattern: key });
    return {
      ch: ch,
      q: "Read the structure. If this level breaks, which way is the odds-on trade — and is it worth taking at all?",
      ui: {
        mode: "mcq", options: [
          { k: "long", t: "Long — buy the break" },
          { k: "short", t: "Short — sell the break" },
          { k: "skip", t: "Stand aside — no readable structure" }
        ]
      }
    };
  },
  grade: function (p, ans) {

/* --- 2. pattern identification ----------------------------------- */
KIND.id = {
  skill: "patterns", tools: [],
  prepare: function (sp, seed) {
    var key = pickPool(sp.pool || POOL.all, seed);
    var ch = Mkt.gen({ seed: seed, pattern: key });
    var R = Mkt.mkR(seed ^ 0x5f3a);
    var right = Mkt.P[key].name, names = {}, opts = [right];
    var pool = (sp.pool || POOL.all).slice();
    R.shuffle(pool);
    for (var i = 0; i < pool.length && opts.length < 4; i++) {
      var nm = Mkt.P[pool[i]].name;
      if (nm !== right && !names[nm]) { names[nm] = 1; opts.push(nm); }
    }
    R.shuffle(opts);
    return {
      ch: ch, q: "Which pattern is printing here?",
      ui: { mode: "mcq", options: opts.map(function (o) { return { k: o, t: o }; }) }
    };
  },
  grade: function (p, ans) {
    var g = p.ch.gt, ok = ans === g.name;
    return {
      score: ok ? 1 : 0, reveal: true,
      verdict: ok ? "Correct" : "Not quite — it is a " + g.name,
      lines: ["<b>" + g.name + "</b> (" + g.family + "). " + g.rule]
    };
  }
};

/* --- 3. mark a swing point --------------------------------------- */
KIND.pivot = {
  skill: "structure", tools: ["mark"],
  prepare: function (sp, seed) {

    if (sp.which === "invalidation") {
      want = nearestPivot(g.pivots, g.invalid) || { i: g.breakIdx, p: g.invalid };
      q = "Click the swing point that <b>invalidates</b> this setup — the one that must hold for the idea to stay alive.";
    } else {
      var pv = Mkt.pivots(ch.bars, 3, g.decision).filter(function (x) { return x.d === (sp.which === "high" ? 1 : -1); });
      want = pv[pv.length - 1] || { i: g.decision, p: ch.bars[g.decision].c };
      q = "Click the most recent confirmed swing " + (sp.which === "high" ? "high" : "low") + " on the chart.";
    }
    return { ch: ch, q: q, ui: { mode: "chart", need: "mark", hint: "Tap the chart to drop a marker. Tap again to move it." }, meta: { want: want } };
  },
  grade: function (p, ans) {
    if (!ans) return { score: 0, verdict: "Nothing marked", lines: [], reveal: true };

      score: s, reveal: true, marks: [{ i: w.i, p: w.p, txt: "correct", col: COL.ok }],

      lines: [

        fmtN(dp / ch.atr, 1) + " ATR and " + di + " bars away.",

  }
};

/* --- 5. the measured move (the core tool) ------------------------- */
KIND.measure = {
  skill: "measured", skill2: "targets", tools: ["measure"],
  prepare: function (sp, seed) {
    var key = pickPool(sp.pool || POOL.measurable, seed);
    var ch = Mkt.gen({ seed: seed, pattern: key });
    return {
      ch: ch,
      q: "Use the <b>measured move</b> tool: click <b>A</b> and <b>B</b> to measure the move that defines this pattern, then click <b>C</b> where that height gets projected from.",
      ui: { mode: "chart", need: "measure", hint: "A = start of the measured leg · B = end of it · C = the anchor the projection starts from (usually the broken level)." }
    };
  },
  grade: function (p, ans) {
    var ch = p.ch, g = ch.gt;
    if (!ans || !ans.c) return { score: 0, verdict: "Projection incomplete", lines: ["Place all three points: A, B, then C."], reveal: true };
    var tol = ptol(ch);
    var userLeg = Math.abs(ans.b.p - ans.a.p);
    var legErr = Math.abs(userLeg - g.height);
    var legS = band(legErr, Math.max(tol, g.height * 0.1));
    var anchS = band(Math.abs(ans.c.p - g.anchor.p), tol);
    var userTgt = ans.c.p + (ans.b.p - ans.a.p);
    var tgtErr = Math.abs(userTgt - g.target);
    var tgtS = band(tgtErr, tol * 1.15);
    var altHit = g.altTarget !== null && g.altTarget !== undefined && Math.abs(userTgt - g.altTarget) < tol;
    if (altHit && tgtS < 0.7) tgtS = 0.7;
    var s = clamp(0.35 * legS + 0.2 * anchS + 0.45 * tgtS, 0, 1);
    var lines = [
      g.rule,
      "Correct height <b>" + fmtN(g.height, ch.dec) + "</b> · yours " + fmtN(userLeg, ch.dec) +
      " — projected target <b>" + fmtN(g.target, ch.dec) + "</b> · yours " + fmtN(userTgt, ch.dec) + "."
    ];
    if (altHit) lines.push("You anchored the projection at the pattern's extreme rather than the break — that is the <b>conservative</b> variant. Valid, but we grade against the break anchor.");
    lines.push(g.hitTargetAt >= 0 && g.worked
      ? "Price <b>reached</b> the measured target " + (g.hitTargetAt - g.decision) + " bars later."
      : "Price <b>never reached</b> it — it failed through the invalidation first. A measured move is a target, never a promise.");
    return { score: s, reveal: true, verdict: s >= 0.85 ? "Clean projection" : s >= 0.55 ? "Roughly right" : "Mis-measured", lines: lines };
  }
};

    return {
      ch: ch,
      q: "Place the <b>stop</b> for a " + (d > 0 ? "long" : "short") + " on this break. Ask yourself: at what price is the idea simply wrong?",

    };
  },
  grade: function (p, ans) {
    if (ans === null || ans === undefined) return { score: 0, verdict: "No stop", lines: [], reveal: true };
    var ch = p.ch, g = ch.gt, d = g.dir, a = ch.atr;
    /* distance past the invalidation point, positive = safely beyond it */
    var beyond = d > 0 ? (g.invalid - ans) : (ans - g.invalid);
    var s, verdict, note;
    if (beyond < -0.15 * a) {
      s = 0.12; verdict = "Inside the structure";

    } else if (beyond <= 1.2 * a) {
      s = 1; verdict = "Well placed";
      note = "Just beyond the invalidation with a " + fmtN(Math.max(0, beyond) / a, 1) + " ATR buffer — the market has to prove you wrong to get you out.";
    } else if (beyond <= 2.6 * a) {
      s = 0.6; verdict = "Wider than it needs to be";
      note = "That is " + fmtN(beyond / a, 1) + " ATR past invalidation. Safe, but every extra tick of risk shrinks your R multiple on the same target.";
    } else {
      s = 0.28; verdict = "Far too wide";
      note = "A " + fmtN(beyond / a, 1) + " ATR buffer turns a " + fmtN(g.height / a, 1) + " ATR target into a sub-1R trade. A stop that can't be hit is just a bigger loss.";
    }
    var gotHit = g.hitInvalidAt >= 0;
    return {
      score: s, reveal: true, verdict: verdict,
      lines: [
        "Invalidation is the " + (d > 0 ? "low" : "high") + " at <b>" + fmtN(g.invalid, ch.dec) + "</b>. You placed " + fmtN(ans, ch.dec) + ".",

        gotHit ? "On this chart price <b>did</b> trade through invalidation — the stop was needed." : "Price never came back to invalidation here."
      ]
    };
  }
};

KIND.plan = {
  skill: "targets", skill2: "stops", tools: ["pos", "measure"],

    return {
      ch: ch,
      q: "Build the whole trade: pick a side, then set <b>entry, stop and target</b>. You are looking for at least <b>" +
        (sp.minRR || 2) + "R</b> — and not every structure can give it to you.",
      ui: { mode: "chart", need: "pos", hint: "Choose Long or Short, tap the chart to drop the position, then drag the three lines." },
      meta: { minRR: sp.minRR || 2 }
    };
  },
  grade: function (p, ans) {
    var ch = p.ch, g = ch.gt, a = ch.atr, minRR = p.meta.minRR;
    if (!ans) return { score: 0, verdict: "No plan submitted", lines: [], reveal: true };
    if (g.noTrade) {
      return {
        score: 0.1, reveal: true, verdict: "This one was un-tradable",
        lines: ["There is no structure here — the disciplined answer was to pass. Planning a trade on chop is how good risk rules get spent on nothing."]
      };
    }
    var dirOK = ans.dir === g.dir;
    if (!dirOK) {
      return {
        score: 0, reveal: true, verdict: "Wrong side of the market",
        lines: ["This is a <b>" + g.name + "</b>: the break resolves " + (g.dir > 0 ? "up" : "down") + ". Everything downstream of the wrong direction is wasted work."]
      };
    }
    var d = g.dir;
    var beyond = d > 0 ? (g.invalid - ans.stop) : (ans.stop - g.invalid);
    var stopS = beyond < -0.15 * a ? 0.15 : beyond <= 1.2 * a ? 1 : beyond <= 2.6 * a ? 0.65 : 0.3;
    var tgtErr = Math.abs(ans.target - g.target), tgtS = band(tgtErr, ptol(ch) * 1.3);
    /* a target short of the measured move is prudent, not wrong */
    if (d * (ans.target - g.level) > 0 && d * (g.target - ans.target) > 0 && tgtS < 0.7) tgtS = 0.72;
    var entryOK = d * (ans.entry - g.level) > -1.2 * a && d * (ans.entry - g.level) < 2.2 * a;
    var risk = Math.abs(ans.entry - ans.stop), rr = risk > 0 ? Math.abs(ans.target - ans.entry) / risk : 0;
    var can = refRR(ch), rrS = rrScore(rr, minRR, can);
    var s = clamp(0.3 * stopS + 0.28 * tgtS + 0.24 * rrS + 0.18 * (entryOK ? 1 : 0.3), 0, 1);
    var lines = [
      "Plan: " + (d > 0 ? "long" : "short") + " " + fmtN(ans.entry, ch.dec) + " · stop " + fmtN(ans.stop, ch.dec) +
      " · target " + fmtN(ans.target, ch.dec) + " → <b>" + rr.toFixed(2) + "R</b>.",
      "Reference: break " + fmtN(g.level, ch.dec) + " · invalidation " + fmtN(g.invalid, ch.dec) + " · measured target " + fmtN(g.target, ch.dec) + "."
    ];
    if (!entryOK) lines.push("Your entry is a long way from the break — chasing costs R, and entering before confirmation is a different trade with a different stop.");
    if (stopS < 0.5) lines.push(beyond < 0 ? "The stop is inside the pattern; noise will take it." : "The stop is too wide for the target you chose.");
    if (rr < minRR) {
      lines.push(can < minRR
        ? "At " + rr.toFixed(2) + "R you are under the " + minRR + "R filter — but so is the structure itself: entering at the break with a stop beyond invalidation only offers about <b>" +
          can.toFixed(2) + "R</b> here. That is the lesson. Wait for a retest to tighten the stop, take a partial target, or pass."
        : "At " + rr.toFixed(2) + "R this does not clear the " + minRR + "R filter, and this structure could give you about " +
          can.toFixed(2) + "R. With a 45% hit rate you need better than 2R just to stay flat after costs.");
    }
    lines.push(g.worked ? "Outcome: the measured target printed." : "Outcome: it failed and traded through invalidation first.");
    return { score: s, reveal: true, verdict: s >= 0.85 ? "Solid plan" : s >= 0.55 ? "Workable, with holes" : "Needs rework", lines: lines };
  }
};

      if (g.noTrade) return { score: 1, reveal: true, r: 0, verdict: "Correctly passed", lines: ["Chop, correctly left alone."] };
      if (can0 < 1.4) return {
        score: 0.8, reveal: true, r: 0, verdict: "Defensible pass",
        lines: ["It was a real <b>" + g.name + "</b>, but from the break it only offered about <b>" + can0.toFixed(2) +
          "R</b> against invalidation. Passing thin structures is a valid edge — just make sure it is the maths talking, not nerves."]
      };
      return {
        score: 0.35, reveal: true, r: 0, verdict: "Passed a valid setup",
        lines: ["A <b>" + g.name + "</b> was on offer with clean invalidation and about " + can0.toFixed(2) +
          "R available. Passing costs nothing today and everything over a year."]
      };
    }
    if (g.noTrade) {
      return {
        score: 0.1, reveal: true, r: ans.result ? ans.result.r : 0,
        verdict: "Traded chop",
        lines: ["There was no structure to lean on. Whatever the result, the process was wrong — and that is the part that repeats."]
      };
    }
    var d = g.dir, dirOK = ans.dir === d;
    var beyond = d > 0 ? (g.invalid - ans.stop) : (ans.stop - g.invalid);
    var stopS = beyond < -0.15 * a ? 0.15 : beyond <= 1.2 * a ? 1 : beyond <= 2.6 * a ? 0.65 : 0.3;
    var rr = Math.abs(ans.target - ans.entry) / Math.max(1e-9, Math.abs(ans.entry - ans.stop));
    var can = refRR(ch), rrS = rrScore(rr, p.meta.minRR, can);
    var tgtS = band(Math.abs(ans.target - g.target), ptol(ch) * 1.4);
    if (d * (ans.target - g.level) > 0 && d * (g.target - ans.target) > 0 && tgtS < 0.7) tgtS = 0.72;
    var s = dirOK ? clamp(0.34 * stopS + 0.26 * rrS + 0.24 * tgtS + 0.16, 0, 1) : 0.05;
    var res = ans.result || { r: 0, exit: "none" };
    var lines = [
      "<b>Process " + pct(s) + "</b> · result <b>" + (res.r >= 0 ? "+" : "") + res.r.toFixed(2) + "R</b> (" + res.exit + ").",
      dirOK ? "" : "Wrong direction for a " + g.name + ".",
      "Plan was " + rr.toFixed(2) + "R against about " + can.toFixed(2) + "R available from the break; measured target " +
      fmtN(g.target, ch.dec) + ", invalidation " + fmtN(g.invalid, ch.dec) + "."
    ];
    if (res.r > 0 && s < 0.5) lines.push("You made money on a bad plan. Note it and move on — that is the most expensive kind of win, because it teaches the wrong lesson.");
    if (res.r < 0 && s > 0.8) lines.push("Good plan, losing trade. That is the job. Nothing here needs fixing.");
    return { score: s, reveal: true, r: res.r, verdict: dirOK ? (s >= 0.8 ? "Well executed" : "Executed, with holes") : "Wrong side", lines: lines.filter(Boolean) };
  }
};

function pickPool(pool, seed) {
  var R = Mkt.mkR((seed ^ 0x9e37) >>> 0);
  return pool[Math.floor(R.u() * pool.length)];
}

  var best = null, bd = Infinity;
  (pivots || []).forEach(function (pv) { var d = Math.abs(pv.p - p); if (d < bd) { bd = d; best = pv; } });
  return best;
}

var MIXED_KINDS = ["id", "bias", "level", "pivot", "measure", "target", "stop", "plan", "filter", "rr", "size"];

function nodeById(id) {
  for (var i = 0; i < TIERS.length; i++) {
    for (var j = 0; j < TIERS[i].nodes.length; j++) if (TIERS[i].nodes[j].id === id) return { tier: TIERS[i], node: TIERS[i].nodes[j], ti: i, ni: j };
  }
  return null;
}

/** build one rep: resolves the "mixed" pseudo-kind */
function prepareRep(node, rep, seed) {
  var spec = node, kindName = node.kind;
  if (kindName === "mixed") {
    var R = Mkt.mkR(seed ^ 0xfeed);
    kindName = MIXED_KINDS[Math.floor(R.u() * MIXED_KINDS.length)];
    spec = { kind: kindName, pool: kindName === "measure" || kindName === "target" ? POOL.measurable : POOL.all, minRR: 2, which: R.chance(0.5) ? "high" : "invalidation" };
  }
  var K = KIND[kindName];
  var prep = K.prepare(spec, seed);
  prep.kind = kindName; prep.K = K; prep.spec = spec;
  return prep;
}

var PROG = (function () {
  var KEY = "tt.progress.v1";
  var st = {
    xp: 0, placed: false, rank: 0,
    skills: {}, nodes: {}, journal: [], trades: [], sessions: 0, made: Date.now()
  };
  Object.keys(SKILLS).forEach(function (k) { st.skills[k] = { s: 0, n: 0 }; });

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        Object.keys(o).forEach(function (k) { st[k] = o[k]; });
        Object.keys(SKILLS).forEach(function (k) { if (!st.skills[k]) st.skills[k] = { s: 0, n: 0 }; });
      }
    } catch (e) { }
    return st;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } }

  function skillBump(skill, score) {
    var s = st.skills[skill] || (st.skills[skill] = { s: 0, n: 0 });
    var w = s.n === 0 ? 1 : 0.28;
    s.s = s.s * (1 - w) + score * w; s.n++;
  }
  /** every graded rep pays skill credit and XP, drills and placement alike */
  function repDone(kindName, score) {
    var K = KIND[kindName];
    if (!K) return;
    skillBump(K.skill, score);
    if (K.skill2) skillBump(K.skill2, score * 0.9 + 0.05);
    st.xp += Math.round(score * 12) + 2;
    save();
  }
  function nodeDone(node, avg, detail) {
    var rec = st.nodes[node.id] || (st.nodes[node.id] = { best: 0, tries: 0 });
    rec.tries++; rec.last = avg;
    if (avg > rec.best) rec.best = avg;
    rec.at = Date.now();
    st.xp += Math.round(avg * 45) + 10;
    st.journal.unshift({ t: Date.now(), node: node.id, title: node.title, avg: avg, n: node.n });
    st.journal = st.journal.slice(0, 60);
    recomputeRank(); save();
  }
  function nodePass(node) {
    var rec = st.nodes[node.id];
    return !!rec && rec.best >= (node.pass || 0.7);
  }
  function tierDone(tier) { return tier.nodes.every(nodePass); }
  function tierProgress(tier) {
    var d = tier.nodes.filter(nodePass).length;
    return { done: d, total: tier.nodes.length, frac: d / tier.nodes.length };
  }
  function tierOpen(ti) {
    if (ti === 0) return true;
    if (st.rank >= ti) return true;
    return tierDone(TIERS[ti - 1]);
  }
  function recomputeRank() {
    var r = 0;
    for (var i = 0; i < TIERS.length; i++) { if (tierDone(TIERS[i])) r = i + 1; else break; }
    if (r > st.rank) st.rank = r;
    return st.rank;
  }
  function rankName() { return RANKS[Math.min(st.rank, RANKS.length - 1)].n; }
  function nextNode() {
    for (var i = 0; i < TIERS.length; i++) {
      if (!tierOpen(i)) break;
      for (var j = 0; j < TIERS[i].nodes.length; j++) {
        if (!nodePass(TIERS[i].nodes[j])) return { tier: TIERS[i], node: TIERS[i].nodes[j], ti: i };
      }
    }
    return null;
  }
  function logTrade(t) { st.trades.unshift(t); st.trades = st.trades.slice(0, 300); save(); }
  function reset() {
    try { localStorage.removeItem(KEY); } catch (e) { }

    st.placed = true;

    for (var i = 0; i < rank; i++) {

    }

  };
})();
