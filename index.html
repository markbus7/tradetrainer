<!DOCTYPE html>
<!-- Trade Trainer v3.5.0 (build 2026-08-01) — Al Brooks price action -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRADE TRAINER v3.6.0 — Cadet to Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116;--bg2:#141821;--bg3:#1B2029;--line:#2A303C;
    --amber:#F2A93B;--amber-dim:#6E5122;--up:#3FBF7F;--dn:#E5634D;--blue:#5B9BD5;
    --paper:#E8E6E0;--muted:#8A92A2;--grid:#1C222C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--paper);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input,select{font-family:inherit}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--amber)}.mu{color:var(--muted)}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171B23,#0E1116);flex:0 0 auto}
  .logo{font-family:'Archivo';font-weight:800;letter-spacing:.15em;font-size:13px;background:linear-gradient(90deg,var(--amber),#FFD98A);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .rank{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber-dim);background:#241a08;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .xpwrap{flex:1;min-width:60px;display:flex;flex-direction:column;gap:3px}
  .xpbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--amber),#FFD98A);width:0%;transition:width .35s}
  .xptxt{font-family:'IBM Plex Mono';font-size:9px;color:var(--muted);letter-spacing:.04em}
  .ver{font-size:9px;color:var(--muted);letter-spacing:.06em;align-self:flex-start;margin-top:2px}
  @media(max-width:760px){.ver{display:none}}
  nav{display:flex;gap:4px;flex:0 0 auto}
  nav button{padding:6px 9px;font-size:11px;font-weight:600;border-radius:7px;border:1px solid transparent;color:var(--muted)}
  nav button.on{color:var(--amber);background:var(--bg3);border-color:var(--line)}
  nav button:hover{color:var(--paper)}
  @media(max-width:620px){
    nav button{padding:6px 8px;font-size:0}
    nav button::after{content:attr(data-ico);font-size:15px;line-height:1}
    .xptxt{display:none}
    .logo{font-size:11px;letter-spacing:.1em}
  }

  main{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .view.on{display:flex}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}

  /* ---------- generic ---------- */
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .seclabel{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
  .seclabel:first-child{margin-top:0}
  .btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:12px;font-weight:600}
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:linear-gradient(180deg,#F2A93B,#D9902A);color:#14100a;border-color:#F2A93B}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:6px 9px;font-size:11px;flex:0 0 auto}
  .row{display:flex;align-items:center;gap:9px}
  .grow{flex:1;min-width:0}
  .wrap{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--muted);border:1px solid var(--line)}
  .pill.ok{background:#12291d;color:var(--up);border-color:#20452f}
  .pill.bad{background:#2c1512;color:var(--dn);border-color:#4a2019}
  .pill.am{background:#241a08;color:var(--amber);border-color:var(--amber-dim)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
  .kv b{font-family:'IBM Plex Mono';font-weight:600}

  /* ---------- path / levels ---------- */
  .tier{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);margin-bottom:9px;align-items:flex-start;cursor:pointer;transition:border-color .12s}
  .tier:hover{border-color:#3d465a}
  .tier.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
  .tier.done{opacity:.75}
  .tier.lock{opacity:.42;cursor:default}
  .tier .num{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-family:'Archivo';font-weight:800;font-size:15px;background:var(--bg3);border:1px solid var(--line)}
  .tier.cur .num{background:#241a08;border-color:var(--amber);color:var(--amber)}
  .tier.done .num{background:#12291d;border-color:#2a5a3c;color:var(--up)}
  .tier .nm{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.02em}
  .tier .ds{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .mini{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:7px}
  .mini i{display:block;height:100%;background:var(--up)}
  .drilllist{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
  .tier.open .drilllist{display:block}
  .drow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12px}
  .drow:hover{background:var(--bg3)}
  .drow .st{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:9px;color:var(--muted)}
  .drow .st.ok{background:#12291d;border-color:#2a5a3c;color:var(--up)}

  .skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
  .skill{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .skill .n{font-size:11px;font-weight:600;display:flex;justify-content:space-between}
  .skill .n span{font-family:'IBM Plex Mono';color:var(--muted)}
  .skill .b{height:5px;background:var(--bg3);border-radius:3px;margin-top:6px;overflow:hidden}
  .skill .b i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7FD1F0)}

  /* ---------- drill / chart ---------- */
  .stage{flex:1;display:flex;min-height:0}
  @media(max-width:860px){.stage{flex-direction:column}}
  .chartcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .chartwrap{flex:1;position:relative;min-height:0;background:#0B0E13;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .toolbar{display:flex;gap:4px;padding:5px 7px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tool{width:31px;height:29px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .tool.on{border-color:var(--amber);background:#241a08;color:var(--amber)}
  .tool:hover{border-color:#3d465a}
  .tool.wide{width:auto;padding:0 9px;font-size:11px;font-weight:600}
  .tsep{width:1px;background:var(--line);margin:2px 3px;flex:0 0 auto}
  .sym{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);padding:0 6px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sym b{color:var(--paper);font-weight:600;letter-spacing:.04em}

  .panel{width:330px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
  @media(max-width:860px){.panel{width:auto;border-left:none;border-top:1px solid var(--line);height:44%;min-height:190px}}
  .pbody{flex:1;overflow-y:auto;padding:11px;-webkit-overflow-scrolling:touch}
  .pfoot{flex:0 0 auto;padding:9px 11px;border-top:1px solid var(--line);display:flex;gap:8px}
  .pfoot .btn{flex:1;text-align:center}
  .task{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-family:'Archivo';font-weight:700;color:var(--amber);margin-bottom:5px}
  .brief{font-size:13px;line-height:1.55}
  .brief b{color:var(--amber)}
  .opt{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);font-size:12.5px;margin-bottom:6px;line-height:1.35}
  .opt:hover{border-color:#3d465a}
  .opt.sel{border-color:var(--amber);background:#241a08}
  .opt.right{border-color:var(--up);background:#12291d}
  .opt.wrong{border-color:var(--dn);background:#2c1512}
  .num{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--paper);font-family:'IBM Plex Mono';font-size:14px}
  .num:focus{outline:none;border-color:var(--amber)}
  .fb{border-radius:9px;padding:10px;margin-top:10px;font-size:12.5px;line-height:1.5;border:1px solid}
  .fb.good{background:#12291d;border-color:#2a5a3c}
  .fb.mid{background:#2a2208;border-color:var(--amber-dim)}
  .fb.bad{background:#2c1512;border-color:#4a2019}
  .fb h4{font-family:'Archivo';font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
  .fb ul{margin:6px 0 0 16px}
  .fb li{margin:3px 0}
  .stepdots{display:flex;gap:4px;margin-bottom:9px}
  .stepdots i{flex:1;height:3px;border-radius:2px;background:var(--bg3)}
  .stepdots i.on{background:var(--amber)}
  .stepdots i.ok{background:var(--up)}

  /* ---------- trade ticket ---------- */
  .ticket{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:9px}
  .ticket .hd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'Archivo';font-weight:700}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tf{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
  .tf .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tf .v{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;margin-top:1px}
  .dirsel{display:flex;gap:6px;margin-bottom:7px}
  .dirsel button{flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);font-size:11px;font-weight:700;letter-spacing:.06em}
  .dirsel button.on.long{background:#12291d;border-color:var(--up);color:var(--up)}
  .dirsel button.on.short{background:#2c1512;border-color:var(--dn);color:var(--dn)}

  /* ---------- stats ---------- */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  .sbox{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .sbox .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .sbox .v{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:5px 6px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:6px;border-bottom:1px solid #1b2029;font-family:'IBM Plex Mono'}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--bg2)}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(6,8,12,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
  .modal.on{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:16px}
  .sheet h2{font-family:'Archivo';font-size:16px;letter-spacing:.04em;margin-bottom:9px}
  .sheet h3{font-family:'Archivo';font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:14px 0 5px}
  .sheet p{font-size:13px;line-height:1.6;color:#cfd4dd;margin-bottom:7px}
  .sheet li{font-size:13px;line-height:1.6;color:#cfd4dd;margin:3px 0 3px 17px}
  .readbtn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;
    margin-left:8px;color:var(--muted);vertical-align:middle;text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif}
  .readbtn:hover{border-color:var(--amber);color:var(--paper)}
  .prefrow{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px;color:#cfd4dd}
  .prefrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--amber)}
  .prefrow select{background:var(--bg3);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--bg3);border:1px solid var(--amber);color:var(--paper);padding:9px 15px;border-radius:9px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,bottom .25s;font-weight:600}
  .toast.on{opacity:1;bottom:30px}
</style>
</head>
<body>

<header>
  <div class="logo">TRADE&nbsp;TRAINER</div>
  <span class="ver mono" id="verTag"></span>
  <div class="rank" id="rankBadge">CADET</div>
  <div class="xpwrap">
    <div class="xpbar"><i class="xpfill" id="xpFill"></i></div>
    <div class="xptxt mono" id="xpTxt">0 XP</div>
  </div>
  <nav>
    <button data-view="path" data-ico="▤" class="on">Path</button>
    <button data-view="practice" data-ico="▶">Practice</button>
    <button data-view="stats" data-ico="◔">Stats</button>
    <button id="helpBtn" data-ico="?">Help</button>
  </nav>
</header>

<main>
  <!-- ============ PATH ============ -->
  <section class="view on" id="view-path"><div class="scroll" id="pathBody"></div></section>

  <!-- ============ DRILL ============ -->
  <section class="view" id="view-drill">
    <div class="stage">
      <div class="chartcol">
        <div class="toolbar" id="drillTools"></div>
        <div class="chartwrap"><canvas id="cvDrill"></canvas></div>
      </div>
      <aside class="panel">
        <div class="pbody" id="drillPanel"></div>
        <div class="pfoot" id="drillFoot"></div>
      </aside>
    </div>
  </section>

  <!-- ============ PRACTICE ============ -->
  <section class="view" id="view-practice">
    <div class="stage">
      <div class="chartcol">
        <div class="toolbar" id="pracTools"></div>
        <div class="chartwrap"><canvas id="cvPrac"></canvas></div>
      </div>
      <aside class="panel">
        <div class="pbody" id="pracPanel"></div>
        <div class="pfoot" id="pracFoot"></div>
      </aside>
    </div>
  </section>

  <!-- ============ STATS ============ -->
  <section class="view" id="view-stats"><div class="scroll" id="statsBody"></div></section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Trade Trainer — version. Bump this when the file changes so a deployed
   copy can be identified from the UI, the page source, or the console. */
var APP = { name: "Trade Trainer", version: "3.6.0", build: "2026-08-08", basis: "Al Brooks price action" };

/* =====================================================================
   TRADE TRAINER — market engine (Al Brooks price-action framework)

   Every chart is one identifiable Brooks *context*, not a chart pattern:
   spike-and-channel, tight channel, trading range, barbwire, failed
   breakout, wedge reversal, major trend reversal, final flag, climax.

   Each context carries the things Brooks actually trades off:
     · the market cycle phase   (breakout / channel / trading range)
     · the always-in direction  (or none, in a range)
     · a probability of success, and the tape resolves at that rate
     · a measured move with an explicit type (spike / leg1=leg2 /
       range height / failed breakout / wedge origin)
     · a signal bar of controlled quality at the decision point
     · scalp or swing

   Bullish forms are declared once; bearish twins are mirrored, so every
   ground-truth function is written in a "bull frame" and reads the
   direction-aware helpers on ctx.
   ===================================================================== */
var Mkt = (function () {
  "use strict";

  /* ---------------- rng ---------------- */
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mkR(seed) {
    var r = rng(seed), sp = null;
    var o = {
      u: r,
      f: function (a, b) { return a + (b - a) * r(); },
      i: function (a, b) { return Math.floor(a + (b - a + 1) * r()); },
      g: function () {
        if (sp !== null) { var v = sp; sp = null; return v; }
        var u1 = Math.max(1e-9, r()), u2 = r(), m = Math.sqrt(-2 * Math.log(u1));
        sp = m * Math.sin(2 * Math.PI * u2);
        return m * Math.cos(2 * Math.PI * u2);
      },
      t: function () { var g = o.g(); return r() < 0.06 ? g * 2.8 : g; },
      pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
      chance: function (p) { return r() < p; },
      shuffle: function (arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(r() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
    };
    return o;
  }

  /* ---------------- instruments ---------------- */
  var INSTR = [
    { sym: "ES",     nm: "S&P 500 Futures",     dec: 2, lo: 4180,  hi: 6120,  sig: 0.0022, kind: "fut",    vbase: 38000 },
    { sym: "NQ",     nm: "Nasdaq 100 Futures",  dec: 2, lo: 15200, hi: 22400, sig: 0.0033, kind: "fut",    vbase: 42000 },
    { sym: "CL",     nm: "Crude Oil Futures",   dec: 2, lo: 62,    hi: 94,    sig: 0.0042, kind: "fut",    vbase: 27000 },
    { sym: "EURUSD", nm: "Euro / US Dollar",    dec: 5, lo: 1.02,  hi: 1.19,  sig: 0.0016, kind: "fx",     vbase: 24000 },
    { sym: "GBPJPY", nm: "Pound / Yen",         dec: 3, lo: 172,   hi: 199,   sig: 0.0026, kind: "fx",     vbase: 12000 },
    { sym: "XAUUSD", nm: "Gold Spot",           dec: 2, lo: 1880,  hi: 2650,  sig: 0.0030, kind: "fx",     vbase: 31000 },
    { sym: "BTCUSD", nm: "Bitcoin / US Dollar", dec: 1, lo: 26000, hi: 98000, sig: 0.0055, kind: "crypto", vbase: 900 },
    { sym: "AAPL",   nm: "Apple Inc.",          dec: 2, lo: 168,   hi: 258,   sig: 0.0026, kind: "eq",     vbase: 380000 },
    { sym: "NVDA",   nm: "NVIDIA Corp.",        dec: 2, lo: 92,    hi: 195,   sig: 0.0049, kind: "eq",     vbase: 620000 },
    { sym: "TSLA",   nm: "Tesla Inc.",          dec: 2, lo: 178,   hi: 428,   sig: 0.0056, kind: "eq",     vbase: 510000 }
  ];
  /* Brooks works the 5-minute chart, so the pool leans intraday */
  var TFS = [
    { k: "1m",  min: 1,    lbl: "1 min",  w: 1 },
    { k: "5m",  min: 5,    lbl: "5 min",  w: 5 },
    { k: "15m", min: 15,   lbl: "15 min", w: 3 },
    { k: "1H",  min: 60,   lbl: "1 hour", w: 2 },
    { k: "1D",  min: 1440, lbl: "Daily",  w: 1 }
  ];
  var TF_POOL = [];
  TFS.forEach(function (t) { for (var i = 0; i < t.w; i++) TF_POOL.push(t); });

  /* ---------------- bar helpers ---------------- */
  function hiIn(b, a, z) {
    a = Math.max(0, a | 0); z = Math.min(b.length - 1, z | 0);
    var bi = a, bv = -Infinity;
    for (var i = a; i <= z; i++) if (b[i].h > bv) { bv = b[i].h; bi = i; }
    return { i: bi, p: bv };
  }
  function loIn(b, a, z) {
    a = Math.max(0, a | 0); z = Math.min(b.length - 1, z | 0);
    var bi = a, bv = Infinity;
    for (var i = a; i <= z; i++) if (b[i].l < bv) { bv = b[i].l; bi = i; }
    return { i: bi, p: bv };
  }
  /** direction-aware helper pack. m=+1 normal, m=-1 mirrored (bearish twin).
      Everything inside a gt() is written as if the market were bullish. */

/* The standard. PASS_MARK is the average a run must clear; CLEAN_MARK is what
   counts as a clean answer when measuring the consecutive-correct streak. A
   node that sets `streak: n` also demands n clean answers back to back in the
   same run, so a lucky patch cannot carry a shaky one. */
var PASS_MARK = 0.85;
var CLEAN_MARK = 0.8;
var DEFAULT_STREAK = 3;

var SKILLS = {

  { n: "Trend Trader" }, { n: "Range Trader" }, { n: "Trap Hunter" }, { n: "Cartographer" },
  { n: "Reversal Trader" }, { n: "Operator" }, { n: "Master" }

/* ---------------- context pools ---------------- */
function both(a) { var o = []; a.forEach(function (k) { o.push(k, k + "_D"); }); return o; }

  pullback: both(["twoLegPullback", "tightChannel", "spikeChannel", "broadChannel"]),

/* ---------------- scoring helpers ---------------- */
function band(err, tol) {
  if (err <= tol) return 1;

}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pct(x) { return Math.round(x * 100) + "%"; }
function fmtN(p, dec) { return p.toFixed(dec); }
function ptol(ch) { return Math.max(0.55 * ch.atr, 0.11 * (ch.gt.height || ch.atr * 3)); }
/** the reward-to-risk this context offers from its reference entry */
function refRR(ch) { return ch.gt.refRR || 0; }
/** Brooks' trader's equation: is probability x reward bigger than the rest? */
function equation(p, rr) { return p * rr - (1 - p); }
function rrScore(rr, goal, can) {
  if (rr >= goal) return 1;
  if (can < goal && rr >= can * 0.85) return 0.75;
  if (rr >= goal * 0.75) return 0.6;

/** where price sits inside its range: 0 = at the low, 1 = at the high */

function entryHow(g) {

  var other = g.dir > 0 ? "below" : "above";
  /* in a range you fade the edge, so the trapped crowd is the one chasing the

  var trapVerb = g.dir > 0 ? "selling" : "buying";
  var trapEdge = g.dir > 0 ? "range low" : "range high";
  return g.entryType === "limit"
    ? "You get in here with a <b>limit order</b> at the range edge, not a stop — in a range you are fading the edge, so you want to be filled as price reaches the edge, not after it breaks. " +
      trapVerb.charAt(0).toUpperCase() + trapVerb.slice(1) + " a stop " + other + " the " + trapEdge +
      " is exactly how traders get trapped here, because about eight out of ten range breakouts fail."

function outcomeLine(ch) {
  var g = ch.gt;

    ? "On this tape it did work — the target came before the stop."
    : "On this tape it failed: the stop came first. About " + pct(1 - g.prob) + " of these do.";

function probLine(ch) {
  var g = ch.gt, e = equation(g.prob, g.refRR);
  return "This context wins about <b>" + pct(g.prob) + "</b> of the time in this trainer, and offers roughly <b>" +
    g.refRR.toFixed(2) + "R</b>. Trader's equation: " + g.prob.toFixed(2) + " x " + g.refRR.toFixed(2) +
    " − " + (1 - g.prob).toFixed(2) + " = <b>" + (e >= 0 ? "+" : "") + e.toFixed(2) + "R</b> per trade.";
}

      ? "Price <b>reached</b> it " + (g.hitTargetAt - g.decision) + " bars later."
      : "Price <b>never got there</b> — it failed first. A measured move is where the market is aiming, not a promise it arrives.");
    return { score: s, reveal: true, verdict: s >= 0.85 ? "Clean projection" : s >= 0.55 ? "Roughly right" : "Mis-measured", lines: lines };
  }
};

    var beyond = d > 0 ? (g.invalid - ans) : (ans - g.invalid);

    /* The signal-bar stop is the other legitimate answer, so grade it as one.
       Which is tighter is not fixed: a large signal bar can reach past the
       structure, and Brooks treats that as a reason to pass, not to shrug. */
    var sigBeyond = d > 0 ? (g.sigStop - ans) : (ans - g.sigStop);
    if (Math.abs(sigBeyond) <= 0.45 * a && Math.abs(g.sigStop - g.invalid) > 0.5 * a) {

            : "Note the signal bar here is <b>large</b>, so this stop is actually the WIDER of the two. Brooks treats an oversized signal bar as a reason to skip the trade rather than to accept the extra risk."),
          g.hitInvalidAt >= 0 ? "Price did trade through the structural level on this tape." : "Price never reached the structural level on this tape."
        ]
      };
    }

    } else {

      : "At " + rr.toFixed(2) + "R you left reward behind — this context offers about " + can.toFixed(2) + "R.");
    lines.push(outcomeLine(ch));

/* --- 17. entry placement ------------------------------------------
   Brooks' entry is mechanical, and it is the half of the trade the old
   curriculum never tested: with the trend you enter on a STOP one tick beyond
   the signal bar, because making price trade there is the confirmation. In a
   range you fade the edge with a LIMIT, because waiting for confirmation means
   paying the edge away. Getting this backwards is the single most common way a
   correct read turns into a losing trade. */
KIND.entry = {
  skill: "execution", skill2: "risk",
  prepare: function (sp, seed) {
    var ch = Mkt.gen({ seed: seed, ctx: pickPool(sp.pool || POOL.tradeable, seed) });
    var lim = ch.gt.entryType === "limit";
    return {
      ch: ch,
      q: "Place your <b>entry</b> for a " + (ch.gt.dir > 0 ? "long" : "short") +
         " here. Not roughly — exactly where the order goes.",
      ui: {
        mode: "chart", need: "hline",
        hint: lim
          ? "You are fading an edge, so you want to be filled AS price reaches it."
          : "You are trading with the move, so price must trade through your level to fill you."
      }
    };
  },
  grade: function (p, ans) {
    if (ans === null || ans === undefined) return { score: 0, verdict: "No entry placed", lines: [], reveal: true };
    var ch = p.ch, g = ch.gt, d = g.dir, a = ch.atr, sb = ch.bars[g.sigIdx];
    var trigger = d > 0 ? sb.h : sb.l;
    var beyond = d * (ans - trigger);          /* >0 = beyond the bar */
    var err = Math.abs(ans - g.entry);
    var tol = 0.30 * a;
    var s, verdict, note;

    if (g.entryType === "limit") {
      var edge = d > 0 ? g.rangeBot : g.rangeTop;
      var inside = edge === undefined ? 0 : d * (ans - edge);
      if (err <= tol) { s = 1; verdict = "Exact"; note = "A limit order right at the edge. You are paid to be early here, not late."; }
      else if (inside < -0.9 * a) {
        s = 0.2; verdict = "Limit too far outside";
        note = "You put the limit well beyond the edge, which only fills if the range actually breaks — and about eight out of ten of those breakouts fail. You would be buying the breakdown instead of fading it.";
      } else if (err <= 2 * tol) { s = 0.7; verdict = "Close"; note = "The right idea, a little loose. At an edge, precision is most of the reward."; }
      else { s = band(err, tol * 1.6) * 0.7; verdict = "Off the edge"; note = "Fading a range edge means the level itself is the trade. Away from it there is no edge left."; }
    } else if (beyond < -0.15 * a) {
      s = 0.1; verdict = "That is a limit order, not a stop";
      note = "You placed the entry <b>inside</b> the signal bar, so you get filled without price ever proving it can go your way. " +
             "With the trend, Brooks makes the market come and take him in: the order sits one tick " +
             (d > 0 ? "above" : "below") + " the signal bar's " + (d > 0 ? "high" : "low") +
             " at <b>" + fmtN(g.entry, ch.dec) + "</b>. If price never trades there, there was no trade — and that is the point.";
    } else if (beyond > 1.1 * a) {
      s = 0.25; verdict = "Chasing";
      note = "That is " + fmtN(beyond / a, 1) + " ATR beyond the signal bar. Every tick you pay above <b>" +
             fmtN(g.entry, ch.dec) + "</b> is added to your risk and taken off your reward — same read, worse equation.";
    } else if (err <= tol) {
      s = 1; verdict = "Exact";
      note = "One tick beyond the signal bar at <b>" + fmtN(g.entry, ch.dec) + "</b>. Price has to come and get you, which is the confirmation.";
    } else if (err <= 2 * tol) {
      s = 0.72; verdict = "Nearly";
      note = "Right side, right idea, slightly off <b>" + fmtN(g.entry, ch.dec) + "</b>.";
    } else {
      s = band(err, tol * 1.7) * 0.65; verdict = "Loose";
      note = "The entry belongs at <b>" + fmtN(g.entry, ch.dec) + "</b> — one tick beyond the signal bar, not a round number nearby.";
    }
    return {
      score: clamp(s, 0, 1), reveal: true, verdict: verdict,
      lines: [note, "<b>" + g.name + "</b>. " + entryHow(g)]
    };
  }
};

/* --- 18. bar counting (High 1/2/3/4, Low 1/2/3/4) ------------------
   The count is read off THIS tape by the same mechanical rule Brooks uses, so
   the answer is whatever the bars actually show — sometimes a High 1, sometimes
   a High 3. That is deliberate: a drill that always answered "High 2" would
   teach you to recognise a name instead of to count. */
KIND.barCount = {
  skill: "bars", skill2: "trend",
  right: function (p) { return String(p.ch.gt.barCount); },
  prepare: function (sp, seed) {
    /* Left alone, this tape produces a High 1 or High 2 nine times out of ten,
       and you could clear the drill by never once answering 3 or 4. So aim at a
       rotated target count and hunt for a tape that actually shows it, falling
       back to whatever valid count turns up. */
    var want = [1, 2, 2, 3, 3, 4][(seed >>> 3) % 6];
    var ch = null, n = 0, first = null, guard = 0;
    for (; guard < 90; guard++) {
      var c = Mkt.gen({ seed: (seed + guard * 7919) >>> 0, ctx: pickPool(sp.pool || POOL.pullback, (seed + guard * 131) >>> 0) });
      var cn = c.gt.barCount;
      if (cn < 1 || cn > 4) continue;
      if (first === null) { first = c; }
      if (cn === want) { ch = c; n = cn; break; }
    }
    if (!ch) { ch = first || Mkt.gen({ seed: seed, ctx: pickPool(POOL.pullback, seed) }); n = ch.gt.barCount; }
    var bull = ch.gt.dir > 0;
    return {
      ch: ch, meta: { n: n },
      q: "Count it the way Brooks counts it. Since the pullback began, how many times has a bar traded " +
         (bull ? "above the prior bar's <b>high</b>" : "below the prior bar's <b>low</b>") +
         " — where the next one only counts once a bar with a " +
         (bull ? "<b>lower high</b>" : "<b>higher low</b>") +

/* --- 19. trade management ------------------------------------------
   The equation is only realised if the trade is managed. Brooks: scalps come
   off at the scalp target, swings take partial profit and move to breakeven,
   and a market that goes two-sided has ended your swing whatever your stop
   says. */
KIND.manage = {
  skill: "execution", skill2: "discipline",
  prepare: function (sp, seed) {
    var R = Mkt.mkR((seed ^ 0x4d21) >>> 0);
    var ch = Mkt.gen({ seed: seed, ctx: pickPool(sp.pool || POOL.tradeable, seed) });
    var g = ch.gt, stalled = R.chance(0.4);
    var scalp = g.style === "scalp";
    var q = stalled
      ? "You are " + (g.dir > 0 ? "long" : "short") + " this <b>" + g.name + "</b> from " + fmtN(g.entry, ch.dec) +
        ". Price moved about 1R your way and has now spent eight bars going sideways in a tight overlapping cluster. Your stop has not been hit. What now?"
      : "You are " + (g.dir > 0 ? "long" : "short") + " this <b>" + g.name + "</b> from " + fmtN(g.entry, ch.dec) +
        ". Price has just reached your first target at " + fmtN(g.target, ch.dec) + ". What now?";
    return {
      ch: ch, meta: { stalled: stalled, scalp: scalp },
      q: q,
      ui: {
        mode: "mcq", options: [
          { k: "all", t: "Take the whole position off" },
          { k: "partial", t: "Take partial profit, move the stop to breakeven, hold the rest for the measured move" },
          { k: "hold", t: "Take nothing, hold it all for the measured move" },
          { k: "add", t: "Add to the position" }
        ]
      }
    };
  },
  grade: function (p, ans) {
    var ch = p.ch, g = ch.gt, stalled = p.meta.stalled, scalp = p.meta.scalp;
    var right = stalled ? "all" : (scalp ? "all" : "partial");
    var ok = ans === right;
    var why;
    if (stalled) {
      why = "A tight overlapping cluster is a trading range, and a trading range means the market has gone two-sided. " +
            "Whatever your reason for entering was, it has stopped being true — the swing is over. Brooks takes what the market has already given him rather than waiting for a stop that is now far away and a target the market is no longer heading for. " +
            "Holding here is how a winner becomes a scratch and then a loser.";
    } else if (scalp) {
      why = "This is a <b>scalp</b> context — " + g.name.toLowerCase() + ". You are being paid for being quick, not for being right for a long time. " +
            "Take the target. In a trading range the move beyond the first target usually does not come, and holding for it hands back the edge you just earned.";
    } else {
      why = "This is a <b>swing</b> context — " + g.name.toLowerCase() + ". Take partial profit so the trade cannot hurt you, move the stop to breakeven, and let the rest run to the measured move at " +
            fmtN(g.mmTarget, ch.dec) + ". " +
            "Brooks scalps part and swings part precisely because he cannot know in advance which trades become the big ones — this is how you stay in the few that do.";
    }

    if (ans === "add") lines.push("Adding is the answer that ruins accounts. It converts a trade that is working into a bigger trade at a worse average price, and it does it exactly when you feel most certain.");
    if (ans === "hold" && !stalled && scalp) lines.push("Holding a scalp for a swing target is trading a different setup from the one the chart actually offered.");
    lines.push(outcomeLine(ch));
    return {
      score: ok ? 1 : (ans === "partial" && right === "all" ? 0.4 : ans === "all" && right === "partial" ? 0.5 : 0),
      reveal: true,
      verdict: ok ? "Correct" : "Not what this one asks for",
      lines: lines.filter(Boolean)

  }
};

/* ---------------- pool picker ---------------- */
function pickPool(pool, seed) {
  var R = Mkt.mkR((seed ^ 0x9e37) >>> 0);
  return pool[Math.floor(R.u() * pool.length)];
}

/** the distinct base structures behind a pool — mirrors (the _D twins) are the
    same lesson, just flipped, so a Learn walkthrough only needs one per pair */
function baseKeys(pool) {
  var seen = {}, out = [];
  (pool || []).forEach(function (k) {
    var base = k.replace(/_D$/, "");
    if (!seen[base]) { seen[base] = 1; out.push(base); }
  });
  return out;
}
/** a stable hash so the same context always shows the same worked example —
    consistency matters when you are trying to burn a pattern into memory */
function fnv1a(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return h >>> 0;
}
/** one clean, fully-resolved worked example for a given structure */
function learnChart(ctxKey) {
  return Mkt.gen({ seed: fnv1a(ctxKey + "|learn"), ctx: ctxKey, forceOutcome: "win" });
}

      }

  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } }
  function skillBump(skill, score) {
    var s = st.skills[skill] || (st.skills[skill] = { s: 0, n: 0 });
    var w = s.n === 0 ? 1 : 0.28;
    s.s = s.s * (1 - w) + score * w; s.n++;
  }
  function repDone(kindName, score) {
    var K = KIND[kindName];
    if (!K) return;
    skillBump(K.skill, score);
    if (K.skill2) skillBump(K.skill2, score * 0.9 + 0.05);
    st.xp += Math.round(score * 12) + 2;
    save();
  }
  function nodeDone(node, avg, streak) {
    var rec = st.nodes[node.id] || (st.nodes[node.id] = { best: 0, tries: 0 });
    rec.tries++; rec.last = avg;
    if (avg > rec.best) rec.best = avg;
    if (streak !== undefined && streak > (rec.bestStreak || 0)) rec.bestStreak = streak;
    /* both conditions, in the same run, or it does not count */
    if (avg >= (node.pass || PASS_MARK) && (streak || 0) >= (node.streak || 0)) rec.passed = true;
    rec.at = Date.now();
    st.xp += Math.round(avg * 45) + 10;
    st.journal.unshift({ t: Date.now(), node: node.id, title: node.title, avg: avg, n: node.n });
    st.journal = st.journal.slice(0, 60);
    recomputeRank(); save();
  }
  /* A node is passed only by a single run that cleared BOTH the pass mark and
     the required run of consecutive clean answers. Averaging alone lets a good
     patch carry a bad one; the streak is what removes the doubt.
     Saves written before streaks existed are grandfathered on score alone. */
  function nodePass(node) {
    var rec = st.nodes[node.id];
    if (!rec) return false;
    if (rec.passed) return true;
    if (rec.legacy || rec.placed) return rec.best >= (node.pass || PASS_MARK);
    return false;
  }
  function tierDone(tier) { return tier.nodes.every(nodePass); }
  function tierProgress(tier) {
    var d = tier.nodes.filter(nodePass).length;
    return { done: d, total: tier.nodes.length, frac: d / tier.nodes.length };
  }
  function tierOpen(ti) {
    if (ti === 0) return true;
    if (st.rank >= ti) return true;
    return tierDone(TIERS[ti - 1]);
  }
  function recomputeRank() {
    var r = 0;
    for (var i = 0; i < TIERS.length; i++) { if (tierDone(TIERS[i])) r = i + 1; else break; }
    if (r > st.rank) st.rank = r;
    return st.rank;
  }
  function rankName() { return RANKS[Math.min(st.rank, RANKS.length - 1)].n; }
  function nextNode() {
    for (var i = 0; i < TIERS.length; i++) {
      if (!tierOpen(i)) break;
      for (var j = 0; j < TIERS[i].nodes.length; j++) {
        if (!nodePass(TIERS[i].nodes[j])) return { tier: TIERS[i], node: TIERS[i].nodes[j], ti: i };
      }
    }
    return null;
  }
  function logTrade(t) { st.trades.unshift(t); st.trades = st.trades.slice(0, 300); save(); }
  function reset() { try { localStorage.removeItem(KEY); } catch (e) { } location.reload(); }
  function place(rank) {

       are going to trade with real money first, so they get earned, not
       inferred from a mixed test that only sampled them in passing. */
    for (var i = 1; i < rank; i++) {
      TIERS[i].nodes.forEach(function (nd) {
        var rec = st.nodes[nd.id] || (st.nodes[nd.id] = { best: 0, tries: 0 });
        if (rec.best < 0.75) { rec.best = 0.75; rec.placed = true; }
      });
    }
    save();
  }
  load();
  return {
    st: st, save: save, nodeDone: nodeDone, repDone: repDone, nodePass: nodePass,
    tierDone: tierDone, tierProgress: tierProgress, tierOpen: tierOpen, rankName: rankName,
    nextNode: nextNode, skillBump: skillBump, logTrade: logTrade, reset: reset,
    place: place, recomputeRank: recomputeRank
  };
})();

        u.onerror = function () { if (done) done(); };
        try { synth.speak(u); } catch (e) { if (done) done(); }
      }
      next();
      return true;
    }
    return { supported: supported, speak: speak, stop: stop, speaking: speaking, strip: strip };
  })();

  /** wire a Read/Stop toggle; hides itself entirely when speech is unavailable */
  function wireRead(id, getText) {
    var b = $(id);
    if (!b) return;
    if (!Speech.supported) { b.style.display = "none"; return; }
    function sync() { b.innerHTML = Speech.speaking() ? "&#9632; Stop" : "&#128266; Read"; }
    b.onclick = function () {
      if (Speech.speaking()) { Speech.stop(); sync(); return; }
      Speech.speak(getText(), sync);
      setTimeout(sync, 60);
    };

  /* ---------------- question snapshot ----------------
     A plain-text dump of the rep you are looking at: the chart's identity
     (seed + context key regenerate it exactly), the question, your answer,
     the right answer and the feedback. Used by both the Copy button and the
     Copy button, so one press hands over everything needed to discuss it. */
  function snapshot() {
    var p = S.prep;
    if (!p || !p.ch) return "";
    var ch = p.ch, g = ch.gt, L = [], sp = Speech.strip;
    L.push("TRADE TRAINER v" + APP.version + " — question detail");
    L.push("Lesson: " + (S.placement ? "Placement test" : S.node.title) +
      " (rep " + (S.idx + 1) + " of " + S.n + ")   drill type: " + p.kind);
    L.push("Chart: " + ch.sym + " " + ch.tfLbl + "   seed=" + ch.seed + "   context=" + g.key);
    L.push("Context: " + g.name + (g.tradeable
      ? " — " + (g.dir > 0 ? "long" : "short") + " bias, " + Math.round(g.prob * 100) + "% win rate, " +
        g.refRR.toFixed(2) + "R reference"
      : " — not tradeable"));
    if (g.tradeable) {
      L.push("App's levels: entry " + fmtN(g.entry, ch.dec) +
        " / stop " + fmtN(g.invalid, ch.dec) + " / target " + fmtN(g.target, ch.dec));
    }
    L.push("");
    L.push("QUESTION");
    L.push(sp(p.q));
    if (p.ui.hint) L.push("(hint shown: " + sp(p.ui.hint) + ")");

    var right = p.K.right ? p.K.right(p) : null;
    if (p.ui.mode === "mcq") {
      L.push("");
      L.push("OPTIONS");
      p.ui.options.forEach(function (o) {
        var tag = [];
        if (S.sel === o.k) tag.push("MY ANSWER");
        if (S.graded && o.k === right) tag.push("APP SAYS CORRECT");
        L.push("  - " + o.t + (tag.length ? "   <<< " + tag.join(" / ") : ""));
      });
    } else if (p.ui.mode === "numeric") {
      L.push("");
      L.push("My answer: " + (S.ansNum != null && S.ansNum !== "" ? S.ansNum : "(none)") +
        (right != null ? "   App's answer: " + right : ""));
    } else {
      var d = (chD.drawings || []).map(function (w) {
        return w.type + (w.p != null ? " at " + fmtN(w.p, ch.dec) : "");
      });
      L.push("");
      L.push("What I drew on the chart: " + (d.length ? d.join(", ") : "(nothing)"));
      if (chD.userMark != null) L.push("Marked price: " + fmtN(chD.userMark, ch.dec));
    }

    if (S.graded) {
      L.push("");
      L.push("APP'S VERDICT: " + sp(S.graded.verdict) + " — scored " + Math.round(S.graded.score * 100) + "%");
      (S.graded.lines || []).forEach(function (l) { L.push("  " + sp(l)); });
    } else {
      L.push("");
      L.push("(not answered yet)");
    }
    return L.join("\n");
  }

  /** copy text to the clipboard, with a fallback for browsers that block the API */

      document.body.appendChild(ta); ta.focus(); ta.select();

      try { ok = document.execCommand("copy"); } catch (e) { }
      document.body.removeChild(ta);
      toast(ok ? "Copied — paste it into your chat" : "Could not copy automatically");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        toast("Copied — paste it into your chat");
      }, fallback);

  /* =====================================================================

  var S = null;

  function startNode(node, opts) {
    opts = opts || {};
    var seed0 = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    var bases = node.pool ? baseKeys(node.pool) : [];
    S = {
      node: node, n: node.n, idx: 0, scores: [], rs: [], seed0: seed0,
      placement: !!opts.placement, prep: null, graded: null, sel: null, busy: false,
      learnBases: bases, learnIdx: 0, learnMode: false

    setView("drill");

      !(KIND[node.kind] && KIND[node.kind].noChart);
    /* teach it before testing it — but only force this the first time; once
       the node is passed, jump straight back into drilling on redo */
    if (canLearn && !opts.placement && !PROG.nodePass(node)) enterLearn(0);
    else loadRep();
  }

  /* =====================================================================
     LEARN — one annotated worked example per structure, before any quiz
     ===================================================================== */
  function enterLearn(idx) {
    /* snapshot the live rep so returning from Learn cannot re-open an answered
       question — otherwise you could review, then re-answer knowing the answer */
    if (!S.learnMode && S.prep) {
      S.saved = {
        drawings: chD.drawings, userMark: chD.userMark, markers: chD.markers,
        i0: chD.i0, i1: chD.i1, vis: chD.vis, locked: chD.locked,
        gt: chD.gt, gtMeasure: chD.gtMeasure, sigBar: chD.sigBar
      };
    }
    S.learnMode = true;
    S.learnIdx = Math.max(0, Math.min(idx, S.learnBases.length - 1));
    var key = S.learnBases[S.learnIdx];
    var ch = learnChart(key);
    if (S.abortSim) { S.abortSim(); S.abortSim = null; }
    chD.locked = true;
    chD.load(ch, ch.bars.length - 1);
    chD.gt = ch.gt; chD.gtMeasure = true; chD.sigBar = ch.gt.sigIdx;
    chD.setTool("cursor");
    chD.fit();
    buildLearnToolbar(ch);
    paintLearnPanel(ch, key);
    paintFoot();
    if (PREF.autoRead) Speech.speak(learnSpeech(ch, key), function () {
      var b = $("learnRead"); if (b) b.innerHTML = "&#128266; Read";
    });
  }
  /** the Learn page as one spoken script */

    steps.forEach(function (st, i) { parts.push("Step " + (i + 1) + ". " + Speech.strip(st)); });
    if (g.tradeable) parts.push(Speech.strip(entryHow(g)));
    return parts.join(" ");
  }

  /** the lesson card as plain text — same job as snapshot(), for Learn mode */
  function learnSnapshot(ch, key) {
    var g = ch.gt, sp = Speech.strip, L = [];
    var steps = (Mkt.CTX[key] && Mkt.CTX[key].howTo) || [];

    if (g.labels && g.labels.length) {

  function buildLearnToolbar(ch) {

      '<button class="tool wide" id="learnPrev"' + (S.learnIdx === 0 ? " disabled" : "") + '>&#9668; Prev</button>' +

  function exitLearn() {

    if (S.prep.ch) {
      chD.load(S.prep.ch, sv.vis);

  function loadRep() {
    if (S.abortSim) { S.abortSim(); S.abortSim = null; }
    S.graded = null; S.sel = null; S.busy = false; S.replayRun = false; S.ansNum = null; S.saved = null;
    S.prep = prepareRep(S.node, S.idx, (S.seed0 + S.idx * 7919) >>> 0);

      chD.load(prep.ch, prep.ch.gt.decision);

      chD.userMark = null;

  var TOOLBTN = [
    ["cursor", "✛", "Crosshair / move"],

  function buildToolbar(prep) {

    var html = '<div class="sym"><b>' + (prep.ch ? prep.ch.sym : "—") + '</b>' +
      (prep.ch ? prep.ch.tfLbl : "") + '</div><div class="tsep"></div>';

      '<button class="tool" data-act="undo" title="Undo">↺</button>' +
      '<button class="tool" data-act="clear" title="Clear drawings">✕</button>' +

    }

    [].forEach.call(wrap.querySelectorAll("[data-act]"), function (b) {

  /* ---------- drill panel ---------- */
  function paintDrillPanel() {
    if (S.learnMode) return;

    if (chD._syncWrap) syncTools(chD._syncWrap, chD);

    out.push('<div class="stepdots">' + Array.apply(null, Array(S.n)).map(function (_, i) {
