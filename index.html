  function learnSpeech(ch, key) {
    var g = ch.gt, steps = (Mkt.CTX[key] && Mkt.CTX[key].howTo) || [];
    var parts = [g.name + ".", Speech.strip(g.brooks), "How to find it."];
    steps.forEach(function (st, i) { parts.push("Step " + (i + 1) + ". " + Speech.strip(st)); });
    if (g.tradeable) parts.push(Speech.strip(entryHow(g, ch)));
    return parts.join(" ");
  }
  function paintLearnPanel(ch, key) {
    var g = ch.gt, steps = (Mkt.CTX[key] && Mkt.CTX[key].howTo) || [], out = [];
    out.push('<div class="task">LEARN &middot; ' + (S.learnIdx + 1) + ' / ' + S.learnBases.length +
      '<button class="readbtn" id="learnRead">&#128266; Read</button>' +
      '<button class="readbtn" id="learnCopy">&#128203; Copy</button></div>');
    out.push('<div class="brief"><b>' + esc(g.name) + '</b><br>' + g.brooks + '</div>');
    out.push('<div class="seclabel" style="margin-top:12px">How to find it</div>');
    out.push('<ol style="margin:0 0 0 18px;padding:0;font-size:12.5px;line-height:1.65;color:#cfd4dd">');
    steps.forEach(function (st) { out.push('<li style="margin-bottom:8px">' + st + '</li>'); });
    out.push('</ol>');
    if (g.tradeable) {
      out.push('<div class="ticket"><div class="hd">This example</div><div class="tgrid">' +
        '<div class="tf"><div class="k">Entry</div><div class="v">' + fmtN(g.entry, ch.dec) + '</div></div>' +
        '<div class="tf"><div class="k">Stop</div><div class="v dn">' + fmtN(g.invalid, ch.dec) + '</div></div>' +
        '<div class="tf"><div class="k">Target</div><div class="v up">' + fmtN(g.target, ch.dec) + '</div></div>' +
        '<div class="tf"><div class="k">R : R</div><div class="v">' + g.refRR.toFixed(2) + 'R</div></div>' +
        '</div><div class="hint" style="margin-top:8px">' + entryHow(g, ch) +
        '</div><div class="hint" style="margin-top:6px">' + targetBasis(ch) + '</div></div>');
    }
    $("drillPanel").innerHTML = out.join("");
    wireRead("learnRead", function () { return learnSpeech(ch, key); });
    wireCopy("learnCopy", function () { return learnSnapshot(ch, key); });
  }
  /** the lesson card as plain text — same job as snapshot(), for Learn mode */
  function learnSnapshot(ch, key) {
    var g = ch.gt, sp = Speech.strip, L = [];
    var steps = (Mkt.CTX[key] && Mkt.CTX[key].howTo) || [];
    L.push("TRADE TRAINER v" + APP.version + " — lesson card");
    L.push("Lesson: " + (S.node ? S.node.title : "Learn") +
      " (card " + (S.learnIdx + 1) + " of " + S.learnBases.length + ")");
    L.push("Chart: " + ch.sym + " " + ch.tfLbl + "   seed=" + ch.seed + "   context=" + key);
    L.push("Context: " + g.name + (g.tradeable
      ? " — " + (g.dir > 0 ? "long" : "short") + " bias, " + Math.round(g.prob * 100) + "% win rate"
      : " — not tradeable"));
    if (g.labels && g.labels.length) {
      L.push("Marked on the chart: " + g.labels.map(function (x) {
        return x[1] + " at " + fmtN(x[0].p, ch.dec);
      }).join(", "));
    }
    L.push("");
    L.push("WHAT IT IS");
    L.push(sp(g.brooks));
    L.push("");
    L.push("HOW TO FIND IT");
    steps.forEach(function (st, i) { L.push("  " + (i + 1) + ". " + sp(st)); });
    if (g.tradeable) {
      L.push("");
      L.push("THIS EXAMPLE");
      L.push("  entry " + fmtN(g.entry, ch.dec) + " / stop " + fmtN(g.invalid, ch.dec) +
        " / target " + fmtN(g.target, ch.dec) + " = " + g.refRR.toFixed(2) + "R");
      L.push("  " + sp(entryHow(g, ch)));
    }
    return L.join("\n");
  }
  function buildLearnToolbar(ch) {
    var wrap = $("drillTools"), last = S.learnIdx >= S.learnBases.length - 1;
    wrap.innerHTML = '<div class="sym"><b>' + ch.sym + '</b>' + ch.tfLbl + '</div><div class="tsep"></div>' +
      '<button class="tool wide" id="learnPrev"' + (S.learnIdx === 0 ? " disabled" : "") + '>&#9668; Prev</button>' +
      '<button class="tool wide" id="learnNext">' + (last ? "Start drilling &#9658;" : "Next &#9658;") + '</button>' +
      '<div class="tsep"></div>' + actBtn("fit", "⤢", "Fit", "Fit the chart to the bars");
    $("learnPrev").onclick = function () { enterLearn(S.learnIdx - 1); };
    $("learnNext").onclick = function () { if (last) exitLearn(); else enterLearn(S.learnIdx + 1); };
    var fitBtn = wrap.querySelector('[data-act="fit"]');
    if (fitBtn) fitBtn.onclick = function () { chD.fit(); };
  }
  function exitLearn() {
    S.learnMode = false;
    var sv = S.saved;
    if (!sv || !S.prep) { S.saved = null; loadRep(); return; }
    /* put the rep back exactly as it was, graded state and all */
    if (S.prep.ch) {
      chD.load(S.prep.ch, sv.vis);
      chD.drawings = sv.drawings; chD.userMark = sv.userMark; chD.markers = sv.markers;
      chD.i0 = sv.i0; chD.i1 = sv.i1; chD.locked = sv.locked;
      chD.gt = sv.gt; chD.gtMeasure = sv.gtMeasure; chD.sigBar = sv.sigBar;
      chD.gtLevel = sv.gtLevel === undefined ? 3 : sv.gtLevel; chD.gtKeep = sv.gtKeep;
      chD.onChange = paintDrillPanel;
    } else {
      chD.blank();
    }
    buildToolbar(S.prep);
    if (!sv.locked && (S.prep.ui.mode === "chart" || S.prep.ui.mode === "plan") && S.prep.ui.need !== "pos") {
      chD.setTool(S.prep.ui.need);
    } else {
      chD.setTool("cursor");
    }
    S.saved = null;
    chD.render();
    paintDrillPanel();
  }

  function loadRep() {
    if (S.abortSim) { S.abortSim(); S.abortSim = null; }
    S.graded = null; S.sel = null; S.busy = false; S.replayRun = false; S.ansNum = null; S.saved = null;
    S.prep = prepareRep(S.node, S.idx, (S.seed0 + S.idx * 7919) >>> 0);
    var prep = S.prep;
    chD.locked = false;
    if (prep.ch) {
      chD.load(prep.ch, prep.ch.gt.decision);
      chD.sigBar = prep.ch.gt.sigIdx;
      chD.userMark = null;
      chD.onChange = paintDrillPanel;
    } else {
      chD.blank();
    }
    buildToolbar(prep);
    /* never pre-select the winning side — that is the answer on plan drills */
    chD.posDir = 1;
    /* arm the tool the drill asks for */
    if ((prep.ui.mode === "chart" || prep.ui.mode === "plan") && prep.ui.need !== "pos") chD.setTool(prep.ui.need);
    paintDrillPanel();
    if (PREF.autoRead) Speech.speak(Speech.strip(prep.q) + (prep.ui.hint ? ". " + Speech.strip(prep.ui.hint) : ""), function () {
      var b = $("qRead"); if (b) b.innerHTML = "&#128266; Read";
    });
  }

  /* icon, tooltip, and a short label printed under the icon. Icons alone meant
     guessing what each button did, and a tooltip you have to hover for is no
     help at all on a touch screen. */
  var TOOLBTN = [
    ["cursor",  "✛", "Select and move — click a drawing, drag it, press its ✕ to delete", "Select"],
    ["hline",   "─", "Horizontal level", "Level"],
    ["trend",   "╱", "Trendline", "Trend"],
    ["rect",    "▭", "Zone / rectangle", "Zone"],
    ["fib",     "≡", "Fibonacci retracement — click the start and end of the leg", "Fib"],
    ["fibext",  "≣", "Fibonacci extension — click A, then B, then the point to project from", "Fib ext"],
    ["measure", "⇕", "Measured move (A → B → C)", "Measure"],
    ["pos",     "⌸", "Position (entry / stop / target)", "Position"]
  ];
  /* icon over label, so a button says what it does without being hovered */
  function toolBtn(t) {
    return '<button class="tool lab" data-tool="' + t[0] + '" title="' + t[2] + '">' +
      '<span class="ic">' + t[1] + '</span><span class="tl">' + t[3] + '</span></button>';
  }
  function actBtn(act, icon, label, title) {
    return '<button class="tool lab" data-act="' + act + '" title="' + title + '">' +
      '<span class="ic">' + icon + '</span><span class="tl">' + label + '</span></button>';
  }

  function buildToolbar(prep) {
    var wrap = $("drillTools"), tools = TOOLBTN.slice();
    if (prep.ui.need === "mark") tools = [["cursor", "✛", "Crosshair"], ["mark", "◉", "Drop a marker"]];
    var html = '<div class="sym"><b>' + (prep.ch ? prep.ch.sym : "—") + '</b>' +
      (prep.ch ? prep.ch.tfLbl : "") + '</div><div class="tsep"></div>';
    tools.forEach(function (t) {
      html += toolBtn(t);
    });
    if (!prep.ch) html = '<div class="sym"><b>—</b>mental maths</div>';
    html += '<div class="tsep"></div>' +
      actBtn("undo", "↺", "Undo", "Undo the last drawing") +
      actBtn("clear", "✕", "Clear all", "Clear every drawing — to remove just one, click it and press its ✕") +
      actBtn("fit", "⤢", "Fit", "Fit the chart to the bars");
    if (S.learnBases && S.learnBases.length) {
      html += '<div class="tsep"></div><button class="tool wide" data-act="learn" title="Review the worked examples">Learn</button>';
    }
    wrap.innerHTML = html;
    [].forEach.call(wrap.querySelectorAll("[data-tool]"), function (b) {
      b.onclick = function () { chD.setTool(b.dataset.tool); syncTools(wrap, chD); };
    });
    [].forEach.call(wrap.querySelectorAll("[data-act]"), function (b) {
      b.onclick = function () {
        if (b.dataset.act === "undo") chD.undo();
        if (b.dataset.act === "clear") { chD.clearAll(); chD.userMark = null; chD.markers = chD.markers.filter(function (m) { return !m.user; }); chD.render(); }
        if (b.dataset.act === "fit") chD.fit();
        if (b.dataset.act === "learn") { enterLearn(S.learnIdx || 0); return; }
        paintDrillPanel();
      };
    });
    chD._syncWrap = wrap;
    syncTools(wrap, chD);
  }
  function syncTools(wrap, ch) {
    [].forEach.call(wrap.querySelectorAll("[data-tool]"), function (b) {
      b.classList.toggle("on", b.dataset.tool === ch.tool);
    });
  }

  /* ---------- drill panel ---------- */
  function paintDrillPanel() {
    if (S.learnMode) return;
    var prep = S.prep, ui = prep.ui, out = [];
    if (chD._syncWrap) syncTools(chD._syncWrap, chD);

    out.push('<div class="stepdots">' + Array.apply(null, Array(S.n)).map(function (_, i) {
      var c = i < S.idx ? (S.scores[i] >= 0.7 ? "ok" : "on") : i === S.idx ? "on" : "";
      return '<i class="' + c + '"></i>';
    }).join("") + '</div>');
    out.push('<div class="task">' + esc(S.placement ? "Placement" : S.node.title) + ' · ' + (S.idx + 1) + " / " + S.n +
      '<button class="readbtn" id="qRead">&#128266; Read</button>' +
      '<button class="readbtn" id="qCopy">&#128203; Copy</button></div>');
    out.push('<div class="brief">' + prep.q + '</div>');
    if (ui.hint) out.push('<div class="hint" style="margin-top:8px">' + ui.hint + '</div>');

    if (ui.mode === "mcq") {
      out.push('<div style="margin-top:11px">');
      ui.options.forEach(function (o, i) {
        var cls = "opt" + (S.sel === o.k ? " sel" : "");
        if (S.graded) {
          var right = prep.K.right ? prep.K.right(prep) : null;
          if (o.k === right) cls += " right";
          else if (S.sel === o.k) cls += " wrong";
        }
        out.push('<button class="' + cls + '" data-opt="' + esc(o.k) + '">' + esc(o.t) + '</button>');
      });
      out.push('</div>');
    }
    if (ui.mode === "numeric") {
      out.push('<div style="margin-top:11px"><div class="hint" style="margin-bottom:5px">' + esc(ui.label) + '</div>' +
        '<input class="num" id="numIn" type="number" step="' + (ui.step || "0.01") + '" inputmode="decimal" ' +
        (S.graded ? "disabled" : "") + ' value="' + (S.ansNum != null ? S.ansNum : "") + '"></div>');
    }
    if ((ui.mode === "chart" || ui.mode === "plan") && ui.need === "pos") out.push(dirToggle());
    if (ui.mode === "replay") out.push(replayPanel());
    if (ui.mode === "chart" || ui.mode === "replay" || ui.mode === "plan") out.push(ticket());
    if (ui.mode === "plan" && !S.graded) {
      out.push('<button class="btn" id="noTradeBtn" style="width:100%;margin-top:9px">No trade here</button>');
    }

    if (S.graded) {
      var g = S.graded, cls = g.score >= 0.85 ? "good" : g.score >= 0.5 ? "mid" : "bad";
      out.push('<div class="fb ' + cls + '"><h4>' + esc(g.verdict) + ' · ' + Math.round(g.score * 100) +
        '%<button class="readbtn" id="fbRead">&#128266; Read</button>' +
        '<button class="readbtn" id="fbCopy">&#128203; Copy</button></h4>' +
        '<ul>' + g.lines.map(function (l) { return "<li>" + l + "</li>"; }).join("") + '</ul></div>');
    }
    $("drillPanel").innerHTML = out.join("");

    [].forEach.call($("drillPanel").querySelectorAll("[data-opt]"), function (b) {
      b.onclick = function () { if (S.graded) return; S.sel = b.dataset.opt; paintDrillPanel(); };
    });
    if ($("numIn")) $("numIn").oninput = function () { S.ansNum = this.value; };
    if ($("dirLong")) $("dirLong").onclick = function () { setDir(1); };
    if ($("dirShort")) $("dirShort").onclick = function () { setDir(-1); };
    if ($("execBtn")) $("execBtn").onclick = execute;
    /* live management, repainting so the read-out follows the action */
    var act = function (fn) { return function () { if (S.sim) { fn(S.sim); paintDrillPanel(); } }; };
    if ($("mHalf")) $("mHalf").onclick = act(function (s) { s.partial(0.5); });
    if ($("mBE")) $("mBE").onclick = act(function (s) { s.breakeven(); });
    if ($("mTrail")) $("mTrail").onclick = act(function (s) { s.setTrail(3); });
    if ($("mAdd")) $("mAdd").onclick = act(function (s) { s.addLeg(); });
    if ($("mRun")) $("mRun").onclick = act(function (s) { s.dropTarget(); });
    if ($("mClose")) $("mClose").onclick = act(function (s) { s.closeAll(); });
    if ($("riskIn")) $("riskIn").onchange = function () {
      var v = parseFloat(this.value);
      if (!isFinite(v) || v <= 0) { this.value = S.account.riskPct; return; }
      S.account.riskPct = clamp(v, 0.1, 10);
      this.value = S.account.riskPct;
      PROG.st.account = S.account; PROG.save();
      paintDrillPanel();
    };
    if ($("noTradeBtn")) $("noTradeBtn").onclick = function () {
      chD.locked = true; finishRep(S.prep.K.grade(S.prep, { passed: true }));
    };
    if ($("passBtn")) $("passBtn").onclick = passTrade;
    if (S.graded) wireRead("fbRead", function () { return feedbackSpeech(S.graded); });
    wireRead("qRead", function () { return Speech.strip(prep.q) + (ui.hint ? ". " + Speech.strip(ui.hint) : ""); });
    wireCopy("qCopy", snapshot);
    wireCopy("fbCopy", snapshot);
    if (S.replayRun) updateLive();         /* fill the live values now, not on the next bar */

    paintFoot();
  }
  /** the graded feedback as one spoken script */
  function feedbackSpeech(g) {
    return [Speech.strip(g.verdict) + "."].concat(
      (g.lines || []).map(function (l) { return Speech.strip(l); })
    ).filter(Boolean).join(" ");
  }
  function dirToggle() {
    var d = chD.posDir || 1;
    return '<div class="ticket"><div class="hd">Direction</div><div class="dirsel">' +
      '<button id="dirLong" class="long' + (d > 0 ? " on" : "") + '">LONG</button>' +
      '<button id="dirShort" class="short' + (d < 0 ? " on" : "") + '">SHORT</button></div>' +
      '<div class="hint">Then tap the chart to drop the position box, and drag entry / stop / target.</div></div>';
  }
  function setDir(d) {
    chD.posDir = d;
    var p = chD.find("pos");
    if (p) {
      var a = S.prep.ch.atr;
      p.dir = d; p.stop = p.entry - d * a * 1.5; p.target = p.entry + d * a * 3;
      chD.render();
    } else { chD.setTool("pos"); }
    paintDrillPanel();
  }
  function ticket() {
    var r = chD.readout(), ch = S.prep.ch, out = [];
    out.push('<div class="ticket"><div class="hd">Read-out</div><div class="tgrid">');
    function f(k, v, cls) { out.push('<div class="tf"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>'); }
    if (r.leg !== undefined) {
      f("Measured leg", ch ? ch.dec !== undefined ? Math.abs(r.leg).toFixed(ch.dec) : "" : "");
      f("Projected target", r.mTarget !== undefined ? r.mTarget.toFixed(ch.dec) : "—", "am");
    }
    if (r.entry !== undefined) {
      f("Entry", r.entry.toFixed(ch.dec));
      f("Stop", r.stop.toFixed(ch.dec), "dn");
      f("Target", r.target.toFixed(ch.dec), "up");
      f("Reward : risk", r.rr.toFixed(2) + "R", r.rr >= 2 ? "up" : r.rr >= 1 ? "am" : "dn");
      f("Risk / unit", r.risk.toFixed(ch.dec));
      f("Risk of entry", r.riskPct.toFixed(2) + "%");
    }
    if (r.leg === undefined && r.entry === undefined) {
      out.push('<div class="hint" style="grid-column:1/-1">Nothing drawn yet.</div>');
    }
    out.push("</div></div>");
    if (S.graded && ch && ch.gt.tradeable) {
      var g = ch.gt;
      out.push('<div class="ticket"><div class="hd">Context</div><div class="tgrid">' +
        '<div class="tf"><div class="k">Cycle</div><div class="v" style="font-size:11px">' + g.cycle + '</div></div>' +
        '<div class="tf"><div class="k">Style</div><div class="v" style="font-size:11px">' + g.style + '</div></div>' +
        '<div class="tf"><div class="k">Wins</div><div class="v">' + Math.round(g.prob * 100) + '%</div></div>' +
        '<div class="tf"><div class="k">Offers</div><div class="v">' + g.refRR.toFixed(2) + 'R</div></div>' +
        '</div></div>');
    }
    return out.join("");
  }
  /** The account read-out: balance, how far from the target, how much of the
      drawdown is spent, and the risk dial. Shown above the ticket so the
      constraints are in front of you while you size the trade, not after. */
  function fundPanel() {
    var a = S.account; if (!a) return "";
    var gain = 100 * (a.bal - a.start) / a.start;
    var dd = 100 * (a.peak - a.bal) / a.peak;
    var day = 100 * (a.sessionStart - a.bal) / a.sessionStart;
    var risk$ = a.bal * a.riskPct / 100;
    var bar = function (pct, lim, cls) {
      var w = Math.max(0, Math.min(100, 100 * pct / lim));
      return '<div class="xpbar" style="height:5px;margin:3px 0 7px"><i class="xpfill ' + cls + '" style="width:' + w.toFixed(0) + '%"></i></div>';
    };
    return '<div class="ticket"><div class="hd">Account &middot; trade ' + (a.tradeNo + 1) + ' of ' + FUND.budget + '</div>' +
      '<div class="row"><div class="grow"><b>$' + Math.round(a.bal).toLocaleString() + '</b> ' +
      '<span class="' + (gain >= 0 ? "up" : "dn") + '">' + (gain >= 0 ? "+" : "") + gain.toFixed(2) + '%</span></div>' +
      '<div class="hint">target +' + FUND.targetPct + '%</div></div>' +
      bar(Math.max(0, gain), FUND.targetPct, "up") +
      '<div class="row"><div class="grow hint">drawdown ' + dd.toFixed(2) + '% of ' + FUND.maxDDPct + '%</div>' +
      '<div class="hint">session ' + (day > 0 ? day.toFixed(2) : "0.00") + '% of ' + FUND.dayLossPct + '%</div></div>' +
      bar(dd, FUND.maxDDPct, "dn") +
      '<div class="row" style="gap:7px;align-items:center"><label class="hint" for="riskIn">Risk per trade</label>' +
      '<input class="num" id="riskIn" type="number" step="0.25" min="0.1" max="10" value="' + a.riskPct + '" style="width:74px">' +
      '<div class="hint grow">= $' + Math.round(risk$).toLocaleString() + ' &middot; size follows your stop</div></div></div>';
  }

  /** While the tape runs you can actually manage the position, which is the
      whole point — a partial you press is a different thing from a partial you
      name in a multiple-choice question. */
  function livePanel() {
    var st = S.sim && S.sim.state ? S.sim.state() : null;
    var out = ['<div class="ticket"><div class="hd">Executing</div><div class="hint">' + S.replayMsg + '</div>'];
    if (st && st.filled && st.open > 0) {
      out.push('<div class="row" style="margin-top:6px"><div class="grow hint" id="lvPos"></div>' +
        '<div class="hint" id="lvBank"></div></div>');
      out.push('<div class="row"><div class="grow hint" id="lvRisk"></div><div class="hint" id="lvTgt"></div></div>');
      out.push('<div class="row" style="margin-top:7px;gap:6px;flex-wrap:wrap">' +
        '<button class="btn grow" id="mHalf">Take half</button>' +
        '<button class="btn grow" id="mBE">Stop to average</button>' +
        '<button class="btn grow" id="mTrail">' + (st.trail ? 'Trailing' : 'Trail') + '</button></div>');
      out.push('<div class="row" style="margin-top:6px;gap:6px;flex-wrap:wrap">' +
        '<button class="btn grow" id="mAdd"' + (st.armedAdd ? ' disabled' : '') + '>Scale in</button>' +
        '<button class="btn grow" id="mRun">Drop target</button>' +
        '<button class="btn grow" id="mClose">Close all</button></div>');
    }
    out.push('</div>');
    return out.join("");
  }

  /** Refresh the live numbers in place. Rebuilding the whole panel every bar
      would fight the buttons for focus, so only the values move. */
  function updateLive() {
    if (!S.sim || !S.sim.state) return;
    var st = S.sim.state(), dec = S.prep.ch.dec, set = function (id, html) {
      var el = $(id); if (el) el.innerHTML = html;
    };
    var hint = $("drillPanel").querySelector(".ticket .hint");
    if (hint) hint.textContent = S.replayMsg;
    if (!st.filled || st.open <= 0) return;
    set("lvPos", "open <b>" + st.open.toFixed(2) + "</b> @ <b>" + fmtN(st.avg, dec) + "</b>" +
      (st.legs > 1 ? " (" + st.legs + " legs)" : ""));
    set("lvBank", 'banked <b class="' + (st.realisedR >= 0 ? "up" : "dn") + '">' +
      (st.realisedR >= 0 ? "+" : "") + st.realisedR.toFixed(2) + "R</b>");
    set("lvRisk", 'at risk now <b class="' + (st.openR > 1.05 ? "dn" : "") + '">' + st.openR.toFixed(2) + "R</b>" +
      (st.openR > 1.05 ? " — more than you planned" : ""));
    set("lvTgt", st.target === null ? "no target · trailing" : "target " + fmtN(st.target, dec));
  }

  function replayPanel() {
    if (S.replayRun) return livePanel();
    if (S.graded) return "";
    return (S.account ? fundPanel() : "") + dirToggle() +
      '<div class="row" style="margin-top:9px;gap:7px">' +
      '<button class="btn primary grow" id="execBtn">Execute</button>' +
      '<button class="btn grow" id="passBtn">Pass</button></div>';
  }

  function paintFoot() {
    var f = $("drillFoot"), out = [];
    if (S.learnMode) {
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
      f.innerHTML = out.join("");
      $("quitBtn").onclick = function () { setView("path"); };
      return;
    }
    if (S.graded) {
      var last = S.idx >= S.n - 1;
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
      out.push('<button class="btn primary" id="nextBtn">' +
        (S.runOver ? (S.runOver === "PASS" ? "See your result" : "See what happened") : last ? "Finish" : "Next") + '</button>');
    } else if (S.prep.ui.mode === "replay") {
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
    } else {
      out.push('<button class="btn ghost" id="quitBtn">Path</button>');
      out.push('<button class="btn primary" id="subBtn">Submit</button>');
    }
    f.innerHTML = out.join("");
    if ($("quitBtn")) $("quitBtn").onclick = function () {
      Speech.stop();
      if (S.abortSim) { S.abortSim(); S.abortSim = null; }
      if (chD._rev) { clearInterval(chD._rev); chD._rev = null; }
      setView("path");
    };
    if ($("subBtn")) $("subBtn").onclick = submit;
    if ($("nextBtn")) $("nextBtn").onclick = nextRep;
  }

  /* ---------- answering ---------- */
  function readAnswer() {
    var ui = S.prep.ui;
    if (ui.mode === "mcq") return S.sel;
    if (ui.mode === "numeric") { var v = parseFloat(S.ansNum); return isFinite(v) ? v : null; }
    if (ui.mode === "chart" || ui.mode === "plan") {
      if (ui.need === "hline") { var d = chD.find("hline"); return d ? d.p : null; }
      if (ui.need === "measure") return chD.find("measure");
      if (ui.need === "mark") return chD.userMark || null;
      if (ui.need === "pos") {
        var p = chD.find("pos");
        return p ? { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target } : null;
      }
    }
    return null;
  }
  function submit() {
    if (S.graded || S.busy) return;
    var ans = readAnswer();
    if (ans === null || ans === undefined || (typeof ans === "object" && S.prep.ui.need === "measure" && !ans.c)) {
      toast(S.prep.ui.mode === "mcq" ? "Pick an answer" :
        S.prep.ui.mode === "numeric" ? "Type a number" :
          S.prep.ui.need === "measure" ? "Place A, B and C first" : "Nothing placed on the chart yet");
      return;
    }
    finishRep(S.prep.K.grade(S.prep, ans));
  }
  /* When the chart stops marking structure, the words have to carry it — but
     only for things you were actually asked to find. Range edges and named
     structure are facts the drill wanted you to locate, so stating them
     afterwards IS the feedback. The trade levels on a "name the context" drill
     are not, and printing those would just re-add the scaffolding as text.

     Appended to g.lines rather than to the panel HTML so the read-aloud and the
     Copy snapshot pick it up for free. Additive, so the {score, reveal, verdict,
     lines} shape the external test scripts rely on is unchanged. */
  function fadeNote(g, ch, lv) {
    if (!g || g._faded || lv >= 3 || !ch) return;
    var t = ch.gt, out = [];
    if (lv < 3 && (t.labels || []).length) {
      out.push((t.labels).map(function (L) {
        return "<b>" + esc(L[1]) + "</b> at " + fmtN(L[0].p, ch.dec);
      }).join(" · "));
    }
    if (lv < 2 && t.rangeTop !== undefined) {
      out.push("range <b>" + fmtN(t.rangeBot, ch.dec) + "</b> to <b>" + fmtN(t.rangeTop, ch.dec) + "</b>");
    }
    if (lv < 2 && t.trendline) {
      out.push("the trendline runs from <b>" + fmtN(t.trendline.a.p, ch.dec) + "</b> through <b>" +
        fmtN(t.trendline.b.p, ch.dec) + "</b>, and bar " + t.trendline.thru + " is the one that cleared it");
    }
    if (!out.length) return;
    g.lines = (g.lines || []).concat(
      "The chart no longer marks these for you at this stage — finding them is the skill being tested. " +
      "For the record: " + out.join(" · ") + ".");
    g._faded = true;
  }

  function finishRep(g) {
    S.graded = g;
    S.scores[S.idx] = g.score;
    PROG.repDone(S.prep.kind, g.score);
    paintHeader();
    if (g.r !== undefined) S.rs.push(g.r);
    chD.locked = true;
    chD.setTool("cursor");                 /* free to pan/zoom and look around now */
    if (g.reveal && S.prep.ch) {
      /* Getting it wrong buys back the full overlay, at any tier — you only
         lose scaffolding while you are getting things right. */
      /* Getting it wrong buys back the full overlay, at any tier. CLEAN_MARK is
         reused deliberately rather than a new constant: it is already the app's
         definition of a clean answer, so a rep that counts toward your streak is
         a rep you did not need the training wheels for. */
      var lv = (g.score < CLEAN_MARK) ? 3 : scaffoldLevel(S.node, { placement: S.placement });
      chD.gtLevel = lv;
      chD.gtKeep = GT_KEEP[S.prep.kind] || null;
      chD.gt = S.prep.ch.gt;
      chD.gtMeasure = (S.prep.kind === "measure" || S.prep.kind === "target");
      /* The bracket only conflicts with the A/B/C measure overlay. It is NOT
         faded by tier: it is already drawn during the unanswered question, so
         removing it on reveal would make the answer show less than the question
         did. It says which bar you decided on, not what the setup was. */
      if (chD.gtMeasure) chD.sigBar = null;
      fadeNote(g, S.prep.ch, lv);
      var posD = chD.find("pos"), fromI = posD ? posD.i : S.prep.ch.gt.sigIdx;
      chD.revealTo(S.prep.ch.bars.length - 1, 26, function () { chD.fitRange(fromI, chD.bars.length - 1); });
    }
    paintDrillPanel();
    if (PREF.autoRead) Speech.speak(feedbackSpeech(g), function () {
      var b = $("fbRead"); if (b) b.innerHTML = "&#128266; Read";
    });
  }
  function nextRep() {
    Speech.stop();
    S.idx++;
    /* a funded run ends the moment a limit is breached or the target is hit —
       it is a sequence against one balance, not a fixed number of reps */
    if (S.runOver) return finishNode();
    if (S.idx >= S.n) {
      if (S.account && !S.account.result) { S.account.result = "budget"; S.runOver = "budget"; PROG.save(); }
      return finishNode();
    }
    loadRep();
  }
  /** Replay a recorded R sequence against a different risk level. Because P&L
      is r x risk$, the whole equity path is recoverable from the R sequence —
      so we can show what the learner's OWN trades would have done sized
      differently. That is the difference between being told a number and
      seeing it. */
  function replayAtRisk(rs, riskPct) {
    var acc = newFundAccount(riskPct);
    for (var i = 0; i < rs.length; i++) {
      var ev = fundApply(acc, rs[i]);
      if (ev.over) return { out: ev.over, at: i + 1, gainPct: ev.gainPct };
    }
    return { out: "budget", at: rs.length, gainPct: 100 * (acc.bal - acc.start) / acc.start };
  }

  /** Pass / blow-up odds at a given risk, using the learner's OWN realised win
      rate and average R rather than an assumed edge. */
  function fundOdds(p, R, riskPct, n) {
    var pass = 0, blow = 0, slow = 0;
    n = n || 3000;
    for (var i = 0; i < n; i++) {
      var acc = newFundAccount(riskPct), done = null;
      for (var t = 0; t < FUND.budget && !done; t++) {
        var ev = fundApply(acc, Math.random() < p ? R : -1);
        if (ev.over) done = ev.over;
      }
      if (done === "PASS") pass++;
      else if (done === "drawdown" || done === "session") blow++;
      else slow++;                        /* never got there — the cost of under-risking */
    }
    return { pass: pass / n, blow: blow / n, slow: slow / n };
  }

  function fundDebrief() {
    var a = S.account, rs = a.log.map(function (x) { return x.r; });
    var wins = rs.filter(function (r) { return r > 0; });
    var losses = rs.filter(function (r) { return r <= 0; });
    var wr = rs.length ? wins.length / rs.length : 0;
    var avgWin = wins.length ? wins.reduce(function (x, y) { return x + y; }, 0) / wins.length : 0;
    var verdict = { PASS: "Funded", drawdown: "Blown — max drawdown", session: "Blown — session loss limit", budget: "Ran out of trades" }[a.result] || "Incomplete";
    var out = [];
    out.push('<h2>' + verdict + '</h2>');
    out.push('<p>Finished at <b>$' + Math.round(a.bal).toLocaleString() + '</b> from $' + a.start.toLocaleString() +
      ' — ' + (a.bal >= a.start ? "+" : "") + (100 * (a.bal - a.start) / a.start).toFixed(2) + '% over <b>' +
      rs.length + '</b> trades at <b>' + a.riskPct + '%</b> risk.</p>');
    if (!rs.length) return out.join("");

    out.push('<p>Your reads: <b>' + Math.round(100 * wr) + '%</b> win rate, average winner <b>' +
      avgWin.toFixed(2) + 'R</b>' + (losses.length ? '' : '') + '.</p>');

    /* the same trades, sized differently */
    var alts = [0.5, 1, 2, 3, 5].filter(function (x) { return Math.abs(x - a.riskPct) > 0.01; });
    var rows = alts.map(function (f) {
      var res = replayAtRisk(rs, f);
      var label = { PASS: "would have passed", drawdown: "would have blown the drawdown", session: "would have hit the session limit", budget: "would have finished at " + (res.gainPct >= 0 ? "+" : "") + res.gainPct.toFixed(2) + "%" }[res.out];
      return "<li>at <b>" + f + "%</b> — " + label + (res.out === "drawdown" || res.out === "session" ? " on trade " + res.at : "") + "</li>";
    });
    out.push('<div class="seclabel" style="margin-top:12px">The same ' + rs.length + ' trades, sized differently</div><ul style="margin:0 0 0 18px;padding:0;font-size:12.5px;line-height:1.7">' + rows.join("") + '</ul>');
    out.push('<p class="hint">Identical reads, identical order. Only the size changed. That is the whole point: the trades were not what decided this.</p>');

    /* odds from the learner's own numbers */
    if (rs.length >= 8 && avgWin > 0) {
      var odds = [0.5, 1, 2, 3, 5].map(function (f) { return { f: f, o: fundOdds(wr, avgWin, f) }; });
      var best = odds.slice().sort(function (x, y) { return y.o.pass - x.o.pass; })[0];
      out.push('<div class="seclabel" style="margin-top:12px">On your own numbers (' + Math.round(100 * wr) + '% at ' + avgWin.toFixed(2) + 'R)</div>');
      out.push('<table class="tbl"><tr><th>Risk</th><th>Pass</th><th>Blow up</th><th>Never got there</th></tr>' +
        odds.map(function (x) {
          return '<tr' + (Math.abs(x.f - a.riskPct) < 0.01 ? ' class="on"' : '') + '><td>' + x.f + '%</td><td>' +
            Math.round(100 * x.o.pass) + '%</td><td class="dn">' + Math.round(100 * x.o.blow) +
            '%</td><td>' + Math.round(100 * x.o.slow) + '%</td></tr>';
        }).join("") + '</table>');
      out.push('<p>Your best odds were at <b>' + best.f + '%</b>. There are two ways to fail and they pull in ' +
        'opposite directions: size up and the drawdown gets you, size down and you never reach the target in the ' +
        'trades you have. The highest risk is never the best — past a point you are buying variance, not return, ' +
        'and the drawdown limit does not care why you hit it.</p>');
      if (a.result === "budget") {
        var slowOdds = fundOdds(wr, avgWin, a.riskPct).slow;
        if (slowOdds >= 0.05) {
          out.push('<p>You failed the slow way, which is the one nobody warns you about. At <b>' + a.riskPct +
            '%</b> your odds of simply running out of trades were <b>' + Math.round(100 * slowOdds) +
            '%</b>. Under-risking is not free — it is a real way to fail an evaluation with a perfectly good edge.</p>');
        } else {
          out.push('<p>You ran out of trades, but at <b>' + a.riskPct + '%</b> that should almost never happen ' +
            'on these numbers — the modelled odds are about <b>' + Math.round(100 * slowOdds) + '%</b>. ' +
            'So the budget was not the constraint: you traded <b>' + rs.length + '</b> of ' + FUND.budget +
            ' and the rest went on setups you passed on, or on a sequence that ran cold. Selectivity has a price ' +
            'too, and this is what it looks like.</p>');
        }
      }
      if (wr * (1 + avgWin) - 1 <= 0.05) {
        out.push('<p>Also worth facing: at ' + Math.round(100 * wr) + '% and ' + avgWin.toFixed(2) +
          'R your edge was thin, and <b>no risk setting fixes that</b>. Sizing decides how fast a good edge compounds and how fast a bad one kills you. It cannot create one.</p>');
      }
    }
    return out.join("");
  }

  function finishNode() {
    if (S.account) {
      var passed = S.account.result === "PASS";
      PROG.nodeDone(S.node, passed ? 1 : 0, passed ? (S.node.streak || 0) : 0);
      modal(fundDebrief() +
        '<button class="btn primary" id="okBtn" style="margin-top:6px">Back to path</button> ' +
        '<button class="btn ghost" id="againBtn">New run</button>');
      PROG.st.account = null; PROG.save();
      $("okBtn").onclick = function () { closeModal(); setView("path"); };
      $("againBtn").onclick = function () { closeModal(); startNode(S.node); };
      return;
    }
    var avg = S.scores.reduce(function (a, b) { return a + b; }, 0) / S.scores.length;
    if (S.placement) {
      /* shifted by one now that tier 0 sits in front, and capped so placement
         can never hand out the last two tiers */
      var rank = avg < 0.3 ? 0 : avg < 0.42 ? 1 : avg < 0.52 ? 2 : avg < 0.6 ? 3 : avg < 0.68 ? 4 :
        avg < 0.75 ? 5 : avg < 0.82 ? 6 : avg < 0.9 ? 7 : 8;
      if (rank > 0) rank = Math.min(rank + 1, TIERS.length - 2);
      PROG.place(rank);
      modal('<h2>Placed: ' + RANKS[rank].n + '</h2>' +
        '<p>You scored <b>' + Math.round(avg * 100) + '%</b> across the mixed set.</p>' +
        '<p>Tiers up to <b>' + TIERS[rank].name + '</b> are unlocked, and the scores there are provisional until you actually run the drills.</p>' +
        '<p><b>You still start at ' + TIERS[0].name + '.</b> Placement does not skip it, whatever you scored. ' +
        'Those are the setups you would be putting real money on first, and Brooks’ advice to a new trader is to trade only those until they are automatic — so they get earned rather than inferred from a mixed test that only sampled them in passing.</p>' +
        '<button class="btn primary" id="okBtn">Show my path</button>');
      $("okBtn").onclick = function () { closeModal(); setView("path"); };
      return;
    }
    /* longest run of clean answers in THIS session */
    var streak = 0, run = 0;
    for (var si = 0; si < S.scores.length; si++) {
      if (S.scores[si] >= CLEAN_MARK) { run++; if (run > streak) streak = run; }
      else run = 0;
    }
    var needStreak = S.node.streak || 0;
    var mark = S.node.pass || PASS_MARK;
    var pass = avg >= mark && streak >= needStreak;
    PROG.nodeDone(S.node, avg, streak);
    var rTxt = "";
    if (S.rs.length) {
      var tot = S.rs.reduce(function (a, b) { return a + b; }, 0);
      rTxt = '<p>Net result across the session: <b class="' + (tot >= 0 ? "up" : "dn") + '">' +
        (tot >= 0 ? "+" : "") + tot.toFixed(2) + "R</b> over " + S.rs.length + " trades. " +
        "Process score is what counts here — the R is the market's opinion, not a grade.</p>";
    }
    modal('<h2>' + esc(S.node.title) + '</h2>' +
      '<p>Score <b>' + Math.round(avg * 100) + '%</b> · ' +
      (pass
        ? '<span class="up">passed</span>'
        : '<span class="dn">' + (avg < mark
            ? "below the " + Math.round(mark * 100) + "% pass mark"
            : "cleared " + Math.round(mark * 100) + "% but not the streak") + '</span>') + '</p>' +
      (needStreak
        ? '<p>Longest clean run this session: <b>' + streak + '</b> of the <b>' + needStreak +
          '</b> in a row required. A node is only passed when one session clears both the mark and the streak — ' +
          'an average can hide a skill you only half have.</p>'
        : '') + rTxt +
      (pass ? "" : "<p>Retake it — repetition on the same skill is the whole point. Both conditions have to be met in the same session.</p>") +
      '<button class="btn primary" id="okBtn">' + (pass ? "Continue" : "Back to path") + '</button> ' +
      '<button class="btn ghost" id="againBtn">Run it again</button>');
    $("okBtn").onclick = function () { closeModal(); setView("path"); };
    $("againBtn").onclick = function () { closeModal(); startNode(S.node); };
  }

  /* ---------------- placement ---------------- */
  function startPlacement() {
    startNode({ id: "placement", kind: "mixed", n: 10, title: "Placement test", pass: 1.1 }, { placement: true });
  }

  /* =====================================================================
     TRADE SIMULATION (shared by replay drills and practice)
     ===================================================================== */
  /* =====================================================================
     the trade engine

     A position is multi-leg: you can scale in, take part off, move the stop to
     the AVERAGE entry, trail it, and hold a runner with no target. Everything
     is measured against the risk you originally planned:

         R = total P&L / (initial per-unit risk x the first leg's size)

     which is what a prop trader means by R, and which survives partials and
     scaling without changing meaning.

     Backward compatibility is by construction: with no actions taken there is
     one leg of size 1 and one exit, so `r` reduces exactly to the old
     (px - fill) * dir / risk. KIND.replay and the funded account cannot notice.

     Scaling in deliberately shows its cost. A second leg at the same stop makes
     the open risk larger than 1R, and `maxOpenR` records how far it got — so
     "plan the total before the first entry" stops being advice and becomes a
     number you watched happen. */
  function newPos(plan) {
    return {
      dir: plan.dir, legs: [], exits: [], stop: plan.stop,
      target: plan.target === undefined ? null : plan.target,
      trail: 0, pending: null, avg: 0, open: 0, realised: 0
    };
  }
  function posAvg(p) {
    var n = 0, s = 0;
    p.legs.forEach(function (L) { n += L.size; s += L.px * L.size; });
    return n > 0 ? s / n : 0;
  }
  function posOpen(p) {
    var n = 0;
    p.legs.forEach(function (L) { n += L.size; });
    p.exits.forEach(function (X) { n -= X.size; });
    return Math.max(0, n);
  }
  /** close `size` units at `px`, banking the P&L against the average entry */
  function posExit(p, px, size, why, at) {
    var open = posOpen(p);
    size = Math.min(size, open);
    if (size <= 0) return 0;
    var pl = (px - posAvg(p)) * p.dir * size;
    p.exits.push({ px: px, size: size, why: why, at: at });
    p.realised += pl;
    return pl;
  }

  function simulate(ch, plan, fromIdx, onBar, done, opts) {
    var bars = ch.bars, i = fromIdx, waited = 0;
    var d = plan.dir, risk = Math.abs(plan.entry - plan.stop);
    var unit = risk || 1e-9;                 /* one R, per unit of size */
    var pos = newPos(plan);
    var maxOpenR = 0, addPx = null, ended = false, acts = [];

    function openRiskR() {                   /* what is at stake right now, in R */
      var open = posOpen(pos); if (!open) return 0;
      return open * Math.abs(posAvg(pos) - pos.stop) / unit;
    }
    /* open profit right now, in R — what "the trade has moved 1R in your
       favour" actually means, and the number the management drills grade
       timing against */
    function unrealR() {
      if (!pos.legs.length || posOpen(pos) <= 0) return 0;
      return (bars[Math.min(i, bars.length - 1)].c - posAvg(pos)) * d / unit;
    }
    function logAct(what) {
      acts.push({ at: i, bar: i - fromIdx, what: what, unrealR: unrealR(), openR: openRiskR() });
    }
    function finish(why, at) {
      if (!pos.legs.length) return { r: 0, exit: "no fill", bars: waited, filledAt: -1 };
      return {
        r: pos.realised / unit, exit: why,
        bars: at ? at - fromIdx : 0, filledAt: at || i,
        legs: pos.legs.slice(), exits: pos.exits.slice(),
        avg: posAvg(pos), maxOpenR: maxOpenR, managed: pos.legs.length > 1 || pos.exits.length > 1,
        actions: acts.slice()
      };
    }
    function stopOut(px, at) {
      posExit(pos, px, posOpen(pos), "stopped", at);
      ended = true; clearInterval(timer); onBar(at); return done(finish("stopped", at));
    }

    function tick() {
      i++;
      if (i >= bars.length) {
        ended = true; clearInterval(timer);
        if (posOpen(pos) > 0) posExit(pos, bars[bars.length - 1].c, posOpen(pos), "data end", i);
        return done(finish(pos.legs.length ? "data end" : "no fill", i));
      }
      var b = bars[i];

      if (!pos.legs.length) {
        if (b.l <= plan.entry && plan.entry <= b.h) { pos.legs.push({ px: plan.entry, size: 1, at: i }); }
        else if (++waited > 14) { ended = true; clearInterval(timer); onBar(i); return done({ r: 0, exit: "no fill", bars: waited, filledAt: -1 }); }
      } else {
        /* a queued scale-in fills when price trades through it */
        if (addPx !== null && b.l <= addPx && addPx <= b.h) {
          pos.legs.push({ px: addPx, size: 1, at: i }); addPx = null;
        }
        /* trail before testing the stop, so it can only ever help, never
           reach back and stop you on a bar it was not on */
        if (pos.trail > 0 && posOpen(pos) > 0) {
          var lo = Infinity, hi = -Infinity;
          for (var q = Math.max(0, i - pos.trail); q <= i - 1; q++) { lo = Math.min(lo, bars[q].l); hi = Math.max(hi, bars[q].h); }
          if (d > 0 && isFinite(lo)) pos.stop = Math.max(pos.stop, lo - ch.atr * 0.05);
          else if (d < 0 && isFinite(hi)) pos.stop = Math.min(pos.stop, hi + ch.atr * 0.05);
        }
        var openR = openRiskR(); if (openR > maxOpenR) maxOpenR = openR;
        var hitS = d > 0 ? b.l <= pos.stop : b.h >= pos.stop;
        var hitT = pos.target !== null && (d > 0 ? b.h >= pos.target : b.l <= pos.target);
        if (hitS) return stopOut(pos.stop, i);
        if (hitT) {
          posExit(pos, pos.target, posOpen(pos), "target", i);
          ended = true; clearInterval(timer); onBar(i); return done(finish("target", i));
        }
      }
      onBar(i);
    }
    /* Live runs are interval-driven; a dry run drives the same tick() in a
       loop so counterfactuals ("what would holding have given?") come from the
       identical code path and cannot drift from what the learner just did. */
    var timer = (opts && opts.sync) ? null : setInterval(tick, 95);

    /* the live control surface — every action is a market order at this bar's
       close, which is the honest approximation while the tape is running */
    var ctrl = {
      abort: function () { clearInterval(timer); },
      state: function () {
        return { legs: pos.legs.length, open: posOpen(pos), avg: posAvg(pos), stop: pos.stop,
                 target: pos.target, trail: pos.trail, realisedR: pos.realised / unit,
                 openR: openRiskR(), unrealR: unrealR(), armedAdd: addPx !== null,
                 filled: !!pos.legs.length };
      },
      partial: function (frac) {
        if (ended || !pos.legs.length) return;
        logAct("partial");
        posExit(pos, bars[i].c, posOpen(pos) * frac, "partial", i);
        if (posOpen(pos) <= 1e-9) { ended = true; clearInterval(timer); done(finish("closed", i)); }
      },
      breakeven: function () { if (!ended && pos.legs.length) { logAct("breakeven"); pos.stop = posAvg(pos); } },
      setTrail: function (n) { if (!ended) { logAct("trail"); pos.trail = n; } },
      dropTarget: function () { if (!ended) { logAct("dropTarget"); pos.target = null; } },
      addLeg: function () {                  /* arm a scale-in a little beyond price */
        if (ended || !pos.legs.length) return;
        logAct("scaleIn");
        addPx = bars[i].c - d * ch.atr * 0.75;
      },
      closeAll: function () {
        if (ended || !pos.legs.length) return;
        logAct("closeAll");
        posExit(pos, bars[i].c, posOpen(pos), "closed", i);
        ended = true; clearInterval(timer); done(finish("closed", i));
      }
    };
    /* the dry-run driver has to come after ctrl exists, so a script can act */
    if (opts && opts.sync) {
      var guard = 0;
      while (!ended && guard++ < 4000) { tick(); if (!ended && opts.script) opts.script(ctrl, i - fromIdx); }
    }
    return ctrl;
  }

  /** Replay a plan against the same engine with a scripted management, and
      return the result. Used for the counterfactuals in the feedback — the
      same trade, managed differently. */
  function dryRun(ch, plan, from, script) {
    var out = null;
    simulate(ch, plan, from, function () {}, function (r) { out = r; }, { sync: true, script: script });
    return out;
  }

  function execute() {
    var p = chD.find("pos");
    if (!p) { toast("Place the position on the chart first"); return; }
    if (Math.abs(p.entry - p.stop) < 1e-9) { toast("Stop and entry are the same price"); return; }
    var ch = S.prep.ch;
    S.replayRun = true; S.replayMsg = "Waiting for fill…"; S.liveShown = false; chD.locked = true;
    paintDrillPanel();
    var plan = { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target };
    /* Size is the OUTPUT of the stop, exactly as KIND.size teaches: a wider
       stop mechanically buys fewer units, at the same money risk. */
    if (S.account) {
      var risk$ = S.account.bal * S.account.riskPct / 100;
      plan.riskPct = S.account.riskPct;
      plan.units = risk$ / Math.abs(p.entry - p.stop);
      plan.risk$ = risk$;
    }
    S.sim = simulate(ch, plan, chD.vis,
      function (i) {
        chD.vis = i;
        if (i > chD.i1 - 3) { chD.i0 += 1; chD.i1 += 1; }
        chD.render();
        S.replayMsg = "Bar " + (i - ch.gt.decision) + " · " + ch.sym + " " + ch.bars[i].c.toFixed(ch.dec);
        /* the management controls only exist once there is a position to manage,
           so repaint on the fill and then update the numbers in place */
        var st = S.sim && S.sim.state ? S.sim.state() : null;
        var live = !!(st && st.filled && st.open > 0);
        if (live !== S.liveShown) { S.liveShown = live; paintDrillPanel(); }
        else updateLive();
      },
      function (res) {
        S.replayRun = false; S.abortSim = null; S.sim = null;
        plan.result = res;
        /* what the same plan would have returned untouched — so the feedback can
           say what your management actually cost or earned, on this tape */
        plan.holdR = dryRun(ch, { dir: plan.dir, entry: plan.entry, stop: plan.stop, target: plan.target },
                            ch.gt.decision, null).r;
        var rec = {
          t: Date.now(), sym: ch.sym, tf: ch.tf, pattern: ch.gt.name, dir: plan.dir,
          r: res.r, exit: res.exit, src: S.node.id, bars: res.bars
        };
        if (S.account) {
          var ev = fundApply(S.account, res.r);
          S.account.log.push({ r: res.r, pl: ev.pl, bal: S.account.bal, exit: res.exit });
          plan.acct = {
            bal: S.account.bal, riskPct: S.account.riskPct, tradeNo: S.account.tradeNo,
            pl: ev.pl, risk$: ev.risk$, ddPct: ev.ddPct, dayPct: ev.dayPct, gainPct: ev.gainPct,
            over: ev.over
          };
          rec.pl = ev.pl; rec.bal = S.account.bal; rec.units = plan.units;
          if (ev.over) { S.account.result = ev.over; S.runOver = ev.over; }
          PROG.st.account = S.account; PROG.save();
        }
        PROG.logTrade(rec);
        finishRep(S.prep.K.grade(S.prep, plan));
      });
    S.abortSim = S.sim.abort;
    paintDrillPanel();                     /* swap in the live management controls */
  }
  function passTrade() {
    chD.locked = true;
    finishRep(S.prep.K.grade(S.prep, { passed: true }));
  }

  /* =====================================================================
     PRACTICE
     ===================================================================== */
  var prac = { ch: null, playing: false, timer: null, live: null, eq: 25000, riskPct: 1 };

  function newPractice(opts) {
    opts = opts || {};
    var seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
    var key = opts.ctx || Mkt.KEYS[(Math.random() * Mkt.KEYS.length) | 0];
    prac.ch = Mkt.gen({ seed: seed, ctx: key });
    prac.live = null; prac.playing = false;
    if (prac.timer) { clearInterval(prac.timer); prac.timer = null; }
    if (prac.sim) { prac.sim.abort(); prac.sim = null; }
    var start = Math.max(30, prac.ch.gt.decision - (4 + ((Math.random() * 10) | 0)));
    chP.load(prac.ch, start);
    chP.sigBar = null;
    chP.locked = false;
    chP.posDir = 1;
    chP.onChange = paintPractice;
    buildPracToolbar();
    paintPractice();
  }
  function buildPracToolbar() {
    var wrap = $("pracTools");
    var html = '<div class="sym"><b>' + prac.ch.sym + '</b>' + prac.ch.tfLbl + '</div><div class="tsep"></div>';
    TOOLBTN.forEach(function (t) { html += toolBtn(t); });
    html += '<div class="tsep"></div>' +
      actBtn("undo", "↺", "Undo", "Undo the last drawing") +
      actBtn("clear", "✕", "Clear all", "Clear every drawing — to remove just one, click it and press its ✕") +
      actBtn("fit", "⤢", "Fit", "Fit the chart to the bars") +
      '<div class="tsep"></div>' +
      '<button class="tool wide" data-act="step">Step ▸</button>' +
      '<button class="tool wide" data-act="play" id="playBtn">Play ▶</button>' +
      '<button class="tool wide" data-act="new">New chart</button>';
    wrap.innerHTML = html;
    [].forEach.call(wrap.querySelectorAll("[data-tool]"), function (b) {
      b.onclick = function () { chP.setTool(b.dataset.tool); syncTools(wrap, chP); };
    });
    [].forEach.call(wrap.querySelectorAll("[data-act]"), function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (a === "undo") chP.undo();
        if (a === "clear") chP.clearAll();
        if (a === "fit") chP.fit();
        if (a === "step") stepPrac(1);
        if (a === "play") togglePlay();
        if (a === "new") newPractice();
        paintPractice();
      };
    });
    chP._syncWrap = wrap;
    syncTools(wrap, chP);
  }
  function stepPrac(n) {
    if (prac.live) return;
    chP.vis = Math.min(chP.bars.length - 1, chP.vis + n);
    if (chP.vis > chP.i1 - 3) { chP.i0 += n; chP.i1 += n; }
    chP.render();
  }
  function togglePlay() {
    if (prac.playing) { clearInterval(prac.timer); prac.timer = null; prac.playing = false; }
    else {
      prac.playing = true;
      prac.timer = setInterval(function () {
        if (chP.vis >= chP.bars.length - 1) { togglePlay(); paintPractice(); return; }
        stepPrac(1);
      }, 260);
    }
    var b = $("playBtn"); if (b) b.textContent = prac.playing ? "Pause ❚❚" : "Play ▶";
  }

  function paintPractice() {
    if (!prac.ch) return;
    if (chP._syncWrap) syncTools(chP._syncWrap, chP);
    var r = chP.readout(), ch = prac.ch, out = [];
    out.push('<div class="task">Practice · free chart</div>');
    out.push('<div class="brief">' + esc(ch.nm) + ' — ' + ch.tfLbl +
