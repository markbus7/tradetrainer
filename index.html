/* --- 17. entry placement ------------------------------------------
   Brooks' entry is mechanical, and it is the half of the trade the old
   curriculum never tested: with the trend you enter on a STOP one tick beyond
   the signal bar, because making price trade there is the confirmation. In a
   range you fade the edge with a LIMIT, because waiting for confirmation means
   paying the edge away. Getting this backwards is the single most common way a
   correct read turns into a losing trade. */
KIND.entry = {
  skill: "execution", skill2: "risk",
  prepare: function (sp, seed) {
    var ch = Mkt.gen({ seed: seed, ctx: pickPool(sp.pool || POOL.tradeable, seed) });
    var lim = ch.gt.entryType === "limit";
    return {
      ch: ch,
      q: "Place your <b>entry</b> for a " + (ch.gt.dir > 0 ? "long" : "short") +
         " here. Not roughly — exactly where the order goes.",
      ui: {
        mode: "chart", need: "hline",
        hint: lim
          ? "You are fading an edge, so you want to be filled as price reaches it — at the prior extreme, or a few ticks through it."
          : "You are trading with the move, so price must trade through your level to fill you."
      }
    };
  },
  grade: function (p, ans) {
    if (ans === null || ans === undefined) return { score: 0, verdict: "No entry placed", lines: [], reveal: true };
    var ch = p.ch, g = ch.gt, d = g.dir, a = ch.atr, sb = ch.bars[g.sigIdx];
    var trigger = d > 0 ? sb.h : sb.l;
    var beyond = d * (ans - trigger);          /* >0 = beyond the bar */
    var err = Math.abs(ans - g.entry);
    var tol = 0.30 * a;
    var s, verdict, note;

    if (g.entryType === "limit") {
      /* Brooks fades a range edge by placing the limit AT or JUST BEYOND the
         prior extreme — "buy limit orders below prior lows to get long" — so
         the probe through the low fills you and then fails. Past roughly an
         ATR beyond, you are no longer fading a probe, you are catching a real
         breakout and needing to scale in lower. */
      var edge = d > 0 ? g.rangeBot : g.rangeTop;
      var past = edge === undefined ? 0 : -d * (ans - edge);   /* >0 = beyond the edge */
      var intoRange = edge === undefined ? 0 : d * (ans - edge); /* >0 = inside the range */
      var beginnerNote = " Brooks tells beginners to enter on stops even here; fading an edge with limits is the experienced, aggressive version of this trade.";
      if (past >= -0.1 * a && past <= 0.85 * a) {
        s = 1; verdict = "Exact";
        note = "A limit at the edge, or a few ticks beyond it, so the probe through the " +
               (d > 0 ? "low" : "high") + " fills you and then fails. That is the fade." + beginnerNote;
      } else if (past > 0.85 * a) {
        s = 0.3; verdict = "Limit too far beyond the edge";
        note = "At " + fmtN(past / a, 1) + " ATR past the edge you are no longer fading a probe — that is a real breakout, and you would be catching it. Brooks' fade sits at the prior extreme or a few ticks through it, and he scales in lower rather than starting there.";
      } else if (intoRange <= 2 * tol) {
        s = 0.7; verdict = "Inside the edge";
        note = "The right idea, but you are already " + fmtN(intoRange / a, 1) + " ATR inside the range. At an edge, precision is most of the reward.";
      } else {
        s = clamp(band(intoRange, tol * 1.8) * 0.6, 0, 1); verdict = "Off the edge";
        note = "Fading a range means the edge itself is the trade. This far into the middle there is no edge left — and the middle of a range is where accounts go to die.";
      }
    } else if (beyond < -0.15 * a) {
      s = 0.1; verdict = "That is a limit order, not a stop";
      note = "You placed the entry <b>inside</b> the signal bar, so you get filled without price ever proving it can go your way. " +
             "With the trend, Brooks makes the market come and take him in: the order sits one tick " +
             (d > 0 ? "above" : "below") + " the signal bar's " + (d > 0 ? "high" : "low") +
             " at <b>" + fmtN(g.entry, ch.dec) + "</b>. If price never trades there, there was no trade — and that is the point.";
    } else if (beyond > 1.1 * a) {
      s = 0.25; verdict = "Chasing";
      note = "That is " + fmtN(beyond / a, 1) + " ATR beyond the signal bar. Every tick you pay above <b>" +
             fmtN(g.entry, ch.dec) + "</b> is added to your risk and taken off your reward — same read, worse equation.";
    } else if (err <= tol) {
      s = 1; verdict = "Exact";
      note = "One tick beyond the signal bar at <b>" + fmtN(g.entry, ch.dec) + "</b>. Price has to come and get you, which is the confirmation.";
    } else if (err <= 2 * tol) {
      s = 0.72; verdict = "Nearly";
      note = "Right side, right idea, slightly off <b>" + fmtN(g.entry, ch.dec) + "</b>.";
    } else {
      s = band(err, tol * 1.7) * 0.65; verdict = "Loose";
      note = "The entry belongs at <b>" + fmtN(g.entry, ch.dec) + "</b> — one tick beyond the signal bar, not a round number nearby.";
    }
    return {
      score: clamp(s, 0, 1), reveal: true, verdict: verdict,
      lines: [note, "<b>" + g.name + "</b>. " + entryHow(g, ch), signalBarWhy(ch)].filter(Boolean)
    };
  }
};

/* --- 18. bar counting (High 1/2/3/4, Low 1/2/3/4) ------------------
   The count is read off THIS tape by the same mechanical rule Brooks uses, so
   the answer is whatever the bars actually show — sometimes a High 1, sometimes
   a High 3. That is deliberate: a drill that always answered "High 2" would
   teach you to recognise a name instead of to count. */
KIND.barCount = {
  skill: "bars", skill2: "trend",
  right: function (p) { return String(p.ch.gt.barCount); },
  prepare: function (sp, seed) {
    /* Left alone, this tape produces a High 1 or High 2 nine times out of ten,
       and you could clear the drill by never once answering 3 or 4. So aim at a
       rotated target count and hunt for a tape that actually shows it, falling
       back to whatever valid count turns up. */
    var want = [1, 2, 2, 3, 3, 4][(seed >>> 3) % 6];
    var ch = null, n = 0, first = null, guard = 0;
    for (; guard < 90; guard++) {
      var c = Mkt.gen({ seed: (seed + guard * 7919) >>> 0, ctx: pickPool(sp.pool || POOL.pullback, (seed + guard * 131) >>> 0) });
      var cn = c.gt.barCount;
      if (cn < 1 || cn > 4) continue;
      if (first === null) { first = c; }
      if (cn === want) { ch = c; n = cn; break; }
    }
    if (!ch) { ch = first || Mkt.gen({ seed: seed, ctx: pickPool(POOL.pullback, seed) }); n = ch.gt.barCount; }
    var bull = ch.gt.dir > 0;
    return {
      ch: ch, meta: { n: n },
      q: "Count it the way Brooks counts it. Since the pullback began, how many times has a bar traded " +
         (bull ? "above the prior bar's <b>high</b>" : "below the prior bar's <b>low</b>") +
         " — where the next one only counts once a bar with a " +
         (bull ? "<b>lower high</b>" : "<b>higher low</b>") +
         " has printed in between? The last bar on the chart is the one you are naming.",
      ui: {
        mode: "mcq", options: [
          { k: "1", t: bull ? "High 1 — first attempt to resume the bull trend" : "Low 1 — first attempt to resume the bear trend" },
          { k: "2", t: bull ? "High 2 — the two-legged pullback buy" : "Low 2 — the two-legged pullback sell" },
          { k: "3", t: bull ? "High 3 — a wedge-shaped bull flag" : "Low 3 — a wedge-shaped bear flag" },
          { k: "4", t: bull ? "High 4 — the count has gone too far; this is becoming a trading range" : "Low 4 — the count has gone too far; this is becoming a trading range" }
        ]
      }
    };
  },
  grade: function (p, ans) {
    var ch = p.ch, g = ch.gt, n = p.meta.n, bull = g.dir > 0, ok = String(n) === ans;
    var H = bull ? "High" : "Low";
    var why = {
      1: "One attempt so far. In a strong trend the first one is often enough — Brooks " +
         (bull ? "buys the High 1" : "sells the Low 1") +
         " in a tight channel because there is never a deeper pullback to wait for.",
      2: "Two attempts. This is the setup Brooks calls the highest-probability entry in a trend: the first attempt trapped traders in early, it failed, and the second attempt traps the other side. Note it is the COUNT that made this a " + H + " 2, not how deep the second leg went.",
      3: "Three attempts. Three pushes is a wedge, and a wedge-shaped flag still works with the trend — but the trend is losing its grip, and a failure here often becomes the reversal.",
      4: "Four attempts. Once the count runs this far the pullback has stopped being a pullback: repeated failures to resume mean two-sided trading, and you should be reading this as a developing trading range, not a flag."
    }[n];
    /* The count says WHICH attempt this is, not how good it is. A deep or
       strongly countertrend pullback produces exactly the same number as a
       shallow one, and it is a materially worse trade — so say so. */
    var bars = ch.bars, from = g.pbFrom, to = g.sigIdx, against = 0, run = 0, worst = 0;
    for (var i = from + 1; i <= to && i < bars.length; i++) {
      var cnt = bull ? bars[i].c < bars[i].o : bars[i].c > bars[i].o;
      if (cnt) { run++; if (run > worst) worst = run; } else run = 0;
      if (cnt) against++;
    }
    var span = Math.max(1, to - from);
    var depth = Math.abs(bars[from][bull ? "h" : "l"] - bars[to][bull ? "l" : "h"]) / Math.max(1e-9, ch.atr);
    var quality;
    if (worst >= 4 || depth > 4) {
      quality = "But look at the <b>shape</b> of this pullback, not just the number: " +
        (worst >= 4 ? "there is a run of <b>" + worst + " consecutive " + (bull ? "bear" : "bull") + " bars</b> in it" : "it is <b>" + depth.toFixed(1) + " ATR deep</b>") +
        ". That is a strong correction, and a " + H + " " + n + " coming out of one is a much weaker " +
        (bull ? "buy" : "sell") + " than the same count out of a shallow, sideways flag. " +
        "Brooks: if the pullback is deep enough to break the prior " + (bull ? "higher low" : "lower high") +
        ", the trend itself is in question — check whether the always-in direction has flipped before you treat this as a " + (bull ? "bull" : "bear") + " flag at all.";
    } else if (against / span < 0.4 && depth < 2.2) {
      quality = "The pullback itself is shallow and sideways — " + against + " countertrend bars in " + span +
        ", about " + depth.toFixed(1) + " ATR. That is what makes a count worth trading: the trend never really gave anything back.";
    } else {
      quality = "Pullback shape: " + against + " countertrend bars in " + span + ", about " + depth.toFixed(1) +
        " ATR deep. Ordinary. The count tells you which attempt this is; the shape tells you how much it is worth.";
    }
    return {
      score: ok ? 1 : 0, reveal: true,
      verdict: ok ? "Correct — " + H + " " + n : "It is a " + H + " " + n,
      lines: [
        "<b>" + H + " " + n + "</b> on this tape. " + why,
        quality,
        "The count does <b>not</b> reset because the correction gets ugly — countertrend bars are what re-arm it. It resets when the trend RESUMES and makes a new " +
        (bull ? "high" : "low") + "; from there the next pullback starts again at " + H + " 1."
      ]
    };
  }
};

/* --- 19. trade management ------------------------------------------
   The equation is only realised if the trade is managed. Brooks: scalps come
   off at the scalp target, swings take partial profit and move to breakeven,
   and a market that goes two-sided has ended your swing whatever your stop
   says. */
KIND.manage = {
  skill: "execution", skill2: "discipline",
  prepare: function (sp, seed) {
    var R = Mkt.mkR((seed ^ 0x4d21) >>> 0);
    var ch = Mkt.gen({ seed: seed, ctx: pickPool(sp.pool || POOL.tradeable, seed) });
    var g = ch.gt, stalled = R.chance(0.4);
    var scalp = g.style === "scalp";
    var q = stalled
      ? "You are " + (g.dir > 0 ? "long" : "short") + " this <b>" + g.name + "</b> from " + fmtN(g.entry, ch.dec) +
        ". Price moved about 1R your way and has now spent eight bars going sideways in a tight overlapping cluster. Your stop has not been hit. What now?"
      : "You are " + (g.dir > 0 ? "long" : "short") + " this <b>" + g.name + "</b> from " + fmtN(g.entry, ch.dec) +
        ". Price has just reached your first target at " + fmtN(g.target, ch.dec) + ". What now?";
    return {
      ch: ch, meta: { stalled: stalled, scalp: scalp },
      q: q,
      ui: {
        mode: "mcq", options: [
          { k: "all", t: "Take the whole position off" },
          { k: "partial", t: "Take partial profit, move the stop to breakeven, hold the rest for the measured move" },
          { k: "hold", t: "Take nothing, hold it all for the measured move" },
          { k: "add", t: "Add to the position" }
        ]
      }
    };
  },
  grade: function (p, ans) {
    var ch = p.ch, g = ch.gt, stalled = p.meta.stalled, scalp = p.meta.scalp;
    var right = stalled ? "all" : (scalp ? "all" : "partial");
    var ok = ans === right;
    var why;
    if (stalled) {
      why = "A tight overlapping cluster is a trading range, and a trading range means the market has gone two-sided. " +
            "Whatever your reason for entering was, it has stopped being true — the swing is over. Brooks takes what the market has already given him rather than waiting for a stop that is now far away and a target the market is no longer heading for. " +
            "Holding here is how a winner becomes a scratch and then a loser.";
    } else if (scalp) {
      why = "This is a <b>scalp</b> context — " + g.name.toLowerCase() + ". You are being paid for being quick, not for being right for a long time. " +
            "Take the target. In a trading range the move beyond the first target usually does not come, and holding for it hands back the edge you just earned.";
    } else {
      why = "This is a <b>swing</b> context — " + g.name.toLowerCase() + ". Take partial profit so the trade cannot hurt you, move the stop to breakeven, and let the rest run to the measured move at " +
            fmtN(g.mmTarget, ch.dec) + ". " +
            "Brooks scalps part and swings part precisely because he cannot know in advance which trades become the big ones — this is how you stay in the few that do.";
    }
    var lines = [why];
    if (ans === "add") {
      /* Brooks does NOT ban adding — scaling in is his standard range technique:
         "bulls will scale into longs in the lower half of the range and scalp
         out with profits in the top half". What ruins accounts is adding to a
         loser you did not plan to add to, because the size grows exactly as the
         read gets worse. The two are not the same thing and the app must not
         blur them. */
      lines.push("Careful — there are two different things here, and only one of them ruins accounts. " +
        "<b>Adding unplanned, to a position going against you, because you cannot accept being wrong</b> is how accounts die: " +
        "the size grows precisely as the read gets worse.");
      lines.push("<b>Scaling in is not that.</b> It is a planned technique and Brooks uses it constantly — in a trading range, " +
        "bulls scale into longs in the lower half and scale out in the upper half. The difference is that the total risk was " +
        "decided <i>before</i> the first entry, the first entry was sized smaller to leave room, and each add comes on a " +
        "signal rather than on hope. Most traders should add once or twice, not five times. You will drill this properly later.");
      lines.push("But it is not the answer <i>here</i>: this question is about a position that is already working, and adding to a winner is a different decision again from either of those.");
    }
    if (ans === "hold" && !stalled && scalp) lines.push("Holding a scalp for a swing target is trading a different setup from the one the chart actually offered.");
    lines.push(outcomeLine(ch));
    return {
      score: ok ? 1 : (ans === "partial" && right === "all" ? 0.4 : ans === "all" && right === "partial" ? 0.5 : 0),
      reveal: true,
      verdict: ok ? "Correct" : "Not what this one asks for",
      lines: lines.filter(Boolean)
    };
  }
};

/* --- 20. failed breakout or major trend reversal? ------------------
   These two are the pair beginners confuse, and naming them is not the skill —
   the skill is knowing WHY. So the options are reasons, not names: what came
   before, and whether a trendline had to break first. */
KIND.reversalType = {
  skill: "traps", skill2: "reversal",
  right: function (p) { return p.ch.gt.family === "reversal" ? "mtr" : "fbo"; },
  prepare: function (sp, seed) {
    var ch = Mkt.gen({ seed: seed, ctx: pickPool(sp.pool || POOL.confusable, seed) });
    return {
      ch: ch,
      q: "Price has turned. Which of these is it, and — more to the point — <b>why</b>?",
      ui: {
        mode: "mcq", options: [
          { k: "fbo", t: "Failed breakout — the market was already in a trading range, so there was no trend to reverse. A probe poked through an edge, found nobody, and snapped back in." },
          { k: "mtr", t: "Major trend reversal — there was a real trend. A countertrend move broke the trendline, and then a test of the old extreme held." },
          { k: "nostructure", t: "Neither — there is no structure here worth naming yet." }
        ]
      }
    };
  },
  grade: function (p, ans) {
    var ch = p.ch, g = ch.gt, isMTR = g.family === "reversal", right = isMTR ? "mtr" : "fbo";
    var ok = ans === right;
    return {
      score: ok ? 1 : 0, reveal: true,
      verdict: ok ? "Correct" : "It is a " + (isMTR ? "major trend reversal" : "failed breakout"),
      lines: [
        "<b>" + g.name + "</b>. " + g.brooks,
        isMTR
          ? "The tell is <b>what came before</b>: there was a trend here — a real sequence of lower highs and lower lows — so a reversal read only counts once a countertrend move has broken the trendline. Brooks: never even think about trading against a trend until a significant trendline has broken. Then the test of the old extreme has to hold."
          : "The tell is <b>what came before</b>: this was a trading range, already two-sided, with no trend to reverse. That is why the failed probe is tradeable straight away — there is no trendline to wait for, and about eight out of ten of these breakout attempts fail.",
        "Do not try to separate them by how the reversal LOOKS. An MTR whose test of the old low comes as a <b>lower</b> low that reverses is itself a failed breakout — of the trend's low rather than a range edge. Same mechanic; the context is what differs, and the context decides whether you scalp it or swing it.",
        isMTR
          ? "So: swing it, and measure the first leg up off the low."
          : "So: scalp it, and target the other side of the range."
      ]
    };
  }
};

/* --- 21. first entry or second entry? ------------------------------
   Brooks: in a trading range the first attempt to turn the market usually
   fails, so you wait for the second entry. In a strong trend you do not get a
   second chance — the first pullback is the trade. Signal-bar quality is not
   the deciding factor, which is the point: bad-looking entry bars in a range
   are normal, and counting attempts is what replaces waiting for a pretty bar. */
KIND.secondEntry = {
  skill: "traps", skill2: "execution",
  right: function (p) { return p.ch.gt.attempt; },
  prepare: function (sp, seed) {
    var ch = Mkt.gen({ seed: seed, ctx: pickPool(sp.pool || POOL.tradeable, seed) });
    var d = ch.gt.dir > 0 ? "up" : "down";
    /* The question used to say the market was "about to make its first
       attempt", which was a claim about a bar that is not on the chart — on a
       long correction the first attempt is often ten or more bars behind the
       decision bar. What the drill actually grades is the rule for THIS
       context, so that is what it asks. */
    return {
      ch: ch,
      q: "When this market turns " + d + " out of a pullback, is the <b>first attempt</b> " +
         "the one to take — or does the first attempt usually fail here, so you wait for the <b>second</b>?",
      ui: {
        mode: "mcq", options: [
          { k: "first", t: "Take the first entry — in this context you will not get a better one" },
          { k: "second", t: "Wait for the second entry — the first attempt here usually fails" },
          { k: "quality", t: "Decide on the signal bar: take it only if the bar itself is strong" },
          { k: "none", t: "Neither — there is no trade in this context" }
        ]
      }
    };
  },
  grade: function (p, ans) {
    var ch = p.ch, g = ch.gt, takeFirst = g.attempt === "first";
    var right = g.attempt, ok = ans === right;
    var lines = ["<b>" + g.name + "</b>. " + g.brooks];
    /* what the attempt is actually attempting depends on where you are: inside
       a pullback it is trying to resume the trend, not to reverse anything */
    var whatFails = (g.family === "range" || g.family === "nothing") ? "to turn a trading range"
      : g.family === "trend" ? "to resume the trend"
        : "to reverse a move like this";
    /* keyed off the context's own declared rule, so this paragraph can never
       argue with the one printed directly above it */
    lines.push(takeFirst
      ? "This market is <b>one-sided</b>. The pullbacks are shallow and they do not come back — Brooks buys the first one, because waiting for a second entry here usually means watching the move leave without you."
      : "This market is <b>two-sided</b>. The first attempt " + whatFails + " usually fails, and that failure is what traps the traders who took it — which is exactly what fuels the second attempt. The <b>second entry</b> is Brooks' standard trigger here.");
    /* "second entry" and "second leg" get confused constantly, and in this one
       setup they land on the same bar — which is worth saying rather than
       leaving the learner to wonder whether they mean the same thing. */
    if (g.key.indexOf("twoLegPullback") === 0) {   /* the one setup where both senses land on the same bar */
      lines.push("Worth being precise here, because two things called \u201csecond\u201d meet on the same bar. A <b>second entry</b> is the second <i>bar count</i> attempt — the <b>High 2</b>. A <b>second leg</b> is the second <i>leg</i> of the correction. They are different lenses and they usually disagree; in a two-legged pullback they agree, because the H2 that triggers you is the one that comes off the second leg. That is exactly why Brooks calls this the cleanest second-entry setup there is.");
    }
    if (ans === "quality") {
      lines.push("Judging it on the signal bar is the trap. <b>Bad entry bars are normal wherever the market is two-sided</b> — if you hold out for a clean one you will take almost nothing. Counting attempts is what replaces waiting for a pretty bar.");
    }
    if (g.firstEntry && g.secondEntry) {
      var tg = g.dir > 0 ? "H" : "L";
      var at = (g.countIdx || []).indexOf(g.sigIdx);
      lines.push("Both attempts are marked on the chart: the first at <b>" +
        fmtN(g.dir > 0 ? g.firstEntry.h : g.firstEntry.l, ch.dec) + "</b> and the second at <b>" +
        fmtN(g.dir > 0 ? g.secondEntry.h : g.secondEntry.l, ch.dec) +
        "</b>, each with the trigger it would have given you and no stop or target, because they are not the trade — they are what the trade is being measured against." +
        (at >= 0
          ? " The bar you are actually entering on is bracketed, and it is the <b>" + tg + (at + 1) + "</b>."
          : " The bar you are actually entering on is bracketed."));
      if (at > 1) {
        lines.push("So read this carefully, because the two numbers disagree and both are right. The <b>rule</b> is about the first two attempts: the first one fails, traps the traders who took it, and that is what fuels the next. The <b>count</b> is what the bars in front of you actually did — and this correction ground on for " +
          (g.sigIdx - g.pbFrom) + " bars, so by the time it triggered it read <b>" + tg + (at + 1) + "</b>. " +
          "Brooks' own point is that the higher the count runs, the weaker the trend's grip. Reading the count off the name of the pattern instead of off the bars is the mistake; a long correction is routinely an " + tg + "3 or " + tg + "4 by the time it goes.");
      }
    } else if (g.firstEntry) {
      /* the silence is the evidence: no second attempt ever came */
      lines.push("On this tape there was <b>no second attempt</b> — the correction gave one attempt at <b>" +
        fmtN(g.dir > 0 ? g.firstEntry.h : g.firstEntry.l, ch.dec) + "</b> and the market went. " +
        (takeFirst
          ? "That is the whole argument for taking the first one here: waiting would have meant no trade at all."
          : "It happens, and it is the cost of the rule — you will miss some. The first attempt failing often enough to pay for those misses is what makes waiting correct on average."));
    }
    lines.push(signalBarWhy(ch));
    lines.push(probLine(ch));
    return {
      score: ok ? 1 : (ans === "quality" ? 0.2 : 0), reveal: true,
      verdict: ok ? "Correct" : (takeFirst ? "Take the first one here" : "Wait for the second"),
      lines: lines
    };
  }
};

/* --- 22. managing a live trade -------------------------------------
   The first drill that grades what you PRESSED rather than what you named.
   Three Brooks rules decide it:

     · breakeven only after the trade has proven itself — about 1R, structure
       intact. "A good trade should never reverse the entry bar", but moving the
       stop up on bar one in chop just donates the trade back.
     · trail in a TREND, behind the most recent higher low, and you may hold a
       runner with no target at all.
     · in a RANGE take the fixed target. Trailing inside two-sided trading gets
       you shaken out of a trade that was going to reach its objective.

   Scaling in is graded on planned size, not on whether you did it: pushing the
   open risk past the 1R you planned is the error, adding itself is not. */
KIND.manageLive = {
  skill: "execution", skill2: "risk",
  prepare: function (sp, seed) {
    var ch = Mkt.gen({ seed: seed, ctx: pickPool(sp.pool || POOL.tradeable, seed) });
    return {
      ch: ch,
      q: "Take the trade and then <b>manage it</b>. The controls appear once you are filled — half off, stop to the average, trail, scale in, drop the target, or close.",
      ui: {
        mode: "replay", manage: true,
        hint: "Breakeven is worth having, but only once the trade has proven itself. Trend or range decides whether you trail or take a fixed target."
      },
      meta: { minRR: sp.minRR || 1.5 }
    };
  },
  grade: function (p, ans) {
    var base = KIND.replay.grade(p, ans);
    if (!ans || ans.passed || !ans.result) return base;
    var g = p.ch.gt, res = ans.result, acts = res.actions || [];
    /* declared by the context, not inferred: a broad channel is family "trend"
       but its own text says take profit at the top rather than hold. */
    var isTrend = g.exit === "trail";
    var find = function (w) { var o = null; acts.forEach(function (a) { if (a.what === w && !o) o = a; }); return o; };
    var be = find("breakeven"), tr = find("trail"), dt = find("dropTarget"), si = find("scaleIn"), ca = find("closeAll");
    var m = 0.7, notes = [];

    if (!acts.length) {
      m = isTrend ? 0.55 : 1;
      notes.push(isTrend
        ? "You held it to the target untouched. Nothing wrong with the trade — but this was a <b>trend</b>, and a trend is where the runner lives. Trailing behind the higher lows, or dropping the target altogether, is what turns the occasional big one into the trade that pays for the month."
        : "Held to the fixed target and left it alone. In a <b>range</b> that is exactly right — the market was heading for its objective and trailing would only have shaken you out early.");
    } else {
      if (be) {
        if (be.unrealR < 0.9) {
          m = Math.min(m, 0.35);
          notes.push("You moved the stop to the average with only <b>" + be.unrealR.toFixed(2) +
            "R</b> of open profit, on bar " + be.bar + ". Brooks moves to breakeven once the trade has moved about <b>1R</b> and the structure is intact — and not at all early in choppy tape. Before that the trade has proven nothing, and a breakeven stop within reach of an ordinary pullback just hands it back.");
        } else {
          m = Math.max(m, 0.9);
          notes.push("Breakeven at <b>" + be.unrealR.toFixed(2) + "R</b> of open profit — after the trade proved itself, which is the condition. A good trade should not come back through your entry.");
        }
      }
      if (isTrend && (tr || dt)) { m = Math.max(m, 1); notes.push("Trailing or running it in a trend is the right instinct: this is the context that pays for being held."); }
      if (!isTrend && tr) {
        m = Math.min(m, 0.45);
        notes.push("You trailed inside <b>two-sided</b> trading. Brooks uses a fixed target in a range and lets the market reach its objective — a trailing stop in two-sided trading gets hit by the ordinary back-and-forth on the way there.");
      }
      if (!isTrend && !tr && (find("partial") || ca)) { m = Math.max(m, 0.85); notes.push("Taking it off inside the range rather than trailing is the right shape for two-sided trading."); }
      if (si) {
        if (res.maxOpenR > 1.15) {
          m = Math.min(m, 0.5);
          notes.push("The scale-in took your open risk to <b>" + res.maxOpenR.toFixed(2) +
            "R</b>. Adding is not the mistake — <b>unplanned size</b> is. If you intend to scale in, the total has to be decided before the first entry, and the first entry sized smaller so the finished position still risks the 1R you meant.");
        } else {
          notes.push("Scaled in and kept the open risk at <b>" + res.maxOpenR.toFixed(2) + "R</b> — planned, not reactive. That is the version Brooks uses.");
        }
      }
    }
    /* the same trade, untouched — the only honest way to price the management */
    if (ans.holdR !== undefined) {
      var diff = res.r - ans.holdR;
      notes.push("On this tape your management came to <b>" + (res.r >= 0 ? "+" : "") + res.r.toFixed(2) +
        "R</b>; holding the original plan untouched would have been <b>" + (ans.holdR >= 0 ? "+" : "") + ans.holdR.toFixed(2) +
        "R</b>. " + (Math.abs(diff) < 0.05
          ? "Almost the same here — one tape is not evidence either way."
          : diff > 0 ? "Your management earned <b>" + diff.toFixed(2) + "R</b> on this one."
                     : "Your management cost <b>" + Math.abs(diff).toFixed(2) + "R</b> on this one — which is the price of the higher win rate it buys you, not a mistake by itself."));
    }
    base.score = clamp(0.55 * base.score + 0.45 * m, 0, 1);
    base.lines = (base.lines || []).concat(notes);
    base.verdict = m >= 0.85 ? "Well managed" : m <= 0.45 ? "Managed against the context" : base.verdict;
    return base;
  }
};

/* ---------------- pool picker ---------------- */
function pickPool(pool, seed) {
  var R = Mkt.mkR((seed ^ 0x9e37) >>> 0);
  return pool[Math.floor(R.u() * pool.length)];
}

/** the distinct base structures behind a pool — mirrors (the _D twins) are the
    same lesson, just flipped, so a Learn walkthrough only needs one per pair */
function baseKeys(pool) {
  var seen = {}, out = [];
  (pool || []).forEach(function (k) {
    var base = k.replace(/_D$/, "");
    if (!seen[base]) { seen[base] = 1; out.push(base); }
  });
  return out;
}
/** a stable hash so the same context always shows the same worked example —
    consistency matters when you are trying to burn a pattern into memory */
function fnv1a(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return h >>> 0;
}
/** one clean, fully-resolved worked example for a given structure */
/** The lesson card is the worked example, so it has to be one that worked.
    forceOutcome only steers where the tape is heading; a chart aimed at the
    target can still clip the stop on the way, and a teaching card that says
    "buy the first pullback and hold" over a losing chart teaches the opposite
    of what it says. Walk the seed until the setup actually resolves. Drills
    are untouched by this — they draw unbiased seeds and must show losses. */
function learnChart(ctxKey) {
  var seed = fnv1a(ctxKey + "|learn"), first = null;
  for (var i = 0; i < 60; i++) {
    var ch = Mkt.gen({ seed: (seed + i * 2654435761) >>> 0, ctx: ctxKey, forceOutcome: "win" });
    if (first === null) first = ch;
    if (!ch.gt.tradeable || ch.gt.worked) return ch;
  }
  return first;
}

var MIXED_KINDS = ["alwaysIn", "cycle", "context", "signalBar", "takeSide", "rangePlace",

  "entry", "barCount", "manage", "reversalType", "secondEntry", "trailOrTarget"];

function nodeById(id) {
  for (var i = 0; i < TIERS.length; i++) {
    for (var j = 0; j < TIERS[i].nodes.length; j++) {
      if (TIERS[i].nodes[j].id === id) return { tier: TIERS[i], node: TIERS[i].nodes[j], ti: i, ni: j };
    }
  }
  return null;
}

/* How much ground truth the chart is allowed to draw AFTER you answer.

     3  full      — shading, RANGE HIGH/LOW, ENTRY/STOP/TARGET, and the violet
                    labels naming every structural point
     2  unnamed   — same, minus the naming labels: the structure is drawn but
                    you have to know what it is
     1  bare      — levels only, so you can still see whether you were right
     0  none      — nothing drawn; the verdict is words

   Keyed off the TIER the node lives in rather than the learner's rank, so
   replaying an early tier still gives early-tier help. (`tier.rank` is stale —
   t1 and t2 both carry rank 1 — and is read nowhere, so use the array index.) */
var SCAFFOLD_BY_TIER = [3, 3, 3, 2, 2, 2, 1, 1, 1, 0, 0, 0, 0];

/* At level 0 the trade levels go, EXCEPT the one the drill actually asked you
   to place — otherwise the top tiers are punitive rather than demanding. You
   still see your line against the right one; you just no longer get the two
   levels you were never asked about. Read/identify kinds get no exemption,
   because entry/stop/target on a "name the context" reveal is decoration.
   `manage` is deliberately absent: its question text already prints the entry
   and the target verbatim. */
var GT_KEEP = {
  entry:  { entry: 1 },
  stop:   { invalid: 1 },
  target: { target: 1 },
  plan:   { entry: 1, target: 1, invalid: 1 },
  /* these two drills ARE the counting, so the attempt markers stay drawn
     however faded the rest of the scaffolding is */
  secondEntry: { counts: 1 },
  barCount:    { counts: 1 },
  replay: { entry: 1, target: 1, invalid: 1 }
};

function scaffoldLevel(node, opts) {
  if (!node || (opts && opts.placement) || node.id === "placement") return 3;
  var f = nodeById(node.id);
  if (!f) return 3;
  var lv = SCAFFOLD_BY_TIER[f.ti];
  return lv === undefined ? 3 : lv;
}

/** build one rep; resolves the "mixed" pseudo-kind */
function prepareRep(node, rep, seed) {
  var spec = node, kindName = node.kind;
  if (kindName === "mixed") {
    var R = Mkt.mkR(seed ^ 0xfeed);
    kindName = MIXED_KINDS[Math.floor(R.u() * MIXED_KINDS.length)];
    spec = {
      kind: kindName, minRR: 1.8,
      pool: kindName === "measure" || kindName === "target" ? POOL.measurable
        : kindName === "boFate" ? POOL.breakout
          : kindName === "rangePlace" ? POOL.range
            : kindName === "scalpSwing" ? POOL.tradeable : POOL.all
    };
  }
  var K = KIND[kindName];
  var prep = K.prepare(spec, seed);
  prep.kind = kindName; prep.K = K; prep.spec = spec;
  return prep;
}

var PROG = (function () {

  Object.keys(SKILLS).forEach(function (k) { st.skills[k] = { s: 0, n: 0 }; });

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw);
        Object.keys(o).forEach(function (k) { st[k] = o[k]; });
        Object.keys(SKILLS).forEach(function (k) { if (!st.skills[k]) st.skills[k] = { s: 0, n: 0 }; });
      }
    } catch (e) { }
    return st;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } }
  function skillBump(skill, score) {
    var s = st.skills[skill] || (st.skills[skill] = { s: 0, n: 0 });
    var w = s.n === 0 ? 1 : 0.28;
    s.s = s.s * (1 - w) + score * w; s.n++;
  }
  function repDone(kindName, score) {
    var K = KIND[kindName];
    if (!K) return;
    skillBump(K.skill, score);
    if (K.skill2) skillBump(K.skill2, score * 0.9 + 0.05);
    st.xp += Math.round(score * 12) + 2;
    save();
  }
  function nodeDone(node, avg, streak) {
    var rec = st.nodes[node.id] || (st.nodes[node.id] = { best: 0, tries: 0 });
    rec.tries++; rec.last = avg;
    if (avg > rec.best) rec.best = avg;
    if (streak !== undefined && streak > (rec.bestStreak || 0)) rec.bestStreak = streak;
    /* both conditions, in the same run, or it does not count */
    if (avg >= (node.pass || PASS_MARK) && (streak || 0) >= (node.streak || 0)) rec.passed = true;
    rec.at = Date.now();
    st.xp += Math.round(avg * 45) + 10;
    st.journal.unshift({ t: Date.now(), node: node.id, title: node.title, avg: avg, n: node.n });
    st.journal = st.journal.slice(0, 60);
    recomputeRank(); save();
  }
  /* A node is passed only by a single run that cleared BOTH the pass mark and
     the required run of consecutive clean answers. Averaging alone lets a good
     patch carry a bad one; the streak is what removes the doubt.
     Saves written before streaks existed are grandfathered on score alone. */
  function nodePass(node) {
    var rec = st.nodes[node.id];
    if (!rec) return false;
    if (rec.passed) return true;
    if (rec.legacy || rec.placed) return rec.best >= (node.pass || PASS_MARK);
    return false;
  }
  function tierDone(tier) { return tier.nodes.every(nodePass); }
  function tierProgress(tier) {
    var d = tier.nodes.filter(nodePass).length;
    return { done: d, total: tier.nodes.length, frac: d / tier.nodes.length };
  }
  function tierOpen(ti) {
    if (ti === 0) return true;
    if (st.rank >= ti) return true;
    return tierDone(TIERS[ti - 1]);
  }
  function recomputeRank() {
    var r = 0;
    for (var i = 0; i < TIERS.length; i++) { if (tierDone(TIERS[i])) r = i + 1; else break; }
    if (r > st.rank) st.rank = r;
    return st.rank;
  }
  function rankName() { return RANKS[Math.min(st.rank, RANKS.length - 1)].n; }
  function nextNode() {
    for (var i = 0; i < TIERS.length; i++) {
