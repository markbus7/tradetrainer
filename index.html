<!DOCTYPE html>
<!-- Trade Trainer v3.60.2 (build 2026-09-28) — Al Brooks price action -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRADE TRAINER v3.60.2 — Cadet to Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* tells the browser its own chrome — select popups, scrollbars, checkboxes —
       should render dark. Without it a dropdown's closed box takes the page's
       light text color, but its open list falls back to native light styling,
       so the options render close to unreadable against a dark background. */
    color-scheme: dark;
    --bg:#0E1116;--bg2:#141821;--bg3:#1B2029;--line:#2A303C;
    --amber:#F2A93B;--amber-dim:#6E5122;--up:#3FBF7F;--dn:#E5634D;--blue:#5B9BD5;
    --paper:#E8E6E0;--muted:#8A92A2;--grid:#1C222C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--paper);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input,select{font-family:inherit}
  /* belt-and-suspenders for browsers that only partly honour color-scheme on
     the popup list (older Firefox, some Linux GTK themes) */
  select{color:var(--paper)}
  select option{background:var(--bg3);color:var(--paper)}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--amber)}.mu{color:var(--muted)}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171B23,#0E1116);flex:0 0 auto}
  .logo{font-family:'Archivo';font-weight:800;letter-spacing:.15em;font-size:13px;background:linear-gradient(90deg,var(--amber),#FFD98A);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .rank{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber-dim);background:#241a08;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .xpwrap{flex:1;min-width:60px;display:flex;flex-direction:column;gap:3px}
  .xpbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--amber),#FFD98A);width:0%;transition:width .35s}
  .xptxt{font-family:'IBM Plex Mono';font-size:9px;color:var(--muted);letter-spacing:.04em}
  .ver{font-size:9px;color:var(--muted);letter-spacing:.06em;align-self:flex-start;margin-top:2px}
  @media(max-width:760px){.ver{display:none}}
  nav{display:flex;gap:4px;flex:0 0 auto}
  nav button{padding:6px 9px;font-size:11px;font-weight:600;border-radius:7px;border:1px solid transparent;color:var(--muted)}
  nav button.on{color:var(--amber);background:var(--bg3);border-color:var(--line)}
  nav button:hover{color:var(--paper)}
  @media(max-width:620px){
    /* five tabs have to fit a phone header, so the chrome gives up its room first */
    nav{gap:2px}
    nav button{padding:6px 5px;font-size:0}
    nav button::after{content:attr(data-ico);font-size:15px;line-height:1}
    .xptxt{display:none}
    .xpwrap{min-width:26px}
    header{gap:6px;padding:7px 8px}
    .logo{font-size:11px;letter-spacing:.1em}
  }
  @media(max-width:430px){.logo{font-size:0;letter-spacing:0}.logo::after{content:'TT';font-size:12px;letter-spacing:.12em}}

  main{flex:1;min-height:0;position:relative}
  .view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .view.on{display:flex}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}

  /* ---------- generic ---------- */
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .seclabel{font-family:'Archivo';font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
  .seclabel:first-child{margin-top:0}
  .btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:12px;font-weight:600}
  .btn:hover{border-color:var(--amber)}
  .btn.primary{background:linear-gradient(180deg,#F2A93B,#D9902A);color:#14100a;border-color:#F2A93B}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:6px 9px;font-size:11px;flex:0 0 auto}
  .row{display:flex;align-items:center;gap:9px}
  .grow{flex:1;min-width:0}
  .wrap{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:inline-block;font-family:'IBM Plex Mono';font-size:10px;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--muted);border:1px solid var(--line)}
  .pill.ok{background:#12291d;color:var(--up);border-color:#20452f}
  .pill.bad{background:#2c1512;color:var(--dn);border-color:#4a2019}
  .pill.am{background:#241a08;color:var(--amber);border-color:var(--amber-dim)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
  .kv b{font-family:'IBM Plex Mono';font-weight:600}

  /* ---------- path / levels ---------- */
  .tier{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);margin-bottom:9px;align-items:flex-start;cursor:pointer;transition:border-color .12s}
  .tier:hover{border-color:#3d465a}
  .tier.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-dim)}
  .tier.done{opacity:.75}
  .tier.lock{opacity:.42;cursor:default}
  .tier .num{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-family:'Archivo';font-weight:800;font-size:15px;background:var(--bg3);border:1px solid var(--line)}
  .tier.cur .num{background:#241a08;border-color:var(--amber);color:var(--amber)}
  .tier.done .num{background:#12291d;border-color:#2a5a3c;color:var(--up)}
  .tier .nm{font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.02em}
  .tier .ds{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
  .mini{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:7px}
  .mini i{display:block;height:100%;background:var(--up)}
  .drilllist{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
  .tier.open .drilllist{display:block}
  .drow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;font-size:12px}
  .drow:hover{background:var(--bg3)}
  .drow .st{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:9px;color:var(--muted)}
  .drow .st.ok{background:#12291d;border-color:#2a5a3c;color:var(--up)}

  .skillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}
  .skill{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .skill .n{font-size:11px;font-weight:600;display:flex;justify-content:space-between}
  .skill .n span{font-family:'IBM Plex Mono';color:var(--muted)}
  .skill .b{height:5px;background:var(--bg3);border-radius:3px;margin-top:6px;overflow:hidden}
  .skill .b i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#7FD1F0)}

  /* ---------- drill / chart ---------- */
  .stage{flex:1;display:flex;min-height:0}
  @media(max-width:860px){.stage{flex-direction:column}}
  .chartcol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .chartwrap{flex:1;position:relative;min-height:0;background:#0B0E13;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  /* A scrollable toolbar with no hint that it scrolls hides whatever sits past
     the fold on any screen narrower than its content -- which is exactly what
     happened to the Coach button. The wrapper is not itself scrollable, so its
     ::before/::after fades sit fixed over the toolbar's edges regardless of
     scroll position; JS below toggles them on only when there is somewhere
     left to scroll TO. */
  .toolwrap{position:relative;flex:0 0 auto}
  .toolwrap::before,.toolwrap::after{content:"";position:absolute;top:0;bottom:0;width:22px;
    pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
  .toolwrap::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
  .toolwrap::after{right:0;background:linear-gradient(270deg,var(--bg2),transparent)}
  .toolwrap.can-l::before{opacity:1}
  .toolwrap.can-r::after{opacity:1}
  .toolbar{display:flex;gap:4px;padding:5px 7px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tool{width:31px;height:29px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .tool.on{border-color:var(--amber);background:#241a08;color:var(--amber)}
  .tool:hover{border-color:#3d465a}
  .tool.wide{width:auto;padding:0 9px;font-size:11px;font-weight:600}
  /* icon over a small caption, so no button needs a hover to explain itself */
  .tool.lab{width:auto;min-width:40px;height:34px;padding:2px 6px;gap:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .tool.lab .ic{font-size:13px;line-height:1}
  .tool.lab .tl{font-size:8px;letter-spacing:.02em;color:var(--muted);margin-top:2px;white-space:nowrap}
  .tool.lab.on .tl{color:var(--amber)}
  .tsep{width:1px;background:var(--line);margin:2px 3px;flex:0 0 auto}
  .sym{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);padding:0 6px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sym b{color:var(--paper);font-weight:600;letter-spacing:.04em}

  .panel{width:330px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
  @media(max-width:860px){.panel{width:auto;border-left:none;border-top:1px solid var(--line);height:44%;min-height:190px}}
  .pbody{flex:1;overflow-y:auto;padding:11px;-webkit-overflow-scrolling:touch}
  .pfoot{flex:0 0 auto;padding:9px 11px;border-top:1px solid var(--line);display:flex;gap:8px}
  .pfoot .btn{flex:1;text-align:center}
  .task{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-family:'Archivo';font-weight:700;color:var(--amber);margin-bottom:5px}
  .brief{font-size:13px;line-height:1.55}
  .brief b{color:var(--amber)}
  .opt{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);font-size:12.5px;margin-bottom:6px;line-height:1.35}
  .opt:hover{border-color:#3d465a}
  .opt.sel{border-color:var(--amber);background:#241a08}
  .opt.right{border-color:var(--up);background:#12291d}
  .opt.wrong{border-color:var(--dn);background:#2c1512}
  .num{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--paper);font-family:'IBM Plex Mono';font-size:14px}
  .num:focus{outline:none;border-color:var(--amber)}
  .fb{border-radius:9px;padding:10px;margin-top:10px;font-size:12.5px;line-height:1.5;border:1px solid}
  .fb.good{background:#12291d;border-color:#2a5a3c}
  .fb.mid{background:#2a2208;border-color:var(--amber-dim)}
  .fb.bad{background:#2c1512;border-color:#4a2019}
  .fb h4{font-family:'Archivo';font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
  .fb ul{margin:6px 0 0 16px}
  .fb li{margin:3px 0}
  .stepdots{display:flex;gap:4px;margin-bottom:9px}
  .stepdots i{flex:1;height:3px;border-radius:2px;background:var(--bg3)}
  .stepdots i.on{background:var(--amber)}
  .stepdots i.ok{background:var(--up)}

  /* ---------- trade ticket ---------- */
  .ticket{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px;margin-top:9px}
  .ticket .hd{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'Archivo';font-weight:700}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tf{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
  .tf .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .tf .v{font-family:'IBM Plex Mono';font-size:13px;font-weight:600;margin-top:1px}
  .dirsel{display:flex;gap:6px;margin-bottom:7px}
  .dirsel button{flex:1;padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);font-size:11px;font-weight:700;letter-spacing:.06em}
  .dirsel button.on.long{background:#12291d;border-color:var(--up);color:var(--up)}
  .dirsel button.on.short{background:#2c1512;border-color:var(--dn);color:var(--dn)}

  /* ---------- stats ---------- */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  .sbox{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px}
  .sbox .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .sbox .v{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:left;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:5px 6px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:6px;border-bottom:1px solid #1b2029;font-family:'IBM Plex Mono'}
  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--bg2)}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(6,8,12,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
  .modal.on{display:flex}
  .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:16px}
  .sheet h2{font-family:'Archivo';font-size:16px;letter-spacing:.04em;margin-bottom:9px}
  .sheet h3{font-family:'Archivo';font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:14px 0 5px}
  .sheet p{font-size:13px;line-height:1.6;color:#cfd4dd;margin-bottom:7px}
  .sheet li{font-size:13px;line-height:1.6;color:#cfd4dd;margin:3px 0 3px 17px}
  .readbtn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;
    margin-left:8px;color:var(--muted);vertical-align:middle;text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif}
  .readbtn:hover{border-color:var(--amber);color:var(--paper)}
  /* ---------- desk / backtester ---------- */
  .panel.wide{width:380px}
  @media(max-width:1100px){.panel.wide{width:330px}}
  @media(max-width:860px){.panel.wide{width:auto}}
  .btsec{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:9px;margin-bottom:8px}
  .btsec>h5{font-family:'Archivo';font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
  .btgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px}
  .btkv{display:flex;justify-content:space-between;font-size:11.5px;gap:6px}
  .btkv span{color:var(--muted)}
  .btkv b{font-family:'IBM Plex Mono';font-weight:600;font-variant-numeric:tabular-nums}
  .btin{width:100%;background:var(--bg3);color:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:5px 7px;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .btin:focus{outline:none;border-color:var(--amber)}
  /* a readout dressed as a field would invite typing into it — so it looks inert */
  .btin[readonly]{background:transparent;border-style:dashed;color:var(--muted);cursor:default}
  .btlab{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;justify-content:space-between;gap:4px}
  .btpin{padding:0 4px;font-size:11px;line-height:16px;border:1px solid var(--line);border-radius:4px;background:var(--bg3);color:var(--muted)}
  .btpin.on{border-color:var(--amber);background:#241a08;color:var(--amber)}
  .btuse{padding:1px 6px;font-size:10px;font-weight:600;border:1px solid var(--line);border-radius:5px;background:var(--bg2);color:var(--muted)}
  .btuse:hover{border-color:var(--amber);color:var(--paper)}
  .hgrade{display:inline-block;min-width:18px;text-align:center;font:700 10.5px 'IBM Plex Mono',monospace;border-radius:4px;padding:1px 4px;letter-spacing:0}
  .hgrade.gA{background:#12291d;color:var(--up)} .hgrade.gB{background:#1d2616;color:#9CCB5B}
  .hgrade.gC{background:#241a08;color:var(--amber)} .hgrade.gD{background:#2c1512;color:var(--dn)}
  .hnotes{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .hn{display:flex;gap:7px;font-size:11.5px;line-height:1.45;color:#cfd4dd}
  .hn i{font-style:normal;font-weight:700;flex:0 0 12px;text-align:center}
  .hn.good i{color:var(--up)} .hn.bad i{color:var(--dn)} .hn.info i{color:var(--muted)}
  .pregrade{margin-top:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg3)}
  .hlist{display:flex;flex-direction:column;gap:3px;max-height:320px;overflow-y:auto}
  .hrow{display:grid;grid-template-columns:34px 1fr 62px 70px 22px;gap:4px;align-items:center;text-align:left;
    padding:4px 6px;font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--bg3);color:var(--paper)}
  .hrow:hover{border-color:#3d465a} .hrow.on{border-color:var(--amber)}
  .btseg{display:flex;gap:4px}
  .btseg button{flex:1;padding:5px 0;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:6px;background:var(--bg3);color:var(--muted)}
  .btseg button.on{border-color:var(--amber);background:#241a08;color:var(--amber)}
  .btseg button.buy.on{border-color:var(--up);background:#12291d;color:var(--up)}
  .btseg button.sell.on{border-color:var(--dn);background:#2c1512;color:var(--dn)}
  .btrow{border:1px solid var(--line);border-radius:8px;padding:6px 7px;margin-bottom:5px;background:var(--bg3);font-size:11px}
  .btrow .top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:3px}
  .btrow .mono{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted)}
  .btrow .acts{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .btrow .acts button{padding:3px 7px;font-size:10px;border:1px solid var(--line);border-radius:5px;background:var(--bg2);color:var(--muted);font-weight:600}
  .btrow .acts button:hover{border-color:var(--amber);color:var(--paper)}
  .btpl{font-family:'IBM Plex Mono';font-weight:600;font-size:11.5px}
  .btbtns{display:flex;gap:6px;margin-top:7px}
  .btbtns button{flex:1;padding:8px 0;font-size:12px;font-weight:700;border-radius:7px;border:1px solid var(--line)}
  .btbuy{background:#12291d;border-color:#2a5a3c!important;color:var(--up)}
  .btsell{background:#2c1512;border-color:#4a2019!important;color:var(--dn)}
  .btbuy:hover,.btsell:hover{filter:brightness(1.25)}
  #eqCurve{width:100%;height:46px;display:block;border-radius:6px;background:var(--bg3)}
  .prefrow{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px;color:#cfd4dd}
  .prefrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--amber)}
  .prefrow select{background:var(--bg3);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--bg3);border:1px solid var(--amber);color:var(--paper);padding:9px 15px;border-radius:9px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,bottom .25s;font-weight:600}
  .toast.on{opacity:1;bottom:30px}
  /* ---------- learn ---------- */
  .learn{flex:1;display:flex;min-height:0;position:relative}

<script>
/* Trade Trainer — version. Bump this when the file changes so a deployed
   copy can be identified from the UI, the page source, or the console. */
var APP = { name: "Trade Trainer", version: "3.60.2", build: "2026-09-28", basis: "Al Brooks price action" };

/* =====================================================================
   TRADE TRAINER — market engine (Al Brooks price-action framework)

   Every chart is one identifiable Brooks *context*, not a chart pattern:
   spike-and-channel, tight channel, trading range, barbwire, failed
   breakout, wedge reversal, major trend reversal, final flag, climax.

   Each context carries the things Brooks actually trades off:
     · the market cycle phase   (breakout / channel / trading range)
     · the always-in direction  (or none, in a range)
     · a probability of success, and the tape resolves at that rate
     · a measured move with an explicit type (spike / leg1=leg2 /
       range height / failed breakout / wedge origin)
     · a signal bar of controlled quality at the decision point
     · scalp or swing

   Bullish forms are declared once; bearish twins are mirrored, so every
   ground-truth function is written in a "bull frame" and reads the
   direction-aware helpers on ctx.
   ===================================================================== */
var Mkt = (function () {
  "use strict";

  /* ---------------- rng ---------------- */
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mkR(seed) {
    var r = rng(seed), sp = null;
    var o = {
      u: r,
      f: function (a, b) { return a + (b - a) * r(); },
      i: function (a, b) { return Math.floor(a + (b - a + 1) * r()); },
      g: function () {
        if (sp !== null) { var v = sp; sp = null; return v; }
        var u1 = Math.max(1e-9, r()), u2 = r(), m = Math.sqrt(-2 * Math.log(u1));
        sp = m * Math.sin(2 * Math.PI * u2);
        return m * Math.cos(2 * Math.PI * u2);
      },
      t: function () { var g = o.g(); return r() < 0.06 ? g * 2.8 : g; },
      pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
      chance: function (p) { return r() < p; },
      shuffle: function (arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(r() * (i + 1)), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }
    };
    return o;
  }

  /* ---------------- instruments ---------------- */
  /* `sig` is the per-hour volatility knob; the generator turns it into a realised
     hourly standard deviation 1.465x larger, so sig = (real hourly sd) / 1.465.
     The nine marked MEASURED were fitted to real hourly closes, never guessed.
     FX and gold from ten years each (2012-2022, ~57.6k hourly returns per
     symbol): XAUUSD .00192, EURUSD .00100, USDJPY .00109, GBPUSD .00114,
     GBPJPY .00145. Indices, oil and bitcoin from minute bars aggregated to the
     hour: DAX .00276 over 2015-2018 (13.4k hours, 21.5% annualised), S&P .00167
     and Nasdaq .00217 and WTI .00367 over 2017-2019 (17.5k hours each), BTC
     .00872 over 2016-2017. Nothing here is estimated: an instrument whose
     volatility could not be fitted to real data does not ship. Apple, Nvidia
     and Tesla were dropped for exactly that reason -- the stock data to hand is
     daily, and turning a daily figure into an hourly one for a market open six
     and a half hours a day needs an assumption none of the others required. */
  var INSTR = [
    { sym: "ES",     nm: "S&P 500 Futures",     dec: 2, lo: 6400,  hi: 7800,  sig: 0.00114, kind: "fut",    vbase: 38000 },  /* MEASURED */
    { sym: "NQ",     nm: "Nasdaq 100 Futures",  dec: 2, lo: 24500, hi: 30000, sig: 0.00148, kind: "fut",    vbase: 42000 },  /* MEASURED */
    { sym: "GER40",  nm: "DAX 40 Futures",      dec: 2, lo: 24000, hi: 26500, sig: 0.00188, kind: "fut",    vbase: 33000 },  /* MEASURED */
    { sym: "CL",     nm: "Crude Oil Futures",   dec: 2, lo: 80,    hi: 105,   sig: 0.00251, kind: "fut",    vbase: 27000 },  /* MEASURED */
    { sym: "EURUSD", nm: "Euro / US Dollar",    dec: 5, lo: 1.08,  hi: 1.19,  sig: 0.00068, kind: "fx",     vbase: 24000 },  /* MEASURED */
    { sym: "GBPUSD", nm: "Pound / US Dollar",   dec: 5, lo: 1.24,  hi: 1.38,  sig: 0.00078, kind: "fx",     vbase: 16000 },  /* MEASURED */
    { sym: "USDJPY", nm: "US Dollar / Yen",     dec: 3, lo: 145,   hi: 160,   sig: 0.00074, kind: "fx",     vbase: 20000 },  /* MEASURED */
    { sym: "GBPJPY", nm: "Pound / Yen",         dec: 3, lo: 195,   hi: 215,   sig: 0.00099, kind: "fx",     vbase: 12000 },  /* MEASURED */
    { sym: "XAUUSD", nm: "Gold Spot",           dec: 2, lo: 3700,  hi: 4500,  sig: 0.00131, kind: "fx",     vbase: 31000 },  /* MEASURED */
    { sym: "BTCUSD", nm: "Bitcoin / US Dollar", dec: 1, lo: 26000, hi: 98000, sig: 0.00595, kind: "crypto", vbase: 900 }   /* MEASURED */
  ];

  /* Where each instrument's volatility actually came from, so the app can say
     so out loud instead of asking to be trusted. `ann` is the annualised
     volatility that measurement implies. `m1` is the measured deviation from
     square-root-of-time scaling at ONE MINUTE, in percent: the app derives
     every timeframe from one hourly fit, and that assumption is near-exact from
     15 minutes upward but frays at one minute, where bid-ask bounce lives.
     null means no minute data existed to test it, which is not the same as
     passing — it is stated as untested. */
  var DATA = {
    EURUSD: { src: "Broker hourly closes",     span: "2012-2022", n: "57.6k hours", ann: 7.8,  m1: null },
    GBPUSD: { src: "Broker hourly closes",     span: "2012-2022", n: "57.6k hours", ann: 8.9,  m1: null },
    USDJPY: { src: "Broker hourly closes",     span: "2012-2022", n: "57.6k hours", ann: 8.5,  m1: null },
    GBPJPY: { src: "Broker hourly closes",     span: "2012-2022", n: "57.6k hours", ann: 11.3, m1: null },
    XAUUSD: { src: "Broker hourly closes",     span: "2012-2022", n: "57.6k hours", ann: 14.9, m1: null },
    GER40:  { src: "HistData DAX minute bars", span: "2015-2018", n: "13.4k hours", ann: 21.5, m1: 5 },
    ES:     { src: "Oanda S&P minute bars",    span: "2017-2019", n: "17.5k hours", ann: 13.0, m1: 17 },
    NQ:     { src: "Oanda Nasdaq minute bars", span: "2017-2019", n: "17.5k hours", ann: 16.9, m1: 2 },
    CL:     { src: "Oanda WTI minute bars",    span: "2017-2019", n: "17.5k hours", ann: 28.5, m1: 7 },
    BTCUSD: { src: "Bitstamp minute bars",     span: "2016-2017", n: "17.5k hours", ann: 67.8, m1: 21 }
  };
  /* Brooks works the 5-minute chart, so the pool leans intraday */
  var TFS = [

      and it re-arms on a bar with a LOWER HIGH. The re-arm condition is that

       straight through a breakout bar is how a correction that has already

      anchors.push({ i: patEnd + R.i(22, 34), p: lastP + sgn * hU * R.f(1.25, 1.75), tag: "x3" });
    } else {
      anchors.push({ i: patEnd + R.i(4, 7),   p: lastP + sgn * hU * R.f(0.28, 0.50), tag: "x1" });
      anchors.push({ i: patEnd + R.i(11, 17), p: lastP - sgn * hU * R.f(0.45, 0.75), tag: "x2" });
      anchors.push({ i: patEnd + R.i(21, 32), p: lastP - sgn * hU * R.f(0.90, 1.40), tag: "x3" });
    }

    if (m < 0) for (var q0 = 0; q0 < anchors.length; q0++) anchors[q0].p = -anchors[q0].p;

    var N = anchors[anchors.length - 1].i + 1;
    var U = P0 * sig * R.f(7.5, 10.5);

    /* ---- closes: anchor path + Brownian bridge, clustered volatility ---- */
    var close = new Array(N), volf = new Array(N), vf = 1;
    volf[0] = 1;
    for (var a2 = 0; a2 < anchors.length - 1; a2++) {
      var A = anchors[a2], B = anchors[a2 + 1], L = B.i - A.i, w = [0], acc = 0;
      for (var k = 1; k <= L; k++) {
        vf = Math.min(2.4, Math.max(0.5, vf * 0.90 + 0.10 * R.f(0.6, 1.5) + Math.abs(R.t()) * 0.04));
        volf[A.i + k] = vf;

      }
      /* scale the noise so this segment's drift cannot dominate it — see K_MAX */
      var drift = Math.abs(B.p - A.p) / Math.max(1, L) * U;
      var sig1 = SIG_T * sig * P0;
      var bs = Math.min(BRIDGE_CAP, Math.max(BRIDGE, drift / (sig1 * K_MAX)));
      /* a trade that works shows follow-through, not violent chop, so the path
         wanders a little less once the signal bar is behind us on a winning
         tape — but only a little, or the resolution looks drawn with a ruler */
      if (intended && A.i >= patEnd) bs *= 0.8;
      for (var k2 = 0; k2 <= L; k2++) {

    /* ---- pivot sweeps (stop runs beyond the swing) ---- */
    var sweep = {};
    for (var a3 = 1; a3 < anchors.length - 1; a3++) {
      var pv = anchors[a3], pr = anchors[a3 - 1], nx = anchors[a3 + 1];
      var isHi = pv.p > pr.p && pv.p > nx.p, isLo = pv.p < pr.p && pv.p < nx.p;
      if ((isHi || isLo) && R.chance(0.6)) sweep[pv.i] = (isHi ? 1 : -1) * U * R.f(0.05, 0.16);
    }

    /* ---- OHLCV ---- */
    /* the "eq" branch is kept though no equity currently ships — see INSTR */
    var gapP = inst.kind === "eq" ? (tf.min >= 1440 ? 0.5 : 0.1) : 0.03;
    var step = tf.min * 60000, skipWk = inst.kind !== "crypto";
    var tCur = Date.UTC(2024, R.i(0, 9), R.i(1, 26), 13, 30), wkGap = false;
    function nextT() {
      wkGap = false;
      if (skipWk) {
        var dw = new Date(tCur).getUTCDay();
        while (dw === 6 || dw === 0) { tCur += 86400000; dw = new Date(tCur).getUTCDay(); wkGap = true; }
      }
      var out = tCur; tCur += step; return out;
    }
    var bars = [];
    /* ---- bar texture ----
       Brooks reads a trading range off its BARS: overlapping, prominent tails,
       at least one doji. A trend reads as the opposite — bodies closing near
       their extremes with little tail against the move. Wick size is the lever:
       bigger wicks mean a smaller body relative to the bar and more overlap
       with the neighbours.

       Without this the wick formula is identical everywhere, and because a
       range traverses edge to edge while a trend spreads the same move over
       more bars, ranges come out with LARGER bodies than trends — backwards for
       a method built entirely on reading bars. */
    /* Multipliers on how much the price wanders INSIDE a bar, relative to how
       far the bar travels. Every value here is measured, not chosen: 1.15M bars
       of real 15-minute XAUUSD/EURUSD/USDJPY/GBPUSD/GBPJPY, split by Kaufman
       efficiency ratio, give RMS(range)/RMS(body) of 1.52-1.67 in the cleanest
       trends, 1.68-1.74 mid, 1.71-1.75 in chop, and 1.89-2.00 in stretches that
       pass a Brooks barbwire filter (tight, overlapping, range < 2.2 ATR).
       Brooks is right that a range prints more tail than a trend — and right
       that barbwire prints the most — but the real gap is about 6-9% between
       trend and range, not the 3.4x this table used to apply. Each value below
       was fitted so its family lands on the figure real data shows for that
       condition. */
    var TEX = { trend: 0.94, breakout: 0.93, range: 1.06, nothing: 1.28, reversal: 1.03 };
    var tex = def.tex !== undefined ? def.tex : (TEX[def.family] || 1);

    /* How hard price is moving right here, bar to bar. It has to be a LOCAL
       measure, not one number for the whole chart: this generator lays a
       deterministic drift under the trend segments, so a trend bar's body is
       bigger than the local noise alone would make it. Scaling the intrabar
       path off a global average would then give those bars too little range and
       the quiet stretches too much — which is exactly how you manufacture
       dojis in the chop and ruler-straight bars in the trend.
       It is an RMS, not a mean: the statistic this is calibrated against —
       RMS(range)/RMS(body) — is a second moment, and a mean-absolute estimate
       reads a drifting stretch differently from a choppy one of the same
       variance, which is the whole thing we are trying to get right. */
    var LW = 10, locS = new Array(N), dAbs = new Array(N);
    for (var q1 = 0; q1 < N; q1++) dAbs[q1] = q1 ? Math.abs(close[q1] - close[q1 - 1]) : 0;
    for (var q2 = 0; q2 < N; q2++) {
      var lo2 = Math.max(1, q2 - LW), hi2 = Math.min(N - 1, q2 + LW), sm = 0, cn = 0;
      for (var q3 = lo2; q3 <= hi2; q3++) { sm += dAbs[q3] * dAbs[q3]; cn++; }
      locS[q2] = cn ? Math.sqrt(sm / cn) : sig * P0;
      if (!(locS[q2] > 0)) locS[q2] = sig * P0;
    }
    var KB = 4;          /* bridge pieces per bar; see candle() */
    var INTRA = 1;       /* the bridge needs no fudge factor; kept for clarity */

    function candle(c, f, swp) {
      var o = bars.length === 0 ? c - R.t() * sig * P0 : bars[bars.length - 1].c;
      /* A bar opens where the last one closed. FX, gold, crypto and index
         futures trade round the clock, so the only real gap is over the
         weekend -- this used to gap 3% of ALL bars by a heavy-tailed amount
         (up to ~10 ATR), printing bear bars that closed above the prior close
         and fills far past a stop. Equity sessions (kind "eq") still gap. */
      var tNow = nextT();
      /* (weekend gaps only where a bar spans days -- intraday tapes on the
         Desk are re-timed continuously, so one would land mid-week there) */
      if (bars.length && (wkGap && tf.min >= 240 ? R.chance(0.85) : inst.kind === "eq" && R.chance(gapP)))
        o += Math.max(-2.5, Math.min(2.5, R.t())) * sig * P0 * (wkGap ? R.f(0.1, 0.45) : R.f(0.4, 1.2));
      /* Where price actually went inside the bar. The old formula drew each
         wick from its own draw scaled to GLOBAL volatility, independent of the
         bar's own move, so a quiet bar with a tiny body still sprouted a
         full-size tail on both sides: 68% of bars carried two wicks against 53%
         in real data, and range/body sat at 2.26 against a real 1.68.

         Instead, treat the bar as what it is — a Brownian bridge from the open
         to the close — and read the high and low off it. Walking the path in
         small steps would work but has to be sampled ~1000 times a bar before
         the extremes stop undershooting, which is far too slow. The bridge
         maximum has a closed form,
             P(max > m) = exp(-2m(m-d)/s^2),  m >= max(0,d)
         so it can be drawn directly from a uniform. Sampling the max and the
         min that way independently ignores that a bar rarely stretches far
         both ways, and overstates two-sided bars; splitting the bar into four
         pieces and giving each its exact extremes restores that dependence.
         Four is where it converges: RMS(range)/RMS(body) = 1.665, which is
         sqrt(4 ln 2) — the value a diffusion has to have, and the value 1.15M
         bars of real 15-minute FX and gold actually show. */
      var sInt = (locS[bars.length] || locS[N - 1]) * tex * INTRA;
      var ssub = sInt / Math.sqrt(KB), s2b = ssub * ssub, d0 = c - o;
      var h = Math.max(o, c), l = Math.min(o, c);
      var wv = new Array(KB + 1), acc4 = 0, k4;
      wv[0] = 0;
      for (k4 = 1; k4 <= KB; k4++) { acc4 += R.g() * ssub; wv[k4] = acc4; }
      for (k4 = 0; k4 < KB; k4++) {
        var pa = o + d0 * (k4 / KB) + (wv[k4] - (k4 / KB) * wv[KB]);
        var pb = o + d0 * ((k4 + 1) / KB) + (wv[k4 + 1] - ((k4 + 1) / KB) * wv[KB]);
        var dd = pb - pa;
        var u1 = Math.max(1e-12, R.u()), u2 = Math.max(1e-12, R.u());
        var mx = pa + (dd + Math.sqrt(dd * dd - 2 * s2b * Math.log(u1))) / 2;
        var mn = pa + (dd - Math.sqrt(dd * dd - 2 * s2b * Math.log(u2))) / 2;
        if (mx > h) h = mx;
        if (mn < l) l = mn;
      }
      if (swp) { if (swp > 0) h += swp; else l += swp; }
      var mv = Math.abs(c - o) / (sig * P0);
      bars.push({
        t: tNow, o: o, h: Math.max(h, o, c), l: Math.min(l, o, c), c: c,
        v: Math.round(inst.vbase * (0.45 + 0.85 * mv + 0.5 * R.u()) * f)
      });
    }
    for (var i2 = 0; i2 < N; i2++) candle(close[i2], volf[i2] || 1, sweep[i2]);

    /* breakouts that are going to fail print probing bars — long tails against the
       push, small bodies — which is exactly what a trader is supposed to read */
    if (def.probe) {
      var pr = def.probe(raw), tailDir = -(def.dir || 1) * m;
      var probeA = atr(bars, 14, Math.min(bars.length - 1, pr[1]));
      for (var pb = Math.max(1, pr[0]); pb <= Math.min(bars.length - 1, pr[1]); pb++) {

      }
    }

    /** continue the tape to `to` over n bars, to force a resolution */
    function extend(to, n) {
      var from = bars[bars.length - 1].c, w2 = [0], acc2 = 0, fv = volf[N - 1] || 1, ff = [];
      for (var k3 = 1; k3 <= n; k3++) {

    }

    /* ---- ground truth from the bars actually drawn ---- */
    var ax = {};
    anchors.forEach(function (a) { ax[a.tag] = a; });
    /* ---- the signal bar: shape it deliberately, it is the decision ----
       This happens BEFORE the ground truth is read. shapeSignal rewrites the
       signal bar's open/high/low/close, and every context's gt() looks back
       through a window that includes that bar, so reading the structure first
       would hand back prices that no longer exist on the chart that is drawn —
       and the stop is placed off exactly those prices. */

    var A14 = atr(bars, 14, sigIdx);
    var quality = opts.sigQ || def.sigQ;

    var C = ctxFor(m, sigIdx);
    var g = def.gt(bars, ax, C);
    if (m < 0 && g.labels) g.labels = g.labels.map(function (L) { return [L[0], flipWords(L[1])]; });

    if (g.rangeTop !== undefined && g.rangeBot !== undefined && g.rangeTop < g.rangeBot) {

    /* ---- entry, and guards so the trade is actually placeable ---- */

    var invalid = g.invalid, target = g.target, stopLevel = "the structure behind the entry";
    if (dir) {
      /* ---- the stop is a PRICE on the chart, never a distance ----
         It goes just beyond a low you can point at — the structure the context
         nominates, a swing low, or the signal bar's own low — with a few ticks
         of air under it. Nothing here is derived from ATR, because "1.4 times
         average range" is not a level anyone can see.

      var tick = Math.pow(10, -inst.dec), buf = 4 * tick;

         their structure through a window that runs a couple of bars past the
         decision bar, which is fine for naming a swing but not for placing a

         tape has, by construction, already traded through. */
      var seen = function (p) {

        var best = null;
        cands.forEach(function (c) {

        (g.labels || []).forEach(function (L) { if (named === null && Math.abs(L[0].p - level) < 1e-9) named = L[1]; });

      }

         Brooks says one tick beyond and why in practice you eyeball a little

      invalid = level - dir * buf;

         guard here that invented a target whenever the structural one came out
         close — the same defect as the ATR-derived stop: a level nobody can
         point at, manufactured to clear a threshold. A setup whose real target
         does not pay for its risk is not a trade, and is rejected by valid()
         rather than dressed up. Only the side is enforced. */
      if (dir * (target - entry) <= 0) target = entry + dir * Math.abs(entry - invalid) * 2;

    /* ---- does the reward pay for the risk? ----
       Brooks' arithmetic, not a preference: a SWING means a reward at least
       twice the risk, and he is explicit that a reversal — a ~40% setup — has
       no positive trader's equation below 2:1. A SCALP is allowed a reward
       smaller than its risk, but then the win rate has to carry the equation.

       A chart that fails this is still the pattern it is named; it is just not
       a trade. It is tagged rather than fixed, because stretching the target
       to clear a threshold would invent a level nobody can point at — the same
       defect as the ATR-derived stop. */
    var payoff = "takeable";
    if (dir) {
      var eqn = def.pWin * refRR - (1 - def.pWin);
      if ((def.style === "swing" && refRR < 2.0) || eqn < 0.10) payoff = "thin";
    }

    /* ---- initial risk, structural risk, and (later) actual risk ----
       Brooks' protective stop goes one tick beyond the signal bar's far
       extreme, and the distance from entry to there is the INITIAL RISK. That
       is the number you size from and the number that belongs in the trader's
       equation, because you do not tighten the stop just because the market
       goes sideways after you enter.

       A stop beyond the structure itself (`invalid`) is a wider alternative —
       a bigger initial risk, so smaller size and a different equation. It is
       not a separate Brooks concept with its own name; it is just a wider stop.

       from either of these: the distance from entry to the extreme of the
       pullback that happens AFTER entry. It is knowable only in hindsight and
       is usually far smaller than the initial risk. Computed below, once the

    var sigStop = dir

    /* ---- the bar count at the decision bar ----
       The pullback runs from the trend extreme it fell away from, so for a bull
       setup that origin is the highest high behind the signal bar. Counting
       forward from there to the signal bar gives the High N / Low N the
       decision bar actually is, read off this tape rather than assumed. */
    var pbFrom = sigIdx, count = { n: 0, idx: [] };
    if (dir) {
      var win = Math.max(0, sigIdx - 30);
      pbFrom = (dir > 0 ? hiIn(bars, win, sigIdx) : loIn(bars, win, sigIdx)).i;

      /* "All wedge bottoms and wedge bull flags are High 3 buy set-ups; all

         reporting something else is simply the wrong count for this pattern. */
      if (def.countAs === "wedge" && g.labels && g.labels.length >= 4) {
        count = { n: 3, idx: [g.labels[1][0].i, g.labels[2][0].i, g.labels[3][0].i] };
        pbFrom = g.labels[1][0].i;
      }
    }

    /* ---- what the tape actually did ---- */
    var td = dir || rd;
    /* The entry is a resting order, so nothing can be won or lost until it
       fills. Scanning from the signal bar regardless meant a setup that never
       triggered — price fell away without ever reaching the stop-entry price —
       was recorded as a stop-out, and the feedback then told the learner "the
       stop came first" about a trade they were never in. */
    function fills(bar) {
      if (!dir) return true;

        ? (td > 0 ? bar.l <= entry : bar.h >= entry)
        : (td > 0 ? bar.h >= entry : bar.l <= entry);
    }

      var fill = -1;
      for (var qq = sigIdx + 1; qq < bars.length; qq++) {

        var tH = td > 0 ? bars[qq].h >= target : bars[qq].l <= target;
        var iH = td > 0 ? bars[qq].l <= invalid : bars[qq].h >= invalid;
        if (iH) return [tH ? qq : -1, qq, fill];
        if (tH) return [qq, -1, fill];

    }
    var res = scan(), hitT = res[0], hitI = res[1], fillAt = res[2], guard = 0;
    while (hitT < 0 && hitI < 0 && guard++ < 3) {
      extend(intended ? target + td * Math.abs(target - entry) * 0.25
        : invalid - td * Math.abs(entry - invalid) * 0.6, R.i(9, 18));
      res = scan(); hitT = res[0]; hitI = res[1]; fillAt = res[2];
    }

    /* ---- the first entry, when it is a genuinely earlier, distinct attempt ----
       Brooks: the first entry usually fails, which is exactly why the second
       is the standard trigger — but the first is still a real, tradeable
       decision point, and pretending it does not exist teaches a false picture
       of how often the market actually gives you a shot before the good one.
       Only meaningful when the count found more than one attempt and the
       earliest is not simply the signal bar itself (an attempt="first"
       context like a tight channel has its designed signal AT the first
       pullback, so there is nothing earlier to also show). Uses the exact same
       target/invalid levels as the real trade — the structure does not change
       depending on which attempt you took it on, only the entry and stop do. */
    var firstAttempt = null;
    if (dir && count.idx.length > 1 && count.idx[0] !== sigIdx) {
      var fi = count.idx[0], fb = bars[fi];
      var fEntry = dir > 0 ? fb.h : fb.l;
      var fStop = (dir > 0 ? fb.l : fb.h) - dir * 0.08 * A14;
      function fFills(bar) {
        return def.entryType === "limit"
          ? (td > 0 ? bar.l <= fEntry : bar.h >= fEntry)
          : (td > 0 ? bar.h >= fEntry : bar.l <= fEntry);
      }
      var fFill = -1, fHitT = -1, fHitI = -1;
      for (var fq = fi + 1; fq < bars.length; fq++) {
        if (fFill < 0) { if (!fFills(bars[fq])) continue; fFill = fq; }
        var ftH = td > 0 ? bars[fq].h >= target : bars[fq].l <= target;
        var fiH = td > 0 ? bars[fq].l <= invalid : bars[fq].h >= invalid;
        if (fiH) { fHitI = fq; if (ftH) fHitT = fq; break; }
        if (ftH) { fHitT = fq; break; }
      }
      /* a first entry that never even filled is not a loss, it is a non-event —
         the same distinction the real signal's fills() check exists to make */
      /* Guard rather than untangle: the first counted bar can, rarely, sit
         chronologically so early that price has already passed the eventual
         (shared) target before this earlier entry would even trigger — the
         target then falls on the wrong side of the entry for this attempt,
         even though it is the right side for the real signal. Rather than
         chase that per-context, skip showing this one — a first attempt that
         does not form a coherent trade is not a first attempt worth taking. */
      var fSane = dir > 0 ? (fStop < fEntry && target > fEntry) : (fStop > fEntry && target < fEntry);
      if (fSane) {

      c.font = "9px 'IBM Plex Mono',monospace"; c.textAlign = "right"; c.textBaseline = "bottom";
      c.fillStyle = "rgba(138,146,162,.8)";
      c.fillText(e[1] + "  " + self2.fmt(p), xr - 4, y - 1);
    });

};

/* --- long/short position with live R:R --- */
Chart.prototype._drawPos = function (c, b, d) {
  if (d.draft) return this._drawDraft(c, b, d);
  if (d.lesson && (d.stop - d.entry) * d.dir >= 0) return this._drawTrail(c, b, d);
  /* i2, when given, closes the box at a bar (a finished trade under review) */
  var x0 = this.x(d.i), xr = b.r, xe = d.i2 != null ? Math.max(x0 + 4, Math.min(b.r, this.x(d.i2))) : b.r;
  var ye = this.y(d.entry), ys = this.y(d.stop), yt = this.y(d.target);
  c.fillStyle = "rgba(63,191,127,.13)"; c.fillRect(x0, Math.min(ye, yt), xe - x0, Math.abs(yt - ye));
  c.fillStyle = "rgba(229,99,77,.15)"; c.fillRect(x0, Math.min(ye, ys), xe - x0, Math.abs(ys - ye));
  var self = this;
  function line(y, col, txt, val) {
    y = Math.round(y) + 0.5;
    c.strokeStyle = col; c.lineWidth = 1.3; c.setLineDash([]);
    c.beginPath(); c.moveTo(x0, y); c.lineTo(xe, y); c.stroke();
    c.font = "700 10px Archivo,sans-serif"; c.textAlign = "left"; c.textBaseline = "bottom";
    /* backed, so a label stays readable where another order's lines cross it */
    /* in a lesson the labels sit at the right end, clear of the signal bar's own label */
    var tw = c.measureText(txt).width, lx = d.lesson ? Math.max(x0 + 2, xe - tw - 10) : x0 + 2;
    c.fillStyle = "rgba(11,14,19,.8)"; c.fillRect(lx, y - 15, tw + 6, 13);
    c.fillStyle = col; c.fillText(txt, lx + 3, y - 3);
    self._tag(c, xr + 1, y, self.fmt(val), col, "#0B0E13");
  }
  line(yt, COL.ok, "TARGET" + this._pnlTxt(d, d.target), d.target);
  line(ye, COL.amber, d.dir > 0 ? "LONG ENTRY" : "SHORT ENTRY", d.entry);
  line(ys, COL.bad, "STOP" + this._pnlTxt(d, d.stop), d.stop);
  this._rrTxt(c, b, d, ye, yt, xe);

/* A lesson position whose stop has been trailed past the entry: the zone
   between entry and stop is locked-in profit, not risk. */
Chart.prototype._drawTrail = function (c, b, d) {
  var x0 = this.x(d.i), xr = b.r, xe = d.i2 != null ? Math.max(x0 + 4, Math.min(b.r, this.x(d.i2))) : b.r, self = this;
  var ye = this.y(d.entry), ys = this.y(d.stop), yt = this.y(d.target);
  c.fillStyle = "rgba(63,191,127,.10)"; c.fillRect(x0, Math.min(ye, yt), xe - x0, Math.abs(yt - ye));
  c.fillStyle = "rgba(63,191,127,.22)"; c.fillRect(x0, Math.min(ye, ys), xe - x0, Math.abs(ys - ye));
  function line(y, col, txt, val) {
    y = Math.round(y) + 0.5;
    c.strokeStyle = col; c.lineWidth = 1.3; c.setLineDash([]);
    c.beginPath(); c.moveTo(x0, y); c.lineTo(xe, y); c.stroke();
    c.font = "700 10px Archivo,sans-serif"; c.textAlign = "left"; c.textBaseline = "bottom";
    var tw = c.measureText(txt).width, lx = Math.max(x0 + 2, xe - tw - 10);
    c.fillStyle = "rgba(11,14,19,.8)"; c.fillRect(lx, y - 15, tw + 6, 13);
    c.fillStyle = col; c.fillText(txt, lx + 3, y - 3);
    self._tag(c, xr + 1, y, self.fmt(val), col, "#0B0E13");
  }
  line(yt, COL.ok, "TARGET", d.target);
  line(ye, COL.amber, d.dir > 0 ? "LONG ENTRY" : "SHORT ENTRY", d.entry);

/* What hitting a level would make or lose, when the owner of the drawing can
   say (the desk supplies d.pnl) -- read straight off the line, the way a
   broker's chart shows it. */
Chart.prototype._pnlTxt = function (d, price) {
  return typeof d.pnl === "function" ? "   " + d.pnl(d, price) : "";
};
/* the reward:risk readout in the top-right of a position box */
Chart.prototype._rrTxt = function (c, b, d, ye, yt, xe) {
  var risk = Math.abs(d.entry - d.stop), rew = Math.abs(d.target - d.entry);
  var rr = risk > 0 ? rew / risk : 0;
  c.font = "700 11px 'IBM Plex Mono',monospace"; c.textAlign = "right"; c.textBaseline = "top";
  c.fillStyle = rr >= 2 ? COL.ok : rr >= 1 ? COL.amber : COL.bad;
  c.fillText(rr.toFixed(2) + "R", (xe || b.r) - 5, Math.min(ye, yt) + 4);
};
/* An order that is still only on the ticket. Drawn so it cannot be mistaken
   for a live trade or a working order: no shaded zones, dashed lines, hollow
   price tags, and every label says NEW. */
Chart.prototype._drawDraft = function (c, b, d) {
  var x0 = this.x(d.i), xr = b.r, self = this;
  var ye = this.y(d.entry), ys = this.y(d.stop), yt = this.y(d.target);
  /* a thin bracket joining the three levels, so they read as one idea */
  c.strokeStyle = "rgba(138,146,162,.55)"; c.lineWidth = 1; c.setLineDash([2, 3]);
  c.beginPath(); c.moveTo(x0 + 0.5, Math.min(ys, yt)); c.lineTo(x0 + 0.5, Math.max(ys, yt)); c.stroke();
  function line(y, col, txt, val) {
    y = Math.round(y) + 0.5;
    c.strokeStyle = col; c.lineWidth = 1.2; c.setLineDash([6, 4]);
    c.beginPath(); c.moveTo(x0, y); c.lineTo(xr, y); c.stroke();
    c.setLineDash([]);
    c.font = "700 10px Archivo,sans-serif"; c.textAlign = "left"; c.textBaseline = "bottom";
    var w = c.measureText(txt).width + 8;
    c.fillStyle = "rgba(11,14,19,.85)"; c.fillRect(x0 + 3, y - 15, w, 13);
    c.fillStyle = col; c.fillText(txt, x0 + 7, y - 3);
    /* hollow tag on the axis -- filled tags belong to real orders */
    var t = self.fmt(val);
    c.font = "10px 'IBM Plex Mono',monospace";
    var tw = c.measureText(t).width + 8;
    c.fillStyle = "#0B0E13"; c.fillRect(xr + 1, y - 8, tw, 16);
    c.strokeStyle = col; c.lineWidth = 1; c.strokeRect(xr + 1.5, y - 7.5, tw - 1, 15);
    c.textBaseline = "middle"; c.fillStyle = col; c.fillText(t, xr + 5, y + 0.5);
  }
  var side = d.dir > 0 ? "BUY" : "SELL";
  line(yt, COL.ok, "NEW TARGET" + this._pnlTxt(d, d.target), d.target);
  line(ye, COL.paper, "NEW " + side + (d._noEntryDrag ? " AT MARKET" : " ENTRY") + " · not placed", d.entry);
  line(ys, COL.bad, "NEW STOP" + this._pnlTxt(d, d.stop), d.stop);
  c.setLineDash([]);
  this._rrTxt(c, b, d, ye, yt);
};

/* readout used by the side panels */
Chart.prototype.readout = function () {
  var m = this.find("measure"), p = this.find("pos"), out = {};
  if (m && m.b) {
    out.leg = m.b.p - m.a.p;
    out.legPct = out.leg / m.a.p * 100;
    if (m.c) out.mTarget = m.c.p + out.leg;
  }
  if (p) {
    out.dir = p.dir; out.entry = p.entry; out.stop = p.stop; out.target = p.target;
    out.risk = Math.abs(p.entry - p.stop); out.reward = Math.abs(p.target - p.entry);
    out.rr = out.risk > 0 ? out.reward / out.risk : 0;
    out.riskPct = out.risk / p.entry * 100;
  }
  return out;
};
/* =====================================================================
   TRADE TRAINER — Brooks skills, drills, grading, progression
   A drill node = N reps. prepare() builds a chart + question,
   grade() returns a score in 0..1 plus written feedback.
   ===================================================================== */

/* The standard. PASS_MARK is the average a run must clear; CLEAN_MARK is what
   counts as a clean answer when measuring the consecutive-correct streak. A
   node that sets `streak: n` also demands n clean answers back to back in the
   same run, so a lucky patch cannot carry a shaky one. */
var PASS_MARK = 0.85;
var CLEAN_MARK = 0.8;
var DEFAULT_STREAK = 3;

var SKILLS = {
  bars: "Bar reading",
  cycle: "Market cycle",
  trend: "Trend trading",
  range: "Range trading",
  traps: "Breakouts & traps",
  measured: "Measured moves",
  reversal: "Reversals",
  risk: "Risk & the equation",
  execution: "Execution",
  discipline: "Discipline"
};

var RANKS = [
  { n: "Cadet" }, { n: "Core Trader" }, { n: "Bar Reader" }, { n: "Cycle Reader" },
  { n: "Trend Trader" }, { n: "Range Trader" }, { n: "Trap Hunter" }, { n: "Cartographer" },
  { n: "Reversal Trader" }, { n: "Operator" }, { n: "Manager" }, { n: "Master" }, { n: "Funded" }
];

/* ---------------- context pools ---------------- */
function both(a) { var o = []; a.forEach(function (k) { o.push(k, k + "_D"); }); return o; }
var POOL = {
  trend: both(["spikeChannel", "tightChannel", "broadChannel", "twoLegPullback"]),
  range: both(["rangeLow", "rangeMid", "barbwire", "breakoutMode"]),
  rangeTradeable: both(["rangeLow"]),
  noTrade: both(["rangeMid", "barbwire", "breakoutMode"]),
  breakout: both(["failedBo", "successBo"]),
  reversal: both(["wedgeBottom", "mtr", "finalFlag", "climax"]),
  all: Mkt.KEYS.slice(),
  tradeable: Mkt.KEYS.filter(function (k) { return Mkt.CTX[k].dir !== 0; }),
  measurable: Mkt.KEYS.filter(function (k) { return Mkt.CTX[k].mmType !== "none" && Mkt.CTX[k].dir !== 0; }),
  /* contexts where a pullback is actually in progress, so a bar count means
     something. Breakouts, reversals and ranges are excluded on purpose. */
  pullback: both(["twoLegPullback", "tightChannel", "spikeChannel", "broadChannel"]),
  /* the two beginners confuse: a failed breakout out of a range, and a real
     trend reversal. Drilled head to head so the discriminator gets learned. */
  confusable: both(["failedBo", "mtr"]),
  /* the beginner's core: the three highest-probability setups Brooks tells a
     new trader to trade, and nothing else */
  core: both(["twoLegPullback", "failedBo", "mtr"]),
  mmSpike: both(["spikeChannel"]),
  mmLeg: both(["tightChannel", "twoLegPullback", "mtr", "finalFlag"]),
  mmRange: both(["successBo", "failedBo", "rangeLow"]),
  mmWedge: both(["wedgeBottom"]),
  swing: [], scalp: [], boFate: []
};
Mkt.KEYS.forEach(function (k) {
  var c = Mkt.CTX[k];
  if (c.dir === 0) return;
  if (c.style === "swing") POOL.swing.push(k);
  if (c.style === "scalp") POOL.scalp.push(k);
});
/* two failures per follow-through: enough to teach the base rate, not enough
   that answering "it fails" every time clears the 70% pass mark */
both(["failedBo"]).forEach(function (k) { POOL.boFate.push(k, k); });
both(["successBo"]).forEach(function (k) { POOL.boFate.push(k); });

/* ---------------- scoring helpers ---------------- */
function band(err, tol) {
  if (err <= tol) return 1;
  if (err <= tol * 2) return 0.68;
  if (err <= tol * 3.4) return 0.3;
  return 0;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function pct(x) { return Math.round(x * 100) + "%"; }
function fmtN(p, dec) { return p.toFixed(dec); }
function ptol(ch) { return Math.max(0.55 * ch.atr, 0.11 * (ch.gt.height || ch.atr * 3)); }
/** the reward-to-risk this context offers from its reference entry */
function refRR(ch) { return ch.gt.refRR || 0; }
/** Brooks' trader's equation: is probability x reward bigger than the rest? */
function equation(p, rr) { return p * rr - (1 - p); }
function rrScore(rr, goal, can) {
  if (rr >= goal) return 1;
  if (can < goal && rr >= can * 0.85) return 0.75;
  if (rr >= goal * 0.75) return 0.6;
  if (rr >= 1) return 0.35;
  return 0.1;
}
/** where price sits inside its range: 0 = at the low, 1 = at the high */
function rangePos(ch) {
  var g = ch.gt;
  if (g.rangeTop === undefined) return null;
  var px = ch.bars[g.decision].c, h = g.rangeTop - g.rangeBot;
  return h > 0 ? clamp((px - g.rangeBot) / h, 0, 1) : 0.5;
}
/** the structural landmark a price coincides with, e.g. "channel low", "push 3" */
function labelFor(ch, price) {
  var L = ch.gt.labels || [];
  for (var i = 0; i < L.length; i++) if (Math.abs(L[i][0].p - price) < 1e-9) return L[i][1];
  return null;
}
/** how you get filled in this context — stop orders trend, limit orders fade */
/** Which level did THIS example's stop actually use, and how far out is it?
    "below the bar or the swing behind it" leaves the learner unable to tell
    whether a stop that survived had earned its room or been handed it, so the
    answer is named: the chart's own label for the point, the price, and the
    distance in ATR so it can be compared with the signal-bar stop. */
function stopLine(g, ch) {
  if (!g || !g.tradeable || !g.stopLevel) return "";
  var other = g.dir > 0 ? "below" : "above";
  var named = /\b(low|high)\b/.test(g.stopLevel)
    ? "the <b>" + g.stopLevel + "</b>"
    : "the point this chart labels <b>" + g.stopLevel + "</b>";
  var s = " On this example that is " + named + ", so the stop goes a few ticks " + other + " it";
  if (ch) {
    s += " at <b>" + fmtN(g.invalid, ch.dec) + "</b> — " + (g.initialRisk / ch.atr).toFixed(2) +
      " ATR from the entry";
    /* the swing stop is the wider alternative; say by how much, so a stop that
       looks generous can be checked rather than guessed at */
    if (g.sigStop !== undefined && Math.abs(g.initialRisk - Math.abs(g.entry - g.sigStop)) > 0.15 * ch.atr) {
      s += ", against " + (Math.abs(g.entry - g.sigStop) / ch.atr).toFixed(2) +
        " ATR if you had stopped at the signal bar alone";
    }
  }
  return s + ".";
}
function entryHow(g, ch) {
  if (!g || !g.tradeable) return "";
  var side = g.dir > 0 ? "above" : "below";
  var other = g.dir > 0 ? "below" : "above";
  /* in a range you fade the edge, so the trapped crowd is the one chasing the
     breakout the other way: we buy the low, they sold the stop below it */
  var trapVerb = g.dir > 0 ? "selling" : "buying";
  var trapEdge = g.dir > 0 ? "range low" : "range high";
  return g.entryType === "limit"
    ? "You get in here with a <b>limit order</b> at the range edge, not a stop — in a range you are fading the edge, so you want to be filled as price reaches it. Brooks puts the limit at the prior extreme or a few ticks through it, so the probe that pokes past the edge fills you and then fails; much further out than that and you are catching a real breakout instead of fading a probe. " +
      trapVerb.charAt(0).toUpperCase() + trapVerb.slice(1) + " a stop " + other + " the " + trapEdge +
      " is exactly how traders get trapped here, because about eight out of ten range breakouts fail." + stopLine(g, ch)
    : "You get in here with a <b>stop order</b> just " + side + " the signal bar: price has to trade there to fill you, which is the confirmation. The protective stop then sits " + other + " the bar or the swing behind it." + stopLine(g, ch);
}
/** Brooks' actual risk: how far the market really went against the entry after
    you were filled, as opposed to how far your stop sat. Hindsight only — you
    size from initial risk — but seeing the gap between the two is most of why
    a good entry is worth so much more than a nearly-good one. */
function actualRiskLine(ch) {
  var g = ch.gt;
  if (!g.tradeable || !isFinite(g.actualRisk)) return "";
  var ar = g.actualRisk, ir = g.initialRisk;
  if (ir <= 0) return "";
  var frac = ar / ir;
  var head = "On this tape your <b>actual risk</b> — entry to the worst the pullback got after you were filled — was <b>" +
    fmtN(ar, ch.dec) + "</b>, against an initial risk of <b>" + fmtN(ir, ch.dec) + "</b>.";
  if (!g.worked) return head + " The trade failed here, so the actual risk ran all the way to the stop and past it. That is the case the initial risk exists for.";
  /* Two different stops are in play and they answer different questions. The
     initial risk above is the SIGNAL BAR stop; the stop this chart actually
     drew is the structural one. A win that used 96% of the stop is not the
     same trade as one that used half, and calling both "it worked" is how a
     learner decides a stop was well placed when it survived by a few ticks. */
  var sr = g.structureRisk, sf = sr > 0 ? ar / sr : frac;
  var used = " Against the stop this chart actually drew — " + (g.stopLevel || "the structure behind the entry") +
    ", " + fmtN(sr, ch.dec) + " away — it used <b>" + pct(sf) + "</b>.";
  if (frac > 1.0) return head + used +
    " Note what that means: the market traded back through where a <i>signal-bar</i> stop would have sat, and only the wider structural stop kept you in the trade. " +
    "Roughly one winner in six here does this. It is not an argument for always using the wider stop — the wider stop means smaller size for the same money risked, so it is a different trade with a different equation, not a free one.";
  if (sf >= 0.90) return head + used +
    " That is a <b>narrow</b> win, not a comfortable one. A few ticks either way and this is a loss on the identical read, so do not take it as proof the stop was well placed. " +
    "Roughly one winner in sixteen here comes this close; the median winner uses about half its stop.";
  if (sf >= 0.75) return head + used +
    " That is most of the room you gave it — the band where moving the stop up early would have cost you the trade. About one winner in nine lands here.";
  if (sf <= 0.45) return head + used +
    " The market barely came back at you. Brooks' point is that this is normal on a good entry, and it is why you can only judge a trade's real maths in hindsight — you still had to be willing to risk the full stop.";
  return head + used + " Comfortable, and close to the typical winner here, which uses about half its stop.";
}

function outcomeLine(ch) {
  var g = ch.gt;
  if (!g.tradeable) return "";
  return g.worked
    ? "On this tape it did work — the target came before the stop."
    : "On this tape it failed: the stop came first. About " + pct(1 - g.prob) + " of these do.";
}
/** How much of the target is ground the market has not covered yet.

    Projecting a leg from the end of a correction has an arithmetic
    consequence that is easy to miss and worth stating: the ground demanded
    beyond the leg's own end is exactly the leg minus whatever the correction
    gave back. It holds on every projected chart in the app, and it is why a
    deep pullback and a shallow one produce very different-looking targets out
    of the same measurement. */
function newGroundLine(g, ch) {
  if (!g.measure || !g.anchor || !isFinite(g.target)) return "";
  var d = g.dir;
  var L = (g.measure.b.p - g.measure.a.p) * d;      /* the leg, toward the trade */
  var P = (g.measure.b.p - g.anchor.p) * d;         /* how far it came back off the leg's end */
  var NG = (g.target - g.measure.b.p) * d;          /* ground asked for past the leg's end */
  if (!(Math.abs(L) > 1e-9)) return "";
  var endP = fmtN(g.measure.b.p, ch.dec), ngP = fmtN(Math.abs(NG), ch.dec);
  if (Math.abs(NG) < 0.05 * Math.abs(L))
    return "Note what that asks for: the target is the far end of the very leg you measured, so it is a repeat of that move from where it began — <b>no new ground at all</b>.";
  if (P > 0.05 * Math.abs(L))
    return "Note what that asks for: the correction gave back <b>" + Math.round(100 * P / L) +
      "%</b> of the leg, so past <b>" + endP + "</b> the target only needs <b>" + ngP +
      "</b> of ground the market has not already covered — <b>the leg minus the pullback</b>. " +
      "The reward is still about a full leg, because you got in that much further back.";
  if (P < -0.05 * Math.abs(L))
    return "Note what that asks for: price had already carried <b>" + fmtN(Math.abs(P), ch.dec) +
      "</b> past the leg's end before you got in, so the target sits <b>" + ngP +
      "</b> beyond it — the leg <i>plus</i> that advance.";
  return "Note what that asks for: the projection starts at the leg's own end, so the target needs <b>" +
    ngP + "</b> of ground the market has not covered yet — a full leg beyond <b>" + endP + "</b>.";
}

/** WHY THIS BAR.

    The chart brackets one bar and calls it the decision, and never says why
    that one rather than the two before it — which look tradeable, because they
    usually are. Three things need saying, and all three are checkable on the
    bars: which push the bar belongs to, what makes it the signal bar inside
    that push, and that the earlier bars in the same push were also entries. */
function signalBarWhy(ch) {
  var g = ch.gt, B = ch.bars, i = g.sigIdx, d = g.dir;
  if (!g.tradeable || !B[i]) return "";
  var bar = B[i], rg = bar.h - bar.l;
  if (!(rg > 0)) return "";
  /* how far the close sits from the bar's own extreme, in the trade's direction */
  var frac = d > 0 ? (bar.h - bar.c) / rg : (bar.c - bar.l) / rg;
  var at = (g.countIdx || []).indexOf(i), tag = d > 0 ? "H" : "L";
  var s = "<b>Why this bar and not the one before it.</b> ";

  if (at >= 0) {
    s += "It is the <b>" + tag + (at + 1) + "</b> itself — the bar that made the attempt. ";
  } else {
    /* find the last counted attempt before it: this bar continues that push */
    var last = -1;
    (g.countIdx || []).forEach(function (x) { if (x < i) last = x; });
    s += last >= 0
      ? "It is <b>not a later attempt</b> — the count stopped at the <b>" + tag +
        ((g.countIdx || []).indexOf(last) + 1) + "</b> on bar " + last + " and nothing re-armed it, so bar " + i +
        " is still that same push. A push only counts again once a bar closes back the other way first. "
      : "";
  }
  s += "Inside that push it is the bar Brooks would use, because of <b>where it closes</b>: " +
    (frac <= 0.15 ? "right at its own " + (d > 0 ? "high" : "low") + " (" + Math.round(100 * frac) + "% off it)"
      : frac <= 0.35 ? "in the last third toward its " + (d > 0 ? "high" : "low") + " (" + Math.round(100 * frac) + "% off it)"
        : "only " + Math.round(100 * frac) + "% of the way from its " + (d > 0 ? "high" : "low") + ", which is why it is graded a weak one") +
    ". ";
  s += "<b>And the bars before it were tradeable too.</b> Brooks does not hand out one blessed bar per correction — " +
    "entering earlier in the same push gets you a better price against a bar that has proved less. That is a real " +
    "trade-off, not a mistake: this drill asks the question at one bar because it has to ask it somewhere.";
  return s;
}

/** the chart's own name for a marked point, if it has one */
function ptName(g, pt) {
  var n = null;
  if (!pt) return null;
  (g.labels || []).forEach(function (L) {
    if (n === null && L[0].i === pt.i && Math.abs(L[0].p - pt.p) < 1e-9) n = L[1];
  });
  return n ? n.replace(/\s*=\s*target$/, "") : null;
}

/** WHY THOSE TWO POINTS AND NOT SOME OTHER PAIR.
    The one question a measured move always raises: the chart is full of highs,
    so why that high? The answer is a rule, not a preference — a leg is measured
    between the extremes it actually reached, so no bar inside it printed past
    either end. Say it with the numbers so it can be checked rather than
    believed. */
function legEndsLine(g, ch) {
  if (!g.measure || !g.measure.a || !g.measure.b) return "";
  var lo = Math.min(g.measure.a.i, g.measure.b.i), hi = Math.max(g.measure.a.i, g.measure.b.i);
  var up = g.measure.b.p > g.measure.a.p;
  var topP = up ? g.measure.b.p : g.measure.a.p, botP = up ? g.measure.a.p : g.measure.b.p;
  return "<b>Why those two points:</b> between bar " + lo + " and bar " + hi +
    " no bar traded above <b>" + fmtN(topP, ch.dec) + "</b> or below <b>" + fmtN(botP, ch.dec) +
    "</b> — they are the extremes the leg actually reached, which is what makes it that leg's height. " +
    "If a bar inside had printed further, that bar would be the end of the leg and the height would be " +
    "measured to it instead. A leg is never measured from the bar a swing happens to be named at.";
}

/** Where the target came from, in words — the numbers that were measured and
    the point they were stood up from. A level far beyond every high and low on
    the screen is unreadable without this; you can see it but not justify it. */
function targetBasis(ch) {
  var g = ch.gt;
  if (!g.tradeable || !isFinite(g.target)) return "";
  var named = null;
  (g.labels || []).forEach(function (L) {
    if (named === null && Math.abs(L[0].p - g.target) < 1e-9) named = L[1];
  });
  if (named) return "The target is the <b>" + named.replace(/\s*=\s*target$/, "") + "</b> at <b>" + fmtN(g.target, ch.dec) + "</b> — a level already on the chart, not a projection.";
  if (g.rangeTop !== undefined && Math.abs(g.target - g.rangeTop) < 1e-9)
    return "The target is the <b>top of the range</b> at <b>" + fmtN(g.target, ch.dec) + "</b>.";
  if (g.rangeBot !== undefined && Math.abs(g.target - g.rangeBot) < 1e-9)
    return "The target is the <b>bottom of the range</b> at <b>" + fmtN(g.target, ch.dec) + "</b>.";
  if (g.measure && g.measure.a && g.measure.b && isFinite(g.mmTarget) && Math.abs(g.target - g.mmTarget) < 1e-6) {
    var h = Math.abs(g.measure.b.p - g.measure.a.p);
    var anName = ptName(g, g.anchor), aName = ptName(g, g.measure.a), bName = ptName(g, g.measure.b);
    var way = g.measure.b.p > g.measure.a.p ? "up to" : "down to";
    return "The target is a <b>measured move</b>, and both halves of it are drawn on the chart as two bars " +
      "of the same length. <b>What was measured:</b> the leg from " + (aName ? "the <b>" + aName + "</b> at " : "") +
      "<b>" + fmtN(g.measure.a.p, ch.dec) + "</b> " + way + " " + (bName ? "the <b>" + bName + "</b> at " : "") +
      "<b>" + fmtN(g.measure.b.p, ch.dec) + "</b> — <b>" + fmtN(h, ch.dec) + "</b> tall. " +
      "<b>Where it is stood up:</b> from the " + (anName ? "<b>" + anName + "</b>" : "entry structure") +
      " at <b>" + fmtN(g.anchor.p, ch.dec) + "</b>, which gives <b>" + fmtN(g.target, ch.dec) +
      "</b>. It is not a multiple of anything — the same distance, moved. " + g.mmRule +
      " " + legEndsLine(g, ch) + " " + newGroundLine(g, ch);
  }
  /* not a projection and not a named level: say what fraction of the measured
     leg it is, which is what a partial-retrace target actually is */
  if (g.measure && g.measure.a && g.measure.b && g.anchor) {
    var span = g.measure.b.p - g.measure.a.p;
    if (Math.abs(span) > 1e-9) {
      var f = (g.target - g.anchor.p) / span;
      if (f > 0.05 && f < 1.5) {
        return "The target is <b>" + Math.round(f * 100) + "%</b> of the leg from <b>" +
          fmtN(g.measure.a.p, ch.dec) + "</b> to <b>" + fmtN(g.measure.b.p, ch.dec) +
          "</b>, measured from <b>" + fmtN(g.anchor.p, ch.dec) + "</b> — <b>" + fmtN(g.target, ch.dec) +
          "</b>. " + (g.mmRule || "") + " " + legEndsLine(g, ch);
      }
    }
  }
  return "The target sits at <b>" + fmtN(g.target, ch.dec) + "</b>. " + (g.mmRule || "");
}

function probLine(ch) {
  var g = ch.gt, e = equation(g.prob, g.refRR);
  var s = "This context wins about <b>" + pct(g.prob) + "</b> of the time in this trainer, and offers roughly <b>" +
    g.refRR.toFixed(2) + "R</b>. Trader's equation: " + g.prob.toFixed(2) + " x " + g.refRR.toFixed(2) +
    " − " + (1 - g.prob).toFixed(2) + " = <b>" + (e >= 0 ? "+" : "") + e.toFixed(2) + "R</b> per trade.";
  /* Say it wherever the chart appears, not only in the take-or-pass drill: a
     correct read on a setup that does not pay is still not a trade, and that
     is the half of the method a learner is most likely to skip. */
  if (g.tradeable && g.payoff === "thin") {
    s += " <b>Which is why this one is not a trade.</b> The pattern is real, the price is wrong — " +
      (g.style === "swing"
        ? "Brooks puts a reversal at roughly a 40% setup, so it has to be capable of two to one before it is worth taking."
        : "a scalp can risk more than it makes only while the win rate carries it, and here it does not.") +
      " And the fix is not a bigger target. The objective is set by the structure — a measured move, a range edge, the level the " +
      "pattern is trying to reach — not by what the arithmetic needs it to be. Moving it further out until the ratio looks " +
      "acceptable does not make the market go there; it just hides a trade you should have passed on. Name it, and pass.";
  }
  return s;
}

    var legS = band(Math.abs(userLeg - g.height), Math.max(tol, g.height * 0.1));

      "<b>" + g.name + "</b>. " + g.mmRule,
      "Correct height <b>" + fmtN(g.height, ch.dec) + "</b> · yours " + fmtN(userLeg, ch.dec) +

          "A stop beyond the structure at <b>" + fmtN(g.invalid, ch.dec) + "</b> risks <b>" + fmtN(g.structureRisk, ch.dec) +

/* --- 16. live execution ------------------------------------------- */
/* =====================================================================
   the funded account

   Everything before this tier grades one decision in isolation. This grades
   the thing that actually ends trading careers: correct reads sized wrongly.

   It is deliberately NOT a P&L score — that would contradict the rest of the
   curriculum ("the R is the market's opinion, not a grade"). You pass by
   respecting a rule set while taking setups with a real edge. The target is
   reachable BECAUSE the edge is real, so a blown drawdown is nearly always a
   sizing decision rather than bad luck, and the debrief proves that by
   replaying your own trades at other risk levels.

   The numbers come from a Monte Carlo against the app's own calibrated edge
   (~60% at ~1.5R). Under these rules, good reads at 1% risk pass about nine
   times in ten; 3% halves that; 5% passes about as often but blows the
   drawdown 40% of the time; and no risk level rescues weak reads. That
   discrimination is a property of the rules, not something the app asserts. */
var FUND = {
  start: 25000,
  targetPct: 6,        /* profit target, % of starting balance */
  dayLossPct: 3,       /* session loss limit, % of balance at session start */
  maxDDPct: 5,         /* max drawdown from peak, % */
  perSession: 5,       /* trades per session — a block, not a calendar day:  */
  budget: 40,          /* every chart has its own clock, so there is no shared one */
  defaultRisk: 1
};

/** Apply one trade's R to an account and report any rule breach. Pure, so the
    verification harness can run it over thousands of simulated runs. */
function fundApply(acc, r) {
  var risk$ = acc.bal * acc.riskPct / 100;
  var pl = r * risk$;
  acc.bal += pl;
  acc.tradeNo++;
  if (acc.bal > acc.peak) acc.peak = acc.bal;
  var ddPct = 100 * (acc.peak - acc.bal) / acc.peak;
  var dayPct = 100 * (acc.sessionStart - acc.bal) / acc.sessionStart;
  var gainPct = 100 * (acc.bal - acc.start) / acc.start;
  var out = { pl: pl, risk$: risk$, ddPct: ddPct, dayPct: dayPct, gainPct: gainPct, over: null };
  if (ddPct >= FUND.maxDDPct) out.over = "drawdown";
  else if (dayPct >= FUND.dayLossPct) out.over = "session";
  else if (gainPct >= FUND.targetPct) out.over = "PASS";
  else if (acc.tradeNo >= FUND.budget) out.over = "budget";
  else if (acc.tradeNo % FUND.perSession === 0) acc.sessionStart = acc.bal;  /* new session */
  return out;
}

function newFundAccount(riskPct) {
  return {
    start: FUND.start, bal: FUND.start, peak: FUND.start,
    riskPct: riskPct || FUND.defaultRisk, sessionStart: FUND.start,
    tradeNo: 0, log: [], result: null
  };
}
