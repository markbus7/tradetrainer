  /* =====================================================================
     DESK — free backtesting on a long tape

     Practice shows one setup and asks one question. The Desk is the other
     thing: a long continuous tape you trade freely, so you can run your own
     approach over many trades and read the result off the balance-per-trade curve.

     The tape is built by stitching Brooks contexts end to end and rebasing
     each one onto the previous close, so the series has real trends, ranges,
     breakouts and reversals rather than being a random walk.
     ===================================================================== */
  var BT = {
    ch: null, sym: null, tf: null,       /* null = let the tape pick */
    coach: false, coachSeen: 0, coachTaken: 0, coachSkipped: 0,
    start: 25000, balance: 25000, lots: 1,
    pos: [], ord: [], log: [], nextId: 1,
    dir: 1, otype: "market", playing: false, timer: null, speed: 320,
    draft: false,                         /* user is working the ticket: preview it */
    dealMap: true,                        /* closed trades drawn entry -> exit on the chart */
    /* "read": Coach finds setups from the bars on screen only (trades and
       backtests). "key": it shows the setups the generator planted (teaching). */
    coachMode: (function () { try { return localStorage.getItem("tt_coachmode") === "key" ? "key" : "read"; } catch (e) { return "read"; } })(),
    seedQueue: null,                      /* fixed tapes, for comparing both Coaches on the same charts */
    autoVis: null, autoTimer: null,       /* a visual auto-backtest in progress */
    peak: 25000, maxDD: 0, curve: [25000]
  };

  /** one long tape: many contexts, each rebased to continue from the last close */
  /** A context's structure, moved from its own bar/price frame onto the
      stitched tape. Points are copied, never shared with the source gt. */
  function segStruct(g, base, off, end) {
    var P = function (pt) { return pt ? { i: pt.i + base, p: pt.p + off } : null; };
    return {
      from: base, to: end,
      labels: (g.labels || []).filter(function (L) { return L && L[0]; })
        .map(function (L) { return [P(L[0]), L[1]]; }),
      rangeTop: g.rangeTop != null ? g.rangeTop + off : null,
      rangeBot: g.rangeBot != null ? g.rangeBot + off : null,
      trendline: g.trendline && g.trendline.a && g.trendline.b ? {
        a: P(g.trendline.a), b: P(g.trendline.b), slope: g.trendline.slope,
        thru: g.trendline.thru != null ? g.trendline.thru + base : null } : null
    };
  }
  function btSeries(seed, segs) {
    var R = Mkt.mkR(seed), bars = [], first = null, sigs = [], parts = [];
    for (var s = 0; s < segs; s++) {
      var key = R.pick(Mkt.KEYS);
      /* the first segment fixes the instrument and timeframe; the rest follow it,
         so a stitched tape stays one market rather than a medley */
      var c = Mkt.gen({ seed: (seed + s * 7919) >>> 0, ctx: key,
        sym: first ? first.sym : (BT.sym || undefined),
        tf: first ? first.tf : (BT.tf || undefined) });
      if (!first) first = c;
      var src = c.bars, off = bars.length ? bars[bars.length - 1].c - src[0].o : 0;
      var base = bars.length;
      for (var i = 0; i < src.length; i++) {
        var b = src[i];
        bars.push({ t: 0, o: b.o + off, h: b.h + off, l: b.l + off, c: b.c + off, v: b.v });
      }
      /* Every segment is one of the 14 contexts and knows its own setup — where
         the signal bar is, what the entry, stop and target were, and the win rate
         that context is calibrated to. The Desk used to throw all of it away.
         Keep it, rebased onto the stitched tape, so the coach can show the setup
         as it arrives instead of the chart being a mystery. */
      var g = c.gt;
      /* ...and the structure the setup is built on -- its named swing points
         (push 1/2/3, spike high, range high/low...), range and trendline --
         so the chart can show WHICH highs and lows make it a wedge or a
         range, not just where to get in */
      var st = g ? segStruct(g, base, off, base + src.length - 1) : null;
      /* which context each stretch of tape really was -- hindsight for the trade review */
      parts.push({ from: base, to: base + src.length - 1, name: (g && g.name) || (Mkt.CTX[key] || {}).name || key });
      if (g && g.sigIdx != null) {
        sigs.push({ st: st,
          i: base + g.sigIdx, key: g.key, name: g.name, cycle: g.cycle,
          dir: g.dir, tradeable: !!g.tradeable,
          entry: g.entry != null ? g.entry + off : null,
          /* The stop beyond the STRUCTURE (the wedge's third push, the failed
             breakout's low...), which always clears the signal bar too. It is
             the stop each setup's win rate was measured against, and the level
             the card names (stopDesc). Trading the tighter signal-bar stop
             with these odds overstated them badly -- measured: a failed
             breakout won 18% of the time against a stated 65%. */
          stop: g.invalid != null ? g.invalid + off : (g.sigStop != null ? g.sigStop + off : null),
          sigStop: g.sigStop != null ? g.sigStop + off : null,
          invalid: g.invalid != null ? g.invalid + off : null,
          stopDesc: g.stopLevel,
          target: g.target != null ? g.target + off : null,
          prob: g.prob, rr: g.refRR, entryType: g.entryType,
          attempt: g.attempt, style: g.style, brooks: g.brooks,
          sigKind: g.sigKind, worked: g.worked, isFirstAttempt: false
        });
      }
      /* The earlier, distinct attempt — chronologically before the main signal
         and shown first as the tape reveals it. Only pushed when the context
         has a declared, MEASURED first-entry rate and this instance actually
         produced a distinct one; a context whose count never separates from
         the main signal (an attempt="first" context usually IS the first
         count) has nothing extra to show, and that is correct, not a gap. */
      if (g && g.firstAttempt && g.probFirst != null) {
        var fa = g.firstAttempt;
        var faRisk = Math.abs(fa.entry - fa.stop), faRr = faRisk > 0
          ? Math.abs(fa.target - fa.entry) / faRisk : 0;
        sigs.push({ st: st,
          i: base + fa.i, key: g.key, name: g.name + " — first entry", cycle: g.cycle,
          dir: g.dir, tradeable: true,
          /* the structural stop, which is what probFirst was measured against
             (see firstAttempt: fiH tests `invalid`); the attempt's own bar
             stop only if the structure is not below this earlier entry */
          entry: fa.entry + off,
          stop: g.invalid != null && (fa.entry - g.invalid) * g.dir > 0 ? g.invalid + off : fa.stop + off,
          sigStop: fa.stop + off, invalid: g.invalid != null ? g.invalid + off : null,
          stopDesc: "the first attempt's own bar", target: fa.target + off,
          prob: g.probFirst, rr: faRr, entryType: g.entryType,
          attempt: "first", style: g.style,
          brooks: "This is the earlier attempt — the one before the standard " +
            (g.attempt || "second") + " entry. " + (g.brooks || ""),
          sigKind: null, worked: fa.worked, isFirstAttempt: true
        });
      }
    }
    /* Each segment carries its own clock, so the stitched tape needs one
       continuous time axis or the labels come out as NaN. */
    var step = 60000 * ((Mkt.TFS.filter(function (x) { return x.k === first.tf; })[0] || { min: 15 }).min);
    var t0 = first.bars[0].t;
    for (var k = 0; k < bars.length; k++) bars[k].t = t0 + k * step;

    /* a tape that drifts to absurd prices reads badly — keep it in a sane band */
    var lo = Infinity;
    bars.forEach(function (b) { lo = Math.min(lo, b.l); });
    if (lo <= first.bars[0].o * 0.25) {
      var lift = first.bars[0].o * 0.4 - lo;
      bars.forEach(function (b) { b.o += lift; b.h += lift; b.l += lift; b.c += lift; });
      /* the setups' prices have to move with the bars, or Coach's lines sit
         `lift` away from the structure they describe */
      sigs.forEach(function (sg) {
        ["entry", "stop", "sigStop", "invalid", "target"].forEach(function (k) { if (sg[k] != null) sg[k] += lift; });
      });
      var lifted = [];
      sigs.forEach(function (sg) {
        var t = sg.st;
        if (!t || lifted.indexOf(t) >= 0) return;   /* first entry shares its main signal's structure */
        lifted.push(t);
        t.labels.forEach(function (L) { L[0].p += lift; });
        if (t.rangeTop != null) t.rangeTop += lift;
        if (t.rangeBot != null) t.rangeBot += lift;
        if (t.trendline) { t.trendline.a.p += lift; t.trendline.b.p += lift; }
      });
    }
    return { bars: bars, sym: first.sym, nm: first.nm, tf: first.tf, tfLbl: first.tfLbl,
      dec: first.dec, kind: first.kind, seed: seed, U: first.U, sigs: sigs, parts: parts,
      atr: Mkt.atr(bars, 14, Math.min(60, bars.length - 1)), gt: null };
  }

  /* Units per lot, the way a broker would quote the instrument. Size is entered
     in lots because that is what you actually type into a platform; units are
     what the P/L maths needs, so everything converts through here. */
  var LOT = { EURUSD: 100000, GBPUSD: 100000, USDJPY: 100000, GBPJPY: 100000,
              XAUUSD: 100, BTCUSD: 1, ES: 50, NQ: 20, GER40: 25, CL: 1000 };
  var LOT_KIND = { fx: 100000, crypto: 1, fut: 1, eq: 100 };
  function lotUnits(ch) {
    ch = ch || BT.ch;
    if (!ch) return 1;
    return LOT[ch.sym] || LOT_KIND[ch.kind] || 1;
  }
  /* P/L accrues in the instrument's QUOTE currency. Everything here is quoted in
     USD except the JPY cross, so without this a 1.00 move on GBPJPY would be
     booked as $100,000 a lot instead of about $667, and risk-based lot sizes
     would come out ~150x too small. */
  /* Profit on a JPY-quoted pair is earned in yen, so it converts at USDJPY —
     the same rate for every JPY cross, not the pair's own price. */
  var QUOTE = { USDJPY: 1 / 156, GBPJPY: 1 / 156, GER40: 1.146 };   /* DAX pays in euros */
  function qRate(ch) { return QUOTE[(ch || BT.ch || {}).sym] || 1; }
  /** money per 1.00 of price movement, for the given number of units */
  function pointValue(units) { return units * qRate(); }
  /** the instrument's tick: a pip on FX, one point elsewhere */
  function pipSize(ch) {
    ch = ch || BT.ch;
    return ch && ch.kind === "fx" ? Math.pow(10, -(ch.dec - 1)) : 1;
  }
  function pipName(ch) { ch = ch || BT.ch; return ch && ch.kind === "fx" ? "pip" : "point"; }
  function toLots(units) { return units / lotUnits(); }
  function toUnits(lots) { return lots * lotUnits(); }
  function fmtLots(units) {
    var l = toLots(units);
    return (l >= 100 ? l.toFixed(0) : l >= 1 ? l.toFixed(2) : l.toFixed(3)) + " lot" + (Math.abs(l) === 1 ? "" : "s");
  }
  /** what one pip (FX) or one point (everything else) is worth on a single lot */
  function perPoint() { return lotUnits() * qRate() * pipSize(); }

  function btPrice() { var b = BT.ch.bars[chB.vis]; return b ? b.c : 0; }
  function btATR() { return Mkt.atr(BT.ch.bars, 14, Math.min(chB.vis, BT.ch.bars.length - 1)) || 1; }
  function money(v) {
    var s = Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US")
      : (Math.round(v * 100) / 100).toFixed(2);
    return (v < 0 ? "-" : "") + "$" + s.replace("-", "");
  }
  function px(v) { return fmtN(v, BT.ch ? BT.ch.dec : 2); }

  /** open P/L of one position at a price */
  function posPL(p, at) { return (at - p.entry) * p.dir * p.units * qRate(); }
  function openPL() {
    var at = btPrice(), t = 0;
    BT.pos.forEach(function (p) { t += posPL(p, at); });
    return t;
  }
  function equity() { return BT.balance + openPL(); }

  /** units implied by the risk model — the whole point of sizing by risk */
  /* What one percent of the account would buy at this stop distance. Shown on the
     ticket as a yardstick only — nothing in the app sizes a trade for you. */
  function unitsFor(entry, stop) {
    var d = Math.abs(entry - stop) * qRate();
    if (!(d > 0)) return 0;
    return (equity() * 0.01) / d;
  }

  /* ---------- order / position lifecycle ---------- */
  function btOpen(dir, entry, units, sl, tp, atIdx, meta) {
    var p = { id: BT.nextId++, dir: dir, entry: entry, units: units, units0: units,
      sl: sl, tp: tp, openIdx: atIdx,
      rpu: Math.abs(entry - sl) * qRate(),   /* money risked per unit, fixed at entry */
      partials: [], exits: [] };
    if (meta && !BT._auto) {
      var eq0 = equity();
      p.meta = meta; meta.fill = entry; meta.openIdx = atIdx;
      meta.riskMoney = p.rpu * units; meta.riskPct = eq0 > 0 ? meta.riskMoney / eq0 * 100 : 0;
    }
    BT.pos.push(p); syncDraw(); return p;
  }
  /** close all or part of a position at `price`; pct is a share of the ORIGINAL size */
  function btClose(p, price, pct, why) {
    pct = Math.min(1, Math.max(0, pct == null ? 1 : pct));
    var unitsOut = Math.min(p.units, p.units0 * pct);
    if (unitsOut <= 1e-12) return;
    var pl = (price - p.entry) * p.dir * unitsOut * qRate();
    BT.balance += pl;
    p.units -= unitsOut;
    BT.log.push({ id: p.id, dir: p.dir, entry: p.entry, exit: price, units: unitsOut,
      /* R is measured against the risk the WHOLE trade started with — dividing a
         partial by its own slice risk would make scaling out look better than it is */
      pl: pl, r: p.rpu > 0 ? pl / (p.rpu * p.units0) : 0,
      why: why || "manual", idx: chB.vis, openIdx: p.openIdx, ch: BT.ch, sl: p.sl, tp: p.tp, setup: p.setup || null });
    if (p.exits) p.exits.push({ idx: chB.vis, price: price, why: why || "manual", pl: pl,
      r: p.rpu > 0 ? pl / (p.rpu * p.units0) : 0 });
    if (p.units <= 1e-9) {
      histAdd(p);
      BT.pos.splice(BT.pos.indexOf(p), 1);
      /* One point per finished trade. Sampling equity every bar instead would
         draw the open-profit wobble, and a drawdown you never actually took. */
      BT.curve.push(BT.balance);
      if (BT.balance > BT.peak) BT.peak = BT.balance;
      BT.maxDD = Math.max(BT.maxDD, BT.peak > 0 ? (BT.peak - BT.balance) / BT.peak : 0);
    }
    syncDraw();
  }

  /** How many more units would bring this position's total risk up to 1% of
      equity, priced off adding at the CURRENT market price against its
      EXISTING stop. Zero if it's already at or above 1%, or if price has
      somehow ended up on the wrong side of its own stop (should already be
      closed by then, but a position with no real risk distance left has
      nothing sane to size against either way). */
  function topUpUnits(p) {
    var targetRisk = equity() * 0.01, currentRisk = p.rpu * p.units;
    /* A relative margin, not currentRisk >= targetRisk outright -- a position
       just topped up to exactly 1% can land a hair under it from ordinary
       floating-point noise, and that noise scales with the position's own
       numbers (price, equity), so a fixed absolute cutoff would need to be
       different for every instrument. Within 0.1% of budget counts as there. */
    if (currentRisk >= targetRisk * 0.999) return 0;
    var priceNow = btPrice();
    if ((priceNow - p.sl) * p.dir <= 0) return 0;
    var riskPerUnitNow = Math.abs(priceNow - p.sl) * qRate();
    if (!(riskPerUnitNow > 0)) return 0;
    return (targetRisk - currentRisk) / riskPerUnitNow;
  }
  /** Add units to an open position at the current price -- the same thing a
      broker does when you buy more of something you already hold: the two
      fills net into one blended entry, weighted by size. The stop and target
      stay exactly where they were; only the entry moves (toward the current
      price) and the risk-per-unit is re-derived from that new entry, so the
      position's total risk-if-stopped genuinely reflects the size it is now,
      not the size it was at the original fill. */
  function btAddUnits(p, addUnits) {
    if (!(addUnits > 0)) return;
    var priceNow = btPrice(), newUnits = p.units + addUnits;
    p.entry = (p.entry * p.units + priceNow * addUnits) / newUnits;
    p.units = p.units0 = newUnits;
    p.rpu = Math.abs(p.entry - p.sl) * qRate();
    syncDraw();
  }

  /** fills for the bar that was just revealed — pending orders first, then exits */
  function btFills(i) {
    var b = BT.ch.bars[i];
    if (!b) return;

    /* pending orders. A stop order fills at its price, or at the open when the
       bar gapped straight through it; a limit fills at its price or better. */
    for (var k = BT.ord.length - 1; k >= 0; k--) {
      var o = BT.ord[k], hit = false, fill = o.price;
      if (o.kind === "stop") {
        if (o.dir > 0 && b.h >= o.price) { hit = true; fill = b.o > o.price ? b.o : o.price; }
        if (o.dir < 0 && b.l <= o.price) { hit = true; fill = b.o < o.price ? b.o : o.price; }
      } else {
        if (o.dir > 0 && b.l <= o.price) { hit = true; fill = b.o < o.price ? b.o : o.price; }
        if (o.dir < 0 && b.h >= o.price) { hit = true; fill = b.o > o.price ? b.o : o.price; }
      }
      if (hit) {
        BT.ord.splice(k, 1);
        var np = btOpen(o.dir, fill, o.units, o.sl, o.tp, i, o.meta);
        if (o.setup) np.setup = o.setup;
        toast((o.dir > 0 ? "Buy" : "Sell") + " " + o.kind + " filled — " + fmtLots(o.units) + " at " + px(fill));
      }
    }

    /* exits. When a bar covers both the stop and a target, the stop is taken
       first — the bar's path is unknown and flattering yourself here is the
       fastest way to build a backtest that lies to you. */
    for (var j = BT.pos.length - 1; j >= 0; j--) {
      var p = BT.pos[j], d = p.dir;
      /* a level the bar OPENED beyond was gapped through: a real order fills
         at the open, not at the level (worse for a stop, better for a target) */
      var past = function (lvl, fav) { return fav ? (d > 0 ? Math.max(b.o, lvl) : Math.min(b.o, lvl))
                                                 : (d > 0 ? Math.min(b.o, lvl) : Math.max(b.o, lvl)); };
      if (p.openIdx === i) {
        /* The fill bar. Its high and low may have come before the fill, so
           they prove nothing -- but its CLOSE came after it. A close beyond
           the stop means the stop was hit on this bar; booking it on the next
           bar instead put the exit at a price that bar never traded. A close
           beyond the target means the target was hit -- unless the bar also
           reached the stop, where the order is unknown and the stop counts. */
        /* filled beyond its own stop or target (the price was already past
           the order when it triggered): the trade's premise -- a set risk and
           reward from THIS entry -- never existed. Closed flat and labelled so,
           never booked as a 'stop' at a profit or a 'target' at a loss. */
        if ((p.sl != null && (p.entry - p.sl) * d <= 0) || (p.tp != null && (p.tp - p.entry) * d <= 0)) {
          btClose(p, p.entry, 1, "invalid-fill");
          continue;
        }
        var cS = p.sl != null && (d > 0 ? b.c <= p.sl : b.c >= p.sl);
        var cT = p.tp != null && (d > 0 ? b.c >= p.tp : b.c <= p.tp);
        var reachS = p.sl != null && (d > 0 ? b.l <= p.sl : b.h >= p.sl);
        if (cS || (cT && reachS)) btClose(p, p.sl, 1, "stop");
        else if (cT) btClose(p, p.tp, 1, "target");
        continue;
      }
      var slHit = p.sl != null && (d > 0 ? b.l <= p.sl : b.h >= p.sl);
      if (slHit) { btClose(p, past(p.sl, false), 1, "stop"); continue; }
      (p.partials || []).forEach(function (pt) {
        if (pt.done) return;
        var touched = d > 0 ? b.h >= pt.price : b.l <= pt.price;
        if (touched) { pt.done = true; btClose(p, past(pt.price, true), pt.pct / 100, "partial"); }
      });
      if (p.units <= 1e-9) continue;
      if (p.tp != null && (d > 0 ? b.h >= p.tp : b.l <= p.tp)) btClose(p, past(p.tp, true), 1, "target");
    }

  }

  /* ---------- the coach ----------
     The tape is stitched from the same 14 contexts the drills use, and each one
     carries its setup: where the signal bar is, the entry, the stop beyond that
     bar, the target, and the win rate the context is calibrated to. With the
     coach on, that setup surfaces the moment its signal bar is revealed — the
     actual decision point — so the tape can be traded as the method says
     instead of guessed at.

     It is NOT a profitable-strategy finder. These probabilities come from
     Brooks' teaching encoded into the generator and verified self-consistent
     against it; they are not the result of backtesting live markets. What this
     trains is execution: whether you can take the setup you are shown, at the
     size you chose, over and over, without flinching or improvising. */
  var COACH_WINDOW = 6;        /* bars a signal stays actionable after it prints */

  /* =====================================================================
     READING COACH — finds every taught setup from the bars on screen only.
     The answer-key Coach reads the setups the generator planted; that is a
     fine teacher and an unfair trader. This one has to recognise them the
     way you do: at each bar it looks only at that bar and the ones before it,
     and applies the setup's own rules (the same signal bar, entry, stop just
     beyond the signal bar, and target the context teaches). It can be wrong
     -- that is the point: its record measures recognition, not the key.

     Everything is written in the bull frame. A bear setup is the same code
     run on a mirrored copy of the chart (high <-> -low), which is exactly how
     the generator builds its bearish twins.
     ===================================================================== */
  var READ_KEYS = ["failedBo", "successBo", "mtr", "finalFlag", "wedgeBottom", "climax",
    "spikeChannel", "twoLegPullback", "tightChannel", "broadChannel", "rangeLow"];

  /** bull-frame arrays for a tape, extended lazily. Each value at bar i uses
      only bars 0..i, so computing ahead of the revealed bar leaks nothing. */
  function rdFrame(ch, m) {
    var k = m > 0 ? "_rfU" : "_rfD", f = ch[k];
    if (!f) f = ch[k] = { m: m, H: [], L: [], O: [], C: [], E: [], TR: [], A: [], piv: [], pivTo: 2 };
    var B = ch.bars;
    for (var i = f.H.length; i < B.length; i++) {
      var b = B[i];
      f.H.push(m > 0 ? b.h : -b.l); f.L.push(m > 0 ? b.l : -b.h);
      f.O.push(m * b.o); f.C.push(m * b.c);
      f.E.push(i ? f.C[i] * (2 / 21) + f.E[i - 1] * (19 / 21) : f.C[i]);
      f.TR.push(i ? Math.max(f.H[i] - f.L[i], Math.abs(f.H[i] - f.C[i - 1]), Math.abs(f.L[i] - f.C[i - 1])) : f.H[i] - f.L[i]);
      var s = 0, n = 0;
      for (var j = Math.max(0, i - 13); j <= i; j++) { s += f.TR[j]; n++; }
      f.A.push(s / n || 1e-9);
    }
    return f;
  }
  /* swing points, 3 bars each side -- confirmed only once 3 more bars exist */
  function rdPivots(f, v) {
    for (var i = f.pivTo + 1; i <= v - 3; i++) {
      var isH = true, isL = true;
      for (var j = i - 3; j <= i + 3; j++) {
        if (j === i) continue;
        if (f.H[j] >= f.H[i]) isH = false;
        if (f.L[j] <= f.L[i]) isL = false;
      }
      if (isH) f.piv.push({ i: i, p: f.H[i], d: 1 });
      if (isL) f.piv.push({ i: i, p: f.L[i], d: -1 });
      f.pivTo = i;
    }
    return f.piv;

  /** confirmed swings of one kind (d = 1 highs, -1 lows) with index in [a, v-3] */
  function pv(f, v, a, d) {
    var P = rdPivots(f, v), lo = 0, hi = P.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (P[mid].i < a) lo = mid + 1; else hi = mid; }
    var out = [];
    for (var k = lo; k < P.length && P[k].i <= v - 3; k++) if (P[k].d === d) out.push(P[k]);
    return out;
  }
  function hiF(f, a, z) {
    a = Math.max(0, a); var bi = a, bv = -Infinity;
    for (var i = a; i <= z; i++) if (f.H[i] > bv) { bv = f.H[i]; bi = i; }
    return { i: bi, p: bv };
  }
  function loF(f, a, z) {
    a = Math.max(0, a); var bi = a, bv = Infinity;
    for (var i = a; i <= z; i++) if (f.L[i] < bv) { bv = f.L[i]; bi = i; }
    return { i: bi, p: bv };
  }
  /** a signal bar for a buy. Strong: a bull bar closing in its top quarter
      with a real body and real size -- what the method calls a good signal
      bar. Weak: closes in its upper half (a range edge, where bad bars are
      normal and the second attempt replaces bar quality). */
  function sigBar(f, v, strong) {
    var r = f.H[v] - f.L[v];
    if (!(r > 0)) return false;
    var pos = (f.C[v] - f.L[v]) / r, body = f.C[v] - f.O[v];
    return strong ? (body >= 0.35 * r && pos >= 0.75 && r >= 0.6 * f.A[v]) : (body >= 0 && pos >= 0.5);
  }
  /** the first good signal bar since bar `from` -- a setup is read once, on
      the bar that completes it, not again on every bar after */
  function firstSig(f, from, v, strong) {
    for (var j = from + 1; j < v; j++) if (sigBar(f, j, strong)) return false;
    return true;
  }
  /** A reversal has to have actually turned: the extreme is at least two bars
      old, nothing has gone lower since, and the signal bar closes above the
      extreme bar's high. Firing on the first bounce off a low is how you buy
      push 2 of a wedge and get stopped by push 3. */
  function turned(f, ext, v) {
    return v - ext.i >= 2 && loF(f, ext.i + 1, v).p > ext.p && f.C[v] > f.H[ext.i];
  }
  /** the first CONFIRMED signal off an extreme: no earlier bar since it both
      was a good signal bar and showed the turn */
  function firstTurn(f, ext, v, strong) {
    for (var j = ext.i + 1; j < v; j++) if (sigBar(f, j, strong) && turned(f, ext, j)) return false;
    return true;
  }
  /** Brooks' count in a pullback from bar `from`: attempts up, each needing a
      lower-high bar before it (High 1, High 2...). `armed` = ready for the next. */
  function hCount(f, from, v) {
    var tries = 0, armed = true;
    for (var j = from + 1; j <= v; j++) {
      if (f.H[j] > f.H[j - 1]) { if (armed) { tries++; armed = false; } }
      else armed = true;

    return { tries: tries, armed: armed };

  /** a trading range over [a, z]: 3-12 ATR tall, a flat average that price
      keeps crossing, and at least two swing tests of each edge */
  function rangeAt(f, a, z, v) {
    a = Math.max(1, a);
    if (z - a < 40) return null;
    var top = hiF(f, a, z), bot = loF(f, a, z), h = top.p - bot.p, A = f.A[v];
    if (h < 3 * A || h > 10 * A) return null;
    if (Math.abs(f.E[z] - f.E[a]) > 0.25 * h) return null;             /* flat: going nowhere */
    var cross = 0;
    for (var i = a + 1; i <= z; i++) if ((f.C[i] - f.E[i]) * (f.C[i - 1] - f.E[i - 1]) < 0) cross++;
    if (cross < 6) return null;                                          /* and back and forth */
    /* each edge tested at least twice, the tests at least 10 bars apart */
    var tt = pv(f, v, a, 1).filter(function (p) { return p.i <= z && p.p >= top.p - 0.2 * h; });
    var tb = pv(f, v, a, -1).filter(function (p) { return p.i <= z && p.p <= bot.p + 0.2 * h; });
    if (tt.length < 2 || tb.length < 2) return null;
    if (tt[tt.length - 1].i - tt[0].i < 10 || tb[tb.length - 1].i - tb[0].i < 10) return null;
    return { top: top, bot: bot, h: h };

  /* ---- the detectors, one per taught setup (bull frame) ---- */
  /* which rule turned a bar down, for tuning (RD._why) */
  function no(code) { RD._why = code; return null; }
  /* ---- the detectors, one per taught setup (bull frame) ----

     good signal bar after the structure's defining extreme. */
  var RD = {
    /* price probes below the range, finds no follow-through, and the first
       good bull bar closes back inside */
    failedBo: function (f, v) {
      if (!sigBar(f, v, true)) return no(1);
      var fail = loF(f, v - 7, v), A = f.A[v];
      var r = rangeAt(f, v - 90, fail.i - 2, v); if (!r) return no(2);
      if (!(fail.p < r.bot.p - 0.15 * A) || fail.p < r.bot.p - 0.35 * r.h) return no(3);
      if (!(f.C[v] > r.bot.p)) return no(4);
      if (!turned(f, fail, v)) return no(4);
      if (!firstTurn(f, fail, v, true)) return no(5);
      return { target: r.top.p, rangeTop: r.top.p, rangeBot: r.bot.p, from: v - 90, anchor: fail.i, stopAt: fail.p, stopName: "failed breakout low",
        lab: [[r.top, "range high"], [r.bot, "range low"], [fail, "failed breakout low"]] };
    },
    /* the breakout: closes clear of the range over a few bars and holds; the
       first pullback stays outside and a good bull bar ends it */
    successBo: function (f, v) {
      if (!sigBar(f, v, true)) return no(6);

      for (var i = v - 3; i >= v - 14 && bo < 0; i--) {

      var peak = hiF(f, bo, v - 1);
      if (peak.p < r.top.p + 0.15 * r.h || peak.i >= v - 1) return no(8);     /* it went somewhere, then paused */
      var pb = loF(f, peak.i, v);
      if (pb.p < r.top.p - 0.1 * r.h) return no(9);                            /* the pullback held outside */
      if (!firstSig(f, peak.i, v, true)) return no(10);
      return { target: r.top.p + r.h, rangeTop: r.top.p, rangeBot: r.bot.p, from: bo - 90, anchor: bo, stopAt: pb.p, stopName: "breakout pullback low",
        lab: [[r.top, "range high"], [r.bot, "range low"], [pb, "breakout pullback low"]] };
    },
    /* a real bear trend, its trendline broken by a rally, and a test of the

    mtr: function (f, v) {

      var low = loF(f, legHi.i - 35, legHi.i);

      var phs = pv(f, v, st.i, 1).filter(function (p) { return p.i < low.i; });
      if (phs.length < 2) return no(14);
      var a = phs[phs.length - 2], b = phs[phs.length - 1];
      if (!(b.p < a.p) || b.i - a.i < 4) return no(15);
      var slope = (b.p - a.p) / (b.i - a.i), brk = null;
      for (var i = low.i + 1; i <= legHi.i; i++) { if (f.H[i] > b.p + slope * (i - b.i) + 0.2 * A) { brk = { i: i, p: f.H[i] }; break; } }
      if (!brk) return no(16);
      if (legHi.p - test.p < 0.4 * leg) return no(17);                       /* a real pullback */
      if (test.p < low.p - 0.8 * A || test.p > low.p + 0.6 * leg) return no(18);
      if (hiF(f, legHi.i + 1, v).p > legHi.p) return no(19);
      if (!turned(f, test, v)) return no(19);
      if (!firstTurn(f, test, v, true)) return no(20);

        trendline: { a: a, b: b, slope: slope, thru: brk.i },
        lab: [[low, "trend low"], [brk, "trendline break"], [test, test.p > low.p ? "higher low" : "lower low test"], [legHi, "first leg high"]] };
    },
    /* late in a bear trend a small flag breaks down, and the breakout fails

    finalFlag: function (f, v) {

      if (!(f.C[v] > legLo.p) || !turned(f, fail, v)) return no(24);

      if (lhs.length < 2 || !(lhs[lhs.length - 1].p < lhs[lhs.length - 2].p)) return no(26);   /* lower highs: a trend */
      if (fail.i - legLo.i < 4 || fail.i - legLo.i > 16) return no(26);       /* a flag is a few bars */
      if (!firstTurn(f, fail, v, true)) return no(27);
      return { target: flagTop.p + (flagTop.p - fail.p), from: st.i, anchor: fail.i, stopAt: fail.p, stopName: "failed breakout low",

    },
    /* three pushes down, each a lower low, with lower highs between them and

      if (pls.length < 2) return no(29);

      if (!firstTurn(f, p3, v, true)) return no(35);

    /* one accelerating leg down -- further and faster each stretch, bigger

      if (h < 4 * A) return no(37);

        lab: [[cs, "first leg low"], [legH, "first leg high"], [pl, "pullback low"]] };
    },
    /* rising highs and lows in big, two-sided swings; a deep pullback toward

    broadChannel: function (f, v) {
      if (!sigBar(f, v, true)) return no(58);
      var A = f.A[v], phs = pv(f, v, v - 90, 1);
      if (phs.length < 2) return no(59);
      var c2 = phs[phs.length - 1], c1 = null;
      for (var k = phs.length - 2; k >= 0; k--) if (c2.i - phs[k].i >= 8) { c1 = phs[k]; break; }

  function fibParse(txt) {

    e.value = fibFmt(Mkt.FIB.ext);
    function apply(which, el) {
      var v = fibParse(el.value);

      Mkt.FIB[which] = v;

    }
    r.onchange = function () { apply("ret", r); };
    e.onchange = function () { apply("ext", e); };

      Mkt.FIB.ext = [0, 0.618, 1, 1.272, 1.618, 2, 2.618];

  function takeSignal() {

  /* ---------- lifecycle ---------- */
  /** Keep the tape going: generate k more segments of the same market and

      var t = g.st;

  /* ---------- automated batch run ----------

     in one go instead of one at a time.

     Important: this is a consistency check on the odds Brooks' teaching
     encoded into the generator (see the note above COACH_WINDOW), not a test
     against real market data -- the synthetic bars are shaped to REALISE
     those documented win rates, not to discover them independently. A green
     run here shows the method's claimed numbers hold together and that
     following them mechanically compounds; it is not proof of a real edge. */
  /* The auto-backtest in three parts so it can run two ways: all at once

     (autoWatch). Both drive exactly the same tick, so what you watch is
     what the instant run does. */
  function autoBegin(n) {
    n = Math.max(1, Math.min(5000, Math.round(n) || 100));
    if (BT.playing) btPlay();
    if (BT.log.length && !confirm("Run " + n + " automatic trades? This clears the " +
      BT.log.length + " trade" + (BT.log.length === 1 ? "" : "s") + " already in this account " +
      "and starts fresh from " + money(BT.start) + ".")) return null;
    btResetAccount(BT.start);
    var wasCoach = BT.coach;
    BT._auto = true;                   /* Coach's own trades stay out of your History */
    BT.coach = true;

       below starts a brand new tape, and on "Any market" that re-rolls a
       fresh random instrument every time -- so a single 100-trade run could
       silently drift from USDJPY to Bitcoin to an index, each with its own
       price scale, decimal precision and lot-size convention. Every trade's
       own dollar P/L and R stay correct regardless (each is computed against

       report's lot size and price formatting always read off the CURRENT

    if (!BT.tf) BT.tf = (BT.ch && BT.ch.tf) || Mkt.TFS[Math.floor(Math.random() * Mkt.TFS.length)].k;

    else if (rec.riskPct < 0.6) info("Risk only " + rec.riskPct.toFixed(2) + "% — fine if deliberate, but it shrinks the winners as much as the losers.");

  /** plain text, for pasting into a chat and picking apart */
  function histReport() {
    var L = ["TRADE TRAINER v" + APP.version + " — trade history (" + HIST.length + " trades)", ""];
    HIST.forEach(function (x) {
      var A = histReview(x);
      L.push("#" + x.n + " " + x.sym + " " + (x.tfLbl || x.tf) + " " + (x.dir > 0 ? "long" : "short") + " " + x.kind +
        "  entry " + fmtN(x.entry, x.dec) + " stop " + fmtN(x.sl0, x.dec) + " target " + fmtN(x.tp0, x.dec) +
        "  risk " + x.riskPct.toFixed(2) + "%  -> " + x.why + " " + (x.r >= 0 ? "+" : "") + x.r.toFixed(2) + "R" +
        "  best +" + A.mfe.toFixed(2) + "R  grade " + A.grade);
      A.notes.forEach(function (nn) { L.push("    " + (nn.k === "good" ? "+" : nn.k === "bad" ? "-" : "·") + " " + nn.t); });
    });
    return L.join("\n");
  }

  function btStep(n) {
    if (!BT.ch) return;
    for (var k = 0; k < n; k++) {
      if (chB.vis >= BT.ch.bars.length - 1) extendTape(BT.ch, 6);   /* the tape never runs out under you */
      chB.vis++;
      btFills(chB.vis);
      if (chB.vis > chB.i1 - 4) { chB.i0 += 1; chB.i1 += 1; }
    }
    /* the live setup changes as bars arrive, so its lines have to be rebuilt --
       also true of the ticket preview even with Coach off: its entry line
       (for a market order) and defaults track the current price, and its
       anchor bar needs to keep pace with the tape instead of drifting stale
       behind it. */
    syncDraw();
    chB.render(); paintBT();
  }
  function btPlay() {
    if (BT.playing) { clearInterval(BT.timer); BT.timer = null; BT.playing = false; }
    else { BT.playing = true; BT.timer = setInterval(function () { btStep(1); }, BT.speed); }
    var b = $("btPlayBtn"); if (b) b.textContent = BT.playing ? "Pause ❚❚" : "Play ▶";
  }
  function buildBTTools() {

      Mkt.INSTR.map(function (x) {
        return '<option value="' + x.sym + '"' + (BT.sym === x.sym ? ' selected' : '') +
          '>' + x.sym + '</option>';
      }).join('') + '</select>' +
      '<select class="tool wide" id="btTf" title="Timeframe">' +
      '<option value=""' + (BT.tf ? '' : ' selected') + '>Any TF</option>' +
      Mkt.TFS.map(function (t) {
        return '<option value="' + t.k + '"' + (BT.tf === t.k ? ' selected' : '') +
          '>' + t.k + '</option>';
      }).join('') + '</select>' +
      '<div class="tsep"></div>';
    TOOLBTN.forEach(function (t) {
      if (t[0] === "pos") return;                 /* replaced by the order tool below */

    });
    html += '<button class="tool lab" data-tool="btorder" title="Work an order at a price you click">' +
      '<span class="ic">⊕</span><span class="tl">Order</span></button>' +
      '<div class="tsep"></div>' +
      actBtn("undo", "↺", "Undo", "Undo the last drawing") +
      actBtn("clear", "✕", "Clear all", "Clear every drawing — to remove just one, click it and press its ✕") +
      actBtn("fit", "⤢", "Fit", "Fit the chart to the bars") +
      '<button class="tool lab' + (BT.dealMap ? ' on' : '') + '" data-act="deals" title="Deal map — draw every closed trade on this tape from entry to exit">' +
      '<span class="ic">⤳</span><span class="tl">Deals</span></button>' +
      actBtn("copy", "⧉", "Copy", "Copy what's on screen as text — the bars, the read, the setup and your orders — to paste into a chat") +
      '<div class="tsep"></div>' +

         screens with nothing to show it was there. */
      '<button class="tool wide" data-act="coach" id="btCoachBtn"' +
      (BT.coach ? ' style="border-color:var(--amber);background:#241a08;color:var(--amber)"' : '') +
      ' title="Name the setup the tape is printing and show its entry, stop, target and win rate' +
      ' — turn it off to read the chart yourself">' +
      (BT.coach ? '\u25cf Coach: ON' : '\u25cb Coach: off') + '</button>' +
      '<div class="tsep"></div>' +
      '<button class="tool wide" data-act="s1">Step ▸</button>' +
      '<button class="tool wide" data-act="s10">+10 ▸▸</button>' +
      '<button class="tool wide" data-act="play" id="btPlayBtn">Play ▶</button>' +
      '<select class="tool wide" id="btSpeed" title="Replay speed">' +
      SPEEDS.map(function (x) { return '<option value="' + x[0] + '"' + (BT.speed === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') +
      '</select>' +
      '<div class="tsep"></div>' +
      '<button class="tool wide" data-act="new">New tape</button>';
    wrap.innerHTML = html;
    [].forEach.call(wrap.querySelectorAll("[data-tool]"), function (b) {
      b.onclick = function () { chB.setTool(b.dataset.tool); syncTools(wrap, chB); };
    });
    [].forEach.call(wrap.querySelectorAll("[data-act]"), function (b) {
      b.onclick = function () {
        var a = b.dataset.act;
        if (BT.autoVis && /^(s1|s10|play|coach|new)$/.test(a)) { toast("The backtest is driving the chart — pause or stop it first"); return; }
        if (a === "deals") { BT.dealMap = !BT.dealMap; buildBTTools(); chB.render(); return; }
        if (a === "undo") { chB.undo(); syncDraw(); }
        if (a === "clear") { chB.drawings = chB.drawings.filter(function (d) { return d._bt; }); }
        if (a === "fit") chB.fit();
        if (a === "copy") { copyText(btChartText()); return; }
        if (a === "s1") btStep(1);
        if (a === "s10") btStep(10);
        if (a === "play") btPlay();
        if (a === "coach") {
          BT.coach = !BT.coach;
          buildBTTools(); syncDraw(); chB.render(); paintBT();
          toast(BT.coach
            ? "Coach on — setups appear as their signal bar prints"
            : "Coach off");
          return;
        }
        if (a === "new") {
          /* the account carries over on purpose: a sample of trades is only
             meaningful once it spans more than one stretch of market */
          var nPos = BT.pos.length, nOrd = BT.ord.length;
          if (!okToLeaveTape()) return;
          btNew(true);
          toast("New tape — " + (nPos ? nPos + " position(s) closed and booked, " : "") +
            (nOrd ? nOrd + " order(s) cancelled, " : "") + "account kept");
          return;
        }
        syncDraw(); chB.render(); paintBT();
      };
    });
    function reTape(what) {
      var nOrd = BT.ord.length;
      btNew(true);
      toast(what + " — " + (nOrd ? nOrd + " order(s) cancelled, " : "") + "account kept");
    }
    var sy = $("btSym");
    if (sy) sy.onchange = function () {
      if (!okToLeaveTape()) { this.value = BT.sym || ""; return; }
      BT.sym = this.value || null;
      reTape(BT.sym ? "Now trading " + BT.sym : "Instrument left to chance");
    };
    var tfSel = $("btTf");
    if (tfSel) tfSel.onchange = function () {
      if (!okToLeaveTape()) { this.value = BT.tf || ""; return; }
      BT.tf = this.value || null;
      reTape(BT.tf ? "Switched to the " + BT.tf + " chart" : "Timeframe left to chance");
    };
    var sp = $("btSpeed");
    if (sp) sp.onchange = function () {
      BT.speed = +this.value || 320;
      if (BT.playing) { btPlay(); btPlay(); }
      if (BT.autoVis) paintBT();
    };
    chB._syncWrap = wrap;
    syncTools(wrap, chB);
  }

  /* ---------- stats ---------- */
  function btStats() {
    /* one position may close in several slices (partials, then the runner);
       a trade is the position, not the slice, or scaling out would inflate
       both the trade count and the win rate */
    var byId = {}, order = [];
    BT.log.forEach(function (t) {
      if (!byId[t.id]) { byId[t.id] = { pl: 0, r: 0 }; order.push(t.id); }
      byId[t.id].pl += t.pl; byId[t.id].r += t.r;
    });
    var w = 0, l = 0, gp = 0, gl = 0, rs = 0, n = order.length;
    order.forEach(function (id) {
      var t = byId[id];
      if (t.pl >= 0) { w++; gp += t.pl; } else { l++; gl += -t.pl; }
      rs += t.r;
    });
    return { n: n, w: w, l: l, win: n ? w / n : 0, pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0),
      avgR: n ? rs / n : 0, netR: rs, net: BT.balance - BT.start };
  }
  function drawCurve() {
    var cv = $("eqCurve"); if (!cv) return;
    var d = window.devicePixelRatio || 1, w = cv.clientWidth || 300, h = 46;
    cv.width = w * d; cv.height = h * d;
    var c = cv.getContext("2d"); c.setTransform(d, 0, 0, d, 0, 0);
    c.clearRect(0, 0, w, h);
    var pts = BT.curve.length > 1 ? BT.curve : [BT.start, BT.start];
    var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
    if (hi - lo < 1e-9) { hi = lo + 1; }
    var x = function (i) { return (i / (pts.length - 1)) * (w - 2) + 1; };
    var y = function (v) { return h - 3 - ((v - lo) / (hi - lo)) * (h - 6); };
    /* the starting balance as a reference line — above it is profit */
    if (BT.start >= lo && BT.start <= hi) {
      c.strokeStyle = "rgba(138,146,162,.45)"; c.setLineDash([3, 3]); c.lineWidth = 1;
      c.beginPath(); c.moveTo(0, y(BT.start)); c.lineTo(w, y(BT.start)); c.stroke(); c.setLineDash([]);
    }
    var up = pts[pts.length - 1] >= BT.start;
    c.strokeStyle = up ? COL.ok : COL.bad; c.lineWidth = 1.5;
    c.beginPath();
    pts.forEach(function (v, i) { i ? c.lineTo(x(i), y(v)) : c.moveTo(x(i), y(v)); });
    c.stroke();
  }

  /* ---------- panel ---------- */
  function paintBT() {
    if (!BT.ch) return;
    var at = btPrice(), A = btATR(), eq = equity(), op = openPL(), st = btStats();
    var out = [];

    /* account */
    /* ---- where this instrument's numbers come from ----
       Stated on screen rather than buried in the help, because "is this real or
       invented?" is the first thing worth knowing about a practice chart. */
    var prov = Mkt.DATA[BT.ch.sym];
    if (prov) {
      var onOneMin = BT.ch.tf === "1m";
      var m1txt = prov.m1 == null
        ? "not testable — no minute data for this instrument"
        : prov.m1 <= 5 ? "holds to within " + prov.m1 + "%"
          : prov.m1 <= 10 ? "drifts about " + prov.m1 + "%"
            : "off by " + prov.m1 + "% — treat 1-minute here with suspicion";
      out.push('<div class="btsec"><h5>Where these bars come from</h5>' +
        '<div class="btkv"><span>Volatility</span><b style="color:var(--up)">Measured, not guessed</b></div>' +
        '<div class="btkv"><span>Source</span><b>' + prov.src + '</b></div>' +
        '<div class="btkv"><span>Sample</span><b>' + prov.n + ', ' + prov.span + '</b></div>' +
        '<div class="btkv"><span>Annualised</span><b>' + prov.ann.toFixed(1) + '%</b></div>' +
        '<div class="btkv"><span>1-minute scaling</span><b class="' +
          (prov.m1 != null && prov.m1 > 10 ? 'dn' : '') + '">' + m1txt + '</b></div>' +
        (onOneMin && prov.m1 != null && prov.m1 > 10
          ? '<div class="hint" style="margin-top:5px;color:var(--dn)">You are on the 1-minute chart, ' +
            'the one timeframe this instrument is least faithful on. Real 1-minute ' + BT.ch.sym +
            ' is choppier than this, because bid-ask bounce is not modelled.</div>'
          : '') +
        '<div class="hint" style="margin-top:5px">Bar <i>shape</i> is one shared calibration across ' +
        'every instrument, fitted to 1.15M real bars. Only the <i>size</i> of the move is per-instrument.</div>' +
        '</div>');
    }

    out.push('<div class="btsec"><h5>Account <span class="mono" style="color:var(--muted)">bar ' +
      (chB.vis + 1) + ' / ' + BT.ch.bars.length + '</span></h5>' +
      '<div class="btgrid">' +
      kv("Balance", money(BT.balance)) +
      kv("Equity", money(eq), eq >= BT.start ? "up" : "dn") +
      kv("Open P/L", money(op), op > 0 ? "up" : op < 0 ? "dn" : "") +
      kv("Peak balance", money(BT.peak)) +
      kv("Max DD", (BT.maxDD * 100).toFixed(1) + "%", BT.maxDD > 0.2 ? "dn" : "") +
      kv("Price", px(at)) +
      '</div>' +
      '<div style="margin-top:7px"><label class="btlab">Start capital</label>' +
      '<input class="btin" id="btStart" type="number" step="any" value="' + BT.start + '"></div>' +
      '<label class="btlab" style="margin-top:8px;display:block">Balance per closed trade' +
      (BT.curve.length > 1 ? '  (' + (BT.curve.length - 1) + ')' : '') + '</label>' +
      '<canvas id="eqCurve"></canvas></div>');

    /* ---- the coach's card ---- */
    coachTally();
    /* Whatever moved the tape, the lines on the chart must match the setup this
       panel is about to describe. Only redraws when the setup actually changed,
       so a rebuild never lands in the middle of a drag. */
    if (BT.coach && liveSignal() !== BT._coachAt) syncDraw();
    if (BT.coach) {
      var cg = liveSignal();
      out.push('<div class="btsec"><h5>Coach <span class="mono">' +
        BT.coachTaken + ' taken / ' + BT.coachSeen + ' seen</span></h5>' +
        '<div class="btseg" style="margin-bottom:5px">' +
        '<button class="' + (BT.coachMode !== "key" ? "on" : "") + '" data-bt="cmode" data-v="read" title="Finds setups from the bars on screen, like you have to">Reads the chart</button>' +
        '<button class="' + (BT.coachMode === "key" ? "on" : "") + '" data-bt="cmode" data-v="key" title="Shows the setups the chart was built from -- always right, for learning">Answer key</button></div>' +
        '<div class="hint" style="margin-bottom:6px;font-size:10.5px">' + (BT.coachMode === "key"
          ? 'Answer key: shows the setups this chart was built from, so it is always right. Good for learning what each one looks like; not a fair trader.'
          : 'Reads the chart: finds each setup from the bars already on screen, like you have to. It can be wrong; its record is the honest one.') + '</div>');
      /* what the swings you can see say the tape IS, and how the ticket's
         trade sits against it -- always on with Coach, not just at a setup */
      var rd = structRead();
      if (rd) {
        out.push('<div class="btrow" style="border-color:rgba(91,155,213,.6)">' +
          '<div class="top"><b style="color:var(--blue,#5B9BD5)">READ</b>' +
          '<span class="mono">' + rd.name + '</span></div>' +
          (rd.why ? '<div class="hint" style="margin-top:3px">Why: ' + rd.why +
            (rd.pos !== null && rd.kind !== "none" ? ' · price is ' +
              (rd.pos < 0.35 ? 'near the low' : rd.pos > 0.65 ? 'near the high' : 'in the middle') + ' of it' : '') +
            '. The swings are labelled on the chart.</div>' :
            '<div class="hint" style="margin-top:3px">Needs two swing highs and two swing lows before it can say trend or range.</div>'));
        /* a reversal setup is by definition against the trend the swings
           show -- say so, rather than leave two cards that look like they
           disagree */
        var lsg = liveSignal();
        if (lsg && lsg.tradeable && (rd.kind === "bull" || rd.kind === "bear") &&
            (lsg.dir > 0) !== (rd.kind === "bull")) {
          out.push('<div class="hint" style="margin-top:4px;color:var(--amber)">Coach\'s setup below trades against this ' +
            rd.kind + ' trend. That is what a reversal setup is — it only works when the trend is failing ' +
            '(a final flag, a wedge, a climax), which is why its odds are lower than a with-trend trade.</div>');
        }
        /* how the ticket sits against this read is graded in the ticket itself */
        out.push('</div>');
      }
      if (!cg) {
        var nx = nextSignal();
        if (nx) {
          var away = nx.i - chB.vis;
          out.push((BT.coachMode === "key" ? '<div class="btkv"><span>Next setup</span><b>' + away +
            ' bar' + (away === 1 ? '' : 's') + ' away</b></div>' +
            '<div class="acts"><button data-bt="skipnext">Skip ahead to it</button></div>'
            : '<div class="btkv"><span>Next setup</span><b>not seen yet</b></div>' +
            '<div class="acts"><button data-bt="skipnext">Step until Coach reads one</button></div>') +
            '<div class="hint" style="margin-top:5px">Setups are roughly a hundred bars apart, ' +
            'so stepping there by hand takes a while. A setup appears the moment its signal bar ' +
            'prints and stays live for ' + COACH_WINDOW + ' bars.</div>');
        } else {
          out.push('<div class="hint">No more setups on this tape. <b>New tape</b> starts ' +
            'another one and keeps your account.</div>');
        }
      } else if (!cg.tradeable) {
        out.push('<div class="btrow"><div class="top">' +
          '<b style="color:var(--muted)">NO TRADE</b>' +
          '<span class="mono">' + cg.cycle + '</span></div>' +
          '<div style="margin-top:3px"><b>' + cg.name + '</b></div>' +
          '<div class="hint" style="margin-top:5px">' + (cg.brooks || '') + '</div>' +
          '<div class="btkv" style="margin-top:5px"><span>The correct trade</span>' +
          '<b>None — sit it out</b></div></div>');
      } else {
        var risk = Math.abs(cg.entry - cg.stop), rew = Math.abs(cg.target - cg.entry);
        var rr = risk > 0 ? rew / risk : 0;
        var edge = cg.prob * rr - (1 - cg.prob);
        var faTag = cg.isFirstAttempt
          ? '<span class="mono" style="color:var(--muted);margin-left:6px">FIRST ENTRY</span>' : '';
        out.push('<div class="btrow" style="border-color:' + (cg.isFirstAttempt ? 'var(--line)' : 'var(--amber)') +
          ';background:' + (cg.isFirstAttempt ? 'var(--bg3)' : '#1a1508') + '">' +
          '<div class="top">' +
          '<b style="color:' + (cg.dir > 0 ? 'var(--up)' : 'var(--dn)') + '">' +
          (cg.dir > 0 ? 'BUY' : 'SELL') + ' ' + (cg.entryType || 'stop').toUpperCase() + '</b>' + faTag +
          '<span class="mono">' + rr.toFixed(2) + 'R</span></div>' +
          '<div style="margin-top:3px"><b>' + cg.name + '</b></div>' +
          (cg.st && cg.st.labels.length ? '<div class="hint" style="margin-top:3px;color:#A98BE8">Built on: ' +
            cg.st.labels.filter(function (L) { return L[0].i <= chB.vis; })
              .sort(function (a, z) { return a[0].i - z[0].i; })
              .map(function (L) { return L[1]; }).join(' → ') +
            ' — marked in violet on the chart.</div>' : '') +
          (cg.isFirstAttempt ? '<div class="hint" style="margin-top:3px">' + cg.brooks + '</div>' : '') +
          '<div class="mono" style="margin-top:4px">entry ' + px(cg.entry) +
          ' · stop ' + px(cg.stop) + ' · target ' + px(cg.target) + '</div>' +
          '<div class="btkv" style="margin-top:5px"><span>' + (cg.read ? 'Taught win rate (if it is the real thing)' : 'Win rate for this setup') + '</span><b>' +
          Math.round(cg.prob * 100) + '%</b></div>' +
          '<div class="btkv"><span>Expectancy</span><b class="' + (edge >= 0 ? 'up' : 'dn') + '">' +
          (edge >= 0 ? '+' : '') + edge.toFixed(2) + 'R per trade</b></div>' +
          '<div class="btkv"><span>Stop sits at</span><b>' + (cg.stopDesc || 'the signal bar') + '</b></div>' +
          '<div class="acts"><button data-bt="take">Fill the ticket with this</button></div>' +
          '</div>');
      }
      out.push('<div class="hint" style="margin-top:6px">' + (BT.coachMode === "key"
        ? 'These odds are Brooks\' method encoded and checked against the generator — not a backtest of live markets. What they drill is execution.'
        : 'The odds are the taught odds for the real setup. Whether Coach reads setups well enough to earn them is what Compare in the Auto-backtest measures.') + '</div>');
      out.push('</div>');
    }

    /* ticket -- same numbers the chart preview draws, from ticketLevels() */
    var ticketLv = ticketLevels();
    var entryFld = ticketLv.entry, sl = ticketLv.sl, tp = ticketLv.tp;
    /* Lots are yours. The app reports what that risks -- it never resizes for
       you on its own, because picking the size is the thing worth practising.
       A one-click "Use" button copies the 1%-risk suggestion in, so matching
       size to a stop you just dragged is a click, not mental arithmetic. */
    var u = toUnits(BT.lots), riskMoney = Math.abs(entryFld - sl) * u * qRate();
    var oneEq = +toLots(unitsFor(entryFld, sl)).toFixed(2);
    /* A small pin button that arms "click the chart to set this price" --
       the same tool used for dragging an existing order's lines, just
       available before the order exists yet. Clicking it again (or clicking
       elsewhere on the chart with cursor/another tool) cancels. */
    function pinLabel(text, field) {
      var armed = chB.tool === "btpick" && chB._pickField === field;
      return '<label class="btlab">' + text +
        '<button class="btpin' + (armed ? ' on' : '') + '" data-bt="pick" data-v="' + field + '" ' +
        'title="' + (armed ? "Cancel picking" : "Click, then tap a price on the chart") + '">' +
        (armed ? "✕" : "⊕") + '</button></label>';
    }
    if (BT.autoVis) out.push('<div class="btsec"><h5>Order ticket</h5><div class="hint">Coach is trading this account — the ticket comes back when the backtest stops.</div></div>');
    else out.push('<div class="btsec"><h5>Order ticket</h5>' +
      '<div class="btseg" style="margin-bottom:7px">' +
      '<button class="buy' + (BT.dir > 0 ? " on" : "") + '" data-bt="dir" data-v="1">Buy</button>' +
      '<button class="sell' + (BT.dir < 0 ? " on" : "") + '" data-bt="dir" data-v="-1">Sell</button></div>' +
      '<div class="btseg" style="margin-bottom:7px">' +
      ["market", "limit", "stop"].map(function (t) {
        return '<button class="' + (BT.otype === t ? "on" : "") + '" data-bt="otype" data-v="' + t + '">' +
          t.charAt(0).toUpperCase() + t.slice(1) + '</button>';
      }).join("") + '</div>' +
      ((BT.pos.length || BT.ord.length)
        ? '<div class="btkv" style="margin-bottom:6px"><span class="hint" style="margin:0">' +
          (showDraft() ? 'New order shown dashed on the chart — not placed yet.'
            : 'New-order preview hidden while a trade is on.') + '</span>' +
          '<button class="btuse" style="white-space:nowrap" data-bt="draft" data-v="' + (showDraft() ? '0' : '1') + '">' +
          (showDraft() ? 'Hide' : 'Show on chart') + '</button></div>'
        : '') +
      (chB.tool === "btpick" && chB._pickField
        ? '<div class="hint" style="margin-bottom:6px;color:var(--amber)">Tap a price on the chart to set the ' +
          (chB._pickField === "entry" ? "entry" : chB._pickField === "sl" ? "stop loss" : "take profit") + '.</div>'
        : '') +
      '<div class="btgrid">' +
      (BT.otype === "market" ? "" :

    /* the way back to every closed trade */

    BT.pos.forEach(function (p) {

        (p.partials.length ? '<div class="acts" style="margin-top:4px">' + p.partials.map(function (x, n) {
          return x.done

            : '<button data-bt="partpct" data-id="' + p.id + '" data-v="' + n + '" title="Tap to change the share">' +

              '<button data-bt="delpart" data-id="' + p.id + '" data-v="' + n + '" title="Remove">✕</button>';
        }).join("") + '</div>' : '') +
        (BT.autoVis ? '</div>' : '<div class="acts">' +
        '<button data-bt="close" data-id="' + p.id + '" data-v="1">Close</button>' +
        '<button data-bt="close" data-id="' + p.id + '" data-v="0.5">Close 50%</button>' +

        '<button data-bt="be" data-id="' + p.id + '">SL to entry</button>' +

        /* Only offered when there's genuinely room to add -- the stop turned

        (addUnits > 1e-9 ? '<button data-bt="topup" data-id="' + p.id +

    });
    out.push('</div>');

    /* pending orders */
    if (BT.ord.length) {
      out.push('<div class="btsec"><h5>Pending orders <span class="mono">' + BT.ord.length + '</span></h5>');
      BT.ord.forEach(function (o) {
        var oRisk = Math.abs(o.price - o.sl) * o.units * qRate();
        var oRR = Math.abs(o.price - o.sl) > 0 ? Math.abs(o.tp - o.price) / Math.abs(o.price - o.sl) : 0;
        /* Dragging the SL line on the chart changes the risk distance, but
           the lot size you already typed doesn't follow it -- so after a
           drag, "Risking" alone forces you to work out the new lots by

          o.kind.toUpperCase() + ' #' + o.id + '</b>' +
          '<span class="mono">' + oRR.toFixed(2) + 'R</span></div>' +
          '<div class="mono">at ' + px(o.price) +
          ' · SL ' + (o.sl == null ? "—" : px(o.sl)) + ' · TP ' + (o.tp == null ? "—" : px(o.tp)) + '</div>' +
          '<div style="margin-top:5px">' +
          '<div><label class="btlab">Lots</label>' +
          '<input class="btin" data-olot="' + o.id + '" type="number" step="0.01" value="' +
          (+toLots(o.units).toFixed(3)) + '"></div>' +
          '</div>' +
          '<div class="btkv" style="margin-top:4px"><span>Risking</span><b>' + money(oRisk) +
          '  (' + (equity() > 0 ? (oRisk / equity() * 100).toFixed(2) : "0") + '%)</b></div>' +
          '<div class="btkv" style="margin-top:2px"><span>1% of equity is</span>' +
          '<span style="display:flex;gap:5px;align-items:center"><b>' + oneEqO + ' lots</b>' +
          '<button class="btuse" data-bt="uselotso" data-id="' + o.id + '" title="Copy this into Lots">Use</button></span></div>' +
          '<div class="acts"><button data-bt="cancel" data-id="' + o.id + '">Cancel order</button></div></div>');
      });
      out.push('</div>');
    }

    /* auto-backtest */
    out.push('<div class="btsec"><h5>Auto-backtest</h5>' +
      '<div class="hint">Runs Coach\'s setups back to back with no clicking — same entries, ' +
      'stops, targets and 1% risk sizing you\'d use by hand. This checks whether following Coach ' +
      'mechanically compounds the way the method\'s own documented odds say it should — the bars ' +
      'are synthetic, so it is <b>not</b> a test against real market data.</div>' +
      (BT.autoVis ? autoPanel() :
      '<div style="margin-top:7px"><label class="btlab">Trades to run</label>' +
      '<input class="btin" id="btAutoN" type="number" step="1" min="1" max="5000" value="' + (BT.autoN || 100) + '"></div>' +
      '<div class="hint" style="margin-top:6px">Coach trading: <b>' + (BT.coachMode === "key" ? 'answer key' : 'reads the chart') + '</b> (switch it in the Coach card).</div>' +
      '<div class="btbtns" style="margin-top:7px"><button class="btn" id="btAutoWatch" title="Play it on the chart bar by bar, like a visual backtest">Watch it trade ▶</button>' +
      '<button class="btn" id="btAutoRun" title="Run every trade instantly">Run instantly</button></div>' +
      '<div class="btbtns"><button class="btn" id="btCompare" title="Run both Coaches on the same charts and compare">Compare: reading vs answer key</button></div>' +
      '<div class="hint" style="margin-top:5px;font-size:10.5px">Watch plays on the chart at the toolbar speed and fast-forwards between setups. Closed trades stay drawn on the chart (Deals).</div>') +
      '</div>');

    /* results */
    out.push('<div class="btsec"><h5>Results</h5><div class="btgrid">' +
      kv("Trades", String(st.n)) +
      kv("Win rate", st.n ? (st.win * 100).toFixed(0) + "%" : "—") +
      kv("Net", money(st.net), st.net >= 0 ? "up" : "dn") +
      kv("Total R", (st.netR >= 0 ? "+" : "") + st.netR.toFixed(2) + "R", st.netR >= 0 ? "up" : "dn") +
      kv("Avg per trade", (st.avgR >= 0 ? "+" : "") + st.avgR.toFixed(2) + "R", st.avgR >= 0 ? "up" : "dn") +
      kv("Profit factor", st.n ? (isFinite(st.pf) ? st.pf.toFixed(2) : "∞") : "—",
        st.pf >= 1 ? "up" : st.n ? "dn" : "") +
      '</div>' +
      (st.n >= 8
        ? '<div class="hint" style="margin-top:7px">' + verdict(st) + '</div>'
        : '<div class="hint" style="margin-top:7px">Take at least 8 trades before reading anything into these numbers.</div>') +
      '<div class="btbtns"><button class="btn" id="btReset">Reset account</button>' +
      '<button class="btn" id="btCopy">📋 Copy results</button></div></div>');

    $("btPanel").innerHTML = out.join("");
    $("btFoot").innerHTML = '<div class="hint">' +
      (BT.coach ? '' : '<b>Coach</b> in the toolbar names the setup the tape is printing and gives you ' +
        'its entry, stop and target. ') +
      'Drag any stop, target or order line straight on the chart. ' +
      'Step the tape with <b>Step</b> or <b>Play</b>; fills happen bar by bar.</div>';
    drawCurve();
    wireBT();
  }
  function kv(k, v, cls) {
    return '<div class="btkv"><span>' + k + '</span><b' +
      (cls ? ' class="' + cls + '"' : '') + '>' + v + '</b></div>';
  }
  /** what the numbers say about the approach, once there are enough of them */
  function verdict(st) {
    if (st.avgR > 0.15 && st.pf >= 1.3)
      return "Positive expectancy: <b>" + st.avgR.toFixed(2) + "R</b> per trade. Keep the sample growing before trusting it.";
    if (st.avgR > 0)
      return "Marginally positive at <b>" + st.avgR.toFixed(2) + "R</b>. Thin enough that costs or one bad run could flip it.";
    if (st.win >= 0.5)
      return "You are right more often than not but still losing: <b>" + st.avgR.toFixed(2) +
        "R</b> per trade. The winners are too small for the losers — look at where you take profit, not at your entries.";
    return "Negative at <b>" + st.avgR.toFixed(2) + "R</b> per trade with a " + (st.win * 100).toFixed(0) +
      "% hit rate. Either the entries have no edge, or the stops are too tight for the targets you are aiming at.";
  }

  /* ---------- wiring ---------- */
  function wireBT() {
    var P = $("btPanel");
    [].forEach.call(P.querySelectorAll("[data-bt]"), function (b) {
      b.onclick = function () {
        var a = b.dataset.bt, id = +b.dataset.id, v = b.dataset.v;
        var pos = BT.pos.filter(function (x) { return x.id === id; })[0];
        if (BT.autoVis && a !== "hist") { toast("The backtest is trading — stop it to trade by hand"); return; }
        if (a === "take") { takeSignal(); return; }
        if (a === "cmode") {
          BT.coachMode = v === "key" ? "key" : "read";
          try { localStorage.setItem("tt_coachmode", BT.coachMode); } catch (e) { }
          toast(BT.coachMode === "key" ? "Coach: answer key — the setups the chart was built from" : "Coach: reads the chart — only the bars on screen");
        }
        if (a === "hist") { setView("history"); return; }
        if (a === "grade") BT.gradeAsk = true;
        if (a === "skipnext") { skipToNext(); return; }
        if (a === "draft") BT.draft = v === "1";
        if (a === "dir" || a === "otype" || a === "pick") BT.draft = true;
        if (a === "dir") { BT.dir = +v; BT.tSL = BT.tTP = BT.tPrice = null; }
        if (a === "otype") {
          BT.otype = v; BT.tPrice = null;
          /* Limit and stop orders need an entry price picked somewhere other
             than the current market -- arm chart-click for it immediately
             instead of leaving the user to hunt for a separate tool. */
          if (v !== "market") { armPick("entry"); } else if (chB.tool === "btpick") { chB.setTool("cursor"); }
        }
        if (a === "pick") {
          if (chB.tool === "btpick" && chB._pickField === v) chB.setTool("cursor");
          else armPick(v);
        }
        if (a === "uselots") {
          var entryEl = $("btPrice"), slEl = $("btSL");
          var entryNow = entryEl ? +entryEl.value : btPrice();
          var slNow = slEl ? +slEl.value : null;
          if (slNow != null && isFinite(slNow) && isFinite(entryNow)) {
            var suggested = unitsFor(entryNow, slNow);
            if (suggested > 0) BT.lots = +toLots(suggested).toFixed(3);
            else toast("Set a stop loss first — there's no risk distance to size against");
          }
        }
        if (a === "uselotso") {
          var ordU = BT.ord.filter(function (x) { return x.id === id; })[0];
          if (ordU) {
            var suggestedO = unitsFor(ordU.price, ordU.sl);
            if (suggestedO > 0) ordU.units = suggestedO;
          }
        }
        if (a === "close" && pos) btClose(pos, btPrice(), +v, "manual");
        if (a === "be" && pos) { pos.sl = pos.entry; syncDraw(); }
        if (a === "topup" && pos) {
          var add = topUpUnits(pos);
          if (add > 0) {
            btAddUnits(pos, add);
            if (pos.meta) pos.meta.topped = true;
            toast("Added " + fmtLots(add) + " at " + px(btPrice()) + " — now risking 1% at the new average entry");
          }
        }
        if (a === "cancel") { BT.ord = BT.ord.filter(function (x) { return x.id !== id; }); syncDraw(); }
        if (a === "addpart" && pos) {
          /* land it at 1R and let them drag it — faster than a prompt, and the
             chart is where the level actually wants to be chosen anyway */
          var n = pos.partials.length + 1;
          pos.partials.push({ price: +(pos.entry + pos.dir * pos.rpu * n).toFixed(BT.ch.dec),
            pct: 50, done: false });
          syncDraw();
        }
        if (a === "delpart" && pos) { pos.partials.splice(+v, 1); syncDraw(); }
        if (a === "partpct" && pos && pos.partials[+v]) {
          var cur = pos.partials[+v].pct;
          pos.partials[+v].pct = cur >= 75 ? 25 : cur >= 50 ? 75 : 50;
        }
        /* A click here is never mid-drag, so rebuilding the ticket preview
           (and everything else) is safe -- this is what keeps the chart
           preview in step with dir/otype/lots changes made in the panel
           rather than by dragging its own lines. */
        syncDraw(); chB.render(); paintBT();
      };
    });
    function num(id, set) {
      var el = $(id);
      if (el) el.onchange = function () {
        var v = +this.value; if (isFinite(v)) set(v);
        if (id !== "btLots") BT.draft = true;
        syncDraw(); chB.render(); paintBT();
      };
    }
    num("btPrice", function (v) { BT.tPrice = v; });
    num("btSL", function (v) { BT.tSL = v; });
    num("btTP", function (v) { BT.tTP = v; });
    num("btLots", function (v) { if (v > 0) BT.lots = v; });
    var stEl = $("btStart");
    if (stEl) stEl.onchange = function () {
      var v = +this.value;
      if (!(v > 0)) { toast("Starting capital must be above zero"); paintBT(); return; }
      /* every past trade was sized off the old stake, so the run restarts */
      if (BT.log.length && !confirm("Change the starting capital to " + money(v) +
        "?\n\nThe " + BT.log.length + " trades already taken were sized against " +
        money(BT.start) + ", so the run resets.")) { paintBT(); return; }
      btResetAccount(v);
    };
    var arBtn = $("btAutoRun");
    if (arBtn) arBtn.onclick = function () {
      var el = $("btAutoN"), n = el ? +el.value : 100;
      if (!(n > 0)) { toast("Enter how many trades to run"); return; }
      BT.autoN = n;
      autoRun(n);
    };
    var cmpBtn = $("btCompare");
    if (cmpBtn) cmpBtn.onclick = function () {
      var el = $("btAutoN"), n = el ? +el.value : 100;
      if (!(n > 0)) { toast("Enter how many trades to run"); return; }
      BT.autoN = n;
      compareCoaches(Math.min(n, 1000));
    };
    var awBtn = $("btAutoWatch");
    if (awBtn) awBtn.onclick = function () {
      var el = $("btAutoN"), n = el ? +el.value : 100;
      if (!(n > 0)) { toast("Enter how many trades to run"); return; }
      BT.autoN = n;
      autoWatch(n);
    };


    [].forEach.call(P.querySelectorAll("[data-olot]"), function (el) {
      el.onchange = function () {
        var o = BT.ord.filter(function (x) { return x.id === +el.dataset.olot; })[0];
        var v = +this.value;
        if (o && v > 0) o.units = toUnits(v);
        chB.render(); paintBT();
      };
    });
    var pl = $("btPlace");
    if (pl) pl.onclick = function () {
      if (BT.autoVis) { toast("The backtest is trading — stop it to trade by hand"); return; }
      var at = btPrice(), A = btATR();
      var entry = BT.otype === "market" ? at
        : (BT.tPrice != null ? BT.tPrice : at + BT.dir * A);
      var sl = BT.tSL != null ? BT.tSL : at - BT.dir * A * 1.5;
      var tp = BT.tTP != null ? BT.tTP : at + BT.dir * A * 3;
      if ((sl - entry) * BT.dir >= 0) { toast("The stop must sit on the losing side of the entry"); return; }
      var u = toUnits(BT.lots);
      if (!(u > 0)) { toast("Size works out to zero — check the stop distance"); return; }
      var meta = tradeMeta(BT.otype, BT.dir, entry, sl, tp);
      if (BT.otype === "market") {
        btOpen(BT.dir, at, u, sl, tp, chB.vis, meta);
        toast((BT.dir > 0 ? "Bought" : "Sold") + " " + fmtLots(u) + " at " + px(at));
      } else {
        /* a stop order must sit beyond the price, a limit order behind it */
        var beyond = (entry - at) * BT.dir > 0;
        if (BT.otype === "stop" && !beyond) { toast("A stop order goes beyond the current price"); return; }
        if (BT.otype === "limit" && beyond) { toast("A limit order goes behind the current price"); return; }
        BT.ord.push({ id: BT.nextId++, kind: BT.otype, dir: BT.dir, price: entry, units: u, sl: sl, tp: tp, meta: meta });
        toast(BT.otype + " order placed at " + px(entry));
      }
      BT.tSL = BT.tTP = BT.tPrice = null;
      BT.draft = false;                /* it's a real order now -- drop the draft */
      BT.gradeAsk = false;             /* the next trade gets asked about afresh */
      syncDraw(); chB.render(); paintBT();
    };

    var rs = $("btReset");
    if (rs) rs.onclick = function () {
      if (BT.log.length && !confirm("Clear the account and start again from " +
        money(BT.start) + "? The " + BT.log.length + " trades in this run are discarded.")) return;
      btResetAccount(BT.start);
    };
    var cp = $("btCopy");
    if (cp) cp.onclick = function () { copyText(btReport()); };
  }

  /** The chart as it stands, as text: enough for someone else to see exactly
      what you see -- the recent bars with each one's shape spelled out, the
      structure read, the live setup and your levels. Only revealed bars. */
  function btChartText(nBars) {
    nBars = nBars || 40;
    var ch = BT.ch, v = chB.vis, bars = ch.bars, dec = ch.dec, L = [];
    var f = function (x) { return fmtN(x, dec); }, A = Mkt.atr(bars, 14, v);
    L.push("TRADE TRAINER v" + APP.version + " — chart " + ch.sym + " " + ch.tfLbl +
      "   seed=" + ch.seed + "   bar " + (v + 1) + " of " + bars.length + "   ATR(14) " + f(A));
    var rd = structRead();
    if (rd) L.push("Read: " + rd.name + (rd.why ? " — " + rd.why : ""));
    var g = liveSignal();
    if (g) L.push("Live setup: " + g.name + (g.tradeable ? "  entry " + f(g.entry) + "  stop " + f(g.stop) + "  target " + f(g.target) +
      (g.prob != null ? "  ~" + Math.round(g.prob * 100) + "%" : "") : ""));
    else if (!BT.coach) L.push("Coach: off");
    L.push("");
    L.push("Last " + Math.min(nBars, v + 1) + " bars (oldest first). gap = open minus previous close.");
    L.push("  #     time    open        high        low         close       bar");
    for (var i = Math.max(0, v - nBars + 1); i <= v; i++) {
      var b = bars[i], rng = b.h - b.l, body = Math.abs(b.c - b.o);
      var kind = body < rng * 0.15 ? "doji" : b.c > b.o ? "bull" : "bear";
      var up = b.h - Math.max(b.o, b.c), dn = Math.min(b.o, b.c) - b.l;
      var desc = kind + " " + Math.round(body / (rng || 1) * 100) + "% body" +
        (up > rng * 0.4 ? ", long top tail" : "") + (dn > rng * 0.4 ? ", long bottom tail" : "") +
        (rng > A * 1.8 ? ", big bar" : "");
      var gp = i > 0 ? b.o - bars[i - 1].c : 0;
      if (Math.abs(gp) > A * 0.05) desc += ", gap " + (gp > 0 ? "+" : "") + f(gp);
      var d = new Date(b.t);
      L.push("  " + String(i + 1).padEnd(5) + " " + ("0" + d.getUTCHours()).slice(-2) + ":" + ("0" + d.getUTCMinutes()).slice(-2) + "   " +
        [b.o, b.h, b.l, b.c].map(function (x) { return f(x).padEnd(11); }).join(" ") + " " + desc);
    }
    if (BT.pos.length || BT.ord.length) L.push("");
    BT.pos.forEach(function (p) {
      L.push("Open " + (p.dir > 0 ? "long " : "short ") + fmtLots(p.units) + " at " + f(p.entry) + "  stop " + f(p.sl) +
        (p.tp != null ? "  target " + f(p.tp) : "") + "  P/L " + money(posPL(p, btPrice())));
    });
    BT.ord.forEach(function (o) {
      L.push("Working " + (o.dir > 0 ? "buy " : "sell ") + o.kind + " " + fmtLots(o.units) + " at " + f(o.price) + "  stop " + f(o.sl) +
        (o.tp != null ? "  target " + f(o.tp) : ""));
    });
    var lv = ticketLevels();
    L.push("Ticket (not placed): " + (BT.dir > 0 ? "buy " : "sell ") + BT.otype + " " + BT.lots + " lots  entry " + f(lv.entry) +
      "  stop " + f(lv.sl) + "  target " + f(lv.tp));
    return L.join("\n");
  }
  /** the run, as text you can paste into a chat and pick apart */
  function btReport() {
    var st = btStats(), L = [];
    L.push("TRADE TRAINER v" + APP.version + " — desk run");
    L.push("Coach: " + (BT.coachMode === "key" ? "answer key (setups the chart was built from)" : "reads the chart (bars on screen only)"));
    L.push("Tape: " + BT.ch.sym + " " + BT.ch.tfLbl + "   seed=" + BT.ch.seed +
      "   bar " + (chB.vis + 1) + " of " + BT.ch.bars.length);
    L.push("Instrument: 1 lot = " + lotUnits().toLocaleString("en-US") + " units, " +
      money(perPoint()) + " per " + pipName());
    L.push("Start " + money(BT.start) + "   balance " + money(BT.balance) +
      "   equity " + money(equity()) + "   max drawdown " + (BT.maxDD * 100).toFixed(1) + "%");
    L.push("Size: " + BT.lots + " lots");
    L.push("");
    L.push("RESULTS over " + st.n + " closed trades");
    L.push("  win rate " + (st.n ? (st.win * 100).toFixed(0) + "%" : "—") +
      "   profit factor " + (st.n ? (isFinite(st.pf) ? st.pf.toFixed(2) : "inf") : "—") +
      "   total " + (st.netR >= 0 ? "+" : "") + st.netR.toFixed(2) + "R" +
      "   avg " + (st.avgR >= 0 ? "+" : "") + st.avgR.toFixed(2) + "R");
    if (st.n >= 8) L.push("  " + verdict(st).replace(/<[^>]+>/g, ""));
    L.push("");
    L.push("TRADES (entry -> exit, why, R)");
    BT.log.forEach(function (t, i) {
      L.push("  " + (i + 1) + ". " + (t.dir > 0 ? "long " : "short") + " " + fmtLots(t.units) +
        "  " + px(t.entry) + " -> " + px(t.exit) + "  " + t.why + "  " +
        (t.r >= 0 ? "+" : "") + t.r.toFixed(2) + "R  " + money(t.pl));
    });
    if (BT.pos.length) {
      L.push("");
      L.push("STILL OPEN");
      BT.pos.forEach(function (p) {
        L.push("  " + (p.dir > 0 ? "long " : "short") + " from " + px(p.entry) +
          "  SL " + (p.sl == null ? "—" : px(p.sl)) + "  TP " + (p.tp == null ? "—" : px(p.tp)) +
          "  open " + money(posPL(p, btPrice())));
      });
    }
    return L.join("\n");
  }

  /* ---------------- boot ---------------- */
  $("verTag").textContent = "v" + APP.version;
  document.title = "TRADE TRAINER v" + APP.version + " \u2014 Cadet to Master";
  paintHeader();
  paintPath();
  if (/^#learn/.test(location.hash)) {
    var lid = location.hash.split("/")[1];
    setView("learn"); if (lid && LCH_BY[lid]) paintLearn(lid);
  } else if (!PROG.st.placed) setTimeout(showHelp, 400);
  window.addEventListener("resize", function () { chD.render(); chP.render(); if (BT.ch) { chB.render(); drawCurve(); } });
  /* the toolbars rebuild their innerHTML on every render, which is fine — the
     listener stays on the same element, only its content and width change */
  ["drillTools", "pracTools", "btTools"].forEach(wireScrollFade);
  setInterval(function () {
    ["drillTools", "pracTools", "btTools"].forEach(function (id) { scrollFade($(id)); });
  }, 500);   /* cheap catch-all for the rebuilds that don't call it directly */
})();
</script>
</body>
</html>
