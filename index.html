      '<div class="tf"><div class="k">Risk %</div><input class="num" id="rpIn" style="padding:3px 5px;font-size:12px" type="number" step="0.25" value="' + prac.riskPct + '"></div>' +
      '</div></div>');

    out.push('<div class="ticket"><div class="hd">Ticket</div><div class="tgrid">');
    function f(k, v, cls) { out.push('<div class="tf"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>'); }
    if (r.mTarget !== undefined) f("Measured target", r.mTarget.toFixed(ch.dec), "am");
    if (r.leg !== undefined) f("Leg", Math.abs(r.leg).toFixed(ch.dec) + " (" + Math.abs(r.legPct).toFixed(1) + "%)");
    if (r.entry !== undefined) {
      var risk$ = prac.eq * prac.riskPct / 100, units = r.risk > 0 ? risk$ / r.risk : 0;
      f("Entry", r.entry.toFixed(ch.dec));
      f("Stop", r.stop.toFixed(ch.dec), "dn");
      f("Target", r.target.toFixed(ch.dec), "up");
      f("R : R", r.rr.toFixed(2) + "R", r.rr >= 2 ? "up" : r.rr >= 1 ? "am" : "dn");
      f("Size", units.toFixed(units > 100 ? 0 : 2) + " u");
      f("Risk", "$" + risk$.toFixed(0));
      f("If target hits", "$" + (risk$ * r.rr).toFixed(0), "up");
      f("Stop distance", (r.risk / ch.atr).toFixed(2) + " ATR");
    } else {
      out.push('<div class="hint" style="grid-column:1/-1">Drop a position with the ⌸ tool to size it.</div>');
    }
    out.push("</div></div>");

    if (prac.result) {
      var res = prac.result;
      out.push('<div class="fb ' + (res.r > 0 ? "good" : res.r < 0 ? "bad" : "mid") + '"><h4>' + esc(res.exit) + ' · ' +
        (res.r >= 0 ? "+" : "") + res.r.toFixed(2) + 'R</h4><ul>' +
        '<li>P&amp;L on the modelled size: <b>' + (res.r >= 0 ? "+" : "") + "$" + (res.r * prac.eq * prac.riskPct / 100).toFixed(0) + '</b></li>' +
        '<li>Held ' + res.bars + ' bars.</li></ul></div>');
    }
    if (prac.revealed) {
      var g = ch.gt;
      out.push('<div class="fb mid"><h4>' + esc(g.name) +
        '<button class="readbtn" id="pracRead">&#128266; Read</button></h4><ul>' +
        '<li>' + g.brooks + '</li>' +
        '<li>Cycle <b>' + g.cycle + '</b> · always-in <b>' +
        (g.alwaysIn > 0 ? "long" : g.alwaysIn < 0 ? "short" : "none") + '</b> · ' + g.style + '</li>' +
        (g.tradeable
          ? '<li>Entry <b>' + g.entry.toFixed(ch.dec) + '</b> · stop <b>' + g.invalid.toFixed(ch.dec) +
            '</b> · target <b>' + g.target.toFixed(ch.dec) + '</b> (' + g.refRR.toFixed(2) + 'R, wins ' +
            Math.round(g.prob * 100) + '%)</li>'
          : '<li>Not tradeable — expectancy is negative here.</li>') +
        '<li>' + g.mmRule + '</li>' +
        '<li>' + (g.worked ? "The target printed." : "It failed before reaching the target.") + '</li></ul></div>');
    }
    $("pracPanel").innerHTML = out.join("");

    if ($("pdirLong")) $("pdirLong").onclick = function () { setPracDir(1); };
    if ($("pdirShort")) $("pdirShort").onclick = function () { setPracDir(-1); };
    if ($("eqIn")) $("eqIn").onchange = function () { prac.eq = Math.max(100, +this.value || 25000); paintPractice(); };
    if ($("rpIn")) $("rpIn").onchange = function () { prac.riskPct = Math.min(10, Math.max(0.1, +this.value || 1)); paintPractice(); };

    var foot = [];
    foot.push('<button class="btn primary" id="pExec">' + (prac.live ? "Running…" : "Execute") + '</button>');
    foot.push('<button class="btn" id="pReveal">Reveal</button>');
    foot.push('<button class="btn ghost" id="pNew">New</button>');
    $("pracFoot").innerHTML = foot.join("");
    $("pExec").onclick = pracExecute;
    $("pReveal").onclick = function () {
      prac.revealed = true; chP.gt = ch.gt; chP.gtMeasure = true; chP.render(); paintPractice();
    };
    $("pNew").onclick = function () { prac.result = null; prac.revealed = false; newPractice(); };
    if (prac.revealed) wireRead("pracRead", function () {
      var g = prac.ch.gt;
      return [g.name + ".", Speech.strip(g.brooks), Speech.strip(g.mmRule)].join(" ");
    });
  }
  function dirTogglePrac() {
    var d = chP.posDir || 1;
    return '<div class="ticket"><div class="hd">Direction</div><div class="dirsel">' +
      '<button id="pdirLong" class="long' + (d > 0 ? " on" : "") + '">LONG</button>' +
      '<button id="pdirShort" class="short' + (d < 0 ? " on" : "") + '">SHORT</button></div></div>';
  }
  function setPracDir(d) {
    chP.posDir = d;
    var p = chP.find("pos");
    if (p) {
      p.dir = d; p.stop = p.entry - d * prac.ch.atr * 1.5; p.target = p.entry + d * prac.ch.atr * 3;
      chP.render();
    } else chP.setTool("pos");
    paintPractice();
  }
  function pracExecute() {
    var p = chP.find("pos");
    if (!p) { toast("Place a position first"); return; }
    if (prac.live) return;
    if (prac.playing) togglePlay();
    prac.live = true; prac.result = null;
    var ch = prac.ch;
    prac.sim = simulate(ch, { dir: p.dir, entry: p.entry, stop: p.stop, target: p.target }, chP.vis,
      function (i) {
        chP.vis = i;
        if (i > chP.i1 - 3) { chP.i0 += 1; chP.i1 += 1; }
        chP.render();
      },
      function (res) {
        prac.live = false; prac.result = res;
        PROG.logTrade({
          t: Date.now(), sym: ch.sym, tf: ch.tf, pattern: ch.gt.name, dir: p.dir,
          r: res.r, exit: res.exit, src: "practice"
        });
        paintPractice(); paintHeader();
      });
    paintPractice();
  }

  /* =====================================================================
     STATS
     ===================================================================== */
  function tradeStats(tr) {
    var w = tr.filter(function (t) { return t.r > 0; }), l = tr.filter(function (t) { return t.r < 0; });
    var sumW = w.reduce(function (a, t) { return a + t.r; }, 0);
    var sumL = Math.abs(l.reduce(function (a, t) { return a + t.r; }, 0));
    var tot = tr.reduce(function (a, t) { return a + t.r; }, 0);
    var cum = 0, peak = 0, dd = 0, curve = [];
    tr.slice().reverse().forEach(function (t) {
      cum += t.r; curve.push(cum);
      if (cum > peak) peak = cum;
      dd = Math.min(dd, cum - peak);
    });
    return {
      n: tr.length, wr: tr.length ? w.length / tr.length : 0,
      avgW: w.length ? sumW / w.length : 0, avgL: l.length ? sumL / l.length : 0,
      exp: tr.length ? tot / tr.length : 0, pf: sumL > 0 ? sumW / sumL : (sumW > 0 ? Infinity : 0),
      tot: tot, dd: dd, curve: curve
    };
  }
  function spark(vals) {
    if (vals.length < 2) return '<div class="hint">Not enough trades yet.</div>';
    var mn = Math.min.apply(null, vals.concat([0])), mx = Math.max.apply(null, vals.concat([0]));
    var rg = (mx - mn) || 1, w = 300, ht = 74;
    var pts = vals.map(function (v, i) {
      return ((i / (vals.length - 1)) * w).toFixed(1) + "," + (ht - ((v - mn) / rg) * ht).toFixed(1);
    }).join(" ");
    var zy = (ht - ((0 - mn) / rg) * ht).toFixed(1);
    return '<svg viewBox="0 0 ' + w + ' ' + ht + '" preserveAspectRatio="none" style="width:100%;height:74px;display:block;background:var(--bg2);border:1px solid var(--line);border-radius:9px">' +
      '<line x1="0" y1="' + zy + '" x2="' + w + '" y2="' + zy + '" stroke="#2A303C" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + (vals[vals.length - 1] >= 0 ? "#3FBF7F" : "#E5634D") +
      '" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
  }
  function paintStats() {
    paintHeader();
    var st = PROG.st, s = tradeStats(st.trades || []), out = [];
    out.push('<div class="seclabel">Standing</div><div class="statgrid">' +
      box("Rank", PROG.rankName()) + box("XP", st.xp) +
      box("Tiers cleared", TIERS.filter(PROG.tierDone).length + " / " + TIERS.length) +
      box("Drills passed", TIERS.reduce(function (a, t) { return a + t.nodes.filter(PROG.nodePass).length; }, 0)) +
      '</div>');

    out.push('<div class="seclabel">Simulated trades</div>');
    if (!s.n) out.push('<div class="card hint">No trades yet — run a live execution drill or take a trade in Practice.</div>');
    else {
      out.push('<div class="statgrid">' +
        box("Trades", s.n) + box("Win rate", Math.round(s.wr * 100) + "%") +
        box("Expectancy", s.exp.toFixed(2) + "R", s.exp >= 0 ? "up" : "dn") +
        box("Net", (s.tot >= 0 ? "+" : "") + s.tot.toFixed(1) + "R", s.tot >= 0 ? "up" : "dn") +
        box("Avg win", "+" + s.avgW.toFixed(2) + "R", "up") +
        box("Avg loss", "-" + s.avgL.toFixed(2) + "R", "dn") +
        box("Profit factor", isFinite(s.pf) ? s.pf.toFixed(2) : "∞") +
        box("Max drawdown", s.dd.toFixed(1) + "R", "dn") + '</div>');
      out.push('<div class="seclabel">Equity curve (R)</div>' + spark(s.curve));
      out.push('<div class="seclabel">Trade log</div><div class="tblwrap"><table><tr><th>Setup</th><th>Sym</th><th>Side</th><th>Exit</th><th>R</th></tr>' +
        st.trades.slice(0, 25).map(function (t) {
          return "<tr><td>" + esc(t.pattern) + "</td><td>" + esc(t.sym) + "</td><td>" + (t.dir > 0 ? "L" : "S") +
            "</td><td>" + esc(t.exit) + '</td><td class="' + (t.r >= 0 ? "up" : "dn") + '">' + (t.r >= 0 ? "+" : "") + t.r.toFixed(2) + "</td></tr>";
        }).join("") + "</table></div>");
    }

    out.push('<div class="seclabel">Skills</div><div class="skillgrid">');
    Object.keys(SKILLS).forEach(function (k) {
      var sk = st.skills[k] || { s: 0, n: 0 };
      out.push('<div class="skill"><div class="n">' + SKILLS[k] + '<span>' + Math.round(sk.s * 100) + '%</span></div>' +
        '<div class="b"><i style="width:' + Math.round(sk.s * 100) + '%"></i></div>' +
        '<div class="hint" style="margin-top:4px;font-size:10px">' + sk.n + ' reps</div></div>');
    });
    out.push("</div>");

    if (st.journal && st.journal.length) {
      out.push('<div class="seclabel">Recent drills</div><div class="tblwrap"><table><tr><th>Drill</th><th>Score</th><th>When</th></tr>' +
        st.journal.slice(0, 15).map(function (j) {
          return "<tr><td>" + esc(j.title) + '</td><td class="' + (j.avg >= 0.7 ? "up" : "dn") + '">' + Math.round(j.avg * 100) +
            "%</td><td>" + new Date(j.t).toLocaleDateString() + "</td></tr>";
        }).join("") + "</table></div>");
    }
    out.push('<div class="seclabel">Data</div><div class="card"><div class="hint" style="margin-bottom:8px">' +
      'Progress is stored in this browser only.</div>' +
      '<div class="hint mono" style="margin-bottom:8px">' + esc(APP.name) + ' v' + esc(APP.version) +
      ' · build ' + esc(APP.build) + '</div>' +
      '<button class="btn" id="resetBtn">Reset all progress</button></div>');
    $("statsBody").innerHTML = out.join("");
    $("resetBtn").onclick = function () {
      modal('<h2>Reset everything?</h2><p>Ranks, skill scores and the trade log will be wiped.</p>' +
        '<button class="btn primary" id="yes">Yes, reset</button> <button class="btn ghost" id="no">Cancel</button>');
      $("yes").onclick = function () { PROG.reset(); };
      $("no").onclick = closeModal;
    };
  }
  function box(k, v, cls) {
    return '<div class="sbox"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>";
  }

  /* =====================================================================
     HELP
     ===================================================================== */
  function showHelp() {
    modal('<h2>How this works</h2>' +
      '<p>This trainer is built on <b>Al Brooks\' price action framework</b>. Every chart is one identifiable ' +
      'context — spike and channel, tight channel, trading range, barbwire, failed breakout, wedge, major trend ' +
      'reversal, final flag, climax — and each one carries its own always-in direction, probability, measured move ' +
      'and scalp-or-swing answer.</p>' +
      '<p>Charts are generated rather than replayed from a feed, but the <b>probabilities are real</b>: every context ' +
      'is checked against the tape it actually produces, and none is more than a few points from the win rate it ' +
      'quotes. Every tradeable context has positive expectancy; every no-trade context has negative expectancy. The ' +
      'base rates you feel here are the ones the app teaches.</p>' +
      '<p>The <b>bars</b> are calibrated against real market data too, not just eyeballed. On a real chart about ' +
      '54% of bars close the opposite colour to the one before, and runs of six or more same-colour bars are about ' +
      '2.5% of all runs. This generator sits at 49% and 2.9%. That matters because a tape that marches ten bars in ' +
      'one direction without a pullback would teach you to expect something the market does not do.</p>' +
      '<p>Bar <b>shape</b> is calibrated the same way, against 1.15 million bars of real 15-minute gold, ' +
      'EURUSD, USDJPY, GBPUSD and GBPJPY. The measure is RMS(range) divided by RMS(body): how much ground a ' +
      'bar covers high to low for the distance it actually closes. Real markets sit at <b>1.66–1.71</b> on ' +
      'every one of those instruments and every timeframe from 15 minutes to daily — which is no coincidence, ' +
      'since the square root of 4·ln2 is 1.665 and that is the value any diffusion must have. This generator ' +
      'used to sit at <b>2.26</b>: each wick was drawn independently of the bar\'s own move, so a quiet bar ' +
      'with a tiny body still sprouted a full-length tail on both sides, and 68% of bars carried two wicks ' +
      'against 53% in real data. A bar is now built as a Brownian bridge from its open to its close with the ' +
      'high and low read off that path, and the tape sits at <b>1.69</b>.</p>' +
      '<p>Brooks says a trading range prints more prominent tails than a trend. The data agrees — but by less ' +
      'than the eye suggests. Sorting real bars by how cleanly price is trending puts the calmest trends at ' +
      '1.52–1.67 and the choppiest stretches at 1.71–1.75, a gap under 10%. Only genuine <b>barbwire</b> — ' +
      'tight, overlapping, range under 2.2 ATR — separates properly, at 1.89–2.00 with bodies down at 40%. ' +
      'Each family is tuned to what its real-world equivalent measures. The same shape holds on an index: ' +
      'four years of DAX minute bars give body 46.0%, ratio 1.66 and 20.1% dojis at 15 minutes, within a ' +
      'whisker of gold and FX — so one calibration covers every asset class here. Dojis and two-sided bars still run a ' +
      'few points above the market average here, and deliberately so: every chart is built around a setup, ' +
      'with stop runs through swing points and probes through range edges, so it is a sample of moments that ' +
      'matter rather than a sample of all market time.</p>' +
      '<p>Each instrument\'s <b>volatility</b> is fitted to real market data. <b>Every instrument ' +
      'that ships is measured — none is guesswork.</b> That is a rule, not a coincidence: Apple, ' +
      'Nvidia and Tesla used to be here and were removed, because the only stock data available was ' +
      'daily, and converting a daily figure to an hourly one for a market open six and a half hours ' +
      'a day needs an assumption none of the others required. An instrument whose number cannot be ' +
      'measured does not get shipped.</p>' +
      '<div class="tblwrap"><table><tr><th>Instrument</th><th>Source</th><th>Sample</th>' +
      '<th>Annualised</th><th>1-min scaling</th></tr>' +
      Mkt.INSTR.map(function (x) {
        var d = Mkt.DATA[x.sym]; if (!d) return '';
        var m1 = d.m1 == null ? '<span style="color:var(--muted)">untested</span>'
          : d.m1 <= 5 ? '<span style="color:var(--up)">±' + d.m1 + '%</span>'
            : d.m1 <= 10 ? '±' + d.m1 + '%'
              : '<span style="color:var(--dn)">±' + d.m1 + '%</span>';
        return '<tr><td><b>' + x.sym + '</b></td><td>' + d.src + '</td><td>' + d.n +
          '<br><span style="color:var(--muted)">' + d.span + '</span></td><td>' +
          d.ann.toFixed(1) + '%</td><td>' + m1 + '</td></tr>';
      }).join('') + '</table></div>' +
      '<p>So a 5-minute bar spans about the distance it really does: 4.6 pips on EURUSD, 6.8 on ' +
      'USDJPY, 12.3 on GBPJPY, 5 points on the S&amp;P, 29 on the DAX, ten cents on crude.</p>' +
      '<p>The last column is the one to read before dropping to a <b>1-minute</b> chart. Every ' +
      'timeframe is derived from a single hourly fit by square-root-of-time scaling, which real ' +
      'markets obey almost exactly from 15 minutes upward — measured at 1–6% error on FX and gold ' +
      'across 15m, 1h and daily. At one minute it frays, because bid-ask bounce is not modelled. ' +
      'Nasdaq holds to 2% and the DAX to 5%; the S&amp;P is out by 17% and bitcoin by 21%, so their ' +
      '1-minute charts are <i>smoother than the real thing</i>. For FX and gold there was no minute ' +
      'data to test against, which is reported as untested rather than quietly assumed to pass.</p>' +
      '<p>Volatility is a regime, not a constant, so these are long-run averages. The DAX ran at 26.5% ' +
      'in 2015 and 12.5% in 2017; each chart draws its own level from a band around the average, which ' +
      'is closer to how the market actually behaves than one fixed number would be.</p>' +
      '<p>You start at <b>Tier 0 — the first three setups</b>, and the placement test cannot skip it. Brooks is ' +
      'blunt that a beginner should trade a handful of the strongest setups and pass on everything else, so that ' +
      'tier drills the two-legged pullback, the failed breakout and the major trend reversal end to end — ' +
      'recognise, count, enter, stop, target, manage — before the rest of the ladder opens.</p>' +

      '<h3>The market cycle</h3>' +
      '<p>Breakout becomes channel, channel becomes trading range, range becomes the next breakout. Name the phase ' +
      'first: you <b>swing</b> in a channel, you <b>scalp</b> in a range, and you do nothing in barbwire. Most of ' +
      'the trading day is a range, which is why half this ladder is about ranges and traps.</p>' +

      '<h3>The 80% rule</h3>' +
      '<p>Roughly four out of five breakout attempts out of a trading range fail. That single number is most of the ' +
      'edge available in a range: fade the failed breakouts, and only go with the ones showing big trend bars, ' +
      'closes on their extremes and a follow-through bar.</p>' +

      '<h3>Measured moves</h3>' +
      '<p>Pick <b>⇕</b> and click three points — <b>A</b> and <b>B</b> to measure, <b>C</b> to anchor the projection. ' +
      'Which move you measure depends on the context:</p>' +
      '<li><b>Spike and channel</b> — measure the spike, project from the top of the spike.</li>' +
      '<li><b>Pullbacks</b> — leg one equals leg two: measure the first leg, project from the pullback.</li>' +
      '<li><b>Breakouts</b> — measure the range height, project from the edge that broke.</li>' +
      '<li><b>Failed breakouts</b> — the target is the other side of the range.</li>' +
      '<li><b>Wedges</b> — no height projection; the target is where the wedge began.</li>' +

      '<h3>The trader\'s equation</h3>' +
      '<p>Probability x reward against probability of loss x risk. A 40% setup paying 3R is a good trade; a 65% ' +
      'setup paying 0.8R is a losing one. The app shows you both numbers for every context after you answer, so ' +
      'you can stop arguing with your own results.</p>' +

      '<h3>Signal bars and stops</h3>' +
      '<p>A bar worth trading <b>closes near its extreme in your direction</b>, with any long tail on the <b>far</b> ' +
      'side — that tail is the other side pushing your way and failing. Body size is not the test: a small body with ' +
      'a long far-side tail and a close at the extreme is a textbook reversal bar and a good signal bar. What is bad ' +
      'is a close in the middle (a doji — both sides rejected) or a long tail on the side you want to trade toward. ' +
      'The protective stop goes <b>one tick beyond the signal bar</b>. Inside the structure is too tight; several ATR ' +
      'beyond destroys the R multiple. A stop beyond the structure that has to hold is a defensible wider ' +
      'alternative — it is simply a bigger stop, so smaller size and a different equation — and both are graded as ' +
      'correct here. When an oversized signal bar makes that stop very wide, Brooks treats it as a reason to skip ' +
      'the trade rather than accept the extra risk.</p>' +

      '<h3>The funded account</h3>' +
      '<p>The last tier hands you <b>$25,000</b> and a rule set: reach <b>+6%</b>, never lose <b>3%</b> in a ' +
      'session, never sit <b>5%</b> below your peak. Five trades to a session, forty trades in total. Breach a ' +
      'limit and the run is over.</p>' +
      '<p>You set your <b>risk per trade</b> and place the stop; the position size follows from the two, exactly as ' +
      '<i>size is the output of the stop</i> says it must. A wider stop buys fewer units at the same money risk.</p>' +
      '<p>This is <b>not</b> a profit score, and it does not overturn anything earlier — process is still the grade. ' +
      'It is a constraint exercise. The target is reachable because the edge is real, so blowing the drawdown is ' +
      'almost always a sizing decision rather than bad luck, and the debrief proves it by replaying <b>your own ' +
      'trades</b> at other risk levels. Same reads, same order, different size, different outcome.</p>' +
      '<p>Then it models your realised win rate and average R to show pass odds against risk. There are two ways to ' +
      'fail and they pull opposite ways: size up and the drawdown gets you, size down and you never reach the ' +
      'target in the trades you have. On a typical edge here, 1% passes about nine times in ten, 3% roughly halves ' +
      'that, and 5% blows up about four runs in ten. No risk setting rescues weak reads — sizing decides how fast a ' +
      'good edge compounds and how fast a bad one kills you, not whether you have one.</p>' +

      '<h3>When to move to breakeven, and when not to</h3>' +
      '<p>Moving the stop to your entry is worth having, and it is also the most over-used button in trading. ' +
      'Brooks moves to breakeven <b>once the trade has moved about 1R and the structure is intact</b> — and ' +
      '<b>not</b> early in choppy tape. The reasoning is that a good trade should not come back through your entry, ' +
      'so once it has proven itself the stop can come up. Before it has proven anything, a breakeven stop sitting where ' +
      'ordinary pullbacks reach simply hands the trade back, and you get the loss without the trade.</p>' +
      '<p>The management drills grade the <b>timing</b>, not the action. Press it at 0.2R and you will be marked ' +
      'down with the reason; press it at 1R and you will not.</p>' +

      '<h3>Trail, or hold a target?</h3>' +
      '<p>Context decides, and the two answers are opposite.</p>' +
      '<li><b>Trend</b> — trail the stop behind the most recent higher low as the move extends. A trend is the one ' +
      'place where holding a <b>runner with no target at all</b> makes sense: you cannot know in advance which move ' +
      'keeps going, so you stop guessing and let the trail decide.</li>' +
      '<li><b>Range</b> — hold the <b>fixed target</b> and let the market reach its objective. A trailing stop inside ' +
      'two-sided trading gets hit by the ordinary back-and-forth long before price gets to the other side, so you take a loss ' +
      'on a trade that was going to work.</li>' +
      '<p>The stop still starts in the same place either way. What context changes is where you get out — never ' +
      'where you were wrong.</p>' +

      '<h3>What management does to the trader\'s equation</h3>' +
      '<p>The equation earlier in this ladder — probability times reward against probability of loss times risk — ' +
      'assumes a trade has <b>two</b> outcomes: you win your target or you lose 1R. The moment you take a partial ' +
      'that stops being true. Winners come back at varying sizes and losers come back <i>smaller</i> than 1R, ' +
      'because part was already off.</p>' +
      '<p>So if you scale out, the equation has to be computed on <b>what you actually do</b>, not on the plan you ' +
      'drew. And the direction is not a matter of opinion — this app measured it over 660 of its own charts:</p>' +
      '<li>hold to target: <b>59%</b> win rate, mean <b>0.75R</b></li>' +
      '<li>half off then stop to breakeven: <b>69%</b> win rate, mean <b>0.29R</b></li>' +
      '<p>Ten points of win rate bought with about 60% of the average reward. That is not an argument against taking ' +
      'partials — it is Brooks\' law stated exactly: <i>whenever a trader does something to increase his ' +
      'probability, he pays for it with a smaller reward, an increased risk, or both.</i> Knowing which side of that ' +
      'trade you are making is the point. After every managed trade the app shows you both numbers on that tape: ' +
      'what your management returned, and what holding untouched would have.</p>' +

      '<h3>Managing a live trade</h3>' +
      '<p>Once you press Execute the tape runs, and you can now actually <b>manage</b> the position rather than watch ' +
      'it. The controls appear as soon as you are filled:</p>' +
      '<li><b>Take half</b> — bank part of it at the current price. What is left keeps running.</li>' +
      '<li><b>Stop to average</b> — move the stop to your <b>average</b> entry. On a single-leg trade that is ' +
      'breakeven; on a scaled position it is the average, which is the only price that means breakeven once you have ' +
      'more than one fill.</li>' +
      '<li><b>Trail</b> — the stop follows behind the recent bars and never moves backwards.</li>' +
      '<li><b>Scale in</b> — arm a second leg a little beyond price. Watch the <b>at risk now</b> figure when it ' +
      'fills: at the same stop, a second leg puts more than 1R at stake. That is why the total has to be planned ' +
      'before the first entry.</li>' +
      '<li><b>Drop target</b> — hold a runner with no target and let the trail decide the exit.</li>' +
      '<li><b>Close all</b> — take what is there.</li>' +
      '<p>The read-out shows the open size, your average, what you have <b>banked</b> so far and what is still ' +
      '<b>at risk</b>, all in R. The result you are graded on is the blended total — so half off at 1R and the rest ' +
      'stopped at the average is a very different number from a flat loss, and you will see it as one.</p>' +
      '<p>Everything is still measured against the risk you originally planned, so 1R means the same thing before ' +
      'and after you manage the trade.</p>' +

      '<h3>Scaling in — and whether it is one trade or two</h3>' +
      '<p>Scaling in is not the same thing as "adding because I am losing". It is a planned technique and Brooks uses ' +
      'it constantly: in a trading range, bulls scale into longs in the lower half and scale out in the upper half, ' +
      'and aggressive traders buy below bars in the bottom third and <b>scale in lower</b>.</p>' +
      '<li><b>How many.</b> Most traders should add <b>once or twice</b>, not five times. Brooks typically scales in ' +
      'one or two more, with a wider stop planned from the start.</li>' +
      '<li><b>On what.</b> Even when adding lower, wait for a signal — a reversal bar and a stop entry — rather than ' +
      'adding blindly at a price. Adding on hope is the version that ruins accounts.</li>' +
      '<li><b>Plan the total first.</b> Adding at the same stop <i>increases</i> your risk. So if you intend to scale ' +
      'in, the first entry has to be <b>smaller</b>, sized so that the full scaled position still risks what you meant ' +
      'to risk. Decide the total before the first entry, never after the second.</li>' +
      '<p><b>Is a scaled position one trade or two?</b> <b>One.</b> It is a single position at an <b>average price</b>, ' +
      'and every level you care about is measured from that average — breakeven means the average entry, not your ' +
      'first one. Brooks manages it as a whole: in one live example he was short two contracts, added a fourth, and ' +
      'scratched the entire position when price came back to the average. His stated middle path between the two ' +
      'extremes — scratch everything, or hold everything — is to <b>take profit on part and swing another part</b>.</p>' +
      '<p>That answers the platform question too. In cTrader (and any netting account) adding blends into one position ' +
      'at an average price, which is exactly Brooks\' mental model. On a hedging account you <i>can</i> hold the legs ' +
      'separately, but you should still think in the average, because that is the price your risk and your breakeven ' +
      'are actually measured from.</p>' +

      '<h3>The second entry</h3>' +
      '<p>At a range edge the first attempt to turn the market usually fails. The traders who took it are now ' +
      'trapped, and unwinding them is what fuels the next attempt — so Brooks\' standard trigger in two-sided ' +
      'trading is the <b>second entry</b>, not the first.</p>' +
      '<p>This matters more than it sounds, because it replaces something you cannot rely on. <b>Bad entry bars in ' +
      'a trading range are normal</b> — both sides are still trading, so the bars are messy by nature. Hold out for ' +
      'a clean signal bar at the edge and you will take almost nothing. Counting attempts is what you use instead.</p>' +
      '<p>A <b>trend</b> is the opposite: the pullbacks are shallow and they do not come back, so Brooks takes the ' +
      'first one. Waiting for a second entry in a tight channel usually means watching the move leave without you. ' +
      'Which of the two you are in decides it — not how the bar looks.</p>' +

      '<h3>Failed breakout or major trend reversal?</h3>' +
      '<p>They look alike and they are graded separately, so the difference is worth being exact about. It is <b>what ' +
      'came before</b>, not what the reversal looks like.</p>' +
      '<li><b>Failed breakout</b> — the market was already in a <b>trading range</b>: two-sided, no trend to reverse. ' +
      'A probe pokes through an edge, finds nobody, and snaps back in. Tradeable immediately, as a scalp, targeting ' +
      'the other side of the range.</li>' +
      '<li><b>Major trend reversal</b> — the market was in a real <b>trend</b>. Before any reversal read counts you ' +
      'need a countertrend move strong enough to <b>break the trendline</b>, and usually the moving average with it. ' +
      'Brooks: never even think about trading against a trend until a significant trendline has broken. Then you ' +
      'need a test of the old extreme that holds. That is a swing, not a scalp.</li>' +
      '<p>The test of the old low can be a <b>higher low or a lower low</b> — Brooks says the two happen about ' +
      'equally often. So do not discard a reversal because price dipped under the old low: a lower-low test that ' +
      'reverses hard <i>is</i> a failed breakout, of the trend\'s low rather than a range edge. The two patterns are ' +
      'the same mechanic in different contexts, and the context is what decides how you trade it.</p>' +

      '<h3>Initial risk and actual risk</h3>' +
      '<p>These are two different numbers and Brooks separates them carefully.</p>' +
      '<li><b>Initial risk</b> — entry to your protective stop below the signal bar. This is what you size from, and ' +
      'it is the risk that belongs in the trader\'s equation, because you do not tighten your stop just because the ' +
      'market goes sideways right after you enter. That is a rule about the <b>initial</b> stop, before the trade has '  +
      'proven anything &mdash; not about trailing a stop behind a move that is already working, which is a separate '  +
      'decision and a legitimate one.</li>' +
      '<li><b>Actual risk</b> — entry to the extreme of the pullback that happens <i>after</i> you are filled. If the ' +
      'market drops three ticks and then runs, your actual risk was three ticks, not the full stop.</li>' +
      '<p>You can only know actual risk in hindsight, so it never sizes a trade. But it is usually far smaller than ' +
      'the initial risk, and that gap is most of why a good entry is worth so much more than a nearly-good one. ' +
      'Every stop question here reports both, measured off the tape you were just looking at.</p>' +
      '<p>Entries are mechanical too. With the trend you enter on a <b>stop</b> one tick beyond the signal bar, so ' +
      'price has to trade there to fill you — that is the confirmation. Fading a range edge you use a <b>limit</b>, ' +
      'because waiting for confirmation means paying the edge away. Getting this backwards turns a correct read ' +
      'into a losing trade.</p>' +

      '<h3>Bar counting</h3>' +
      '<p>Brooks counts <b>bars</b>, not legs. A <b>High 1</b> is a bar with a high above the prior bar in a bull ' +
      'flag. If there is then a bar with a <b>lower high</b> — one bar later or several — the next bar whose high ' +
      'is above the prior bar\'s high is a <b>High 2</b>. Third and fourth occurrences are a High 3 and 4. Lows ' +
      'mirror it exactly.</p>' +
      '<p>What is <b>not</b> required: the correction does not have to make a new low, and leg two does not have to ' +
      'trade below leg one\'s low. That single lower-high bar is the whole re-arm condition. Demand more and you ' +
      'will sit out valid High 2s. This app counts off the actual bars with that rule, so the answer is whatever ' +
      'the tape shows — sometimes a High 1, sometimes a High 3.</p>' +

      '<h3>The help fades as you climb</h3>' +
      '<p>Questions never show you the answer — that has always been true, at every tier. What changes is the ' +
      '<b>feedback</b>. Early on, answering paints the whole picture: the range shaded with its edges priced, ' +
      'entry, stop and target, and violet labels naming every structural point. Later that thins out, because ' +
      'being shown where the structure was is not the same as finding it.</p>' +
      '<li><b>Tiers 0&ndash;2</b> &mdash; everything, named.</li>' +
      '<li><b>Tiers 3&ndash;5</b> &mdash; the structure is still drawn, but the <b>names go</b>. You have to know that the ' +
      'line you are looking at is the range high.</li>' +
      '<li><b>Tiers 6&ndash;8</b> &mdash; the range box goes too. Only the trade levels remain, so you can still see ' +
      'whether you were right.</li>' +
      '<li><b>Live execution and certification</b> &mdash; nothing is drawn but the levels the drill actually asked you ' +
      'to place. A stop question still shows the stop; it no longer shows you the entry and target you were never ' +
      'asked about.</li>' +
      '<p>Two things never fade. <b>Get it wrong and the full picture comes back</b>, at any tier — you only lose the ' +
      'scaffolding while you are getting things right, and the threshold is the same 80% that counts toward your ' +
      'streak. And the <b>lesson cards are always fully marked</b>: they are the teaching, so press <b>Learn</b> on ' +
      'the toolbar whenever you want the labelled version back.</p>' +
      '<p>When the chart stops naming something you were asked to find, the feedback states it in words instead, so ' +
      'nothing is ever simply withheld from you.</p>' +

      '<h3>Questions this file should have answered before you asked</h3>' +
      '<p><b>Why is the decision bar that one and not the two before it?</b> Usually because those two are the same ' +
      'push, not earlier attempts — a push only counts again once a bar closes back the other way first — and because ' +
      'of where the chosen bar closes inside its own range, which is Brooks\' signal-bar test. The earlier bars in ' +
      'that push were tradeable too: entering sooner buys a better price against a bar that has proved less. Every ' +
      'answer that reveals a trade now says which of these applies.</p>' +
      '<p><b>The rule says second entry, so why does the chart say H4?</b> Both are right and they are different ' +
      'lenses. The rule is about the first two attempts to turn the market; the count is what the bars actually did. ' +
      'A correction that grinds on for twenty bars routinely reads H3 or H4 by the time it triggers, and Brooks\' ' +
      'point is that the higher the count runs, the weaker the trend\'s grip.</p>' +
      '<p><b>Where did the target come from?</b> It is stated on every chart. If it is a measured move, both halves ' +
      'are drawn as two bars of the same length — the leg that was measured, and that height stood up again from the ' +
      'point it is projected off — and the words give the arithmetic. If it is a level already on the chart (a range ' +
      'edge, a wedge\'s origin) it says that instead, because that is a different kind of claim.</p>' +
      '<p><b>Why that high (or that low) and not another one?</b> A leg is measured between the extremes it actually ' +
      'reached, so between its two ends no bar traded past either of them. That is the whole rule, and every measured ' +
      'move states the two prices so you can check it against the bars. A swing gets its NAME at the bar the ' +
      'structure turns on, but it gets MEASURED to the furthest point the leg went — if a bar inside the leg printed ' +
      'past the end, that bar is the end. Measuring to a lesser high would quietly shorten the leg, and the target ' +
      'projected from it would be short by exactly what was skipped.</p>' +
      '<p><b>Why is the target so close sometimes?</b> Because the projection starts at the end of the correction, ' +
      'not at the end of the leg. The ground the market still has to break is the leg minus whatever the correction ' +
      'gave back. The reward is about a full leg either way — a deep pullback got you in that much further back.</p>' +
      '<p><b>Why does it say NOT A TRADE on a textbook pattern?</b> Because a correct read is not a trade. A swing ' +
      'needs reward at least twice risk; a scalp needs the win rate to carry the equation. About one chart in six is ' +
      'deliberately one where the read is right and the price is wrong, and passing is the graded answer. <b>The fix ' +
      'is never a bigger target</b> — the objective is set by the structure, and moving it out until the ratio looks ' +
      'acceptable does not make the market go there.</p>' +
      '<p><b>Which stop am I being graded on?</b> The one drawn on the chart is the structural stop, a real price ' +
      'with a few ticks of air under it. The <i>initial risk</i> quoted beside it is entry to one tick beyond the ' +
      'signal bar — Brooks\' number, the one you size from. The <i>actual risk</i> is what the market really took ' +
      'out of you before the trade worked, knowable only afterwards, and usually far smaller than both.</p>' +
      '<p><b>Can I reproduce a chart I want to ask about?</b> Yes. The seed printed in the Copy snapshot regenerates ' +
      'that exact chart.</p>' +
      '<h3>Desk — backtesting your own approach</h3>' +
      '<p>The <b>Desk</b> tab is the opposite of a drill: no question, no score, just a long tape and ' +
      'an account. Set your starting capital, step or play the bars, and trade it the way you actually ' +
      'trade. The point is the sample — after enough trades the Results box tells you whether the ' +
      'approach makes money, and if not, which half of it is broken.</p>' +
      '<li><b>Size is in lots.</b> Each instrument carries a real contract size, so a lot means what ' +
      'it means on a platform: 100,000 units on FX ($10 a pip on EURUSD and GBPUSD, $6.41 on USDJPY ' +
      'and GBPJPY, since yen profit converts at USDJPY), 100oz of gold, one contract on ES ($50 a ' +
      'point) or NQ ($20), one coin on BTC, 100 shares on stock. ' +
      'You type the lots — nothing sizes the trade for you, because on a real platform nobody does. ' +
      'The ticket reads the risk back in money and in percent of the account, and shows what 1% of ' +
      'equity would have come to at that stop distance, as a yardstick you can ignore.</li>' +
      '<li><b>Work orders straight off the chart.</b> Pick Buy or Sell, hit the <b>⊕</b> tool and ' +
      'click the price you want. Limit or stop is inferred from where you clicked — behind the ' +
      'current price is a limit, beyond it is a stop — and the order appears with a stop and target ' +
      'you then drag wherever you like. Set its lots afterwards in the order row.</li>' +
      '<li><b>Every level is draggable</b>: entries on working orders, stops, targets and partial ' +

      '<li><b>Several positions at once</b>, and partial take-profits (add one and it lands at 1R, ' +

      '<li><b>The curve is one point per closed trade</b>, not one per bar, so it shows the balance ' +

      '<li><b>Pick your market.</b> The two dropdowns at the left of the toolbar choose the instrument ' +

      '<li><b>Where to find it.</b> <b>Coach</b> is the toggle in the Desk toolbar, between Play and ' +
      'New tape. It reads <b>Coach: off</b> until you switch it on. Setups are roughly a hundred bars ' +
      'apart, so when nothing is live the panel offers to step ahead to the next one (with the answer key ' +
      'it also says how many bars away it is; the reading Coach cannot know) — the tape still fills bar ' +
      'by bar on the way, so nothing jumps past a stop you had working.</li>' +
      '<li><b>Two Coaches.</b> <b>Reads the chart</b> (the default) finds every taught setup from the ' +
      'bars already on screen, the way you have to, so it can be wrong — its trades and its backtest are ' +
      'the honest ones. <b>Answer key</b> shows the setups the chart was built from, so it is always ' +
      'right: the best way to learn what each setup looks like, but not a fair trader. <b>Compare</b> in ' +

      '<li><b>Coach</b> shows you what the tape is actually printing. The Desk stitches its tape ' +
      'from the same fourteen contexts the drills use, so every stretch has a known setup — and the ' +
      'coach surfaces it the moment its signal bar prints, which is the real decision point. You get ' +

      '<li><b>Some setups show a first entry too.</b> Brooks counts attempts: the first often fails, ' +

      'In a range that rate usually sits close to the main entry\'s odds — the first try there really is ' +

  /* ---------- example charts ----------
     Every lesson is drawn on a generated chart whose structure is known: the
     generator records the swing points, signal bar, entry, stops and target,
     and what happened afterwards. The narration is pinned to those points,
     so what you hear is always what the chart shows. */
  var LSYM = { NQ: "US100", ES: "US500", GER40: "GER40", XAUUSD: "Gold", EURUSD: "EURUSD", USDJPY: "USDJPY", CL: "Oil", GBPUSD: "GBPUSD", BTCUSD: "BTCUSD", GBPJPY: "GBPJPY" };
  function lessonChart(ctx, seed, sym, tf) {

    ch.alias = LSYM[ch.sym] || ch.sym;
    return ch;
  }
  /** Several contexts stitched into one continuous chart (like the Desk
      tape), each part rebased to open where the last one closed. Returns the
      bars plus each part's own ground truth, moved to the stitched indices. */
  function lessonStitch(parts, sym, tf) {
    var bars = [], segs = [], first = null;
    parts.forEach(function (pt) {
      var c = Mkt.gen({ ctx: pt.ctx, seed: pt.seed, sym: sym, tf: tf });
      if (!first) first = c;
      var off = bars.length ? bars[bars.length - 1].c - c.bars[0].o : 0, base = bars.length;
      var take = pt.cut ? Math.min(c.bars.length, pt.cut) : c.bars.length;
      for (var i = 0; i < take; i++) {
        var b = c.bars[i];
        bars.push({ t: 0, o: b.o + off, h: b.h + off, l: b.l + off, c: b.c + off, v: b.v });
      }
      var g = c.gt, P = function (q) { return q ? { i: q.i + base, p: q.p + off } : null; };
      segs.push({ ctx: pt.ctx, from: base, to: base + take - 1, name: g.name, dir: g.dir,
        labels: (g.labels || []).map(function (L) { return [P(L[0]), L[1]]; }),
        sig: g.sigIdx + base, entry: g.entry + off, stop: g.invalid + off, sigStop: g.sigStop + off, target: g.target + off,
        rangeTop: g.rangeTop != null ? g.rangeTop + off : null, rangeBot: g.rangeBot != null ? g.rangeBot + off : null,
        trendline: g.trendline ? { a: P(g.trendline.a), b: P(g.trendline.b) } : null,
        fillAt: g.fillAt >= 0 ? g.fillAt + base : -1, hitT: g.hitTargetAt >= 0 ? g.hitTargetAt + base : -1,
        hitI: g.hitInvalidAt >= 0 ? g.hitInvalidAt + base : -1, worked: g.worked, pbFrom: g.pbFrom + base });
    });
    var step = 60000 * ((Mkt.TFS.filter(function (x) { return x.k === first.tf; })[0] || { min: 15 }).min);
    var t0 = Date.UTC(2026, 2, 9, 7, 0);
    bars.forEach(function (b, k) { b.t = t0 + k * step; });
    return { bars: bars, sym: first.sym, alias: LSYM[first.sym] || first.sym, tf: first.tf, tfLbl: first.tfLbl, dec: first.dec, segs: segs };
  }
  /* small helpers the lesson scripts use: the lowest / highest bar in a span */

  function hi(ch, a, z) { var bi = a; for (var i = a; i <= z; i++) if (ch.bars[i].h > ch.bars[bi].h) bi = i; return { i: bi, p: ch.bars[bi].h }; }

    box: function (i0, i1, p0, p1, text, col, lab) { return { t: "box", i: i0, i0: i0, i1: i1, p0: p0, p1: p1, text: text, col: col, lab: lab }; },

  /* ---------- the lessons ----------
     Each lesson is a fixed chart (same seed, same bars for everyone) and a list
     of scenes. A scene reveals bars up to `vis`, adds notes, can show the
     position box, and can stop and ask a question. `check` states what the
     script assumes about the chart, so a change to the generator that moves a
     signal bar is caught by the tests instead of silently mis-narrating. */

  function lfp(ex) { return function (p) { return (+p).toFixed(ex.dec); }; }
  function lorders(ex, i, what) {
    var g = ex.gt, fp = lfp(ex), long = g.dir > 0;
    return [
      N.order(i, g.entry, (what || (long ? "buy stop " : "sell stop ")) + fp(g.entry), long ? COL.up : COL.dn, 5, i + 1),
      N.order(i, g.invalid, "stop " + fp(g.invalid), COL.dn, 5, i + 1),
      N.order(i, g.target, "target " + fp(g.target), COL.up, 5, i + 1)

  }

  lch({ id: "cycle", part: "Foundations", title: "The market cycle", video: "cycle",
    sub: "Every chart is in one phase. Name it before you do anything else.",
    body: function () {

        lp("Brooks' market cycle: <b>breakout → channel → trading range → breakout</b>. Each phase has its own trades, its own targets, and its own mistakes.") +
        ltable(["Phase", "How it looks", "Always-in", "What you trade", "Scalp or swing"], [
          ["<b>Breakout (spike)</b>", "Two or more big trend bars in a row, small tails, closes near the extremes, little overlap", "The breakout's direction", "The first pullback (experienced: the close of the breakout bar)", "Swing"],

      { q: "Higher highs and higher lows, but each pullback goes below the EMA and the bars overlap a lot.", o: ["Tight channel", "Broad channel", "Barbwire"], a: 1, why: "A trend with deep, overlapping pullbacks is a broad channel: a trading range tilted up." },

  lch({ id: "alwaysin", part: "Foundations", title: "Always-in: which way?",

        lp("Always-in flips to long when the bulls make a <b>strong breakout</b>: two or more bull trend bars in a row, closing near their highs, breaking above something that mattered (a swing high, the top of a range, a trend line), and followed by more bull bars. It flips to short the same way. <b>One bar almost never flips it.</b>") +
        lh("What it is for") +

  lch({ id: "where", part: "Foundations", title: "Where are we?",
    sub: "The same bar means different things at the top and at the bottom.",
    body: function () {

          "<b>The top, middle and bottom of a trading range.</b>",

          ["Far above the EMA after a long run", "A possible climax", "Don't chase it"]

  lch({ id: "routine", part: "The routine", title: "The every-bar routine", video: "every",

  /* ================= PART 3: SETUPS ================= */
  lch({ id: "count", part: "Setups", title: "Pullbacks: H1, H2, L1, L2", video: "count",
    sub: "Counting the attempts to resume a trend, and why the second one is usually the one.",
    body: function () {
      return lvideo("count") +
        lp("In a pullback in a bull trend, the <b>High 1</b> (H1) is the first bar whose high goes above the high of the bar before it. When the market turns down again and then a bar again goes above the prior bar's high, that is the <b>High 2</b> (H2). Then H3, H4. In a bear trend you count lows the same way: <b>Low 1</b>, <b>Low 2</b>…") +
        lp("Why the second one? The first attempt (H1) often traps early bulls. When it fails, those bulls get out and the bears push a second leg. The second attempt (H2) then traps the bears. That is why an <b>H2 at the EMA</b> is the classic with-trend buy and an <b>L2 at the EMA</b> the classic sell.") +
        lcard([["Where", "A pullback in a trend, ideally two legs to the EMA"], ["Signal", "The H2 (L2) bar, closing near its extreme in the trend's direction"], ["Entry", "Stop order one tick beyond the signal bar"], ["Stop", "One tick beyond the signal bar, or beyond the pullback's extreme"], ["Target", "Leg 1 = leg 2: the leg before the pullback, added to the pullback's end"], ["Style", "Swing; take part at 1R if you want a scalp part"], ["Odds", lodds("twoLegPullback") + " taught"]]) +
        lh("H1 or H2?") +
        ltable(["The trend is…", "Take", "Why"], [
          ["A spike or a tight channel", "The H1 (L1)", "Strong trends don't give second chances; the first pullback is bought"],
          ["A normal trend", "The H2 (L2)", "The first attempt often fails"],
          ["A broad channel", "The H2, near the channel's bottom", "Two-sided; buy low in it"],
          ["A trading range", "Only second entries at the edges", "First reversals at the edges often fail"]
        ]) +
        lh("When the count goes on") +
        lp("If the H2 fails, the pullback can become a three-push <b>wedge bull flag</b>: the H3 is still a buy in a bull trend. If the H4 fails too, the trend has probably turned into a trading range or is reversing: switch to range rules.") +
        lh("Tips") +
        lul(["The count is not enough: the H2 bar must also be a decent signal bar. An H2 that is a bear doji closing on its low is a weak signal. Wait for the next bar.",
          "If the bars are messy (outside bars, sideways drift), look at the <b>legs</b>: two legs down in a bull trend is a High 2, whatever the exact bar count.",
          "An H2 that goes a little below the first leg's low is fine and common: the bears got one more push and failed."]) +
        lp("The first lesson, <i>Every bar, one decision</i> in the routine chapter, walks a full H2 trade on EURUSD from start to finish.");
    },
    quiz: [
      { q: "In a bull pullback, the first bar that goes above the prior bar's high is the…", o: ["H1", "H2", "L1"], a: 0, why: "High 1: the first attempt to resume the bull trend." },
      { q: "The H2 bar is a bear doji closing near its low. Do you buy above it?", o: ["Yes: it's an H2", "No: it's a weak signal bar; wait for a better one"], a: 1, why: "The count tells you where; the bar tells you whether. A weak bar at the right place is still a weak bar." },
      { q: "In a tight bull channel, which entry is fine?", o: ["Only the H2", "The H1: the first pullback"], a: 1, why: "Strong trends rarely give a second leg. Brooks buys the first pullback in a tight channel." },
      { q: "The H2 failed and the market made a third push down, in a bull trend. That third push can be…", o: ["A wedge bull flag (H3): still a buy", "A sure reversal"], a: 0, why: "Three pushes down in a bull trend is a wedge bull flag. Only when the H4 fails too does the trend look done." }
    ],
    practise: [{ label: "Drill: count the pullback", go: "node", node: "t0b" }, { label: "Drill: High 1, 2, 3, 4", go: "node", node: "t3f" }, { label: "Drill: first entry or second?", go: "node", node: "t0a3" }, { label: "Free chart: two-legged pullback", go: "prac", ctx: "twoLegPullback" }]
  });

  lch({ id: "spike", part: "Setups", title: "Spike and channel", video: "spike",
    sub: "A strong breakout, then a slower trend in the same direction.",
    body: function () {
      return lvideo("spike") +

        lcard([["Where", "The first pullback after the spike, then pullbacks to the EMA in the channel"], ["Signal", "A bull bar that goes above the prior bar's high (H1, or H2 in the channel)"], ["Entry", "Buy stop one tick above the signal bar"], ["Stop", "Below the most recent pullback low"], ["Target", "The spike's height (spike low to spike high) added to the spike high"], ["Style", "Swing; trail below confirmed higher lows"], ["Odds", lodds("spikeChannel") + " taught, with a big reward"]]) +
        lkey("Brooks: <b>the first pullback after a strong spike rarely fails</b>. Traders who missed the spike are waiting to buy it.") +
        lh("While the spike is going") +
        lp("Never trade against it. Experienced traders buy the close of a strong spike bar with a wide stop; you wait for the first pullback, where the stop can be close.") +
        lh("How it ends") +
        lp("The channel usually ends by going sideways into a trading range. The start of the channel (its first pullback low) is where the market often comes back to later. Once the channel breaks with strong bars the other way, stop buying pullbacks and switch to range rules.") +

    },
    quiz: [

      { q: "During the spike you…", o: ["Look for shorts because it's overbought", "Only look for buys, and wait for the first pullback"], a: 1, why: "A spike makes the market always-in in its direction. Trading against it is the worst trade on the chart." }

    practise: [{ label: "Drill: spike measured move", go: "node", node: "t3c" }, { label: "Drill: with the trend", go: "node", node: "t3a" }, { label: "Free chart: spike and channel", go: "prac", ctx: "spikeChannel" }]

  lch({ id: "tight", part: "Setups", title: "Tight channel", video: "tight",

    body: function () {

        lcard([["Where", "The first pullback to (or near) the EMA"], ["Signal", "The H1: a bull bar going above the prior bar's high"], ["Entry", "Buy stop one tick above the signal bar"], ["Stop", "Below the signal bar or the pullback low"], ["Target", "Leg 1 = leg 2; trail the rest"], ["Style", "Swing"], ["Odds", lodds("tightChannel") + " taught"]]) +
        lwarn("<b>Never sell a tight bull channel.</b> Brooks: countertrend trading in a tight channel is the worst trade on the chart. About four out of five attempts to reverse a strong trend fail, and in a tight channel it is worse. \"Overbought\" is not a signal.") +
        lh("How it ends") +

      { q: "When do the bears get a good sell in a tight bull channel?", o: ["At any strong bear bar", "Only after the channel breaks and the test of the high fails"], a: 1, why: "That is the major trend reversal sequence: break, test, then the reversal." }
    ],
    practise: [{ label: "Drill: stop entries with the trend", go: "node", node: "t3g" }, { label: "Free chart: tight channel", go: "prac", ctx: "tightChannel" }]
  });

  lch({ id: "broad", part: "Setups", title: "Broad channel", video: "broad",
    sub: "A trend with big swings both ways: buy low in it, take profits at the prior high.",
    body: function () {
      return lvideo("broad") +

  lch({ id: "breakout", part: "Setups", title: "Breakouts", video: "bo",

    body: function () {

  lch({ id: "range", part: "Setups", title: "Trading ranges", video: "range",
    sub: "Buy low, sell high, scalp — and do nothing in the middle.",
    body: function () {
      return lvideo("range") +
        lp("Most of the day, most markets are in trading ranges. There is no always-in direction, so both sides make money — at the edges.") +

          "<b>Thirds</b>: buy only in the bottom third, sell only in the top third, nothing in the middle.",
          "<b>Take second entries.</b> The first reversal at an edge often fails; the second (an H2 at the bottom, an L2 at the top) is the better trade.",
          "<b>Fade breakout attempts.</b> Most pushes beyond an edge fail and come back.",
          "<b>Targets</b>: the middle first, then the other side. Don't hold for a breakout.",
          "<b>Stops</b>: beyond the edge or the signal bar. Range stops are often wider than you'd like — size down, don't tighten.",
          "<b>Entries</b>: a stop order above a bull reversal bar at the bottom (beginners), or a limit order at its close or below the prior bar's low (experienced)."]) +
        lcard([["Where", "The bottom (top) third, after a push to the edge"], ["Signal", "A reversal bar, ideally a second entry"], ["Entry", "Stop order beyond the signal bar, or a limit order if experienced"], ["Stop", "Beyond the range edge or the signal bar"], ["Target", "The middle, then the other side"], ["Style", "Scalp, fixed target, no trailing"], ["Odds", lodds("rangeLow") + " taught"]]) +
        lwarn("The biggest range mistake: buying the strong bull bar at the top and selling the strong bear bar at the bottom. In a range, strong bars at the edges are usually traps.");

  lch({ id: "orders", part: "Execution", title: "Stop, limit and market orders", video: "orders",
    sub: "Entering with momentum, entering against it, and entering now.",
    body: function () {
      return lvideo("orders") +
        lh("Stop orders") +
        lp("A <b>buy stop</b> sits above the market, a <b>sell stop</b> below it. It fills only if price moves through the level, so you enter <b>with momentum</b>: the market proves itself first. Use stop orders for with-trend entries (H1/H2, L1/L2), breakout pullbacks, second entries on reversals and failed breakouts. <b>This is the default, and what Brooks recommends to beginners.</b>") +
        lh("Limit orders") +
        lp("A <b>buy limit</b> sits below the market, a <b>sell limit</b> above it. It fills when price comes to you, so you enter <b>against</b> the current move, at a better price. Use limit orders to fade the edges of a trading range (buy at or below the prior bar's low in the bottom third, sell at or above the prior bar's high in the top third). Experienced traders also buy below the prior bar's low in a strong bull trend. The risk: you get filled on exactly the bars that keep going against you. Trade smaller, and scale in only by a plan made in advance.") +
        lh("Market orders") +
        lp("A <b>market order</b> fills now, at the current price plus the spread. Use it in a strong breakout (buying the close of a big breakout bar, experienced traders) and to exit a trade now.") +
        ltable(["Situation", "Order", "Why"], [
          ["H1 / H2 in a bull trend", "Buy stop one tick above the signal bar", "Momentum must confirm"],
          ["L1 / L2 in a bear trend", "Sell stop one tick below the signal bar", "The mirror"],
          ["Bottom third of a range, bull reversal bar", "Buy stop above it (beginner) / buy limit at its close or at the prior bar's low (experienced)", "Fading the edge"],
          ["Top third of a range", "Sell stop below the bar / sell limit above", "The mirror"],
          ["A strong breakout bar", "Market at its close (experienced) or a stop order on the first pullback", "Get in before the move"],
          ["A failed breakout", "Stop order beyond the reversal bar, back inside the range", "Proof the trap has sprung"],
          ["Getting out", "Market (now) or stop (if hit)", "–"]
        ]) +
        lh("How long an order lives") +
        lp("An order from a signal bar is meant for the next bar. If the next bar doesn't trigger it, look again: keep it one more bar if the setup is still valid, move it to the new bar if that bar is a better signal bar, or cancel it if the market has changed.") +
        lh("In cTrader") +
        lul(["The chart shows the <b>Bid</b>. Buy orders fill at the <b>Ask</b> (Bid + spread). A buy stop one tick above a bar's high on the Bid chart triggers when the Ask gets there, which can be before the Bid does. So: <b>buy stop = signal bar high + 1 tick + spread.</b>",
          "The stop loss of a <b>short</b> is a buy, so it triggers at the Ask too: put it <b>one tick + spread</b> above the level. Sell stops, sell limits and the stop loss of a long trigger at the Bid, which is what you see.",
          "Place the <b>stop loss and take profit on the pending order itself</b>, so you are never in a trade without a stop.",
          "Spreads widen at the open, around news, at the daily rollover and at weekends (BTCUSD). A wide spread can make a small-stop trade not worth taking."]);
    },
    quiz: [
      { q: "Beginners enter with…", o: ["Stop orders", "Limit orders"], a: 0, why: "A stop order only fills when the market is already moving your way." },
      { q: "You short in cTrader. The signal bar's high is 2,350.00, the spread is 0.30 and a tick is 0.01. Where is the protective stop?", o: ["2,350.01", "2,350.31"], a: 1, why: "The stop of a short is a buy and triggers at the Ask. Add the spread, or you get stopped by the spread alone." },
      { q: "Which order fits fading the top of a range, for an experienced trader?", o: ["A sell limit above the prior bar's high", "A buy stop above the range"], a: 0, why: "At the top of a range you sell high; a limit order sells into the push up." }
    ],
    practise: [{ label: "Drill: where the order goes", go: "node", node: "t0c" }, { label: "Drill: limit orders at the edge", go: "node", node: "t4f" }, { label: "Drill: stop entries with the trend", go: "node", node: "t3g" }]
  });

  lch({ id: "stops", part: "Execution", title: "Where the stop goes",

  });

  lch({ id: "targets", part: "Execution", title: "Targets and the trader's equation",
    sub: "Where you get paid, and whether the trade is worth taking at all.",
    body: function () {
      var row = function (name, k) {
        var c = Mkt.CTX[k]; return [name, lodds(k), lneed(k), c.style === "scalp" ? "about 1R or the magnet" : "2R or more"];
      };
      return lp("<b>R</b> is your risk on the trade: the distance from the entry to the stop. Every target is measured in R.") +
        lh("Magnets") +
        lul(["The middle and the other side of a trading range.", "The prior high or low.", "The EMA (for counter-trend scalps).", "Measured moves."]) +
        ltable(["Setup", "Measured move"], [
          ["Spike and channel", "The spike's height added to the spike's end"],
          ["Pullback (H2 / L2)", "Leg 1 = leg 2: the leg before the pullback, added to the pullback's end"],
          ["Breakout", "The range's height added to the breakout point"],
          ["Failed breakout", "The other side of the range"],
          ["Wedge", "The start of the wedge"],
          ["Major trend reversal", "The first leg of the new trend, projected from the test"],
          ["Final flag", "Back past the flag: the leg into the flag, measured from the failed breakout"],
          ["Climax", "A good part of the climactic leg"]
        ]) +
        lh("The trader's equation") +
        lp("<b>probability × reward &gt; (1 − probability) × risk.</b> Examples:") +
        lul(["40% × 3R − 60% × 1R = <b>+0.6R</b> per trade: good.", "60% × 1R − 40% × 1R = <b>+0.2R</b>: fine.", "70% × 0.3R − 30% × 1R = <b>−0.09R</b>: a loser, even though it wins most of the time."]) +
        lp("The break-even win rate for a reward of X times the risk is 1 / (1 + X): 0.5R needs 67%, 1R needs 50%, 1.5R needs 40%, 2R needs 33%, 3R needs 25%.") +
        ltable(["Setup", "Taught odds", "Break-even reward", "Aim for"], [
          row("Two-legged pullback", "twoLegPullback"), row("Spike and channel", "spikeChannel"), row("Tight channel", "tightChannel"),
          row("Broad channel", "broadChannel"), row("Range edge", "rangeLow"), row("Failed breakout", "failedBo"),
          row("Breakout pullback", "successBo"), row("Wedge", "wedgeBottom"), row("Major trend reversal", "mtr"),
          row("Final flag", "finalFlag"), row("Climax", "climax")
        ]) +
        lkey("Before every order, say the three numbers out loud: <b>probability, reward, risk</b>. If the equation isn't clearly positive, it is a wait bar.");
    },
    quiz: [

      { q: "A 70% setup with a 0.3R reward. Worth it?", o: ["Yes: it wins most of the time", "No: −0.09R per trade"], a: 1, why: "0.7 × 0.3 − 0.3 × 1 = −0.09R." },
      { q: "What win rate does a 2R target need to break even?", o: ["50%", "33%", "25%"], a: 1, why: "1 / (1 + 2) = 33%." }
    ],
    practise: [{ label: "Drill: where you are getting paid", go: "node", node: "t0e" }, { label: "Drill: is it worth taking?", go: "node", node: "t8a" }, { label: "Drill: all measured moves", go: "node", node: "t6a" }, { label: "Drill: expectancy maths", go: "node", node: "t8c" }]
  });

    body: function () {
      return lp("A <b>scalp</b> takes a small profit, about as big as the risk or smaller, and only makes sense with high odds (60% or better). A <b>swing</b> holds for a reward of at least twice the risk and works with 40–50% odds.") +
        ltable(["Only scalp", "Only swing", "Both: a scalp part and a swing part"], [

          ["Climax corrections", "", "Trail the rest behind confirmed higher lows to the measured move"],

          ["Late in the session, with little time left", "", ""]
        ]) +

          "A range or a two-sided market → scalp.",
          "A reversal → swing only, and only with a target of 2R or more.",
          "If the room to the next magnet (the prior high, the range edge) is smaller than your risk → skip it, unless the odds are high enough for a scalp."]);

    quiz: [

  lch({ id: "manage", part: "Execution", title: "Managing a trade", video: "manage",
    sub: "The plan is made before the entry. During the trade you only check it.",
    body: function () {
      return lvideo("manage") +
        lp("Management is decided <b>before</b> you enter: the stop, the target, and whether part of the trade is a scalp. During the trade you only check, bar by bar, whether the market is doing what the plan needs.") +
        LSHEET.manage() +
        lh("Breakeven") +
        lp("Brooks moves the stop to breakeven once the trade has gone about 1R and the structure is intact — and not early, and not in choppy two-sided trading. A stop exactly at your entry sits where ordinary pullbacks often reach, so in weaker trends keep it behind the last higher low instead. The lessons show both: in the EURUSD H2 a breakeven stop would have been taken out just before the target.") +
        lh("Trailing") +
        lp("Only in trends. While a pullback is going, the stop stays put: you don't know yet where it ends. The pullback has ended when a with-trend signal bar at its end gets triggered — the next bar goes above a bull signal bar (below a bear one). That makes its low a higher low: move the stop one tick below it. Some traders wait for the next new high to confirm it — later, same level. A single bull bar that ends no pullback and breaks nothing is not a reason to move the stop. In a range, hold a fixed target: a trailing stop there gets hit by the ordinary back-and-forth.") +
        lh("Scaling in") +
        lp("Adding to a position is a planned technique, not a rescue. In a range, experienced traders scale into longs in the lower half on signals, with the total risk decided before the first entry. It is one position at an average price. Adding to a loser without a plan is how accounts die.");
    },
    quiz: [
      { q: "The trade has reached 1R in a trending market. What's the usual plan?", o: ["Take part off; keep the rest with the stop behind the structure", "Close everything"], a: 0, why: "Scalp part and swing part: bank some, let the rest work." },
      { q: "In a trading range trade, do you trail the stop?", o: ["Yes", "No: hold a fixed target"], a: 1, why: "Trailing inside two-sided trading gets you stopped by ordinary swings." },
      { q: "When does a trailing stop move up in a bull trend?", o: ["After every bull bar", "When a pullback has ended — a buy signal triggers above it, or a new high — to just below that pullback's low"], a: 1, why: "Only a pullback that has ended gives you a higher low. Until then the stop stays where it is." }
    ],

  lch({ id: "glossary", part: "Sheets & reference", title: "Glossary",
    sub: "Every term this tab uses, in one place.",
    body: function () {
      var G = [
        ["Always-in", "The direction you would hold if you had to be in the market at all times. Flips on strong breakouts with follow-through."],
        ["Barbwire", "Three or more overlapping bars with dojis and big tails around a flat EMA. No trade."],
        ["Bar count (H1, H2, L1, L2)", "In a bull pullback, each new bar going above the prior bar's high after the pullback resumed is the next High (H1, H2…). In a bear pullback, count lows."],
        ["Breakeven", "Moving the stop to the entry price. Allowed after about 1R when the structure is intact."],
        ["Breakout", "Price leaving a range, flag or triangle. Most fail; the strong ones have follow-through."],
        ["Breakout mode", "A narrowing triangle or tight range: it will break, nobody knows which way."],
        ["Breakout pullback", "The first pullback after a breakout; the usual with-breakout entry."],
        ["Broad channel", "A trend with deep, overlapping pullbacks: a trading range tilted up or down."],
        ["Channel", "The slower trend after a spike, with pullbacks."],
        ["Climax", "An accelerating trend of big bars far from the EMA: exhaustion. Expect a correction."],
        ["Doji", "A bar with a small body closing near its middle: balance."],
        ["EMA (20)", "The 20-bar exponential moving average: the only indicator in this method."],
        ["Entry bar", "The bar that fills your order."],
        ["Failed breakout", "A breakout that reverses back inside; the trapped traders fuel a move to the other side."],
        ["Final flag", "A late flag whose breakout in the trend's direction fails, reversing the trend."],
        ["Follow-through", "The bars after a breakout or an entry, going the same way."],
        ["Higher low / lower high", "A pullback low above the prior low (bull) or a rally high below the prior high (bear)."],
        ["Limit order", "An order to buy below or sell above the current price: entering against the move."],
        ["Magnet", "A price the market tends to reach: a prior high or low, the range middle, a measured move, the EMA."],
        ["Major trend reversal", "Trend, trend line break, test of the extreme, reversal. The only reversal worth trading."],
        ["Market order", "An order filled now at the current price."],
        ["Measured move", "A target projected from a height already on the chart: leg 1 = leg 2, the spike, the range."],
        ["Micro double bottom / top", "Two lows (highs) at about the same price a few bars apart."],
        ["Pullback", "A move against the trend that is expected to end."],
        ["R", "Your risk on the trade: entry to stop. Profits and losses are measured in R."],
        ["Scalp", "A trade for a small profit, about 1R or less; needs high odds."],
        ["Second entry", "The second signal at the same place after the first one failed; usually the better one."],
        ["Signal bar", "The bar before the entry. A good one closes near its extreme in your direction."],
        ["Spike", "A breakout of several big consecutive trend bars."],
        ["Stop order", "An order to buy above or sell below the current price: entering with momentum."],
        ["Swing", "A trade held for 2R or more."],
        ["Tail", "The part of the bar outside the body: prices tried and rejected."],
        ["Test", "A return to an important price (a breakout point, a prior extreme) that either holds or breaks."],
        ["Tight channel", "A strong trend with tiny, short pullbacks, on one side of the EMA."],
        ["Trader's equation", "Probability × reward versus (1 − probability) × risk. Trade only when it is clearly positive."],
        ["Trading range", "A sideways market with no always-in direction; buy low, sell high, scalp."],
        ["Trapped traders", "Traders caught on the wrong side, whose exits push price further."],
        ["Trend bar", "A bar whose body is most of its range, closing near its extreme."],
        ["Trend line", "A line along the lows of a bull trend (the highs of a bear trend). Its break is step one of a reversal."],
        ["Wedge", "Three pushes in one direction, each barely further than the last: exhaustion."]
      ];
      return '<dl class="lgloss">' + G.map(function (g) { return '<dt>' + g[0] + '</dt><dd>' + g[1] + '</dd>'; }).join("") + '</dl>';
    },
    quiz: [], practise: []
  });

    chB: chB, get BT() { return BT; }, btNew: btNew, btStep: btStep, btOpen: btOpen, btClose: btClose,
